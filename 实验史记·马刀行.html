      const dn = { easy: "简单", normal: "普通", hard: "困难", extreme: "极难" };
      const diffTxt = dn[battle.diff] || "普通";
      const aiTxt = (battle.diff === "extreme") ? "狂攻(强制)" : (nm[battle.aiAggr] || "主动");
      $("#ai-label").textContent = diffTxt + " · AI " + aiTxt;
    }
  }

  function phaseLocked() { return !battle || battle.over || battle._playerPhaseActive !== true; }

  async function playerPhase(b) {
    battle = b;
    b._playerPhaseActive = true;
    await showBanner("汝之回合", 700);
    if (checkAutoEnd()) { b._playerPhaseActive = false; return; }
    updateAll();
    await new Promise(resolve => { b._phaseResolve = resolve; });
    b._playerPhaseActive = false;
    mode = null;
    updateAll();
  }

  function checkAutoEnd() {
    if (!battle) return true;
    const p = battle.player;
    return battle.over || p.apNow <= 0 || !p.alive || p.offField > 0;
  }

  function afterPlayerAction() {
    updateAll();
    if (checkAutoEnd()) endPlayerPhase();
  }
  function endPlayerPhase() {
    mode = null;
    if (battle && battle._phaseResolve) { const r = battle._phaseResolve; battle._phaseResolve = null; r(); }
  }

  /* ---------------- 猜拳 ---------------- */
  const RPS = [{ k: "rock", g: "✊", n: "石头" }, { k: "scissors", g: "✌", n: "剪刀" }, { k: "paper", g: "✋", n: "布" }];
  async function rpsRound(b) {
    battle = b;
    if (SAVE.settings.rpsMode === "auto") {
      const k = Math.random();
      const resK = k < 0.4 ? "胜" : (k < 0.75 ? "和" : "负");
      const ap = resK === "胜" ? 4 : (resK === "和" ? 3 : 2);
      b.pushLog("—— 自动猜拳：" + resK + "，得" + ap + "动。——");
      if (window.SJI_DEBUG && window.SJI_DEBUG.skipScenes) return { res: resK, ap };
      await showBanner("猜拳 " + resK + "　得" + ap + "动", 460);
      return { res: resK, ap };
    }
    await showBanner("猜拳定行动", 650);
    if (b.over) return { res: "和", ap: 2 };
    return queueModal(() => new Promise(resolve => {
      modal(
        '<div class="rps-title">猜 拳</div>' +
        '<div class="rps-sub">胜得四动 · 和得三动 · 负得二动</div>' +
        '<div class="rps-btns">' + RPS.map((r, i) => '<button class="rps-btn" data-i="' + i + '"><span class="g">' + r.g + "</span>" + r.n + "</button>").join("") + "</div>" +
        '<div class="rps-vs" id="rps-vs">　</div>' +
        '<div class="rps-result" id="rps-res">　</div>'
      );
      const vs = $("#rps-vs"), res = $("#rps-res");
      $$("#modal-box .rps-btn").forEach(btn => {
        btn.onclick = async () => {
          const mine = RPS[+btn.dataset.i];
          const foe = RPS[Math.floor(Math.random() * 3)];
          $$("#modal-box .rps-btn").forEach(x => x.disabled = true);
          for (let i = 0; i < 6; i++) {
            vs.textContent = mine.g + "　对　" + RPS[i % 3].g;
            AU.click();
            await new Promise(r => setTimeout(r, 80));
          }
          vs.textContent = mine.g + "　对　" + foe.g;
          let resK, ap;
          if (mine.k === foe.k) { resK = "和"; ap = 3; AU.rpsDraw(); }
          else if ((mine.k === "rock" && foe.k === "scissors") || (mine.k === "scissors" && foe.k === "paper") || (mine.k === "paper" && foe.k === "rock")) { resK = "胜"; ap = 4; AU.rpsWin(); }
          else { resK = "负"; ap = 2; AU.rpsLose(); }
          res.textContent = resK + "！天命予汝" + ap + "动";
          res.style.color = resK === "胜" ? "#a63a2b" : (resK === "负" ? "#555" : "#9a7b2d");
          setTimeout(() => { closeModal(); resolve({ res: resK, ap }); }, window.SJI_DEBUG && window.SJI_DEBUG.fast ? 30 : 850);
        };
      });
      if (window.SJI_DEBUG && window.SJI_DEBUG.autoRps) {
        setTimeout(() => { const b2 = $$("#modal-box .rps-btn")[Math.floor(Math.random() * 3)]; if (b2 && !b2.disabled) b2.click(); }, 30);
      }
    }));
  }

  /* ---------------- 增益三选一（生存模式） ---------------- */
  async function pickBoon(b) {
    battle = b;
    if (b.over) return null;
    const taken = b.boonsTaken || [];
    const commons = D.BOONS.filter(x => !x.rare && !taken.includes(x.id)).sort(() => Math.random() - 0.5);
    const rares = D.BOONS.filter(x => x.rare && !taken.includes(x.id)).sort(() => Math.random() - 0.5);
    const pool = commons.slice(0, 2).concat(rares.slice(0, 1)).sort(() => Math.random() - 0.5);
    while (pool.length < 3 && commons.length > pool.length) pool.push(commons[pool.length]);
    return queueModal(() => new Promise(resolve => {
      modal(
        '<h3>苔藓之间，拾得一策</h3>' +
        '<div class="sub">破败城墙 · 三选其一</div>' +
        '<div class="boon-btns">' + pool.map((bo, i) =>
          '<button class="btn boon-b" data-i="' + i + '"><span class="bn">「' + bo.name + "」</span><span class=\"bd\">" + bo.desc + "</span></button>").join("") + "</div>"
      );
      $$("#modal-box .boon-b").forEach(btn => {
        btn.onclick = () => { AU.select(); closeModal(); resolve(pool[+btn.dataset.i]); };
      });
    }));
  }

  /* ---------------- 剧情对话（战斗内弹层） ---------------- */
  function showDialogue(lines) {
    if (window.SJI_DEBUG && window.SJI_DEBUG.skipScenes) return Promise.resolve();
    const runScene = () => new Promise(resolve => {
      const mask = $("#modal-mask"), box = $("#modal-box");
      let idx = 0, typing = null, done = false;
      function finish() {
        if (done) return;
        done = true;
        if (typing) clearInterval(typing);
        document.removeEventListener("keydown", onKey);
        mask.classList.remove("on");
        mask.onclick = null;
        box.onclick = null;
        box.innerHTML = "";
        resolve();
      }
      function showLine() {
        const pair = lines[idx];
        const sp = speakerOf(pair[0]);
        box.innerHTML =
          '<div class="dlg">' +
          '<div class="dlg-head">' + face(sp) +
          '<div><div class="dlg-name" style="color:' + sp.color + '">' + sp.name + "</div>" +
          '<div class="dlg-role">' + (pair[0] === "史" || sp.name === "音克思" ? "史官" : (sp.hao || "")) + "</div></div>" +
          '<button class="btn small" id="dlg-skip">跳过</button></div>' +
          '<div class="dlg-text" id="dlg-text"></div>' +
          '<div class="dlg-next">▼</div></div>';
        mask.classList.add("on");
        const tx = $("#dlg-text");
        let i = 0;
        tx.textContent = "";
        typing = setInterval(() => {
          i++;
          tx.textContent = pair[1].slice(0, i);
          if (i >= pair[1].length) { clearInterval(typing); typing = null; }
        }, 22);
        $("#dlg-skip").onclick = (e) => { e.stopPropagation(); finish(); };
        box.onclick = () => {
          if (typing) { clearInterval(typing); typing = null; tx.textContent = pair[1]; return; }
          idx++;
          if (idx >= lines.length) finish(); else showLine();
        };
      }
      function onKey(e) {
        if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (box.onclick) box.onclick(); }
        if (e.key === "Escape") finish();
      }
      document.addEventListener("keydown", onKey);
      showLine();
    });
    return queueModal(runScene);
  }

  /* ---------------- 横幅/特效 ---------------- */
  function showBanner(text, ms) {
    const el = $("#phase-banner");
    el.textContent = text;
    el.classList.add("on");
    return new Promise(r => setTimeout(() => { el.classList.remove("on"); r(); }, (window.SJI_DEBUG && window.SJI_DEBUG.fast ? 60 : ms)));

  function uPos(u) {
    return { x: PAD + u.rx * TILE + TILE / 2, y: PAD + u.ry * TILE + TILE / 2 };
  }
  function fxFloat(u, text, color) {
    floaters.push({ u, text, color, t: 1, dy: 0 });
    if (text && text[0] === "+") {
      const P = uPos(u);
      spawnParticles(P.x, P.y, { n: 8, colors: ["#7fe08a", "#ffd98a"], speed: 55, life: 0.7, grav: -70, size: 2.5 });
    }
  }
  function fxHit(u, dmg, opts) {
    u.flash = 1;
    fxFloat(u, "-" + dmg, opts && opts.poison ? "#b06ad0" : "#d63a2a");
    const P = uPos(u);
    if (opts && opts.poison) spawnParticles(P.x, P.y, { n: 6, color: "#b06ad0", speed: 60, life: 0.6, grav: -40, size: 2.5 });
    else if (opts && opts.type === "horse") spawnParticles(P.x, P.y, { n: 10, color: "#c9b28a", speed: 150, life: 0.45, grav: 240 });
    else spawnParticles(P.x, P.y, { n: Math.min(14, 4 + dmg * 2), colors: ["#d63a2a", "#a63a2b", "#f2ead8"], speed: 110, life: 0.45 });
    if (dmg >= 3) addShake(6);
  }
  function fxStatus(u, text) { banner = { text, t: 1.4 }; }
  function snap(u) { u.rx = u.c; u.ry = u.r; }

  /* ---------------- 打击特效系统 ---------------- */
  let particles = [], slashes = [], projectiles = [], rings = [], ghosts = [], vignettes = [];
  let shakeT = 0, shakeMag = 0;
  const PROJ_STYLE = {
    wenbin: ["arrow", "#3a2a1a"], wonder: ["beam", "#d8a11f"], shaoming: ["paper", "#f5efe0"],
    xinhui: ["wave", "#c04a6a"], shibo: ["beam", "#4f6d8c"], weirong: ["beam", "#6b4f8c"],
    qinfa: ["line", "#3d4a5c"], xiangdong: ["beam", "#8a8ab8"], limo: ["wave", "#8f8f5c"],
    dage: ["paper", "#e8d8c0"], lifan: ["wave", "#3f7d8c"], ziye: ["paper", "#8c6a2f"],
    zichen: ["ring", "#7d4a6b"], luhao: ["paper", "#4a6d9c"], guyin: ["wave", "#555555"],
    keai: ["paper", "#c76b98"], wanzhen: ["beam", "#6a8577"], tree: ["dab", "#4c6b3c"],
    yinkesi: ["paper", "#a63a2b"]
  };

  function spawnParticles(x, y, o) {
    const n = o.n || 10;
    for (let i = 0; i < n; i++) {
      if (particles.length > 320) particles.shift();
      const a = Math.random() * Math.PI * 2, sp = (o.speed || 90) * (0.4 + Math.random() * 0.8);
      particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0),
        life: (o.life || 0.55) * (0.6 + Math.random() * 0.7), t: 0,
        color: o.colors ? o.colors[Math.floor(Math.random() * o.colors.length)] : (o.color || "#a63a2b"),
        size: (o.size || 3) * (0.5 + Math.random()), grav: o.grav !== undefined ? o.grav : 160
      });
    }
  }
  function addShake(mag) { shakeMag = Math.max(shakeMag, mag); shakeT = Math.max(shakeT, 1); }

  function fxAttack(att, def, opts) {
    if (!att || !def) return;
    const A = uPos(att), B = uPos(def);
    const cheb = Math.max(Math.abs(att.r - def.r), Math.abs(att.c - def.c));
    const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;
    if (opts.type === "horse") {
      rings.push({ x: B.x, y: B.y, t: 1, color: "#8a6a3a", r: 16 });
      spawnParticles(B.x, B.y, { n: 14, color: "#a89066", speed: 130, life: 0.5, grav: 220, size: 3.5 });
      addShake(9);
      att._lunge = { dx: dx / len, dy: dy / len, t: 1 };
      return;
    }
    if (cheb <= 1) {
      att._lunge = { dx: dx / len, dy: dy / len, t: 1 };
      slashes.push({ x: B.x, y: B.y, a: Math.atan2(dy, dx), t: 1, color: opts.type === "skill" ? "#d8a11f" : "#f2ead8" });
      spawnParticles(B.x, B.y, { n: 7, colors: ["#f2ead8", "#a63a2b"], speed: 120, life: 0.4, size: 2.5 });
      return;
    }
    const st = PROJ_STYLE[att.charId] || ["dab", "#5a5248"];
    projectiles.push({ x: A.x, y: A.y, tx: B.x, ty: B.y, t: 0, style: st[0], color: st[1] });
  }

  function fxDeath(u) {
    const P = uPos(u);
    ghosts.push({ x: P.x, y: P.y, glyph: u.ch.glyph, color: u.ch.color, t: 1.3 });
    spawnParticles(P.x, P.y, { n: 22, colors: [u.ch.color, "#6a615a", "#2b2622"], speed: 150, life: 0.7, size: 3.5 });
  }

  function fxVignette(rgb) { vignettes.push({ rgb, t: 1 }); }

  /* ---------------- 画布 ---------------- */
  function buildBG() {
    bgCanvas = document.createElement("canvas");
    bgCanvas.width = CS; bgCanvas.height = CS;
    const g = bgCanvas.getContext("2d");
    g.fillStyle = "#efe4c8"; g.fillRect(0, 0, CS, CS);
    for (let i = 0; i < 900; i++) {
      g.fillStyle = "rgba(" + (120 + Math.random() * 60 | 0) + "," + (100 + Math.random() * 50 | 0) + "," + (60 + Math.random() * 40 | 0) + "," + (Math.random() * 0.05) + ")";
      g.fillRect(Math.random() * CS, Math.random() * CS, Math.random() * 26 + 4, Math.random() * 3 + 1);
    }
    for (let r = 0; r < E.SIZE; r++) for (let c = 0; c < E.SIZE; c++) {
      const x = PAD + c * TILE, y = PAD + r * TILE;
      if (E.isWall(r, c)) {
        g.fillStyle = "#cabd9e"; g.fillRect(x, y, TILE, TILE);
        g.strokeStyle = "rgba(90,75,50,.35)"; g.lineWidth = 1.4;
        for (let by = 0; by <= TILE; by += 24) {
          g.beginPath(); g.moveTo(x, y + by); g.lineTo(x + TILE, y + by); g.stroke();
        }
        for (let row = 0; row < 4; row++) {
          const offset = (row % 2) * 24;
          for (let bx = offset; bx <= TILE; bx += 48) {
            g.beginPath(); g.moveTo(x + bx, y + row * 24); g.lineTo(x + bx, y + row * 24 + 24); g.stroke();
          }
        }
        if (r === 1 || c === 1 || r === E.SIZE - 2 || c === E.SIZE - 2) {
          g.fillStyle = "rgba(60,45,25,.14)"; g.fillRect(x, y, TILE, TILE);
        }
      } else {
        g.fillStyle = "#eee2c2"; g.fillRect(x, y, TILE, TILE);
        const seed = (r * 7 + c * 13) % 5;
        g.strokeStyle = "rgba(120,130,70,.28)"; g.lineWidth = 1.2;
        for (let i = 0; i < 3; i++) {
          const gx = x + 16 + ((seed * 17 + i * 29) % (TILE - 30));
          const gy = y + 20 + ((seed * 31 + i * 37) % (TILE - 40));
          g.beginPath(); g.moveTo(gx, gy + 7); g.quadraticCurveTo(gx + 3, gy, gx + 7, gy - 4); g.stroke();
        }
      }
      g.strokeStyle = "rgba(90,75,50,.14)";
      g.strokeRect(x + .5, y + .5, TILE - 1, TILE - 1);
    }
    // 障碍格：按关卡地形类型绘制
    const stage = (battle && battle.cfg && battle.cfg.stage) || null;
    const blocked = (stage && stage.blocked) || [];
    const ttype = (stage && stage.terrain) || "desk";
    for (const [br, bc] of blocked) {
      const x = PAD + bc * TILE, y = PAD + br * TILE;
      g.fillStyle = "rgba(60,40,20,.18)";
      g.beginPath(); g.ellipse(x + TILE / 2, y + TILE - 14, 30, 8, 0, 0, 7); g.fill();
      if (ttype === "pillar") {
        g.fillStyle = "#8f8478";
        g.fillRect(x + TILE / 2 - 15, y + 12, 30, TILE - 26);
        g.fillStyle = "#a99d8e";
        g.fillRect(x + TILE / 2 - 15, y + 12, 10, TILE - 26);
        g.fillStyle = "#6e6152";
        g.fillRect(x + TILE / 2 - 19, y + 8, 38, 8);
        g.fillRect(x + TILE / 2 - 19, y + TILE - 20, 38, 8);
      } else if (ttype === "table") {
        g.fillStyle = "#3f6e5e";
        g.fillRect(x + 8, y + 16, TILE - 16, TILE - 34);
        g.strokeStyle = "rgba(255,255,255,.7)"; g.lineWidth = 1.5;
        g.strokeRect(x + 10, y + 18, TILE - 20, TILE - 38);
        g.beginPath(); g.moveTo(x + 8, y + TILE / 2 - 2); g.lineTo(x + TILE - 8, y + TILE / 2 - 2); g.stroke();
        g.fillStyle = "#5a4a3a";
        g.fillRect(x + 12, y + TILE - 20, 5, 14); g.fillRect(x + TILE - 17, y + TILE - 20, 5, 14);
      } else if (ttype === "cabinet") {
        g.fillStyle = "#5c4a38";
        g.fillRect(x + 10, y + 8, TILE - 20, TILE - 16);
        g.fillStyle = "#6e5a44";
        g.fillRect(x + 13, y + 11, TILE - 26, TILE - 22);
        g.strokeStyle = "rgba(35,25,15,.6)"; g.lineWidth = 1.5;
        g.beginPath(); g.moveTo(x + 13, y + TILE / 2); g.lineTo(x + TILE - 13, y + TILE / 2); g.stroke();
        g.fillStyle = "#c9a227";
        g.fillRect(x + TILE / 2 - 2, y + TILE / 2 - 8, 4, 3);
        g.fillRect(x + TILE / 2 - 2, y + TILE / 2 + 5, 4, 3);
      } else if (ttype === "platform") {
        g.fillStyle = "#9a8f7c";
        g.fillRect(x + 6, y + TILE - 30, TILE - 12, 20);
        g.fillStyle = "#877c68";
        g.fillRect(x + 10, y + 16, TILE - 20, TILE - 46);
        g.fillStyle = "#a63a2b";
        g.fillRect(x + TILE / 2 - 10, y + 20, 20, 6);
      } else {
        const bw = TILE - 22, bh = TILE - 30;
        g.fillStyle = "#8a6a45";
        g.fillRect(x + 11, y + 12, bw, bh);
        g.fillStyle = "#b08a5c";
        g.fillRect(x + 11, y + 12, bw, 9);
        g.strokeStyle = "rgba(80,55,30,.35)"; g.lineWidth = 1;
        for (let i = 1; i < 4; i++) {
          g.beginPath(); g.moveTo(x + 13, y + 12 + i * (bh / 4)); g.lineTo(x + 9 + bw, y + 12 + i * (bh / 4)); g.stroke();
        }
        g.fillStyle = "#6b5033";
        g.fillRect(x + 14, y + 12 + bh, 6, 9);
        g.fillRect(x + 9 + bw - 6, y + 12 + bh, 6, 9);
        g.fillStyle = "#c94f3a";
        g.fillRect(x + TILE / 2 - 13, y + 22, 18, 11);
        g.fillStyle = "#f2ead8";
        g.fillRect(x + TILE / 2 - 13, y + 22, 18, 3);
        g.fillStyle = "#5a7d9a";
        g.beginPath(); g.arc(x + TILE / 2 + 11, y + 30, 6, 0, 7); g.fill();
        g.strokeStyle = "rgba(0,0,0,.25)"; g.lineWidth = 1.5;
        g.strokeRect(x + 11.5, y + 12.5, bw - 1, bh - 1);
      }
    }
    // 角楼
    for (const [rr, cc] of [[0, 0], [0, E.SIZE - 1], [E.SIZE - 1, 0], [E.SIZE - 1, E.SIZE - 1]]) {
      const x = PAD + cc * TILE + TILE / 2, y = PAD + rr * TILE + TILE / 2;
      g.fillStyle = "#6e6152"; g.fillRect(x - 15, y - 18, 30, 36);
      g.fillStyle = "#453b30"; g.fillRect(x - 20, y - 24, 40, 9);
      g.fillStyle = "#8a7d63"; g.fillRect(x - 15, y - 18, 30, 5);
      g.fillStyle = "#a63a2b"; g.beginPath(); g.arc(x, y - 6, 4.5, 0, 7); g.fill();
      g.strokeStyle = "rgba(242,234,216,.9)"; g.lineWidth = 1.2;
      g.beginPath(); g.arc(x, y - 6, 6.5, 0, 7); g.stroke();
    }
    // 旗帜
    for (const [rr, cc, ch] of [[0, 3, "實"], [E.SIZE - 1, 3, "驗"], [3, 0, "史"], [3, E.SIZE - 1, "記"]]) {
      const x = PAD + cc * TILE + TILE / 2, y = PAD + rr * TILE + TILE / 2;
      g.strokeStyle = "#5a4a3a"; g.lineWidth = 2.5;
      g.beginPath(); g.moveTo(x - 22, y - 24); g.lineTo(x - 22, y + 24); g.stroke();
      g.fillStyle = "#a63a2b";
      g.beginPath();
      g.moveTo(x - 22, y - 22); g.lineTo(x + 2, y - 18); g.lineTo(x - 22, y - 6);
      g.closePath(); g.fill();
      g.fillStyle = "#f2ead8";
      g.font = "bold 11px KaiTi, serif"; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(ch, x - 12, y - 15);
    }
    g.strokeStyle = "#8a7a58"; g.lineWidth = 3;
    g.strokeRect(PAD - 1.5, PAD - 1.5, E.SIZE * TILE + 3, E.SIZE * TILE + 3);
    g.save();
    g.globalAlpha = 0.1;
    g.font = "bold 120px KaiTi, STKaiti, serif";
    g.fillStyle = "#5a4020"; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText("馬刀", PAD + 3.5 * TILE, PAD + 3.5 * TILE);
    g.restore();
  }

  function fxLevel() { return SAVE.settings.fx || "full"; }

  function startRaf() {
    if (rafOn) return;
    rafOn = true;
    let last = performance.now();
    const cv = $("#battle-canvas");
    cv.width = CS; cv.height = CS;
    const ctx = cv.getContext("2d");
    function frame(now) {
      if (!rafOn) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      draw(ctx, dt);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  function stopRaf() { rafOn = false; }

  function draw(ctx, dt) {
    if (!bgCanvas) return;
    ctx.clearRect(0, 0, CS, CS);
    ctx.drawImage(bgCanvas, 0, 0);
    if (!battle) return;
    ctx.save();
    if (shakeT > 0 && fxLevel() !== "off") {
      shakeT -= dt * 2.4;
      const m = shakeMag * Math.max(0, shakeT);
      ctx.translate((Math.random() - .5) * m, (Math.random() - .5) * m);
    }
    const speedK = [1, 0.6, 0.3][SAVE.settings.speed - 1] || 1;

    const p = battle.player;
    if (battle._playerPhaseActive && p.alive && p.offField <= 0 && mode === null && !checkAutoEnd()) {
      const reach = battle._reachable(p, battle.moveRange(p));
      ctx.fillStyle = "rgba(80,140,70,.30)";
      for (const key of reach.keys) {
        const [r, c] = key.split(",").map(Number);
        if (battle.unitAt(r, c) || (r === p.r && c === p.c)) continue;
        dot(ctx, PAD + c * TILE + TILE / 2, PAD + r * TILE + TILE / 2, 10);
      }
    }
    if (mode === "knife" || mode === "horse" || mode === "skill") {
      const t = performance.now() / 300;
      const targets = battle.opponentsOf(p).filter(f =>
        mode === "knife" ? E.adj(p, f) :
        mode === "horse" ? (E.isWall(p.r, p.c) && E.isWall(f.r, f.c) && E.manh(p, f) <= 3) :
        chebSkillRange(p, f));
      for (const f of targets) {
        const pos = uPos(f);
        ctx.strokeStyle = "rgba(200,50,40," + (0.55 + 0.4 * Math.sin(t)) + ")";
        ctx.lineWidth = 3.5;
        ctx.strokeRect(pos.x - 32, pos.y - 32, 64, 64);
      }
    }

    const order = [...battle.units].sort((a, b) => (a.side === "player" ? 1 : 0) - (b.side === "player" ? 1 : 0));
    for (const u of order) {
      if (!u.alive || u.offField > 0) continue;
      u.rx += (u.c - u.rx) * Math.min(1, dt * 8 / speedK);
      u.ry += (u.r - u.ry) * Math.min(1, dt * 8 / speedK);
      if (u.flash > 0) u.flash -= dt * 3;
      let px = PAD + u.rx * TILE + TILE / 2, py = PAD + u.ry * TILE + TILE / 2;
      if (u.flash > 0) {
        px += Math.sin(u.flash * 40) * 5 * u.flash;
      }
      if (u._lunge) {
        u._lunge.t -= dt * 5;
        if (u._lunge.t <= 0) delete u._lunge;
        else { const k = Math.sin(u._lunge.t * Math.PI) * 16; px += u._lunge.dx * k; py += u._lunge.dy * k; }
      }
      ctx.fillStyle = "rgba(60,40,20,.18)";
      ctx.beginPath(); ctx.ellipse(px, py + 26, 26, 8, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(px, py, 29, 0, 7);
      ctx.fillStyle = u.flash > 0 && Math.sin(u.flash * 50) > 0 ? "#ffffff" : u.ch.color;
      ctx.fill();
      ctx.lineWidth = u.side === "player" ? 4.5 : 3;
      ctx.strokeStyle = u.side === "player" ? "#d8a11f" : ((u.side === "ally" ? "#3a7d46" : "#6e2318"));
      ctx.stroke();
      if (u.st.bloodlust > 0) {
        ctx.strokeStyle = "rgba(255,90,90," + (0.35 + 0.3 * Math.sin(performance.now() / 140)) + ")";
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(px, py, 33, 0, 7); ctx.stroke();
      }
      if (u.st.shield > 0) {
        ctx.strokeStyle = "rgba(110,180,230,.8)";
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(px, py, 33, -2.4, -0.7); ctx.stroke();
      }
      ctx.font = "bold 30px KaiTi, STKaiti, serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "#fff";
      ctx.strokeStyle = "rgba(0,0,0,.4)"; ctx.lineWidth = 3;
      ctx.strokeText(u.ch.glyph, px, py + 1);
      ctx.fillText(u.ch.glyph, px, py + 1);
      const hw = 56, hpc = Math.max(0, u.hp / u.maxhp);
      if (u.hpGhost === undefined) u.hpGhost = u.hp;
      if (u.hp < u.hpGhost) u.hpGhost = Math.max(u.hp, u.hpGhost - dt * 7);
      else u.hpGhost = u.hp;
      const ghc = Math.max(0, u.hpGhost / u.maxhp);
      ctx.fillStyle = "rgba(43,38,34,.75)";
      ctx.fillRect(px - hw / 2 - 1, py + 34, hw + 2, 8);
      ctx.fillStyle = "#e8ddc8";
      ctx.fillRect(px - hw / 2, py + 35, hw * ghc, 6);
      ctx.fillStyle = hpc > 0.3 ? "#6aa84f" : "#cc4125";
      ctx.fillRect(px - hw / 2, py + 35, hw * hpc, 6);
      ctx.font = "13px serif";
      let bx = px + 20;
      if (u.hasKnife) { ctx.fillStyle = "#ffd98a"; ctx.fillText("刀", bx, py - 26); bx -= 15; }
      if (u.hasHorse) { ctx.fillStyle = "#d8c8ff"; ctx.fillText("马", bx, py - 26); }
      let sy = py - 40;
      ctx.font = "12px serif";
      if (u.st.poison > 0) { ctx.fillStyle = "#b06ad0"; ctx.fillText("毒" + u.st.poison, px, sy); sy -= 13; }
      if (u.st.bloodlust > 0) { ctx.fillStyle = "#ff5a5a"; ctx.fillText("祭", px, sy); sy -= 13; }
      if (u.st.skip > 0) { ctx.fillStyle = "#8a7a3a"; ctx.fillText("晕", px, sy); sy -= 13; }
      if (u.st.seal > 0) { ctx.fillStyle = "#666"; ctx.fillText("封", px, sy); sy -= 13; }
    }

    for (const u of battle.units) {
      if (!u.alive || u.offField <= 0) continue;
      const pos = uPos(u);
      ctx.globalAlpha = 0.5;
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = "#8a7a58"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(pos.x, pos.y, 22, 0, 7); ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = "bold 15px KaiTi, serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "#6a5a3a";
      ctx.fillText("返家", pos.x, pos.y);
      ctx.globalAlpha = 1;
    }

    const hu = hoverUnit();
    if (hu && hu.alive) {
      const pos = uPos(hu);
      ctx.strokeStyle = "rgba(43,38,34,.6)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(pos.x, pos.y, 34, 0, 7); ctx.stroke();
    }

    const FX = fxLevel();
    if (FX === "off") { slashes.length = 0; projectiles.length = 0; rings.length = 0; ghosts.length = 0; particles.length = 0; }
    else if (FX === "lite" && particles.length > 40) particles.length = 40;
    for (let i = slashes.length - 1; i >= 0; i--) {
      const sl = slashes[i];
      sl.t -= dt * 3.2;
      if (sl.t <= 0) { slashes.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(sl.x, sl.y); ctx.rotate(sl.a + 0.6);
      ctx.strokeStyle = "rgba(242,234,216," + sl.t.toFixed(2) + ")";
      ctx.lineWidth = 4 * sl.t + 1;
      ctx.beginPath(); ctx.arc(0, 0, 26, -0.9, 0.9); ctx.stroke();
      ctx.strokeStyle = "rgba(166,58,43," + (sl.t * 0.8).toFixed(2) + ")";
      ctx.lineWidth = 2 * sl.t + 0.5;
      ctx.beginPath(); ctx.arc(0, 0, 31, -0.7, 0.7); ctx.stroke();
      ctx.restore();
    }
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const pr = projectiles[i];
      pr.t += dt * 3.4;
      if (pr.t >= 1) {
        spawnParticles(pr.tx, pr.ty, { n: 9, colors: [pr.color, "#f2ead8"], speed: 100, life: 0.4 });
        projectiles.splice(i, 1); continue;
      }
      const x = pr.x + (pr.tx - pr.x) * pr.t, y = pr.y + (pr.ty - pr.y) * pr.t - Math.sin(pr.t * Math.PI) * 14;
      ctx.save();
      if (pr.style === "beam") {
        ctx.strokeStyle = pr.color; ctx.lineWidth = 3; ctx.globalAlpha = 0.85;
        ctx.beginPath(); ctx.moveTo(pr.x, pr.y); ctx.lineTo(x, y); ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill();
      } else if (pr.style === "arrow") {
        const ang = Math.atan2(pr.ty - pr.y, pr.tx - pr.x);
        ctx.translate(x, y); ctx.rotate(ang);
        ctx.strokeStyle = pr.color; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(7, 0); ctx.stroke();
        ctx.fillStyle = pr.color; ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(4, -3); ctx.lineTo(4, 3); ctx.fill();
      } else if (pr.style === "paper") {
        ctx.translate(x, y); ctx.rotate(Math.sin(pr.t * 9) * 0.5);
        ctx.fillStyle = pr.color; ctx.fillRect(-6, -8, 12, 16);
        ctx.strokeStyle = "rgba(90,70,40,.5)"; ctx.strokeRect(-6, -8, 12, 16);
      } else if (pr.style === "wave") {
        ctx.strokeStyle = pr.color; ctx.lineWidth = 3; ctx.globalAlpha = 0.8;
        ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.stroke();
      } else if (pr.style === "ring") {
        ctx.strokeStyle = pr.color; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(x, y, 10, 0, 7); ctx.stroke();
      } else {
        ctx.fillStyle = pr.color; ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill();
      }
      ctx.restore(); ctx.globalAlpha = 1;
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.t -= dt * 2.6; r.r += dt * 60;
      if (r.t <= 0) { rings.splice(i, 1); continue; }
      ctx.strokeStyle = r.color; ctx.globalAlpha = r.t * 0.8; ctx.lineWidth = 3 * r.t + 0.5;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    for (let i = ghosts.length - 1; i >= 0; i--) {
      const g = ghosts[i];
      g.t -= dt; g.y -= dt * 12;
      if (g.t <= 0) { ghosts.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, g.t) * 0.55;
      ctx.fillStyle = g.color;
      ctx.beginPath(); ctx.arc(g.x, g.y, 27, 0, 7); ctx.fill();
      ctx.font = "bold 28px KaiTi, STKaiti, serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "rgba(255,255,255,.8)";
      ctx.fillText(g.glyph, g.x, g.y + 1);
      ctx.globalAlpha = 1;
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const pa = particles[i];
      pa.t += dt;
      if (pa.t >= pa.life) { particles.splice(i, 1); continue; }
      pa.vy += pa.grav * dt;
      pa.x += pa.vx * dt; pa.y += pa.vy * dt;
      ctx.globalAlpha = Math.max(0, 1 - pa.t / pa.life);
      ctx.fillStyle = pa.color;
      ctx.fillRect(pa.x - pa.size / 2, pa.y - pa.size / 2, pa.size, pa.size);
      ctx.globalAlpha = 1;
    }

    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.t -= dt * 0.9; f.dy -= dt * 34;
      if (f.t <= 0) { floaters.splice(i, 1); continue; }
      const pos = f.u ? uPos(f.u) : { x: CS / 2, y: CS / 2 };
      ctx.font = "bold 22px KaiTi, serif";
      ctx.textAlign = "center";
      ctx.globalAlpha = Math.min(1, f.t * 1.6);
      ctx.fillStyle = f.color;
      ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 3;
      ctx.strokeText(f.text, pos.x, pos.y - 44 + f.dy);
      ctx.fillText(f.text, pos.x, pos.y - 44 + f.dy);
      ctx.globalAlpha = 1;
    }
    if (banner) {
      banner.t -= dt;
      if (banner.t <= 0) banner = null;
      else {
        ctx.font = "bold 44px KaiTi, serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.globalAlpha = Math.min(1, banner.t);
        ctx.fillStyle = "rgba(166,58,43,.92)";
        ctx.strokeStyle = "rgba(255,244,220,.9)"; ctx.lineWidth = 6;
        ctx.strokeText(banner.text, CS / 2, CS / 2 - 90);
        ctx.fillText(banner.text, CS / 2, CS / 2 - 90);
        ctx.globalAlpha = 1;
      }
    }
    ctx.restore();

    for (let i = vignettes.length - 1; i >= 0; i--) {
      const v = vignettes[i];
      if (fxLevel() === "off") { vignettes.length = 0; break; }
      v.t -= dt * 1.6;
      if (v.t <= 0) { vignettes.splice(i, 1); continue; }
      const g = ctx.createRadialGradient(CS / 2, CS / 2, CS * 0.28, CS / 2, CS / 2, CS * 0.72);
      g.addColorStop(0, "rgba(" + v.rgb + ",0)");
      g.addColorStop(1, "rgba(" + v.rgb + "," + (v.t * 0.4).toFixed(3) + ")");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, CS, CS);
    }
  }

  function chebSkillRange(p, f) {
    const sk = battle.skillOf(p, 0);
    if (!sk) return false;
    const rng = sk.range || 1;
    return Math.max(Math.abs(p.r - f.r), Math.abs(p.c - f.c)) <= rng;
  }

  function dot(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }

  function tileFromEvent(ev) {
    const cv = $("#battle-canvas");
    const rect = cv.getBoundingClientRect();
    const x = (ev.clientX - rect.left) * (CS / rect.width);
    const y = (ev.clientY - rect.top) * (CS / rect.height);
    const c = Math.floor((x - PAD) / TILE), r = Math.floor((y - PAD) / TILE);
    if (r < 0 || c < 0 || r >= E.SIZE || c >= E.SIZE) return null;
    return { r, c };
  }
  function hoverUnit() {
    if (!hoverTile || !battle) return null;
    return battle.unitAt(hoverTile.r, hoverTile.c);
  }

  const IS_TOUCH = (typeof window !== "undefined") && ("ontouchstart" in window || navigator.maxTouchPoints > 0);
  function bindCanvas() {
    const cv = $("#battle-canvas");
    if (cv) cv.style.touchAction = "manipulation";
    if (IS_TOUCH) return bindCanvasTouch(cv);
    cv.addEventListener("mousemove", ev => {
      hoverTile = tileFromEvent(ev);
      const u = hoverUnit();
      const tip = $("#tooltip");
      if (u && battle) {
        tip.style.display = "block";
        tip.style.left = (ev.clientX + 14) + "px";
        tip.style.top = (ev.clientY + 14) + "px";
        tip.innerHTML = '<div class="tt-n">' + u.ch.name + "（" + u.ch.hao + "）</div>血 " + u.hp + "/" + u.maxhp
          + "　行动 " + u.apNow + "　" + (u.hasKnife ? "持刀 " : "") + (u.hasHorse ? "有马 " : "")
          + "<br>被动「" + u.ch.passive.name + "」<br><span style='color:#ddd'>" + u.ch.passive.desc + "</span>"
          + (u.ch.skill ? "<br>技「" + u.ch.skill.name + "」<br><span style='color:#ddd'>" + u.ch.skill.desc + "</span>" : "");
      } else tip.style.display = "none";
    });
    cv.addEventListener("mouseleave", () => { hoverTile = null; $("#tooltip").style.display = "none"; });
    cv.addEventListener("click", async ev => {
      if (!battle || battle.over || !battle._playerPhaseActive) return;
      const tile = tileFromEvent(ev);
      if (!tile) return;
      const p = battle.player;
      const target = battle.unitAt(tile.r, tile.c);
      if (mode === "knife") {
        if (target && p.hasKnife && E.adj(p, target) && battle.opponentsOf(p).includes(target)) {
          mode = null;
          await battle.doKnife(p, target);
          afterPlayerAction();
          return;
        }
        mode = null; updateAll(); return;
      }
      if (mode === "horse") {
        if (target && p.hasHorse && E.isWall(p.r, p.c) && E.isWall(target.r, target.c) && E.manh(p, target) <= 3 && battle.opponentsOf(p).includes(target)) {
          mode = null;
          await battle.doHorse(p, target);
          afterPlayerAction();
          return;
        }
        mode = null; updateAll(); return;
      }
      if (mode === "skill") {
        if (target && battle.opponentsOf(p).includes(target) && chebSkillRange(p, target)) {
          mode = null;
          await battle.doSkill(p, 0, target);
          afterPlayerAction();
          return;
        }
        mode = null; updateAll(); return;
      }
      if (target) return;
      const reach = battle._reachable(p, battle.moveRange(p));
      const key = tile.r + "," + tile.c;
      if (reach.keys.includes(key) && !battle.unitAt(tile.r, tile.c)) {
        await battle.doMove(p, tile.r, tile.c);
        afterPlayerAction();
      }
    });
    cv.addEventListener("contextmenu", ev => { ev.preventDefault(); mode = null; updateAll(); });
  }

  function bindCanvasTouch(cv) {
    cv.addEventListener("pointerup", async ev => {
      if (!battle || battle.over || !battle._playerPhaseActive) return;
      const tile = tileFromEvent(ev);
      if (!tile) return;
      const p = battle.player;
      const target = battle.unitAt(tile.r, tile.c);
      if (mode === "knife" && target && E.adj(p, target) && battle.opponentsOf(p).includes(target)) {
        mode = null; await battle.doKnife(p, target); afterPlayerAction(); return;
      }
      if (mode === "horse" && target && p.hasHorse && E.isWall(p.r, p.c) && E.isWall(target.r, target.c)
          && E.manh(p, target) <= 3 && battle.opponentsOf(p).includes(target)) {
        mode = null; await battle.doHorse(p, target); afterPlayerAction(); return;
      }
      if (mode === "skill" && target && battle.opponentsOf(p).includes(target) && chebSkillRange(p, target)) {
        mode = null; await battle.doSkill(p, 0, target); afterPlayerAction(); return;
      }
      if (mode) { mode = null; updateAll(); return; }
      if (target) return;
      const reach = battle._reachable(p, battle.moveRange(p));
      if (reach.keys.includes(tile.r + "," + tile.c) && !battle.unitAt(tile.r, tile.c)) {
        await battle.doMove(p, tile.r, tile.c);
        afterPlayerAction();
      }
    });
  }

  /* ---------------- 结算：交给世界侧的钩子渲染，然后回校园 ---------------- */
  function onBattleEnd(b) {
    battle = b;
    endPlayerPhase();
    updateAll();
    const win = b.result === "win";
    if (win) AU.victory(); else AU.defeat();
    setTimeout(async () => {
      const hooks = window.SJI_BATTLE_HOOKS || {};
      let scn = null;
      if (b.cfg && b.cfg.stageId && window.SJI_SCENES) scn = window.SJI_SCENES.stages[b.cfg.stageId];
      try {
        if (win && b.cfg.victoryScene) await showDialogue(b.cfg.victoryScene);
        else if (!win && b.cfg.defeatScene) await showDialogue(b.cfg.defeatScene);
        else if (scn && scn.victory && win) await showDialogue(scn.victory);
        else if (scn && scn.defeat && !win) await showDialogue(scn.defeat);
      } catch (e) { console.error(e); }
      const extra = (hooks.onResult) ? hooks.onResult(b) : "";
      showResult(b, extra);
    }, window.SJI_DEBUG && window.SJI_DEBUG.fast ? 150 : 1300);
  }

  function showResult(b, extraHtml) {
    const win = b.result === "win";
    $("#result-body").innerHTML =
      '<div class="result-seal seal' + (win ? "" : " lose") + '">' + (win ? "胜" : "败") + "</div>" +
      '<div class="result-title">' + (win ? "活者为王" : (b.result === "timeout" ? "高考终了" : "出师未捷")) + "</div>" +
      '<div class="result-stats">回合：' + b.round + "　·　击破：" + b.stats.kills + "　·　用技：" + (b.stats.usedSkill ? "有" : "无") + "　·　血祭：" + (b.stats.usedBlood ? "有" : "无") + "</div>" +
      (extraHtml || "") +
      '<div class="btnrow" style="justify-content:center;margin-top:18px">' +
      '<button class="btn" id="r-retry">重整旗鼓</button>' +
      '<button class="btn primary" id="r-menu">回校园</button></div>';
    $("#r-retry").onclick = () => {
      AU.click();
      const cfg = Object.assign({}, b.cfg);
      delete cfg.introScene;
      startBattle(cfg, onEndCb);
    };
    $("#r-menu").onclick = () => {
      AU.click();
      if (window.SJI_BATTLE_HOOKS && window.SJI_BATTLE_HOOKS.onDone) window.SJI_BATTLE_HOOKS.onDone(b);
      hideOverlay();
      closeModal();
    };
    showScreenResult();
  }
  function showScreenResult() {
    $("#battle-stage").classList.add("hidden");
    $("#battle-result").classList.remove("hidden");
    stopRaf();
  }
  function showScreenStage() {
    $("#battle-result").classList.add("hidden");
    $("#battle-stage").classList.remove("hidden");
  }

  /* ---------------- 启动绑定 ---------------- */
  function boot() {
    bindActions();
    bindCanvas();
    $("#b-speed").textContent = "速×" + SAVE.settings.speed;
    $("#b-mute").textContent = SAVE.settings.sfx ? "音" : "默";
    AU.setSfx(SAVE.settings.sfx !== false);
  }

  return {
    boot, toast, startBattle, onLog, onState: updateAll,
    rpsRound, playerPhase, pickBoon, onBattleEnd,
    fxFloat, fxHit, fxStatus, snap, fxAttack, fxDeath, fxVignette,
    banner: showBanner, showDialogue, speakerOf,
    showScreenStage,
    get battle() { return battle; },
    get active() { return window.BATTLE_ACTIVE === true; },
  };
})();

/* 全局命名空间（替代马刀 main.js）：设置与调试钩子 */
window.SJI = {
  get settings() { return window.SJI_SAVE.settings; },
  battle: null
};
document.addEventListener("DOMContentLoaded", () => {
  try { window.SJI_UI.boot(); } catch (e) { console.error("战斗层启动失败:", e); }
});
// 首次交互解锁战斗音效（浏览器手势策略）
document.addEventListener("pointerdown", () => { window.SJI_AUDIO.unlock(); }, { once: true });
window.SJI_DEBUG = {
  fast: false,
  skipScenes: false,
  autoRps: false,
  get battle() { return window.SJI.battle; },
  killEnemies() {
    const b = window.SJI.battle;
    if (!b || b.over) return "no battle";
    b.living("enemy").slice().forEach(u => b.rawHurt(u, u.hp, "天降正义"));
    return "ok";
  },
  healPlayer(n) {
    const b = window.SJI.battle;
    if (b) { b.player.hp = Math.min(b.player.maxhp, b.player.hp + (n || 99)); b.pushLog("（神迹）「" + b.player.ch.hao + "」回复了血。"); return "ok"; }
    return "no battle";
  },
  giveAll() {
    const b = window.SJI.battle;
    if (!b) return "no battle";
    b.player.hasKnife = true; b.player.hasHorse = true;
    return "ok";
  }
};

</script>
<script>
/* 实验史记·春秋笔 —— 主线流程：章节 / 交互 / 晚自习 / 终章 */
'use strict';

const Main = (() => {
  /* ---------- 存档兼容：补齐马刀行新增字段 ---------- */
  function normalizeG() {
    if (G.wins == null) G.wins = 0;
    if (G.duelsLost == null) G.duelsLost = 0;
    if (!G.blades) G.blades = { cards: [], equip: null, rare: [] };
    if (!G.blades.rare) G.blades.rare = [];
    if (!G.upgrades) G.upgrades = {};
    if (!G.trialDone) G.trialDone = {};
    if (!G.duelDone) G.duelDone = {};
    if (!G.flags) G.flags = {};
    if (G.flags.duelBanDays == null) G.flags.duelBanDays = 0;
  }

  /* ---------- 马刀：约战 / 结算 ---------- */
  /* 首败即首战：角色 → 马刀风云剧本卷（战前/战胜/战败台词自动接上） */
  const SCENE_OF_CHAR = {
    wanzhen: 's0', dage: 's1', shenren: 's1', xiannv: 's1', hanxiao: 's2',
    shaoming: 's3', xinhui: 's3', shibo: 's4', weirong: 's4', wonder: 's5',
    wenbin: 's5', dazhan: 's6', touge: 's7', luhao: 's8', xiaochuan: 's8',
    guayu: 's9', yiran: 's9', zichen: 's10', guyin: 's11', lifan: 's12',
    limo: 's13', xiangdong: 's13', chongguo: 's14', qinfa: 's14',
    shengxiang: 's15', qiyue: 's15', ziye: 's15', lianqi: 's15',
  };
  /* 特殊战场（据马刀风云原关卡地形） */
  const DUEL_SPECIAL = {
    chongguo: {  // 卷十四 · 终焉之战：校长携钦法，为兵助阵
      enemies: ['qinfa', 'chongguo'], allies: ['weibing'],
      stage: { id: 's14', blocked: [[2, 3], [4, 3]], terrain: 'cabinet', hpScale: 0.78 },
      title: '终焉之战 · 校长室',
    },
  };

  function duelDiff() {
    const d = (window.SJI_SAVE && SJI_SAVE.settings.lastDiff) || 'normal';
    return ['easy', 'normal', 'hard', 'extreme'].includes(d) ? d : 'normal';
  }

  function duelCfg(p, opts) {
    Blades.registerChar();
    const id = p.id;
    const sp = DUEL_SPECIAL[id];
    const first = !Blades.hasCard(id);
    const cfg = Object.assign({
      mode: 'story',
      title: (p.hao || p.name) + ' · 马刀场',
      playerChar: 'yinkesi',
      enemies: [id],
      allies: [],
      diff: duelDiff(),
      aiAggr: (window.SJI_SAVE && SJI_SAVE.settings.aiAggr) || 'active',
    }, opts || {});
    if (sp) {
      Object.assign(cfg, { enemies: sp.enemies, allies: sp.allies || [], stage: sp.stage, title: sp.title });
    } else if (first && window.SJI_SCENES) {
      const sid = SCENE_OF_CHAR[id];
      if (sid && SJI_SCENES.stages[sid]) {
        cfg.stage = { id: sid };
        cfg.introScene = SJI_SCENES.stages[sid].intro;
      }
    }
    return cfg;
  }

  /* 刀禁期（高三·十二月起，师怒禁刀）：课上时段于教室楼内约战，可能被钦法连人带刀收缴 */
  function knifeBanRiskOk(onDecide) {
    if (G.ch < 12) { onDecide(); return; }
    if (G.flags.duelBanDays > 0) { toast(`刀具尚在钦法处（还押 ${G.flags.duelBanDays} 日），约战不得`, '禁'); return; }
    const per = Engine.period();
    const safe = ['dorm', 'playground', 'gate', 'canteen'].includes(World.sceneId);
    if ((per !== 'morning' && per !== 'aft') || safe || Math.random() > 0.25) { onDecide(); return; }
    Dialog.play([
      { who: '钦法', text: '（从走廊尽头逼近）此何课也？尔等围于此，所为何物？' },
      { choice: [
        { t: '把马刀塞进袖口，佯装晨读', fx: '五五之数', run() {
            if (Math.random() < 0.55) return { say: { who: '旁白', text: '钦法扫了一眼，走了。刀柄上全是手汗。' } };
            G.flags.duelBanDays = 2;
            return { say: { who: '钦法', text: '此何物？马刀也。——缴矣。两日后还汝。' }, bad: true };
        } },
        { t: '称此乃历史教具，正在鉴古', fx: '六五之数', run() {
            if (Math.random() < 0.65) return { say: { who: '旁白', text: '钦法端详片刻：「……善。」——好险，他没认出来。' } };
            G.flags.fineTomorrow = true;
            return { say: { who: '钦法', text: '教具？站到后面去。明日行动点-1。' }, bad: true };
        } },
        { t: '抱起书包就跑', fx: '险中求活', run() {
            if (Math.random() < 0.8) { Engine.addRep(-2); return { say: { who: '旁白', text: '你一路冲进厕所，听见外面脚步声远去。' } }; }
            Engine.addRep(-5); Engine.award('ach_caught');
            G.flags.duelBanDays = 2;
            return { say: { who: '钦法', text: '站住！人赃并获——刀缴两日，通报于电子班牌！' }, bad: true };
        } },
      ] },
    ], () => {
      Save.write();
      if (G.flags.duelBanDays > 0) { afterAction(); return; }   // 刀被缴，这一战打不成了
      onDecide();
    });
  }

  function challenge(p) {
    if (Dialog.active || MG.active || (window.BATTLE_ACTIVE)) return;
    const pos = World.npcPos(p.id);
    if (pos) {
      const [px, py] = World.playerPos;
      if (Math.hypot(pos[0] - px, pos[1] - py) > 80) { World.walkTo(pos[0], pos[1] - 50); return; }
    }
    if (!window.SJI_DATA.CHARACTERS[p.id]) { toast('此人不会马刀。', '刀'); return; }
    if ((G.flags.duelBanDays || 0) > 0) { toast(`刀具尚在钦法处（还押 ${G.flags.duelBanDays} 日），约战不得`, '禁'); return; }
    const pool = (p.chat && p.chat.length) ? p.chat : ['来呀来呀。'];
    const script = [
      { who: p.hao || p.name, text: pick(pool) },
      { who: '音克思', text: '闲话少叙——马刀场上见真章。来呀来呀！' },
      { who: p.hao || p.name, text: pick(['来呀来呀，重开重开。', '规则至简，而引人入胜。——请。', '活者为王。开刀吧。']) },
    ];
    /* 行囊里有战大道具，可择一携之入场 */
    const itemIds = Object.keys(G.bag).filter(k => G.bag[k] > 0 && Blades.BATTLE_ITEMS[k]);
    if (itemIds.length) {
      script.push({
        choice: itemIds.map(id => ({
          t: `携「${ITEM_BY_ID[id].name}」入场`, fx: Blades.BATTLE_ITEMS[id].label,
          run() {
            G.bag[id]--; G.flags.duelItem = id; Save.write();
            return { say: { who: '旁白', text: `（${ITEM_BY_ID[id].name}入怀，刀意更稳。）` } };
          },
        })).concat([{ t: '空手赴战', fx: '来呀来呀', run() { return null; } }]),
      });
    }
    Dialog.play(script, () => {
      knifeBanRiskOk(() => SJI_UI.startBattle(duelCfg(p)));
    });
  }

  /* 战斗结算钩子：奖励 / 录技 / 段位（供 battle-ui 调用） */
  window.SJI_BATTLE_HOOKS = {
    onResult(b) {
      const win = b.result === 'win';
      const rankBefore = Blades.rankName();
      let extra = '<div class="result-extra">';
      /* 生存模式：按波次结算 */
      if (b.mode === 'survival') {
        const reached = b.survivalWaveNo || 1;
        const gained = Math.max(0, reached - 1) * 2;
        Engine.addMoney(gained);
        if (reached >= 3) { G.wins++; Engine.addRep(1); }
        if (reached >= 10) Engine.award('ach_surv10');
        extra += `<div>破败城墙，此行抵第 <b>${reached}</b> 波，零花钱 +${gained}。${reached >= 3 ? '计一胜。' : ''}</div>
          <div class="yueks">音克思曰：苔藓覆其上，其高极大以至于不能尽。吾走之其上久——终将尽之。</div>`;
        extra += '</div>';
        Save.write();
        return extra;
      }
      if (win) {
        G.wins++;
        const foes = b.cfg.enemies || [];
        const names = [];
        foes.forEach(id => {
          const ch = window.SJI_DATA.CHARACTERS[id];
          if (!ch) return;
          names.push(ch.hao);
          const c = Blades.grant(id);
          if (PEOPLE_BY_ID[id]) Engine.addFavorQuiet(id, c.fresh ? 6 : 3);
        });
        Engine.addRep(2); Engine.addMoney(3);
        /* 战斗成就 */
        if (G.wins >= 1) Engine.award('ach_duel1');
        if (G.wins >= 30) Engine.award('ach_duel30');
        if (b.stats.usedBlood) Engine.award('ach_bloodwin');
        if (!b.stats.everLeftWall) Engine.award('ach_wallwin');
        /* 高难试炼首通：追加稀有刀卡 */
        if (b.cfg.trialId && !G.trialDone[b.cfg.trialId]) {
          const t = trialById(b.cfg.trialId);
          G.trialDone[t.id] = true;
          Blades.grantRare(t.reward);
          Engine.addRep(3); Engine.addMoney(30);
          if (TRIALS.every(x => G.trialDone[x.id])) Engine.award('ach_trial');
          const rw = Blades.RARE_BOONS[t.reward];
          extra += `<div><b>试炼首通！</b>「${t.name}」授稀有刀卡「${rw.name}」：${rw.desc}（每场常驻生效）</div>
            <div>另声望 +3 · 零花钱 +30。</div>`;
        }
        if (b.cfg.tournament) {
          ['luhao', 'xiaochuan', 'zichen'].forEach(id => Blades.grant(id));
          Engine.addRep(4); Engine.addMoney(10);
          Engine.award('ach_champion');
          extra += `<div><b>锦标赛三连胜！</b>鲁豪、小川、子琛之技尽录刀谱。声望 +4 · 零花钱 +10。</div>
            <div class="yueks">音克思曰：马刀大兴盛，汝今列席协会，与有荣焉。</div>`;
        } else {
          extra += `<div>胜${names.length > 1 ? '众刀手' : '「' + names[0] + '」'}，其名其技录入刀谱。好感与声望各有进益。</div>`;
          const rankNow = Blades.rankName();
          if (rankNow !== rankBefore) {
            toast(`刀道晋阶：「${rankNow}」`, '晋');
            extra += `<div class="yueks">音克思曰：今日封「${rankNow}」。刀是死的，人是活的。</div>`;
          } else {
            extra += `<div class="yueks">音克思曰：规则至简，而引人入胜。${pick(['来呀来呀。', '活者为王。', '重开重开。'])}</div>`;
          }
        }
      } else {
        G.duelsLost++;
        const foeId = (b.cfg.enemies || [])[0];
        const ch = foeId && window.SJI_DATA.CHARACTERS[foeId];
        if (foeId && PEOPLE_BY_ID[foeId]) Engine.addFavorQuiet(foeId, -1);
        extra += `<div>败于${ch ? '「' + ch.hao + '」' : '刀下'}。胜负乃兵家常事。</div>
          <div class="yueks">音克思曰：${pick(['重开重开！', '既毕业，无复有刀者，悲哉——故今日之败，不足记也。', '汝倒下了。但史官还站着。'])}</div>`;
      }
      extra += '</div>';
      Save.write();
      return extra;
    },
    onDone() {
      afterAction();
      World.refresh();
    },
  };

  /* ---------- 刀谱面板 ---------- */
  function panelBlades() {
    Blades.registerChar();
    UI.openPanel('刀谱 · 马刀行', body => {
      const w = G.wins || 0;
      const next = Blades.nextRank();
      const eqId = Blades.equippedSkillId();
      const eqSk = eqId ? Blades.skillCardOf(eqId) : null;
      body.appendChild(el('div', 'card', `
        <h3>段位：${Blades.rankName()} <span class="pill gold">胜 ${w} 场</span>${G.duelsLost ? `<span class="pill gray">败 ${G.duelsLost}</span>` : ''}</h3>
        <div class="meta">段位加成：血上限 +${Blades.hpBonus()} · 每回合行动点 +${Blades.apBonus()}
        ${next ? `　·　再胜 ${next.w - w} 场晋「${next.name}」` : '　·　已至刀道之巅'}</div>
        <div style="height:8px"></div>
        <div class="meta">当前技：${eqSk ? `「${eqSk.name}」——${eqSk.desc}` : '<b style="color:var(--cinnabar)">白板无技</b>——赢下第一场对决，录他一技。'}</div>`));
      /* 修炼：零花钱买永久强化 */
      body.appendChild(el('div', 'muted', '<div style="height:12px"></div>修炼 · 花零花钱买永久强化（小卖部挣钱，对决与试炼亦有进益）：'));
      Blades.UPGRADES.forEach(u => {
        const lv = Blades.upgrades()[u.id] || 0;
        const maxed = lv >= u.max;
        const cost = u.price(lv);
        const c = el('div', 'card');
        c.style.cssText = 'display:flex;align-items:center;gap:12px';
        c.innerHTML = `<div style="flex:1"><h3 style="margin:0">${u.name} <span class="pill gray">Lv.${lv}/${u.max}</span></h3>
          <div class="meta">${u.desc}${maxed ? ' · 已臻化境' : ` · 花费 ◉${cost}`}</div></div>`;
        const b = el('button', 'btn' + (maxed ? '' : ' btn-primary'), maxed ? '已成' : '修炼');
        b.style.padding = '8px 14px';
        if (maxed) b.disabled = true;
        else b.onclick = () => { if (Blades.buyUpgrade(u.id)) { UI.closePanel(); panelBlades(); } };
        c.appendChild(b);
        body.appendChild(c);
      });
      /* 稀有刀卡（试炼首通所授） */
      const rares = Blades.rareList();
      if (rares.length) {
        body.appendChild(el('div', 'muted', '<div style="height:12px"></div>稀有刀卡 · 高难试炼首通所授，每场常驻：'));
        rares.forEach(bid => {
          const rw = Blades.RARE_BOONS[bid];
          if (rw) body.appendChild(el('div', 'card', `<h3 style="margin:0">「${rw.name}」<span class="pill">常驻</span></h3><div class="meta">${rw.desc}</div>`));
        });
      }
      /* 录技列表 */
      body.appendChild(el('div', 'muted', '<div style="height:12px"></div>击败马刀手，其技自动录入刀谱。点选可切换出战之技：'));
      const cards = Blades.cards();
      if (!cards.length) {
        body.appendChild(el('div', 'muted', '刀谱尚空。校园里处处是刀手——走近了，说「来呀来呀」。'));
        return;
      }
      cards.forEach(id => {
        const ch = window.SJI_DATA.CHARACTERS[id];
        if (!ch) return;
        const sk = Blades.skillCardOf(id);
        const c = el('div', 'card');
        c.style.cssText = 'display:flex;align-items:center;gap:12px';
        c.innerHTML = `<div style="flex:1"><h3 style="margin:0">${ch.name} <span class="phao" style="color:var(--cinnabar);font-size:12px">${ch.hao}</span></h3>
          <div class="meta">${sk ? `「${sk.name}」：${sk.desc}` : '（其技不可录，徒留其名）'}</div></div>`;
        const b = el('button', 'btn' + (eqId === id ? ' btn-primary' : ''), eqId === id ? '出战中' : (sk ? '换此技' : '不可选'));
        b.style.padding = '8px 14px';
        if (!sk || eqId === id) b.disabled = true;
        else b.onclick = () => { Blades.equip(id); toast(`已换技：「${sk.name}」`, '谱'); UI.closePanel(); panelBlades(); };
        c.appendChild(b);
        body.appendChild(c);
      });
    });
  }

  /* ---------- 标题页 ---------- */
  function bindTitle() {
    $('#btn-new').onclick = () => { Sfx.tap(); G = newGameState(); normalizeG(); Save.write(); startChapter(true); };
    $('#btn-continue').onclick = () => {
      const s = Save.read();
      if (!s) { toast('还没有存档'); return; }
      G = s; normalizeG(); Sfx.tap();
      $('#screen-title').classList.add('hidden');
      $('#screen-game').classList.remove('hidden');
      UI.updateHUD();
      World.enter(G.flags.lastScene || 'corridor');
      enterPeriod(false);
      toast('继续上局', '史');
    };
    $('#btn-import-title').onclick = () => {
      UI.openPanel('导入存档', body => {
        const ta = el('textarea', 'savebox'); ta.placeholder = '粘贴存档文字…';
        body.appendChild(ta);
        const b = el('button', 'btn btn-primary', '导入');
        b.style.marginTop = '8px';
        b.onclick = () => {
          try { Save.import(ta.value); location.reload(); }
          catch (e) { toast('存档格式不对'); }
        };
        body.appendChild(b);
      });
    };
    const has = !!Save.read();
    $('#btn-continue').classList.toggle('hidden', !has);
  }

  /* ---------- 章节卡 ---------- */
  function showChapterCard(def, cb) {
    const card = $('#chapter-card');
    $('#cc-date').textContent = def.date;
    $('#cc-title').textContent = def.title;
    $('#cc-sub').textContent = def.sub || '';
    card.classList.remove('hidden');
    Sfx.page();
    let fired = false;
    const done = () => {
      if (fired) return; // 点击与自动定时只会生效一次
      fired = true;
      card.classList.add('hidden'); card.onclick = null; cb && cb();
    };
    card.onclick = done;
    setTimeout(done, G.settings.motion === 'off' ? 1200 : 3000);
  }

  function startChapter(isNew) {
    const def = CHAPTERS[G.ch];
    $('#screen-title').classList.add('hidden');
    $('#screen-game').classList.remove('hidden');
    UI.updateHUD();
    showChapterCard(def, () => {
      const scene = def.scene || (G.ch === 15 ? 'gate' : 'corridor');
      World.enter(scene);
      if (isNew && G.ch === 0) prologue();
      else enterPeriod(true);
    });
  }

  function nextChapter() {
    if (G.ch >= CHAPTERS.length - 1) { finale(); return; }
    const toFinale = G.ch + 1 === CHAPTERS.length - 1; // 下一章即终章
    Engine.nextChapter();
    if (toFinale) { finale(); return; }
    startChapter(false);
  }

  /* ---------- 序章 ---------- */
  function prologue() {
    enterPeriod(true);
    toast('点击地面移动 · 走近带「记」的名场面旁观', '引');
    setTimeout(() => toast('走近会马刀的人，可「来呀来呀」约战——胜则录技入刀谱', '刀'), 1800);
    setTimeout(() => toast('右上「史记」随时翻阅卷目 · 「刀」字随时查看刀谱', '引'), 3600);
  }

  /* ---------- 时段流转 ---------- */
  function enterPeriod(changed) {
    UI.updateHUD();
    UI.renderPlaces();
    UI.renderHearsay();
    World.refresh();
    if (Engine.period() === 'eve') { /* 晚自习 ctx 由 updateCtx 处理 */ updateCtx(null); }
    else updateCtx(null);
    if (changed && Engine.period() === 'morning') toast(`${Engine.dateLabel()} · 早读铃响`, '晨');
  }
  function advancePeriod() {
    if (Dialog.active || MG.active || UI.panelOpen) return;
    const r = Engine.advancePeriod();
    if (r === 'period') { enterPeriod(true); Sfx.page(); }
    else if (r === 'eve') { enterPeriod(true); toast('晚自习——一日所获，可入史册', '夜'); Sfx.page(); }
  }
  function sleep() {
    if (Dialog.active || MG.active) return;
    const r = Engine.nextDay();
    if (r === 'chapter-end') {
      if (G.ch === 0) { Engine.award('ach_start'); }
      nextChapter();
    } else if (G.ch === CHAPTERS.length - 1 && G.day > CHAPTERS[G.ch].days) {
      finale();
    } else {
      enterPeriod(true);
      toast(`${Engine.dateLabel()}`, '晨');
    }
  }

  /* ---------- 交互条 ---------- */
  function updateCtx(near) {
    const bar = $('#ctxbar');
    bar.innerHTML = '';
    bar.classList.add('hidden');
    if (Dialog.active || MG.active) return;
    // 晚自习固定动作
    if (Engine.period() === 'eve') {
      bar.classList.remove('hidden');
      const mk = (t, cls, fn, dis) => { const b = el('button', 'ctx-btn' + (cls ? ' ' + cls : ''), t); b.disabled = !!dis; b.onclick = fn; bar.appendChild(b); return b; };
      mk('📖 撰史', '', () => UI.panelBook());
      mk('✒ 写日记', '', () => { Engine.addWen(3); G.flags.rested = true; toast('日记写成，文笔 +3；明日精神抖擞（行动点+1）', '文'); Save.write(); });
      mk('🌙 夜谈', '', nightTalk);
      mk('就寝 →', 'accent', sleep);
      return;
    }
    const hasSceneAct = World.sceneId === 'library' || World.sceneId === 'shop' || World.sceneId === 'pingpong'
      || World.sceneId === 'playground'
      || ((World.sceneId === 'classroom6' || World.sceneId === 'classroom7') && (Engine.period() === 'morning' || Engine.period() === 'aft'));
    if (!near && !hasSceneAct) return;
    if (near) bar.classList.remove('hidden');
    if (near && near.type === 'npc') {
      const p = near.p;
      const fav = Engine.favorOf(p.id);
      const head = el('span', 'ctx-name', p.hao || p.name);
      bar.appendChild(head);
      bar.appendChild(el('span', 'ctx-sub', `好感 ${fav}`));
      // 交谈
      const free = G.chatCount < 2;
      const chatBtn = el('button', 'ctx-btn', free ? '交谈' : '交谈 ⚡1');
      chatBtn.onclick = () => chat(p);
      bar.appendChild(chatBtn);
      // 赠礼
      const giftBtn = el('button', 'ctx-btn', G.giftToday[p.id] ? '已赠' : '赠礼');
      if (G.giftToday[p.id]) giftBtn.disabled = true;
      giftBtn.onclick = () => giftPick(p);
      bar.appendChild(giftBtn);
      // 采访
      if (p.interview) {
        const need = p.ivNeed != null ? p.ivNeed : 30;
        const ok = fav >= need && !Engine.hasShard(p.interview.give);
        const iv = el('button', 'ctx-btn' + (ok ? ' accent' : ''), ok ? '采访 ⚡1' : fav >= need ? '已采' : `采访 需好感${need}`);
        if (!ok) iv.disabled = true;
        iv.onclick = () => interview(p);
        bar.appendChild(iv);
      }
      // 约战（会马刀的人）
      if (window.SJI_DATA && SJI_DATA.CHARACTERS[p.id]) {
        const duelBtn = el('button', 'ctx-btn duel', '来呀来呀 · 约战');
        duelBtn.onclick = () => challenge(p);
        bar.appendChild(duelBtn);
      }
    } else if (near && near.type === 'event') {
      bar.appendChild(el('span', 'ctx-name', '「' + near.ev.name + '」'));
      const b = el('button', 'ctx-btn accent', '旁观亲历');
      b.onclick = () => playEvent(near.ev);
      bar.appendChild(b);
    } else if (near && near.type === 'door') {
      const b = el('button', 'ctx-btn', '进入 · ' + near.door.label);
      b.onclick = () => World.travel(near.door.to);
      bar.appendChild(b);
    }
    // 场景特有动作（入景即可用，无需贴近谁）
    if (hasSceneAct) bar.classList.remove('hidden');
    if (World.sceneId === 'library') {
      const b = el('button', 'ctx-btn', '读书 ⚡1 → 文笔+4');
      b.onclick = () => {
        if (!Engine.spendAP(1)) return;
        Engine.addWen(4); G.stats.reads++; Sfx.good();
        toast('读罢掩卷，文笔 +4', '文');
        if (Math.random() < 0.3) toast('（文言书看起来就是很上头）');
        Save.write();
      };
      bar.appendChild(b);
    }
    if ((World.sceneId === 'classroom6' || World.sceneId === 'classroom7') && (Engine.period() === 'morning' || Engine.period() === 'aft')) {
      const b = el('button', 'ctx-btn', '听课 ⚡1 → 文笔+2');
      b.onclick = () => listenClass();
      bar.appendChild(b);
    }
    if (World.sceneId === 'shop') {
      const b = el('button', 'ctx-btn accent', '进店购物');
      b.onclick = () => UI.panelShop();
      bar.appendChild(b);
    }
    if (World.sceneId === 'playground' && G.ch >= 8) {
      const clubOn = !!G.flags.xiehui;
      const t = el('button', 'ctx-btn' + (clubOn ? ' duel' : ''), clubOn ? '协会锦标赛 ⚡' : '协会未立（卷九后）');
      if (!clubOn) t.disabled = true;
      else t.onclick = () => { if (!Engine.spendAP(1)) return; startTournament(); };
      bar.appendChild(t);
      const tr = el('button', 'ctx-btn' + (clubOn ? ' duel' : ''), clubOn ? '高难试炼' : '试炼未开');
      if (!clubOn) tr.disabled = true;
      else tr.onclick = () => panelTrial();
      bar.appendChild(tr);
      const s = el('button', 'ctx-btn' + (clubOn ? ' duel' : ''), clubOn ? '破败城墙 · 生存 ⚡' : '生存未开');
      if (!clubOn) s.disabled = true;
      else s.onclick = () => { if (!Engine.spendAP(1)) return; startSurvival(); };
      bar.appendChild(s);
    }
    if (World.sceneId === 'pingpong') {
      const b = el('button', 'ctx-btn', '打乒乓球 ⚡1');
      b.onclick = () => {
        if (!Engine.spendAP(1)) return;
        MG.launch('pingpong', ok => {
          if (ok) {
            Engine.award('ach_pp'); Engine.addWen(2); Engine.addMoney(5);
            if (!Engine.hasShard('sh_pingpong')) Engine.grantShard('sh_pingpong', 'scene');
            afterAction();
          } else { toast('差两板……再来一局？'); afterAction(); }
        });
      };
      bar.appendChild(b);
    }
  }

  function trialById(id) { return TRIALS.find(t => t.id === id); }

    Blades.registerChar();

      mode: 'story', trialId: id,

      allies: [], diff: duelDiff(), aiAggr: 'active',

  function panelTrial() {
    Blades.registerChar();
    UI.openPanel('协会试炼 · 高难关卡', body => {
      const cleared = TRIALS.filter(t => G.trialDone[t.id]).length;

      TRIALS.forEach(t => {
        const done = !!G.trialDone[t.id];

          ${rule ? `<div class="meta" style="color:var(--cinnabar)"><b>〔特则〕</b>${rule.desc}</div>` : ''}

  function afterAction() {
    UI.updateHUD(); UI.renderHearsay(); World.refresh(); Save.write();
  }

  /* ---------- 行为 ---------- */
  function chat(p) {
    if (G.chatCount >= 2 && !Engine.spendAP(1)) return;
    G.chatCount++;
    G.stats.chats++;
    if (!G.flags.metPeople.includes(p.id)) { G.flags.metPeople.push(p.id); toast(`结识「${p.name}${p.hao ? ' · ' + p.hao : ''}」`, '识'); }
    const first = G.stats.chats === 1;
    const line = pick(first ? p.greet.concat(p.chat) : p.chat);
    Engine.addFavor(p.id, 1);
    if (Engine.riskCheck()) { Engine.caughtPlay(() => afterAction()); return; }
    Dialog.play([{ who: p.hao || p.name, text: line }], afterAction);
  }
  function giftPick(p) {
    const ids = Object.keys(G.bag).filter(k => G.bag[k] > 0);
    if (!ids.length) { toast('行囊空空——去小卖部买点礼物', '囊'); UI.panelShop(); return; }
    UI.openPanel(`赠礼予 ${p.hao || p.name}`, body => {
      body.appendChild(el('div', 'muted', '投其所好，好感大涨。每人每天可赠一次。'));
      body.appendChild(el('div', '', '<div style="height:8px"></div>'));
      ids.forEach(id => {
        const it = ITEM_BY_ID[id];
        const love = p.loves && p.loves.includes(id), like = p.likes && p.likes.includes(id);
        const c = el('div', 'card');
        c.style.cssText = 'display:flex;align-items:center;gap:12px;cursor:pointer';
        c.innerHTML = `<div style="flex:1"><h3 style="margin:0">${it.name} <span class="pill gray">×${G.bag[id]}</span>${love ? '<span class="pill">心头好</span>' : like ? '<span class="pill jade">会喜欢</span>' : ''}</h3><div class="meta">${it.desc}</div></div>`;
        const b = el('button', 'btn btn-primary', '赠');
        b.onclick = e => { e.stopPropagation(); doGift(p, id); };
        c.appendChild(b);
        body.appendChild(c);
      });
    });
  }
  function doGift(p, id) {
    G.bag[id]--;
    G.giftToday[p.id] = 1;
    G.stats.gifts++;
    const love = p.loves && p.loves.includes(id), like = p.likes && p.likes.includes(id);
    const n = love ? 12 : like ? 6 : 2;
    Engine.addFavor(p.id, n);
    if (love) Sfx.unlock(); else Sfx.good();
    if (p.id === 'keyi' && Engine.favorOf(p.id) >= 100) Engine.award('ach_sugar');
    if (G.money >= 40) Engine.award('ach_rich');
    UI.closePanel();
    Dialog.play([{ who: p.hao || p.name, text: love ? `（眼睛一亮）此物……汝如何知吾所好？善！大善！` : like ? '（收下，端详片刻）有心了。' : '（收下）……多谢。' }], afterAction);
  }
  function interview(p) {
    if (!Engine.spendAP(1)) return;
    Engine.grantShard(p.interview.give, 'interview');
    Engine.addFavor(p.id, 5);
    Dialog.play(p.interview.script, afterAction);
  }
  function playEvent(ev) {
    Dialog.play(ev.script, () => {
      G.doneEvents.push(ev.id);
      if (ev.flag) { G.flags[ev.flag] = true; toast('新去处已开：' + ev.name, '开'); }
      // 亲历其事，当事人好感微增（不打扰，合并一条提示）
      if (ev.cast && ev.cast.length) {
        ev.cast.forEach(id => PEOPLE_BY_ID[id] && Engine.addFavorQuiet(id, 2));
        toast('亲历名场面，当事诸人好感 +2', '记');
      }
      if (ev.id === 'ev_shuban') Engine.award('ach_shuban');
      const mgStep = ev.script.find(s => s.mg);
      const mgOk = mgStep ? mgStep._mgResult !== false : true;
      if (ev.shard) {
        if (mgStep && !mgOk) { Engine.grantShard(ev.shard, 'gossip'); toast('过程有波折，但史料还是到手了'); }
        else Engine.grantShard(ev.shard, 'scene');
      }
      if (mgStep && mgOk) {
        if (ev.mg === 'late') Engine.award('ach_109');
        if (ev.mg === 'spin') Engine.award('ach_spin');
        if (ev.mg === 'canteen') Engine.award('ach_lingyang');
      }
      if (Engine.riskCheck()) { Engine.caughtPlay(() => afterAction()); return; }
      afterAction();
    });
  }

  /* ---------- 世界回调 ---------- */  function onCtxChange(near) { updateCtx(near); }
  function onNPC(p) {
    if (Dialog.active || MG.active) return;
    const pos = World.npcPos(p.id);
    if (pos) {
      const [px, py] = World.playerPos;
      if (Math.hypot(pos[0] - px, pos[1] - py) > 80) { World.walkTo(pos[0], pos[1] - 50); return; }
    }
    updateCtx({ type:'npc', p });
  }
  function onEvent(ev) {
    if (Dialog.active || MG.active) return;
    const [px, py] = World.playerPos;
    if (Math.hypot(ev.pos[0] - px, ev.pos[1] - py) > 80) { World.walkTo(ev.pos[0], ev.pos[1] + 30); return; }
    playEvent(ev);
  }
  function afterDialog() { UI.updateHUD(); UI.renderHearsay(); World.refresh(); Save.write(); }

  /* ---------- 终章：高考 · 毕业 · AI ---------- */
  function finale() {
    showChapterCard(CHAPTERS[16], () => {
      World.enter('gate');
      UI.updateHUD();
      Dialog.play([
        { who:'旁白', text:'六月七日。考场。你一抬眼——歆慧就坐在斜前方，大哥在她左后方。' },
        { who:'大哥', text:'（见之心善，探身）歆慧，汝亦在此。' },
        { who:'歆慧', text:'滚。' },
        { who:'旁白', text:'大哥于是遂走。开考铃响。' },
        { choice: [
          { t:'把这一幕原样记进心里', fx:'史官本能', rep:1, run(){ return { say:{who:'旁白',text:'你要让这一幕活过这个夏天。'} }; } },
          { t:'专心做卷子', fx:'考生本分', wen:2, run(){ return { say:{who:'旁白',text:'笔下如有神——这一场，你超常发挥。'} }; } },
        ] },
        { who:'旁白', text:'两日笔落如刀，收卷如史官封笔。后来听说，大哥托俊玥传了话，又亲口对歆慧说了三个字，歆慧对曰：善。' },
        { who:'旁白', text:'你忽然想起大哥的话：城墙者，高考也。你们都走完了那面墙。' },
      ], () => graduation());
    });
  }
  function graduation() {
    const all = PEOPLE.concat(PEOPLE_WAI);
    UI.openPanel('毕业 · 诸君去向', body => {
      body.appendChild(el('div', 'muted', '卷里卷外，皆是少年。你写下的每一个人，都有了自己的远方。'));
      body.appendChild(el('div', '', '<div style="height:10px"></div>'));
      all.forEach(p => {
        const met = G.flags.metPeople.includes(p.id) || (p.vol && G.vols[p.vol]);
        const c = el('div', 'card');
        c.style.marginBottom = '8px';
        c.innerHTML = `<h3 style="margin:0">${p.name} <span class="phao" style="color:var(--cinnabar);font-size:12.5px">${p.hao || ''}</span></h3>
          <div class="meta">${met ? p.out || '' : '（你在史书里没来得及写他/她。）'}</div>`;
        body.appendChild(c);
      });
      const b = el('button', 'btn btn-primary', '一年后……');
      b.style.cssText = 'width:100%;margin-top:12px;padding:14px';
      b.onclick = () => { UI.closePanel(); aiEpilogue(); };
      body.appendChild(b);
    });
  }
  function aiEpilogue() {
    Engine.award('ach_ai');
    const pub = Object.keys(G.vols).length;
    const avg = pub ? Object.values(G.vols).reduce((a, b) => a + b.grade, 0) / pub : 0;
    let title = '残卷 · 史未成而人已散';
    if (pub >= 6) title = '史官 · 有所记，有所失';
    if (pub >= 10) title = '良史 · 秉笔直书，温润如玉';
    if (pub >= 15) title = G.rep >= 60 ? '太史公 · 究天人之际，通古今之变' : '太史公（孤本）· 书成而友尽？';
    const styleLine = G.stats.direct > G.stats.curve * 2 ? '峻直' : G.stats.curve > G.stats.direct * 2 ? '敦厚' : '直曲相济';
    // 已立传诸人的平均好感
    const castIds = new Set();
    Object.keys(G.vols).forEach(no => VOL_BY_NO[no].cast.forEach(id => castIds.add(id)));
    const favAvg = castIds.size ? Math.round([...castIds].reduce((a, id) => a + Engine.favorOf(id), 0) / castIds.size) : 0;
    // 马刀行结局变体
    const wins = G.wins || 0, cards = (G.blades && G.blades.cards || []).length;
    const rank = (window.Blades && Blades.rankName()) || '未入册';
    let bladePara;
    if (wins === 0) bladePara = '「全书几乎不提马刀。你站在刀场边上，把笔墨都留给了人。」';
    else if (wins >= 30) bladePara = `「另外——你的刀谱录了 ${cards} 人之技，生平 ${wins} 胜，封『${rank}』。马刀之神与你，只差一个名分。」`;
    else bladePara = `「另外——你放不下的还有那把马刀。刀谱录 ${cards} 人之技，生平 ${wins} 胜，位至『${rank}』。」`;
    const bladeTail = wins > 0
      ? '<p style="font-size:14px;line-height:1.9">「卷八有云：既毕业，无复有刀者，悲哉。但你把它一笔一笔写进了书里——写进书里的刀，就不会消。」</p>'
      : '';
    UI.openPanel('一年后 · AI 读史', body => {
      const card = el('div', 'card');
      card.style.fontFamily = 'var(--font-ui)';
      card.innerHTML = `
        <h3 style="font-size:18px">你把《实验史记》喂给了一个 AI。</h3>
        <div class="muted" style="margin-bottom:10px">——序云：「我想看看史记到底能不能看出我。」</div>
        <p style="font-size:14px;line-height:1.9">AI 读完了。它说：</p>
        <p style="font-size:14px;line-height:1.9">「全书立传 <b>${pub}/15</b> 卷，笔风<b>${styleLine}</b>（直笔 ${G.stats.direct} 处，曲笔 ${G.stats.curve} 处）。</p>
        <p style="font-size:14px;line-height:1.9">「书中诸人的平均好感 ${favAvg}/100，你在班中的声望 ${G.rep}/100——${G.rep >= 60 ? '你写作时显然没有失去太多朋友，这很了不起。' : '史官从来不好当，你得罪了一些人，但你没有删掉一个字。'}</p>
        <p style="font-size:14px;line-height:1.9">「最打动我的是：${pick(['你记录他们时，从未居高临下。', '你把小事故写成了大历史，又把大历史写得像小事。', '书里没有反派，只有没来得及好好说话的少年。'])}。</p>
        <p style="font-size:14px;line-height:1.9">「通过一个人的文字，真的能看出一个人的大部分。」</p>
        ${bladePara}${bladeTail}
        <div style="text-align:center;margin:18px 0 4px">
          <div style="font-family:var(--font-cl);font-size:30px;font-weight:900;color:var(--cinnabar)">${title}</div>
        </div>
        <button class="btn btn-primary" style="width:100%;padding:14px" id="btn-replay">重开重开</button>`;
      body.appendChild(card);
      $('#btn-replay').onclick = () => { Save.clear(); location.reload(); };
    });
    Sfx.unlock();
  }

  /* ---------- 菜单面板 ---------- */
  function menuPanel() {
    UI.openPanel('系统', body => {
      const row = el('div', '');
      row.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px';
      [['图鉴 · 史中人', () => UI.panelCodex()], ['刀谱 · 马刀行', () => panelBlades()], ['成就', () => UI.panelAch()],
       ['行囊', () => UI.panelBag()], ['设置 · 存档', () => UI.panelSettings()]].forEach(([t, fn]) => {
        const b = el('button', 'btn', t);
        b.onclick = fn;
        row.appendChild(b);
      });
      body.appendChild(row);
      body.appendChild(el('div', 'card', `<h3>操作</h3><div class="meta">点击地面移动 / 点击人物交谈 / 走近「记」旁观名场面。底部按钮可直达各处。误触不怕——没有不可撤销的损失。</div>`));
    });
  }

  /* ---------- 全局按钮 ---------- */
  function bindHUD() {
    $('#btn-hud-book').onclick = () => UI.panelBook();
    $('#btn-hud-blade').onclick = () => panelBlades();
    $('#btn-bag').onclick = () => UI.panelBag();
    $('#btn-menu').onclick = () => menuPanel();
  }

  function boot() {
    bindTitle();
    bindHUD();
    World.setOnCtx(onCtxChange);
    // 底部「下一时段」由 placelist 附加
    const orig = UI.renderPlaces;
    UI.renderPlaces = function () {
      orig();
      const bar = $('#placelist');
      if (Engine.period() !== 'eve') {
        const b = el('button', 'place-btn here', '下一时段 ▸');
        b.onclick = () => advancePeriod();
        bar.appendChild(b);
      }
    };
    World.start();
  }

  return { boot, onNPC, onEvent, afterDialog, updateCtx, onCtxChange,
           challenge, startDuel: p => SJI_UI.startBattle(duelCfg(p)), panelBlades, normalizeG,
           startTournament, startSurvival, startTrial, panelTrial, trialById };
})();

window.addEventListener('DOMContentLoaded', () => Main.boot());

</script>
</body>
</html>
