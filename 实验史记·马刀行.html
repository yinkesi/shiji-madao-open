<!DOCTYPE html>
<html lang="zh-CN">
<!--
  ============================================================
  实验史记·马刀行 —— 页面骨架（index.html）
  【这份文件是干嘛的】
  HTML 是网页的"骨架"：它本身不会动，只负责把一个个元素（用
  <div>、<button> 等标签写出的盒子）摆到页面上。让页面动起来的是
  另外两套分工：
    · CSS（css/style.css）管"长什么样"：颜色、圆角、玻璃质感；
    · 文件末尾的 23 个 <script>（js 目录）管"怎么动"：游戏逻辑
      全在那边。
  而 JS 抓住页面元素的"把手"，就是本文件里各种 id：JS 用
  document.querySelector('#hud') 这样的方式按 id 找到元素，
  再改它的内容、增删它的 class。

  【页面结构地图】（从上到下，按出现顺序）
    1. screen-title   标题页：开卷 / 继续上局 / 导入存档
    2. screen-game    游戏主界面：世界画布 + 顶部 HUD + 校园见闻
                      + 任务卡 + 地点导航条 + 交互提示条
    3. panel + scrim  底部抽屉面板（图鉴/成就/系统/史记/行囊共用）
    4. dialog         对话层：立绘舞台 + 对话框 + 选项
    5. minigame       小游戏覆盖层（第二块画布）
    6. chapter-card   章节转场卡（"第 X 章"大字过场）
    7. battle         马刀战场覆盖层（战棋界面 + 结算页）
    8. 零碎小件：modal-mask 战斗弹层、tooltip 小提示、toasts 飘字
  【新手阅读提示】
  1) 大部分区块默认"藏"着：JS 增删 class="hidden"（对应 CSS 里
     display:none）来切换谁显示谁隐藏。整个游戏就是在一块窗口里
     轮流掀开这些"屏幕"和"层"。
  2) 末尾 23 个 <script> 的顺序绝对不能乱，原因见文件末尾的大段
     注释；先读完上面的骨架再往下看脚本，思路更清楚。
  ============================================================
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>实验史记·马刀行</title>
<style>
/* ============================================================
   实验史记·春秋笔 — 样式
   Apple 风格：系统字体、玻璃材质、即时按压反馈、按尺寸调字距
   ============================================================ */
/* ============================================================
   【这份文件是干嘛的】
   CSS（层叠样式表）管的是"长什么样"：颜色、字体、圆角、阴影、
   动画全写在这里，HTML（index.html）只提供骨架。选择器（写在
   { } 前面的部分）负责"点名"要打扮哪些元素：
     · #hud    井号开头 = 按 id 找，全页唯一的一个元素；
     · .glass  点号开头 = 按 class 找，可同时命中很多元素；
     · body.theme-night = 标签名 + class 组合，夜间模式的 body。
   【文件地图】（自上而下）
     1. 设计变量与昼夜两套主题
     2. 全局重置与 .hidden 开关
     3. 通用零件：按钮家族、玻璃卡
     4. 标题页
     5. 游戏主界面：画布、HUD、见闻栏、地点条、交互条
     6. 底部抽屉面板及其内容（卷目/图鉴/成就/设置）
     7. 对话层
     8. 章节转场卡、Toast 通知
     9. 撰史界面、小游戏层、任务指引卡
    10. 马刀战场覆盖层（占文件后半的最大一块）
   ============================================================ */
/* ---------- 设计变量 ----------
   :root 指文档根元素，这里定义的"--开头的自定义属性"（变量）
   全页可用，用 var(--名字) 引用。好处：改一处、全站生效。
   常用几组：纸墨色 paper/ink、朱砂红 cinnabar、金 gold、玉绿 jade、
   玻璃底色 glass、圆角半径 r-s/m/l、UI 黑体 font-ui 与古风宋体
   font-cl、--blur 是毛玻璃的模糊配方。 */
:root {
  --paper: #f6f3ea;
  --paper-2: #efe9db;
  --ink: #26241f;
  --ink-2: #5a564c;
  --ink-3: #8d887a;
  --cinnabar: #b8432f;
  --cinnabar-deep: #96331f;
  --gold: #a8842c;
  --jade: #3e7a5e;
  --glass: rgba(252, 250, 244, 0.72);
  --glass-border: rgba(255, 255, 255, 0.55);
  --glass-dark: rgba(28, 26, 22, 0.78);
  --shadow-1: 0 1px 2px rgba(30, 26, 16, .08), 0 4px 14px rgba(30, 26, 16, .10);
  --shadow-2: 0 2px 6px rgba(30, 26, 16, .12), 0 14px 40px rgba(30, 26, 16, .18);
  --r-s: 10px; --r-m: 16px; --r-l: 22px;
  --font-ui: -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
  --font-cl: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
  --blur: blur(22px) saturate(160%);
}
/* 夜间主题：body 挂上 .theme-night 类时，把上面那批变量整体换成
   深色值。因为所有颜色都走 var() 引用，只改变量即可全局换肤。 */
body.theme-night {
  --paper: #23211c;
  --paper-2: #2c2921;
  --ink: #ece7da;
  --ink-2: #c4beac;
  --ink-3: #8f8a7b;
  --glass: rgba(38, 35, 29, 0.72);
  --glass-border: rgba(255, 255, 255, 0.12);
  --shadow-1: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
  --shadow-2: 0 2px 6px rgba(0,0,0,.4), 0 14px 40px rgba(0,0,0,.5);
}
/* 全局重置与基线：* 选中所有元素，清掉浏览器默认边距；
   box-sizing:border-box 让"宽度"把内边距和边框也算进去，算尺寸
   更直观。html/body 锁满屏并禁止页面滚动（整屏游戏不需要滚动条）。
   .hidden 是全场最重要的工具类：display:none 直接把元素藏起来，
   JS 靠增删这个类来切换界面，!important 保证它压过其他显示规则。 */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font: 100%/1.6 var(--font-ui);
  color: var(--ink);
  background: var(--paper);
  letter-spacing: 0.01em;
  user-select: none;
  -webkit-user-select: none;
}
.hidden { display: none !important; }
button { font: inherit; color: inherit; letter-spacing: inherit; }

/* ---------- 通用按钮：按下即反馈 ---------- */
/* 按钮家族：.btn 基础款（玻璃底、圆角，:active 即"被按住那一刻"
   缩小变暗，制造按压手感）；.btn-primary 朱砂实色主按钮；
   .btn-ghost 透明底幽灵款给次要操作；.btn-icon 34px 圆形小图标钮
   （如面板右上角的 ✕）。 */
.btn {
  appearance: none; border: 1px solid var(--glass-border);
  background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  color: var(--ink); border-radius: 14px;
  padding: 12px 22px; font-size: 16px; font-weight: 600; cursor: pointer;
  box-shadow: var(--shadow-1);
  transition: transform 120ms ease-out, filter 120ms ease-out;
}
.btn:active { transform: scale(0.96); filter: brightness(0.96); }
.btn-primary {
  background: linear-gradient(180deg, #c8523c, var(--cinnabar));
  border-color: rgba(255,255,255,.25); color: #fff8f2;
  box-shadow: 0 1px 2px rgba(150,51,31,.4), 0 8px 24px rgba(184,67,47,.35);
}
.btn-ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--ink-2); }
.btn-ghost:active { background: rgba(0,0,0,.05); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn-icon {
  appearance: none; border: none; background: rgba(0,0,0,.05);
  width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 15px;
  transition: transform 120ms ease-out;
}
.btn-icon:active { transform: scale(0.9); }

/* ---------- 玻璃材质 ---------- */
/* 毛玻璃卡：半透明底色 + backdrop-filter 模糊（把背后的画面糊化，
   磨砂玻璃质感）+ 细白描边 + 柔和阴影。HUD、见闻栏、地点条、
   交互条、任务卡全都挂 .glass，所以看起来像同一套器具。 */
.glass {
  background: var(--glass);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-1);
  border-radius: var(--r-m);
}

/* ============ 标题页 ============ */
/* 标题页：.screen 铺满整窗；书名用 writing-mode:vertical-rl 竖排
   （从上到下、从右往左），朱砂印章斜贴右上角；字号用 clamp()
   随窗口高度伸缩，小屏也不挤。 */
.screen { position: fixed; inset: 0; }
#screen-title { overflow: hidden; background: var(--paper); }
.title-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(184,67,47,.10), transparent 60%),
    radial-gradient(900px 500px at 10% 110%, rgba(62,122,94,.10), transparent 60%),
    repeating-linear-gradient(0deg, transparent 0 34px, rgba(38,36,31,.028) 34px 35px);
}
.title-seal {
  position: absolute; top: 6vh; right: 8vw;
  width: 92px; height: 92px; border-radius: 18px;
  display: grid; place-items: center;
  font-family: var(--font-cl); font-size: 56px; font-weight: 700; color: #fff6f0;
  background: linear-gradient(160deg, #c8523c, var(--cinnabar-deep));
  box-shadow: var(--shadow-2), inset 0 1px 0 rgba(255,255,255,.35);
  transform: rotate(4deg);
}
.title-main {
  position: relative; height: 100%;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  gap: 4vh; padding: 24px; text-align: center;
}
.title-vert { display: flex; flex-direction: row-reverse; gap: 3.2vw; align-items: stretch; justify-content: center; }
.title-book {
  writing-mode: vertical-rl; font-family: var(--font-cl);
  font-size: clamp(56px, 11vh, 96px); font-weight: 900; color: var(--ink);
  letter-spacing: 0.18em; line-height: 1;
}
.title-sub {
  writing-mode: vertical-rl; font-family: var(--font-cl);
  font-size: clamp(26px, 5.2vh, 44px); font-weight: 700; color: var(--cinnabar);
  letter-spacing: 0.5em; padding-top: .35em;
  border-right: 1px solid rgba(184,67,47,.35); padding-right: .5em;
}
.title-tagline { color: var(--ink-2); font-size: 17px; letter-spacing: .06em; }
.title-menu { display: flex; flex-direction: column; gap: 12px; width: min(320px, 80vw); }
.title-foot { position: absolute; bottom: 3vh; color: var(--ink-3); font-size: 12.5px; letter-spacing: .12em; }

/* ============ HUD ============ */
/* 游戏主界面：#world 画布铺满垫底，#hud 状态条浮在顶部。
   z-index 决定层级（数字大的盖住小的）；.hud-chip 是状态条里一枚枚
   胶囊小牌；@keyframes bump 定义"放大跳一下"，数值变化时 JS 给
   牌子加 .bump 类触发它。 */
#screen-game { background: #dfe6da; }
#world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; }
#hud {
  position: absolute; top: 12px; left: 12px; right: 12px;
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 10px; gap: 8px; z-index: 20; border-radius: 18px;
}
.hud-left, .hud-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hud-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.5); border: 1px solid rgba(255,255,255,.6);
  border-radius: 999px; padding: 6px 12px;
  font-size: 13.5px; font-weight: 600; color: var(--ink); white-space: nowrap;
  box-shadow: 0 1px 2px rgba(30,26,16,.06);
}
body.theme-night .hud-chip { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.14); }
.hud-chip.stat b { font-weight: 800; font-variant-numeric: tabular-nums; }
.hud-chip.stat.bump b { animation: bump .45s ease; }
@keyframes bump { 30% { transform: scale(1.35); color: var(--cinnabar); } }
button.hud-chip { cursor: pointer; transition: transform 120ms ease-out; }
button.hud-chip:active { transform: scale(0.94); }
.hud-title .seal-mini {
  display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 7px;
  background: linear-gradient(160deg, #c8523c, var(--cinnabar-deep));
  color: #fff6f0; font-family: var(--font-cl); font-size: 14px; font-weight: 700;
}
.hud-title .hud-bookname { font-family: var(--font-cl); font-size: 15px; letter-spacing: .2em; }
#hud-date { flex-direction: column; align-items: flex-start; gap: 0; padding: 5px 14px; line-height: 1.25; }
#hud-date-main { font-size: 13px; }
#hud-period { font-size: 11.5px; color: var(--ink-2); font-weight: 600; letter-spacing: .08em; }

/* 今日风闻 */
/* 游戏主界面右上/底部的三块悬浮小件，依次是：
   见闻栏（右上角固定 230px 宽的纯展示播报）、地点导航、交互条。 */
#hearsay {
  position: absolute; top: 72px; right: 12px; width: 230px;
  padding: 10px 12px; z-index: 15; border-radius: 16px;
}
.hearsay-title { font-size: 11.5px; font-weight: 800; letter-spacing: .22em; color: var(--cinnabar); margin-bottom: 6px; }
#hearsay-list { display: flex; flex-direction: column; gap: 6px; }
.hearsay-item { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
.hearsay-item b { color: var(--ink); }
.hearsay-item .done { color: var(--jade); }

/* 地点导航 */
/* 底部地点条：一排可横向滑动的胶囊按钮，.here 表示当前所在地点
   （墨色反白高亮）。 */
#placelist {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px;
  display: flex; gap: 6px; padding: 7px 9px; z-index: 20; max-width: calc(100vw - 24px);
  overflow-x: auto; scrollbar-width: none;
}
#placelist::-webkit-scrollbar { display: none; }
.place-btn {
  appearance: none; border: 1px solid transparent; cursor: pointer;
  background: rgba(255,255,255,.5); border-radius: 999px; padding: 7px 14px;
  font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap;
  transition: transform 120ms ease-out, background 150ms;
}
body.theme-night .place-btn { background: rgba(255,255,255,.08); }
.place-btn:active { transform: scale(0.94); }
.place-btn.here { background: var(--ink); color: var(--paper); }

/* 交互提示条 */
/* 交互条：走到人物/设施旁才浮现的动作按钮排（按钮由 JS 现造）；
   .accent 朱砂主按钮、.duel 红描边约战按钮。 */
#ctxbar {
  position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%);
  padding: 10px 14px; z-index: 25; border-radius: 16px;
  display: flex; gap: 8px; align-items: center; max-width: calc(100vw - 24px);
}
.ctx-name { font-family: var(--font-cl); font-weight: 800; font-size: 15px; margin-right: 2px; }
.ctx-sub { font-size: 12px; color: var(--ink-3); margin-right: 6px; }
.ctx-btn {
  appearance: none; cursor: pointer; border: 1px solid var(--glass-border);
  background: rgba(255,255,255,.65); border-radius: 999px; padding: 8px 16px;
  font-size: 13.5px; font-weight: 700; color: var(--ink);
  transition: transform 120ms ease-out;
}
body.theme-night .ctx-btn { background: rgba(255,255,255,.1); }
.ctx-btn:active { transform: scale(0.94); }
.ctx-btn.accent { background: linear-gradient(180deg,#c8523c,var(--cinnabar)); color: #fff8f2; border-color: transparent; }
.ctx-btn.duel { border-color: rgba(184,67,47,.5); color: var(--cinnabar); background: rgba(184,67,47,.08); }
.ctx-btn[disabled] { opacity: .4; pointer-events: none; }

/* ============ 面板 Sheet ============ */
/* 底部抽屉面板：index.html 里 #panel 那个全游戏共用的容器——
   宽最高 860px、只有顶部两个圆角，像一张从屏幕底边升起的纸。
   #scrim 是它身后的半透明黑遮罩（点遮罩即关闭）。 */
#scrim { position: fixed; inset: 0; background: rgba(20,18,12,.35); z-index: 40; }
#panel {
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
  width: min(860px, 100vw); height: min(82vh, 780px);
  background: var(--paper); border-radius: 26px 26px 0 0;
  box-shadow: var(--shadow-2); z-index: 50;
  display: flex; flex-direction: column; overflow: hidden;
  touch-action: none;
}
.sheet-grabber { width: 40px; height: 5px; border-radius: 3px; background: rgba(0,0,0,.16); margin: 10px auto 2px; }
body.theme-night .sheet-grabber { background: rgba(255,255,255,.22); }
.sheet-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 20px 10px; border-bottom: 1px solid rgba(0,0,0,.06);
}
body.theme-night .sheet-head { border-bottom-color: rgba(255,255,255,.08); }
.sheet-head h2 { font-family: var(--font-cl); font-size: 21px; font-weight: 800; letter-spacing: .12em; }
.sheet-body { flex: 1; overflow-y: auto; padding: 16px 20px 30px; -webkit-overflow-scrolling: touch; }

/* 面板内通用 */
/* 面板内部的通用积木：.tabs 标签页胶囊、.card 白卡片、.pill 彩色
   小徽章（jade/gold/gray 变体换色）、.seal-stamp 印章小方块。
   图鉴/成就/系统/史记各界面都用这套零件拼装。 */
.tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.tab {
  appearance: none; cursor: pointer; border: 1px solid transparent; border-radius: 999px;
  padding: 7px 15px; background: rgba(0,0,0,.05); font-size: 13.5px; font-weight: 700; color: var(--ink-2);
  transition: transform 120ms ease-out;
}
.tab:active { transform: scale(0.95); }
.tab.on { background: var(--ink); color: var(--paper); }
.card {
  background: #fffdf7; border: 1px solid rgba(0,0,0,.06); border-radius: 18px;
  padding: 14px 16px; box-shadow: 0 1px 2px rgba(30,26,16,.05);
}
body.theme-night .card { background: #2e2b23; border-color: rgba(255,255,255,.07); }
.card + .card { margin-top: 10px; }
.card h3 { font-size: 15.5px; font-weight: 800; margin-bottom: 4px; }
.card .meta { font-size: 12px; color: var(--ink-3); }
.muted { color: var(--ink-3); font-size: 12.5px; }
.pill {
  display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 11.5px; font-weight: 700;
  background: rgba(184,67,47,.1); color: var(--cinnabar); margin-right: 5px;
}
.pill.jade { background: rgba(62,122,94,.12); color: var(--jade); }
.pill.gold { background: rgba(168,132,44,.14); color: var(--gold); }
.pill.gray { background: rgba(0,0,0,.06); color: var(--ink-2); }
.seal-stamp {
  font-family: var(--font-cl); color: #fff6f0; display: inline-grid; place-items: center;
  background: linear-gradient(160deg,#c8523c,var(--cinnabar-deep)); border-radius: 8px;
}

/* 史记卷目 */
/* 接下来四段都是某个具体面板的内容样式：卷目（史记面板的目录行，
   .vol-grade 评等徽章按品级换色，progress-bar 进度条）、
   图鉴（人物卡网格）、成就（未达成半透明）、设置行（分段选择器
   与存档文本框）。 */
.vol-row {
  display: flex; align-items: center; gap: 14px; cursor: pointer;
  padding: 13px 16px; border-radius: 18px; background: #fffdf7;
  border: 1px solid rgba(0,0,0,.06); margin-bottom: 8px;
  transition: transform 120ms ease-out;
}
body.theme-night .vol-row { background: #2e2b23; border-color: rgba(255,255,255,.07); }
.vol-row:active { transform: scale(0.985); }
.vol-row.locked { opacity: .55; }
.vol-no { font-family: var(--font-cl); font-size: 13px; color: var(--ink-3); width: 44px; flex: none; }
.vol-name { font-family: var(--font-cl); font-size: 16.5px; font-weight: 800; flex: 1; min-width: 0; }
.vol-name small { display: block; font-family: var(--font-ui); font-size: 11.5px; font-weight: 600; color: var(--ink-3); margin-top: 2px; }
.vol-grade {
  font-family: var(--font-cl); font-size: 13px; font-weight: 800; color: #fff6f0; flex: none;
  border-radius: 8px; padding: 4px 10px; background: linear-gradient(160deg,#c8523c,var(--cinnabar-deep));
}
.vol-grade.g3 { background: linear-gradient(160deg,#b8912f,#8a6a1a); }
.vol-grade.g2 { background: #6b675c; }
.vol-grade.g1 { background: #a09a8c; }
.progress-bar { height: 6px; border-radius: 3px; background: rgba(0,0,0,.08); overflow: hidden; margin-top: 8px; }
.progress-bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--cinnabar), #d97a5a); transition: width .3s ease; }

/* 图鉴 */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.pcard { display: flex; gap: 12px; align-items: flex-start; }
.pcard canvas { border-radius: 14px; flex: none; }
.pcard .pname { font-family: var(--font-cl); font-weight: 800; font-size: 16px; }
.pcard .phao { color: var(--cinnabar); font-size: 12.5px; margin-left: 6px; }
.pcard .pbio { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; margin-top: 4px; }
.pcard .pquote { font-family: var(--font-cl); font-size: 12.5px; color: var(--ink-2); margin-top: 6px; padding-left: 10px; border-left: 2px solid rgba(184,67,47,.4); }

/* 成就 */
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.ach { opacity: .5; }
.ach.got { opacity: 1; }
.ach .aicon { font-size: 22px; margin-right: 8px; float: left; }
.ach h3 { display: inline; }
.ach.got h3 { color: var(--cinnabar); }

/* 设置行 */
.setrow { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px; border-bottom: 1px solid rgba(0,0,0,.05); }
body.theme-night .setrow { border-bottom-color: rgba(255,255,255,.06); }
.setrow .segs { display: flex; gap: 6px; }
.seg {
  appearance: none; cursor: pointer; border-radius: 999px; padding: 6px 13px;
  font-size: 13px; font-weight: 700; border: 1px solid var(--glass-border); background: rgba(255,255,255,.5); color: var(--ink-2);
  transition: transform 120ms ease-out;
}
.seg:active { transform: scale(0.94); }
.seg.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
textarea.savebox {
  width: 100%; height: 84px; border-radius: 12px; border: 1px solid rgba(0,0,0,.12);
  padding: 10px; font-size: 11px; font-family: var(--font-ui); resize: none; color: var(--ink);
  background: rgba(255,255,255,.6); user-select: text; -webkit-user-select: text;
}

/* ============ 对话 ============ */
/* 对话层：#dialog 铺满全屏但内容沉在底部；#dialog-cast 是舞台，
   立绘由 JS 摆放，.dim 压暗不说话的角色；对话框用深色玻璃
   （--glass-dark）；#dialog-text 打字中带 .typing 类，::after 在
   句尾画一个闪烁光标；.choice-btn 是分支选项按钮。 */
#dialog { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
#dialog-cast {
  position: absolute; left: 0; right: 0; top: 8vh; height: 46vh;
  display: flex; justify-content: center; align-items: flex-end; gap: 4vw; pointer-events: none;
}
.cast-fig { display: flex; flex-direction: column; align-items: center; gap: 10px; transition: opacity .3s, transform .4s cubic-bezier(.2,.8,.2,1); }
.cast-fig.dim { opacity: .35; transform: scale(.92) translateY(8px); }
.cast-fig canvas { filter: drop-shadow(0 18px 24px rgba(30,26,16,.25)); }
.cast-label { font-family: var(--font-cl); font-weight: 800; font-size: 15px; background: var(--glass); border: 1px solid var(--glass-border); padding: 4px 14px; border-radius: 999px; backdrop-filter: var(--blur); }
#dialog-box {
  position: relative; width: min(760px, calc(100vw - 24px)); margin-bottom: 4vh;
  background: var(--glass-dark); color: #f3efe4; border: 1px solid rgba(255,255,255,.14);
  border-radius: 24px; padding: 20px 24px 18px; min-height: 132px;
  box-shadow: var(--shadow-2);
}
#dialog-name { font-family: var(--font-cl); font-size: 15px; font-weight: 800; color: #e8b7a4; letter-spacing: .18em; margin-bottom: 6px; }
#dialog-text { font-family: var(--font-cl); font-size: 17.5px; line-height: 1.85; letter-spacing: .02em; min-height: 62px; }
#dialog-text.typing::after { content: "▍"; opacity: .6; animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
#dialog-choices { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.choice-btn {
  appearance: none; cursor: pointer; text-align: left; font-family: var(--font-cl); font-size: 15.5px;
  background: rgba(255,255,255,.08); color: #f3efe4; border: 1px solid rgba(255,255,255,.16);
  border-radius: 14px; padding: 11px 16px; transition: transform 120ms ease-out, background 150ms;
}
.choice-btn:hover { background: rgba(255,255,255,.14); }
.choice-btn:active { transform: scale(0.97); }
.choice-btn .fx { color: #9fd6b8; font-size: 12px; margin-left: 8px; font-family: var(--font-ui); }
.choice-btn .fx.bad { color: #e8a08d; }
#dialog-next {
  position: absolute; right: 14px; bottom: 10px; appearance: none; border: none; cursor: pointer;
  background: rgba(255,255,255,.14); color: #f3efe4; width: 34px; height: 34px; border-radius: 50%;
  font-size: 15px; transition: transform 120ms ease-out;
}
#dialog-next:active { transform: scale(0.88); }

/* ============ 章节转场 ============ */
/* 章节过场卡：黑底全屏，cc-title 竖排大字；@keyframes 定义动画
   轨迹（ccIn 入场上浮、breathe 呼吸闪烁），由 animation 属性引用。 */
#chapter-card {
  position: fixed; inset: 0; z-index: 80; display: grid; place-items: center;
  background: linear-gradient(180deg, #17150f, #241f14);
}
.cc-inner { text-align: center; animation: ccIn 1s cubic-bezier(.2,.8,.2,1); }
@keyframes ccIn { from { opacity: 0; transform: translateY(24px); } }
.cc-date { color: #9c917a; font-size: 14px; letter-spacing: .5em; margin-bottom: 18px; }
.cc-title {
  writing-mode: vertical-rl; margin: 0 auto; font-family: var(--font-cl);
  color: #f0e9d6; font-size: clamp(30px, 6.4vh, 54px); font-weight: 900; letter-spacing: .3em;
  border-left: 1px solid rgba(240,233,214,.25); border-right: 1px solid rgba(240,233,214,.25);
  padding: .2em .35em;
}
.cc-sub { color: #b8ac8e; font-family: var(--font-cl); font-size: 15px; margin-top: 22px; letter-spacing: .2em; }
.cc-hint { color: #6e6753; font-size: 12px; margin-top: 34px; letter-spacing: .3em; animation: breathe 2.4s ease infinite; }
@keyframes breathe { 50% { opacity: .35; } }

/* ============ Toast ============ */
/* Toast 通知：从顶部飘下的小气泡（toastIn 落下入场），消失前 JS
   加 .out 类淡出。容器 pointer-events:none，不挡下方点击。 */
#toasts { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  background: var(--glass-dark); color: #f3efe4; border: 1px solid rgba(255,255,255,.14);
  border-radius: 999px; padding: 9px 20px; font-size: 13.5px; font-weight: 600;
  box-shadow: var(--shadow-2); display: flex; gap: 8px; align-items: center;
  animation: toastIn .45s cubic-bezier(.2,.9,.25,1.2);
}
.toast .seal-stamp { width: 20px; height: 20px; font-size: 12px; border-radius: 6px; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-14px) scale(.9); } }
.toast.out { opacity: 0; transform: translateY(-10px); transition: all .3s ease; }

/* 撰史界面 */
/* 撰史面板的内容：左栏 .slot-row 四条虚线"槽位"（把右侧碎片仓库
   .shard-pool 里的 .shard-card 填进去；.hot 表示当前选中槽），
   .writ-verdict 是成稿后的评等大字。 */
.writ-grid { display: grid; grid-template-columns: 1fr 300px; gap: 16px; }
@media (max-width: 760px) { .writ-grid { grid-template-columns: 1fr; } }
.slot-row { display: flex; flex-direction: column; gap: 8px; }
.slot {
  border: 1.5px dashed rgba(0,0,0,.18); border-radius: 14px; padding: 10px 12px; min-height: 58px;
  background: rgba(255,255,255,.4); cursor: pointer; transition: transform 120ms ease-out, border-color 150ms;
  position: relative;
}
body.theme-night .slot { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.2); }
.slot:active { transform: scale(0.985); }
.slot.hot { border-color: var(--cinnabar); border-style: solid; }
.slot .slot-tag {
  position: absolute; top: -9px; left: 10px; font-size: 11px; font-weight: 800; letter-spacing: .2em;
  background: var(--ink); color: var(--paper); border-radius: 999px; padding: 1px 10px;
}
.slot .s-name { font-family: var(--font-cl); font-weight: 800; font-size: 14.5px; }
.slot .s-text { font-size: 12px; color: var(--ink-2); margin-top: 2px; line-height: 1.5; }
.slot.empty .s-name { color: var(--ink-3); font-weight: 600; }
.shard-pool { display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
.shard-card {
  width: calc(50% - 4px); border-radius: 14px; padding: 9px 11px; cursor: pointer;
  background: #fffdf7; border: 1px solid rgba(0,0,0,.08); box-shadow: 0 1px 2px rgba(30,26,16,.05);
  transition: transform 120ms ease-out;
}
body.theme-night .shard-card { background: #2e2b23; border-color: rgba(255,255,255,.08); }
.shard-card:active { transform: scale(0.96); }
.shard-card.used { opacity: .35; pointer-events: none; }
.shard-card .sc-tags { font-size: 10.5px; color: var(--gold); font-weight: 800; letter-spacing: .1em; }
.shard-card .sc-name { font-family: var(--font-cl); font-weight: 800; font-size: 13.5px; margin-top: 1px; }
.shard-card .sc-text { font-size: 11px; color: var(--ink-3); margin-top: 2px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.writ-verdict { text-align: center; padding: 22px 10px 6px; }
.writ-verdict .grade {
  font-family: var(--font-cl); font-size: 54px; font-weight: 900; letter-spacing: .1em;
  color: var(--cinnabar); animation: gradeIn .6s cubic-bezier(.2,.9,.3,1.3);
}
@keyframes gradeIn { from { opacity: 0; transform: scale(1.8) rotate(-6deg); } }

/* 小游戏覆盖层 */
/* 小游戏层：暗幕中央一块独立画布，#mg-hud 分数条悬浮在画布上方。 */
#minigame { position: fixed; inset: 0; z-index: 70; background: rgba(20,18,12,.72); display: grid; place-items: center; }
#mg-canvas { border-radius: 22px; box-shadow: var(--shadow-2); max-width: 100vw; max-height: 100vh; }
#mg-hud { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); padding: 8px 18px; z-index: 72; font-size: 14px; font-weight: 700; }

/* 任务指引卡 */
/* 右上角任务卡：qc-tag 主线徽章、qc-sides 支线区，内容全由
   js/quests.js 动态生成，这里只管长相。 */
#questcard {
  position: absolute; top: 206px; right: 12px; width: 252px;
  max-height: 46vh; overflow-y: auto; padding: 11px 13px; z-index: 15; border-radius: 16px;
}
#questcard .qc-tag {
  display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .18em;
  background: linear-gradient(180deg,#c8523c,var(--cinnabar)); color: #fff8f2;
  border-radius: 999px; padding: 1px 9px; margin-bottom: 5px;
}
#questcard .qc-tag.done { background: var(--jade); }
#questcard .qc-name { font-family: var(--font-cl); font-size: 15.5px; font-weight: 800; }
#questcard .qc-goal { font-size: 12.5px; color: var(--ink); line-height: 1.45; margin-top: 3px; }
#questcard .qc-hint { font-size: 11.5px; color: var(--ink-3); line-height: 1.45; margin-top: 3px; }
#questcard .qc-btn { margin-top: 8px; font-size: 12px; padding: 6px 12px; }
#questcard .qc-sides { margin-top: 10px; border-top: 1px dashed rgba(150,130,90,.35); padding-top: 8px; }
#questcard .qc-sides-title { font-size: 11px; font-weight: 800; letter-spacing: .16em; color: var(--gold); margin-bottom: 5px; }
#questcard .qc-side { font-size: 11.5px; color: var(--ink-2); line-height: 1.5; margin-bottom: 5px; }
#questcard .qc-side b { color: var(--ink); }
#questcard .qc-side .qc-btn { margin-top: 2px; font-size: 11px; padding: 3px 9px; }

/* 减少动效 */
/* 无障碍与小屏适配：系统开了"减少动态效果"就把所有动画压到近零；
   窄屏（640px 以下）藏起见闻栏、收紧 HUD 字号与间距。 */
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01s !important; transition-duration: .01s !important; }
}
@media (max-width: 640px) {
  #hearsay { display: none; }
  .hud-chip.stat { padding: 6px 9px; }
  #hud-date-main { font-size: 11.5px; }
  .title-vert { gap: 6vw; }
}

/* ============================================================
   马刀战场覆盖层（战棋）
   ============================================================ */
/* 战场整体：开战时全屏盖住世界的"棋盘房间"，纸纹底与标题页同款。
   #battle-stage 居中限宽；.btl-top 顶栏（标题/回合数/工具按钮）；
   #battle-wrap 分左右两栏（棋盘+操作 / 敌军+战报），窄屏时叠为
   上下两栏（见文件末尾的媒体查询）。 */
#battle {
  position: fixed; inset: 0; z-index: 65;
  background:
    radial-gradient(1100px 560px at 78% -12%, rgba(184,67,47,.14), transparent 60%),
    radial-gradient(880px 500px at 8% 112%, rgba(168,132,44,.10), transparent 60%),
    repeating-linear-gradient(0deg, transparent 0 34px, rgba(38,36,31,.03) 34px 35px),
    #efe8d6;
  display: flex; flex-direction: column;
  overflow: auto;
}
body.theme-night #battle { background: radial-gradient(1100px 560px at 78% -12%, rgba(184,67,47,.10), transparent 60%), #26231d; }
#battle-stage {
  flex: 1; display: flex; flex-direction: column;
  width: min(1240px, 100vw); margin: 0 auto; padding: 12px 16px 18px; gap: 10px;
}
.btl-top { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.btl-top h2 { font-family: var(--font-cl); font-size: 24px; font-weight: 900; letter-spacing: .22em; }
.btl-top .crumb { font-family: var(--font-cl); color: var(--cinnabar); font-size: 14.5px; font-weight: 700; letter-spacing: .1em; }
.btl-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btl-tools .btn { padding: 6px 14px; font-size: 13px; border-radius: 999px; }
.btl-tools .stat-inline { font-size: 12.5px; color: var(--ink-2); font-weight: 700; }

#battle-wrap { display: flex; gap: 14px; align-items: flex-start; flex: 1; min-height: 0; flex-wrap: wrap; }
#battle-left { flex: 1 1 600px; min-width: 300px; display: flex; flex-direction: column; gap: 10px; }
#battle-right { flex: 1 1 280px; min-width: 250px; display: flex; flex-direction: column; gap: 10px; max-height: 100%; }
/* 左栏细部：#battle-canvas 棋盘画布（JS 每帧手绘格子与棋子）；
   .phase-banner "我方/敌方回合"横幅浮在画布中央，.on 类控制显隐；
   .tokenface 圆形棋子头像；#player-card 玩家状态卡（.critical 时
   criticalPulse 红光脉冲告警；血条三层：hpbar-ghost 白色残影慢半拍
   追赶、hpbar-in 绿色真实血量、hpbar-tx 数字，低于三成变 .low 红）；
   .ap-pips 行动点小圆点（.on 点亮）；.actbar 行动按钮排，
   .armed 描红边表示"已选中该指令"。 */
#canvas-outer { position: relative; }
#battle-canvas {
  width: 100%; max-width: 672px; height: auto; display: block;
  border-radius: 16px; border: 1px solid rgba(120,100,60,.35);
  box-shadow: var(--shadow-2); cursor: pointer; background: #efe4c8;
}
.phase-banner {
  position: absolute; top: 42%; left: 50%; transform: translate(-50%,-50%);
  font-family: var(--font-cl); font-size: 32px; letter-spacing: 10px; color: #f7ecd7; padding: 10px 34px;
  background: rgba(43,38,34,.8); border-radius: 12px; pointer-events: none;
  opacity: 0; transition: opacity .25s; z-index: 5; white-space: nowrap;
}
.phase-banner.on { opacity: 1; }

.tokenface {
  width: 44px; height: 44px; border-radius: 50%; flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff; font-family: var(--font-cl); font-size: 22px; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,.45);
  border: 2px solid rgba(0,0,0,.25); box-shadow: inset -3px -4px 8px rgba(0,0,0,.22), inset 3px 3px 6px rgba(255,255,255,.25);
}

#player-card {
  display: flex; gap: 12px; align-items: center;
  background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border); border-radius: 16px; padding: 10px 14px; box-shadow: var(--shadow-1);
}
#player-card.critical { animation: criticalPulse 1.1s ease-in-out infinite; }
@keyframes criticalPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(184,67,47,0); }
  50% { box-shadow: 0 0 0 6px rgba(184,67,47,.28); }
}
#pc-name { font-family: var(--font-cl); font-size: 16px; font-weight: 800; }
.hpbar-outer { flex: 1; height: 15px; background: rgba(0,0,0,.12); border-radius: 8px; overflow: hidden; position: relative; margin-top: 4px; }
.hpbar-ghost, .hpbar-inner { position: absolute; left: 0; top: 0; bottom: 0; }
.hpbar-ghost { background: rgba(255,255,255,.5); transition: width .8s ease .35s; }
.hpbar-inner { width: 100%; background: linear-gradient(180deg, #7fbe6a, #55954a); transition: width .25s; }
.hpbar-inner.low { background: linear-gradient(180deg, #e0765a, #b8483a); }
.hpbar-text { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 15px; font-weight: 700; color: #26241f; text-shadow: 0 0 3px rgba(255,255,255,.7); }
.ap-pips { display: flex; gap: 5px; margin-top: 6px; min-height: 15px; }
.ap-pip { width: 14px; height: 14px; border-radius: 50%; background: rgba(0,0,0,.12); }
.ap-pip.on { background: radial-gradient(circle at 35% 30%, #ffd98a, #d8912b); box-shadow: 0 0 4px rgba(216,145,43,.6); }
.st-chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; min-height: 20px; }
.st-chip { font-size: 11.5px; padding: 1px 9px; border-radius: 999px; color: #fff; font-weight: 700; }

.actbar { display: flex; flex-wrap: wrap; gap: 8px; }
.actbar .btn { font-size: 14px; padding: 9px 15px; border-radius: 12px; }
#battle .btn.armed, .actbar .btn.armed { outline: 3px solid var(--cinnabar); outline-offset: -1px; background: #ffe9c9; }

#rare-chips { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#rare-chips .rare-chips-label { font-size: 11px; font-weight: 800; letter-spacing: .18em; color: var(--gold); }
#rare-chips .rare-chip {
  appearance: none; cursor: pointer; border-radius: 999px; padding: 4px 11px;
  font-size: 12px; font-weight: 700; border: 1px solid rgba(168,132,44,.5);
  background: rgba(168,132,44,.08); color: var(--ink-2); transition: transform 120ms ease-out;
}
#rare-chips .rare-chip:active { transform: scale(0.94); }
#rare-chips .rare-chip.on { background: linear-gradient(180deg,#b8912f,#8a6a1a); color: #fff8f2; border-color: transparent; }

/* 右栏：#rare-chips 稀有刀卡切换胶囊（.on 金底表示已选中）；
   #enemy-panel 敌军一览（.enemy-row 一人一行，.dead 半透明划线）；
   #battle-log 滚动战报（.em 朱砂强调、.sys 金色系统行）。 */
#enemy-panel, #log-panel {
  background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border); border-radius: 16px; padding: 10px 12px; box-shadow: var(--shadow-1);
  font-size: 13px;
}
#enemy-panel > b, #log-panel > b { font-family: var(--font-cl); font-size: 13.5px; letter-spacing: .2em; color: var(--ink-2); }
#enemy-list { margin-top: 6px; max-height: 26vh; overflow-y: auto; }
.enemy-row { display: flex; align-items: center; gap: 8px; padding: 4px 2px; border-bottom: 1px dashed rgba(150,130,90,.25); }
.enemy-row .tokenface { width: 28px; height: 28px; font-size: 14px; }
.enemy-row .ehp { flex: 1; height: 7px; background: rgba(0,0,0,.12); border-radius: 4px; overflow: hidden; }
.enemy-row .ehp i { display: block; height: 100%; background: #b8483a; transition: width .35s; }
.ap-mini { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 3px; background: radial-gradient(circle at 35% 30%, #ffd98a, #d8912b); }
.enemy-row.dead { opacity: .35; text-decoration: line-through; }
#battle-log { height: 300px; overflow-y: auto; font-size: 12.5px; line-height: 1.7; margin-top: 6px; }
#battle-log div { border-bottom: 1px dashed rgba(150,130,90,.18); padding: 1px 0; }
#battle-log .em { color: var(--cinnabar); }
#battle-log .sys { color: var(--gold); }

/* 结算 */
/* 结算页：.result-seal 大印章旋转盖下（stamp 动画，胜朱红、
   .lose 灰），正文与按钮全由 JS 塞进 #result-body。 */
#battle-result { flex: 1; display: grid; place-items: center; padding: 20px; overflow-y: auto; }
.result-seal {
  width: 128px; height: 128px; font-family: var(--font-cl); font-size: 76px; font-weight: 900;
  display: grid; place-items: center; margin: 0 auto 12px; color: #fff6f0; border-radius: 22px;
  background: linear-gradient(160deg, #c8523c, var(--cinnabar-deep));
  transform: rotate(-7deg); animation: stamp .45s cubic-bezier(.2,1.6,.4,1);
  box-shadow: var(--shadow-2), inset 0 1px 0 rgba(255,255,255,.3);
}
@keyframes stamp { 0% { transform: rotate(-7deg) scale(2.4); opacity: 0; } 60% { opacity: 1; } 100% { transform: rotate(-7deg) scale(1); } }
.result-seal.lose { background: linear-gradient(160deg, #6b675c, #4a463e); }
.result-title { font-family: var(--font-cl); font-size: 30px; font-weight: 900; letter-spacing: .3em; text-align: center; }
.result-stats { margin: 14px auto; text-align: center; color: var(--ink-2); font-size: 14px; }
.result-extra { max-width: 560px; margin: 6px auto; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 16px; padding: 12px 18px; font-size: 13.5px; line-height: 1.9; }
.result-extra .yueks { color: var(--cinnabar); font-family: var(--font-cl); }
#result-body .btnrow { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }

/* 战斗弹层（猜拳/对话/增益） */
/* 战斗中的临时弹窗：#modal-mask 暗幕（.on 才显示）、#modal-box
   白卡居中；rps-* 是战前猜拳按钮组、boon-btns 是波次间增益
   三选一、dlg-* 是战斗内人物插话。 */
#modal-mask {
  position: fixed; inset: 0; background: rgba(28,26,22,.55); z-index: 75;
  display: none; align-items: center; justify-content: center; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
#modal-mask.on { display: flex; }
#modal-box {
  background: var(--paper); border-radius: 24px; max-width: 620px; width: 92%;
  max-height: 86vh; overflow-y: auto; padding: 24px 28px;
  box-shadow: var(--shadow-2); animation: popIn .22s ease; position: relative;
}
@keyframes popIn { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
#modal-box h3 { font-family: var(--font-cl); font-size: 22px; font-weight: 900; letter-spacing: .1em; margin-bottom: 4px; }
#modal-box .sub { color: var(--cinnabar); font-size: 13.5px; margin-bottom: 10px; font-weight: 700; letter-spacing: .08em; }
#modal-box p { line-height: 1.8; font-size: 14.5px; margin: 8px 0; }
#modal-box .btnrow { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; flex-wrap: wrap; }
#modal-box .btn.small, #modal-box .btn.btn-small { padding: 6px 14px; font-size: 13px; }

.rps-title { font-family: var(--font-cl); font-size: 26px; font-weight: 900; letter-spacing: 8px; margin-bottom: 6px; text-align: center; }
.rps-sub { color: var(--ink-2); font-size: 13.5px; margin-bottom: 18px; text-align: center; }
.rps-btns { display: flex; gap: 14px; justify-content: center; }
.rps-btn {
  font-family: inherit; width: 120px; padding: 14px 0 11px; font-size: 16px; letter-spacing: 3px; cursor: pointer;
  background: rgba(255,255,255,.65); border: 1px solid rgba(0,0,0,.1); border-radius: 16px; transition: transform 120ms;
}
.rps-btn:active { transform: scale(0.95); }
.rps-btn .g { font-size: 40px; display: block; }
.rps-result { font-family: var(--font-cl); font-size: 26px; font-weight: 900; letter-spacing: 4px; margin: 14px 0 4px; min-height: 40px; text-align: center; }
.rps-vs { font-size: 42px; letter-spacing: 8px; margin-top: 6px; min-height: 56px; text-align: center; }

.boon-btns { display: flex; flex-direction: column; gap: 10px; }
.boon-btns .btn { text-align: left; letter-spacing: 0; }
.boon-btns .bn { font-family: var(--font-cl); font-size: 16px; color: var(--cinnabar); font-weight: 800; }
.boon-btns .bd { display: block; font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }

/* 战斗内对话 */
.dlg { position: relative; }
.dlg-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.dlg-head .tokenface { width: 52px; height: 52px; font-size: 26px; animation: dlgFace .28s cubic-bezier(.2,1.4,.4,1); }
@keyframes dlgFace { from { transform: scale(1.5) rotate(-6deg); } to { transform: none; } }
.dlg-name { font-family: var(--font-cl); font-size: 21px; font-weight: 900; letter-spacing: .1em; }
.dlg-role { font-size: 12.5px; color: var(--ink-3); letter-spacing: .08em; }
.dlg-text {
  min-height: 88px; font-family: var(--font-cl); font-size: 16.5px; line-height: 1.95; letter-spacing: .02em;
  padding: 12px 14px; background: rgba(255,253,247,.9);
  border: 1px solid rgba(0,0,0,.07); border-left: 4px solid var(--gold); border-radius: 12px;
  user-select: text; -webkit-user-select: text;
}
.dlg-next { text-align: right; color: var(--cinnabar); font-size: 14px; animation: bob 1s infinite; margin-top: 4px; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
.dlg #dlg-skip { position: absolute; top: 0; right: 0; }

/* 悬停小提示框：战场上悬停格子/按钮时，JS 把说明写进来并挪到
   指针旁，平时 display:none。 */
#tooltip {
  position: fixed; z-index: 98; pointer-events: none; display: none;
  background: rgba(28,26,22,.94); color: #f3ead6; padding: 9px 13px; border-radius: 12px;
  font-size: 13px; line-height: 1.65; max-width: 300px; box-shadow: var(--shadow-2);
}
#tooltip .tt-n { color: #ffd98a; font-size: 14.5px; font-weight: 700; }

/* 窄屏适配（860px 以下）：战场左右栏改上下叠放，战报压矮、
   标题与按钮收紧。 */
@media (max-width: 860px) {
  #battle-wrap { flex-direction: column; }
  #battle-log { height: 170px; }
  .btl-top h2 { font-size: 19px; }
  #modal-box { padding: 18px; }
  .rps-btn { width: 96px; }
}

</style>
</head>
<body class="theme-morning">

<!-- 标题页 -->
<!--
  游戏的第一块"屏幕"：class="screen" 让它铺满整个窗口（position:fixed），
  是唯一初始就可见的屏幕，其余屏幕都带着 hidden 藏着。
  三个按钮的 id（btn-new 开新档 / btn-continue 继续存档 /
  btn-import-title 导入存档）是 main.js 绑定点击事件的抓手。
  aria-hidden="true" 是给读屏器（无障碍工具）的提示：
  背景纹理和印章这两个纯装饰元素不用念出来。
-->
<div id="screen-title" class="screen">
  <div class="title-bg" aria-hidden="true"></div>
  <div class="title-seal" aria-hidden="true">刀</div>
  <div class="title-main">
    <div class="title-vert">
      <h1 class="title-book">实验史记</h1>
      <div class="title-sub">马刀行</div>
    </div>
    <p class="title-tagline">开放校园，四处游历；来呀来呀，以刀会友。</p>
    <div class="title-menu">
      <button class="btn btn-primary" id="btn-new">开卷 · 新的史官</button>
      <button class="btn" id="btn-continue">继续上局</button>
      <button class="btn btn-ghost" id="btn-import-title">导入存档</button>
    </div>
    <div class="title-foot">据 音克思《实验史记》改编 · 卷里卷外，皆是少年</div>
  </div>
</div>

<!-- 游戏主界面 -->
<!--
  真正玩游戏的"屏幕"，初始带 hidden，点了「开卷」才由 JS 显示。
  里面叠了好几层，从底到顶依次是：
    · canvas#world  世界画布：校园地图、可走的人物、任务标记全由
      JS 每一帧重画在这块"白布"上（canvas 是可用代码作画的元素）；
    · #hud          顶部玻璃状态条（见下方注释）；
    · #hearsay      右上角"校园见闻"播报栏；
    · #questcard    右侧任务指引卡（主线进度 + 可接支线）；
    · #placelist    底部地点导航条（点地名瞬移，末尾还有「歇一日」）；
    · #ctxbar       交互提示条（走近人物/地点才弹出按钮）。
  后五者都挂了 class="glass"（毛玻璃卡），悬浮在画布之上。
-->
<div id="screen-game" class="screen hidden">
  <!--
    世界画布：整个校园的"舞台"。JS（js/world.js）不停地在上面
    画地图、人物小人、任务标记并响应点击；它没有内容标签，
    宽高由 CSS 拉满整个窗口。
  -->
  <canvas id="world"></canvas>

  <!-- 顶部玻璃 HUD -->
  <!--
    HUD = Heads-Up Display（抬头显示），借自飞行仪表盘的词，
    指一直悬在画面上方、不遮挡主视野的状态栏。
    左半边：史记/刀谱两个入口按钮（btn-hud-book / btn-hud-blade，
    点开对应抽屉面板）+ 日期牌（hud-date 两行：周次 + 时段）。
    右半边：四个数值牌（hud-ap 主线进度"令"、hud-wen 文笔、
    hud-rep 声望、hud-money 零花钱，数字都在各自带 -v 后缀的
    <b> 里，JS 只改那几个字）+ 行囊和系统两个按钮。
    数值变化时 JS 会给牌子加 bump class 触发一个放大动画。
  -->
  <header id="hud" class="glass">
    <div class="hud-left">
      <button class="hud-chip hud-title" id="btn-hud-book" title="翻开史记">
        <span class="seal-mini">史</span>
        <span class="hud-bookname">史记</span>
      </button>
      <button class="hud-chip hud-title" id="btn-hud-blade" title="刀谱">
        <span class="seal-mini" style="background:linear-gradient(160deg,#a8842c,#7a5c14)">刀</span>
        <span class="hud-bookname" id="hud-blade-name">未入册</span>
      </button>
      <div class="hud-chip" id="hud-date">
        <span id="hud-date-main">高二上 · 第一周</span>
        <span id="hud-period">早读</span>
      </div>
    </div>
    <div class="hud-right">
      <div class="hud-chip stat" id="hud-ap" title="主线进度">令<b id="hud-ap-v">0/9</b></div>
      <div class="hud-chip stat" id="hud-wen" title="文笔：约战前可骂阵/檄文，立传之本">✒<b id="hud-wen-v">5</b></div>
      <div class="hud-chip stat" id="hud-rep" title="声望：小卖部折扣、支线门槛">☘<b id="hud-rep-v">50</b></div>
      <div class="hud-chip stat" id="hud-money" title="零花钱">◉<b id="hud-money-v">10</b></div>
      <button class="hud-chip icon" id="btn-bag" title="行囊">囊</button>
      <button class="hud-chip icon" id="btn-menu" title="系统">☰</button>
    </div>
  </header>

  <!-- 校园见闻（本章可亲历之事） -->
  <!--
    右上角的"新闻栏"：js/ui.js 把当前章节可触发的事件一条条填进
    #hearsay-list（初始是空的，内容由 JS 动态生成）；做过的事件
    会打上 .done 标记变绿。纯展示，不可点击。
  -->
  <div id="hearsay" class="glass">
    <div class="hearsay-title">校园见闻</div>
    <div id="hearsay-list"></div>
  </div>

  <!-- 任务指引卡（主线 + 可接支线） -->
  <!--
    右侧的任务卡：JS（js/quests.js）往这个空盒子里塞当前主线的
    名称/目标/提示，以及下方一排"支线可接"列表。它是纯容器，
    里里外外全靠 JS 生成，所以源码里只有一个开合标签。
  -->
  <div id="questcard" class="glass hidden"></div>

  <!-- 底部地点导航条 -->
  <!--
    底部一排"地点按钮"：JS 按当前章节把可去的地点渲染成
    .place-btn 圆角胶囊，点一下就瞬移；所在地点高亮（.here）。
    队伍末尾还常驻一个「歇一日」按钮（过日子的入口）。
  -->
  <nav id="placelist" class="glass"></nav>

  <!-- 交互提示条 -->
  <!--
    走到人物或设施旁边时才弹出的一行按钮（交谈/赠礼/约战……），
    由 js/main.js 按脚下坐标生成；平时带着 hidden 藏起来。
  -->
  <div id="ctxbar" class="glass hidden"></div>
</div>

<!-- 通用面板（图鉴/成就/系统/史记/行囊） -->
<!--
  一个从屏幕底部滑上来的"抽屉"（class="sheet"）。全游戏所有列表
  界面共用这一个容器：JS 往 #panel-title 写标题、往 #panel-body
  塞具体内容，用完清空，省得每个界面写一套 HTML。动画由
  js/config.js 的 SheetFX 弹簧驱动。下一行 #scrim 是抽屉身后的
  半透明遮罩，点它等于点关闭。
-->
<div id="panel" class="sheet hidden">
  <div class="sheet-grabber"></div>
  <div class="sheet-head">
    <h2 id="panel-title">面板</h2>
    <button class="btn-icon" id="panel-close">✕</button>
  </div>
  <div class="sheet-body" id="panel-body"></div>
</div>
<div id="scrim" class="hidden"></div>

<!-- 对话层 -->
<!--
  全屏对话层，由 js/dialog.js 驱动，盖在世界（或任何界面）之上：
    · #dialog-cast  舞台区：JS 往里摆说话角色的立绘 canvas，
      轮到谁说话谁高亮，其余变暗（.dim）；
    · #dialog-box   底部对话框：名字 #dialog-name、正文 #dialog-text
      （打字机逐字效果，打字中带 .typing 类）、选项容器
      #dialog-choices（有分支时 JS 在这里生成按钮）、右下角的
      "下一句"圆钮 #dialog-next。点击对话框本体=翻页。
-->
<div id="dialog" class="hidden">
  <div id="dialog-cast"></div>
  <div id="dialog-box" class="glass-dark">
    <div id="dialog-name"></div>
    <div id="dialog-text"></div>
    <div id="dialog-choices"></div>
    <button id="dialog-next">▸</button>
  </div>
</div>

<!-- 小游戏层 -->
<!--
  小游戏（月考迟到/陀螺/食堂冲刺/乒乓球）专用的全屏覆盖层：
  又一块独立画布 #mg-canvas，开局时 JS 换上对应游戏循环来画；
  #mg-hud 显示该局自己的分数与提示。逻辑在 js/minigames.js。
-->
<div id="minigame" class="hidden">
  <canvas id="mg-canvas"></canvas>
  <div id="mg-hud" class="glass"></div>
</div>

<!-- 章节转场 -->
<!--
  "第 X 章"的全屏过场卡：深色底 + 竖排大字（日期 cc-date、
  标题 cc-title、副题 cc-sub 由 JS 填），点任意处继续。
  主线每推进一节，回到世界前 main.js 会先掀开它。
-->
<div id="chapter-card" class="hidden">
  <div class="cc-inner">
    <div class="cc-date" id="cc-date"></div>
    <h1 class="cc-title" id="cc-title"></h1>
    <div class="cc-sub" id="cc-sub"></div>
  </div>
</div>

<!-- 马刀战场覆盖层 -->
<!--
  战棋对战的整块"战场屏幕"：开战时盖住世界，胜/负结算完再由
  JS 关掉。里面两大块：
    · #battle-stage   战场本体（下面逐段注释）；
    · #battle-result  结算页（战斗中一直 hidden，打完才显示）。
-->
<div id="battle" class="hidden">
  <!-- 战场 -->
  <!--
    战场本体，从上到下：
    .btl-top 顶栏（标题/回合数/稀有刀卡切换/调速静音认输离场）；
    #battle-wrap 主区，左右两栏（#battle-left 棋盘+操作，
    #battle-right 敌军单+战报）。
  -->
  <div id="battle-stage">
    <div class="btl-top">
      <h2 id="battle-title">马刀场</h2>
      <div class="crumb" id="round-no">第 1 回合</div>
      <span id="rare-chips" title="稀有刀卡：每场只能携带一张，点选切换"></span>
      <div class="btl-tools">
        <span class="stat-inline" id="ai-label"></span>
        <button class="btn btn-small" id="b-speed">速×1</button>
        <button class="btn btn-small" id="b-mute">音</button>
        <button class="btn btn-small" id="b-surrender">认输</button>
        <button class="btn btn-small" id="b-exit">离场</button>
      </div>
    </div>
    <!--
      主区左右两栏。左栏 #battle-left：战场棋盘 canvas#battle-canvas
      （也是 JS 每帧手绘，点击格子移动/攻击）、其上悬浮的"阶段横幅"
      #phase-banner（我方/敌方回合提示，靠 .on 类显隐）、下方
      #player-card 玩家状态条（头像/血条三件套：hpbar-ghost 白色
      残影缓慢追赶、hpbar-in 绿色真实血量、hpbar-tx 文字；行动点
      #ap-pips 一排小圆点；状态标签 #pc-st）、再下 .actbar 一排
      行动按钮（购刀/购马/刀击/马踢/驱赶/技能/撤销/血祭/待机）。
      右栏 #battle-right：#enemy-panel 敌军一览、#log-panel 滚动战报。
    -->
    <div id="battle-wrap">
      <div id="battle-left">
        <div id="canvas-outer">
          <canvas id="battle-canvas"></canvas>
          <div class="phase-banner" id="phase-banner"></div>
        </div>
        <div id="player-card">
          <span class="tokenface" id="pc-face">·</span>
          <div style="flex:1;min-width:0">
            <div id="pc-name"></div>
            <div class="hpbar-outer"><div class="hpbar-ghost" id="pc-hp-ghost"></div><div class="hpbar-inner" id="pc-hp-in"></div><div class="hpbar-text" id="pc-hp-tx"></div></div>
            <div class="ap-pips" id="ap-pips" title="行动点"></div>
            <div class="st-chips" id="pc-st"></div>
          </div>
        </div>
        <div class="actbar">
          <button class="btn" id="b-knife">购刀·1动</button>
          <button class="btn" id="b-horse">购马·1动</button>
          <button class="btn" id="b-attack">刀击·1动</button>
          <button class="btn" id="b-horseatk">马踢·1动</button>
          <button class="btn" id="b-drive">驱赶·1动</button>
          <button class="btn" id="b-skill">技能</button>
          <button class="btn" id="b-undo">撤销移动</button>
          <button class="btn" id="b-blood">血祭</button>
          <button class="btn" id="b-wait">待机（空格）</button>
        </div>
      </div>
      <div id="battle-right">
        <div id="enemy-panel"><b>敌军</b><div id="enemy-list"></div></div>
        <div id="log-panel"><b>战报</b><div id="battle-log"></div></div>
      </div>
    </div>
  </div>
  <!-- 战斗结算 -->
  <!--
    结算页：胜负大印章 + 战果明细都由 JS 生成塞进 #result-body。
    印章样式（.result-seal）在 CSS 里，赢了朱红、输了灰。
  -->
  <div id="battle-result" class="hidden">
    <div id="result-body"></div>
  </div>
</div>

<!-- 战斗弹层（猜拳/对话/结算明细） -->
<!--
  #modal-mask 全屏暗幕 + #modal-box 居中白卡：战前猜拳、战斗中
  人物插话、波次间"增益三选一"这类临时弹窗，内容都由 JS 现往
  #modal-box 里填，用完即关（.on 类控制显隐）。
  #tooltip 是黑色小提示框：战场上悬停格子/按钮时，JS 把说明文字
  写进来并挪到鼠标旁，平时 display:none。
-->
<div id="modal-mask"><div id="modal-box"></div></div>
<div id="tooltip"></div>

<!-- Toast -->
<!--
  屏幕上方飘出的小通知（"获得 xx""存档完成"之类）的容器：
  js/config.js 的 toast() 往这里塞一条 .toast 气泡，几秒后自动
  淡出移除。pointer-events:none 让它不挡下面的点击。
-->
<div id="toasts"></div>

<!--
  ============================================================
  23 个 <script>：这里的顺序就是"依赖顺序"，一个都不能乱。
  【为什么不能乱】本项目没有模块系统（没有 import/export），23 个
  文件共享同一个全局作用域，文件之间靠"前面文件定义的全局变量"
  互相调用。浏览器按书写顺序逐个执行：轮到某个文件时，它要用的
  名字必须已经由前面的文件定义好，否则当场报错、页面瘫痪。
  【排列规律】（谁被依赖得多，谁排前面）
    1. js/config.js      工具箱：查元素 $、弹簧动画、音效、存档……
                         几乎所有人都依赖它，必须排第一个；
    2. js/data/*.js      五份"设定集"纯数据：人物/物品/场景/事件/
                         卷目，只供别人读，不依赖任何逻辑代码；
    3. engine/world/dialog/writing/minigames/ui
                         各功能模块：总引擎、校园世界、对话、撰史、
                         小游戏、面板 UI；
    4. js/battle/*       马刀战斗子系统自成一体：自己的配置/数据/
                         引擎/音效/存档/场景/融合层（与外面的同名
                         文件互不相干）；
    5. blades/quests     刀谱系统、任务系统；
    6. js/battle-ui.js   战斗界面融合层；
    7. js/main.js        总指挥：要把前面所有人都拧起来、负责开机
                         启动，所以必须排在最后。
  【新手提示】这串 <script> 放在 </body> 之前而不是 <head> 里，
  是为了让上面的 DOM 全部就位后再执行 JS：否则 JS 想抓 #hud 时
  那些元素还没"出生"，查回来全是 null。
  ============================================================
-->
<script>
/* 实验史记·春秋笔 —— 全局工具 */
'use strict';
/* ================================================================
   【这个文件是干嘛的】
   全项目的“工具箱”：DOM 查询与元素工厂、数学小工具、弹簧动画引擎、
   底部抽屉面板动画、程序合成音效、toast 提示、localStorage 存档。
   零依赖，全原生 JS。

   【架构位置】
   index.html 里第一个加载的 <script>（其后才是 data/ 数据、engine、
   world、dialog……最后是 main）。它不依赖任何别的文件，反而被所有
   文件依赖。注意战斗层还有个同名文件 js/battle/config.js，两者互不相干。

   【暴露的全局名】
   $ $$ el clamp lerp rand irand pick shuffle
   Spring（弹簧动画） SheetFX（抽屉滑入滑出） Sfx（音效）
   toastQueue / toast / flushToasts / showToastNow（提示弹幕）
   Save（存档，localStorage key 为 shiji_cqb_v1）

   【新手阅读提示】
   1) 本项目没有模块系统（没有 import/export），22 个 <script> 按顺序
      加载，文件之间靠“顶层全局变量”通信。JS 里顶层的 const/let 不会像
      var/function 那样挂到 window 上，所以跨文件只能用裸名（直接写
      Spring、Save），不能用 window.Spring；判断某物是否存在用
      typeof Spring !== 'undefined'（直接裸名比较会抛 ReferenceError，
      typeof 则安全）。
   2) 本文件大量使用 IIFE（立即执行函数表达式）：用函数包住内部状态、
      只 return 出想暴露的方法——这就是最朴素的“模块”写法，闭包让
      springs、ctx 这类内部变量外界摸不到。
   ================================================================ */

/* 两个 DOM 查询快捷方式：$ 找第一个匹配的元素，$$ 找全部。
   箭头函数是匿名函数的简写，(参数) => 表达式 意为“返回这个表达式”。
   第二个参数 el 可选：不传就用整个 document（|| 取第一个真值），
   传了就只在该元素内部找。 */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));

/* 造 DOM 元素的小工厂：tag 是标签名（如 'div'），cls 是 class 名，
   html 是要塞进去的 innerHTML（可含标签的 HTML 字符串）。
   “!= null”会同时拦住 null 和 undefined 两种“没有值”，
   是 JS 里最常见的判空写法。 */
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
/* ---------- 数学小工具 ---------- */
/* clamp：把 v 夹在 [a, b] 区间内（超出边界就取边界值）。
   lerp：线性插值，t=0 得 a、t=1 得 b，中间取过渡值，动画渐变的基石。
   rand：取 [a, b) 的随机小数；irand：随机整数（含两端）；
   pick：从数组里随机取一个元素。 */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const irand = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
/* shuffle：洗牌（Fisher-Yates 算法），从尾往头把每个位置与更前面的随机位交换。
   先 arr.slice() 浅复制一份再打乱，不污染调用者手里的原数组；
   [a[i], a[j]] = [a[j], a[i]] 是“解构赋值”交换两值，相当于 Python 的 a, b = b, a。 */
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- 弹簧动画（Apple: damping/response 参数化，可被打断） ---------- */
/* Spring：物理弹簧动画引擎。IIFE + 闭包把活动弹簧集合 springs 藏在内部，
   只对外暴露 make（新建）和 retarget（中途改目标）两个方法。
   每帧由 requestAnimationFrame 驱动：rAF 在浏览器每次重绘前调用 tick，
   是做动画的标准姿势（比 setInterval 顺滑，页面切后台时自动暂停）。
   damping=阻尼（越大弹跳越少），response=响应时间（秒，越小越快）。 */
const Spring = (() => {
  const springs = new Set();
  /* 每帧回调：遍历所有活着的弹簧，各自往前积分一小步。 */
  function tick() {
    const now = performance.now();
    springs.forEach(s => {
      if (s.cancelled) { springs.delete(s); return; }
      /* 单个弹簧回调出错不能拖垮整条动画链（否则后续所有弹簧都停摆，
         表现为"对话/面板卡住、回调丢失、世界像被冻住"） */
      try {
        /* dt = 距上一帧的秒数；夹到 0.032s 以内，防止切后台回来时一步跳太远穿帮。 */
        const dt = Math.min(0.032, (now - s.last) / 1000); s.last = now;
        // 半隐式欧拉积分
        /* 弹簧运动方程：a = -ω²·(x - 目标) - 2ζω·v。前一项是把物体拉回目标的
           “弹力”（离目标越远拉力越大），后一项是与速度成正比的“阻尼力”；
           omega 由 response 换算成角频率。 */
        const omega = 2 * Math.PI / Math.max(0.01, s.response);
        s.v += (-omega * omega * (s.x - s.target) - 2 * s.damping * omega * s.v) * dt;
        s.x += s.v * dt;
        /* 位置和速度都几乎贴住目标 → 视为动画结束：钉死在目标值并触发 done 回调。 */
        if (Math.abs(s.x - s.target) < 0.001 && Math.abs(s.v) < 0.001) {
          s.x = s.target; s.v = 0; springs.delete(s); s.done && s.done();
        }
        s.update(s.x, s.v);
      } catch (e) { springs.delete(s); try { console.error(e); } catch (e2) {} }
    });
    if (springs.size) requestAnimationFrame(tick); else running = false;
  }
  /* running 标记：整条动画链只允许一个 rAF 循环在跑，没有弹簧时自动停表。 */
  let running = false;
  function ensureLoop() { if (!running) { running = true; requestAnimationFrame(tick); } }
  // 创建弹簧：{x0, target, damping=1, response=0.35, update(x,v), done()}
  /* make：造一个弹簧加入集合。opt 里 x0=起点、target=终点、
     update(x, v)=每帧拿着当前值/速度去干活的回调（典型：改 style.transform）、
     done=结束回调。“!= null”式的默认值兜底保证参数可省。 */
  function make(opt) {
    const s = {
      x: opt.x0 || 0, v: opt.v0 || 0, target: opt.target != null ? opt.target : (opt.x0 || 0),
      damping: opt.damping != null ? opt.damping : 1.0,
      response: opt.response != null ? opt.response : 0.35,
      update: opt.update || (() => {}), done: opt.done, last: performance.now(),
    };
    springs.add(s); ensureLoop(); return s;
  }
  /* retarget：中途改目标（比如用户又点了别处，动画顺势改道），
     v0 可选地重设初速度；保证 rAF 循环在跑。 */
  function retarget(s, target, v0) { s.target = target; if (v0 != null) s.v = v0; ensureLoop(); }
  return { make, retarget };
})();

/* Sheet 弹入弹出：从当前呈现值出发（可被打断） */
/* SheetFX：底部抽屉面板的滑入/滑出动画。
   关键思路：不假设面板“从哪开始”，而是用 getComputedStyle 读出它
   当前真实的 transform 再解析成矩阵（m42 就是矩阵里 Y 方向的平移量），
   从当前位置出发滑向目标——于是动画随时可被打断再接上，不会瞬移。 */
const SheetFX = {
  /* 打开抽屉：若上一次的“关闭弹簧”还没跑完，先标记 cancelled 作废它，
     显示面板，再新建一个从当前位置滑回 0（屏幕内）的弹簧。 */
  open(panel) {
    if (panel._closeSpring) { panel._closeSpring.cancelled = true; panel._closeSpring = null; }
    panel.classList.remove('hidden');
    panel.style.transformOrigin = '50% 100%';
    const st = getComputedStyle(panel).transform;
    const m = new DOMMatrixReadOnly(st === 'none' ? '' : st);
    Spring.make({
      x0: m.m42 || 120, target: 0, damping: 0.85, response: 0.4,
      update: x => { panel.style.transform = `translateX(-50%) translateY(${x}px)`; },
    });
  },
  /* 关闭抽屉：目标值是“面板高度 + 60px”（彻底滑出屏幕）。
     done 里用 fired 标志做幂等：弹簧自然结束与下面的 320ms 兜底谁先到，
     “隐藏面板 + 执行回调 cb”这套收尾都只执行一次。 */
  close(panel, cb) {
    if (panel._closeSpring) panel._closeSpring.cancelled = true;
    const st = getComputedStyle(panel).transform;
    const m = new DOMMatrixReadOnly(st === 'none' ? '' : st);
    /* 弹簧只负责视觉滑出；收尾（隐藏层 + 回调）必须保证执行，故加超时兜底 */
    let fired = false;
    const done = () => {
      if (fired) return; fired = true;
      panel.classList.add('hidden'); panel._closeSpring = null; cb && cb();
    };
    try {
      panel._closeSpring = Spring.make({
        x0: m.m42 || 0, target: panel.offsetHeight + 60, damping: 1.0, response: 0.28,
        update: x => { panel.style.transform = `translateX(-50%) translateY(${x}px)`; },
        done,
      });
    } catch (e) { done(); return; }
    /* 保底闹钟：万一弹簧没跑完（回调抛错、rAF 被暂停），320ms 后强制收尾，
       保证面板一定藏起来、cb 一定执行。正常滑出远快于 320ms，玩家无感。 */
    setTimeout(done, 320);
  },
};

/* ---------- 音效：WebAudio 合成，静音可切 ---------- */
/* Sfx：不加载任何音频文件，直接用 WebAudio“现场合成”音效。
   惰性初始化：第一次要发声时才创建 AudioContext（浏览器规定音频必须
   在用户交互之后才能启动，建早了也是“挂起”状态）。
   tone() 是唯一发声原语：振荡器 o 产生指定波形的频率 f，
   增益节点 g 控制音量包络——音量从 0.0001 快速升到目标值再衰减回
   0.0001（指数插值不允许到 0，所以用极小值代替“静音”）。 */
const Sfx = (() => {
  let ctx = null;
  /* 拿到（或首次创建）AudioContext；创建失败返回 null，之后静默无声但不报错。 */
  function ac() { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return ctx; }
  function tone(f, dur, type, vol, delay) {
    /* window.G 是全局状态对象（engine.js 里挂到 window、main.js 里赋值）。
       先探 window.G 再摸 G.settings：读不存在的属性只会得到 undefined（安全），
       裸读一个未声明的变量才会抛 ReferenceError——防御性写法。 */
    if (!window.G || !G.settings || G.settings.muted) return;
    const c = ac(); if (!c) return;
    const t0 = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  /* 对外只暴露一组“具名音效”，每个都是用 tone() 拼出来的小旋律：
     tap=点按、page=翻页、good=好事、seal=落印、bad=坏事、
     unlock=解锁成就、chat=对话滴答（频率带随机扰动，避免千篇一律）。 */
  return {
    tap: () => tone(880, 0.06, 'triangle', 0.05),
    page: () => { tone(520, 0.09, 'sine', 0.07); tone(780, 0.1, 'sine', 0.05, 0.05); },
    good: () => { tone(660, 0.12, 'sine', 0.09); tone(880, 0.16, 'sine', 0.08, 0.09); },
    seal: () => { tone(140, 0.16, 'square', 0.1); tone(90, 0.22, 'sine', 0.12, 0.02); },
    bad: () => { tone(220, 0.18, 'sawtooth', 0.06); tone(160, 0.22, 'sawtooth', 0.06, 0.08); },
    unlock: () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.14, 'sine', 0.07, i * 0.07)); },
    chat: () => tone(700 + rand(-40, 40), 0.05, 'triangle', 0.04),
  };
})();

/* ---------- Toast：弹层打开期间排队，关闭后补发；同屏至多 3 条 ---------- */
/* toast：屏幕上自动消失的短提示（第二个参数是可选的“印章”字，如『善』）。
   面板/对话开着时先排进队列，等它们关掉后由 flushToasts 补播，
   避免提示被弹层挡住白显示。 */
const toastQueue = [];
function toast(msg, sealChar) {
  /* UI / Dialog 是后面文件才定义的全局，本文件加载时它们还不存在；
     但这段代码只在用户交互时才执行，届时用 typeof 判活即可安全访问。 */
  if ((typeof UI !== 'undefined' && UI.panelOpen) || (typeof Dialog !== 'undefined' && Dialog.active)) {
    toastQueue.push([msg, sealChar]);
    /* 队列最多攒 6 条，超了丢最旧的（shift 从头部取出）。 */
    if (toastQueue.length > 6) toastQueue.shift();
    return;
  }
  showToastNow(msg, sealChar);
}
/* 把队列里攒下的提示一口气补播完（条件：弹层已经都关了）。 */
function flushToasts() {
  while (toastQueue.length && !((typeof UI !== 'undefined' && UI.panelOpen) || (typeof Dialog !== 'undefined' && Dialog.active))) {
    const [m, s] = toastQueue.shift();
    showToastNow(m, s);
  }
}
/* 真正把一条 toast 插进 #toasts 容器：同屏满 3 条先删最旧的；
   2.6 秒后给元素加 .out 类触发淡出 CSS 动画，再嵌套等 350ms
   动画播完才从 DOM 里移除——setTimeout 里再套 setTimeout 是
   “先播动画、后清理”的惯用法。 */
function showToastNow(msg, sealChar) {
  const box = $('#toasts');
  while (box.children.length >= 3) box.firstChild.remove();
  const t = el('div', 'toast');
  if (sealChar) t.appendChild(el('span', 'seal-stamp', sealChar));
  t.appendChild(el('span', '', msg));
  box.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 350); }, 2600);
}

/* ---------- 存档 ---------- */
/* Save：存档读写。localStorage 只能存字符串，所以对象要先
   JSON.stringify 序列化、读出后 JSON.parse 反序列化。
   每个操作都包 try/catch：浏览器隐私模式/存储已满时 localStorage 会抛异常，
   游戏不能因此崩掉。export/import 把存档转成 base64 文本方便复制搬运：
   btoa 只认拉丁字符，中文要先 encodeURIComponent 变成纯 ASCII 才进得去。 */
const Save = {
  KEY: 'shiji_cqb_v1',
  write() { try { localStorage.setItem(this.KEY, JSON.stringify(G)); } catch (e) {} },
  read() { try { return JSON.parse(localStorage.getItem(this.KEY)); } catch (e) { return null; } },
  clear() { try { localStorage.removeItem(this.KEY); } catch (e) {} },
  /* 导出：JSON 字符串 → encodeURIComponent 百分号编码（全 ASCII）→ btoa 转 base64。
     escape/unescape 是被废弃的老 API，如今恰好还干着这活儿，读懂即可不必模仿。 */
  export() { return btoa(unescape(encodeURIComponent(JSON.stringify(G)))); },
  /* 导入：上一步的逆运算。校验 ver 字段挡住粘错的内容；
     导入即覆盖现有存档，调用方随后刷新页面让它生效。 */
  import(str) {
    const o = JSON.parse(decodeURIComponent(escape(atob(str.trim()))));
    if (!o || !o.ver) throw new Error('bad');
    Save.clear(); localStorage.setItem(this.KEY, JSON.stringify(o)); return o;
  },
};

</script>
<script>
/* 实验史记·春秋笔 —— 人物数据（据《实验史记》原文）
   look.hair 发色 / style 发型 / acc 随身标识(emoji) */
'use strict';

/* ================================================================
   【这张表是干嘛的】
   全校人物表，分两份：PEOPLE 是 30 名校园角色，PEOPLE_WAI 是
   4 名二中番外角色（第 15 章之后才出现在校门口）。每个人是一条
   “名片 + 剧本”：既有档案文字（intro/bio/quote），也有运行时要
   用的数据（站位、日程、送礼偏好、采访脚本）。

   【被谁消费】
   - js/world.js  把人画到地图上：按 role/cls/home 加当前时段算出
     NPC 站位，look 里的发型发色和 emoji 用来画小人。
   - js/main.js  点人聊天（greet/chat 每次随机抽）、送礼（loves/
     likes 填的是 data/items.js 的道具 id）、采访（interview，好感
     达到门槛 ivNeed 才解锁，没写默认 30）。

<script>
/* 实验史记·春秋笔 —— 史料卡与名场面事件
   shard: 史料卡 {vol, name, tags:['事'|'言'|'趣'|'评'], wen, text(原文摘句)}
   event: {ch, day|[d], periods[], scene, pos, name, cast, shard, script}
   script 步骤: {who,text} | {choice:[{t,fx,favor,rep,say}]} | {ach:id} | {mg:'late'|'spin'|'canteen'} */
'use strict';

/* ================================================================
   【这张表是干嘛的】
   两张表：SHARDS 是“史料卡”字典（撰史玩法的素材，共 91 张——
   注意它是个以 id 为键的对象，不是数组）；EVENTS 是“名场面事件”
   数组（共 68 个，剧情主线的基本单位：走到现场 → 播剧本 →
   发史料/成就/开新地点）。

   【被谁消费】
   - js/engine.js  grantShard 把史料收进存档（打听/转述来的会扣
     文笔值）；eventsNow() 挑出本章还没经历的事件。
   - js/world.js  把事件的 cast 人物临时搬到 scene+pos 现场，并在
     现场画一个“记”字气泡提示可触发。
   - js/dialog.js  播 script 剧本，并处理三种特殊步骤：
     {choice:...} 出选项、{ach:id} 顺手发成就、{mg:...} 插入小游戏
     （late=月考迟到 / spin=陀螺对战 / canteen=食堂冲刺）。
   - js/writing.js  撰史时从已收集的 SHARDS 里挑卡排进起承转合
     四槽算分。
   - 文件末尾还会顺手给 data/people.js 的 PEOPLE_WAI 四人补采访。

   【SHARDS 字段字典】（键是 id，值是一张卡）
   id    卡片代号：'sh_' 开头是亲历/听来的史料，'sh_i_' 开头是采访
         所得的“评”卡（撰史时“合”槽只收评）；
   vol   所属卷号（第几卷的素材）；
   name  卡名；
   tags  标签数组，取值 事/言/趣/评：命中槽位偏好按 1.5 倍计分；
   wen   文笔值 1~5，撰史计分基数（转述来的会被扣减）；
   text  原文摘句（文言，摘自《实验史记》）。

   【EVENTS 字段字典】
   id       事件唯一代号（存档 G.doneEvents 记“做过没有”）；
   ch       所属章节号（0=序章 … 15=番外），决定事件在哪章出现；
   day      原定第几天（数字，或数组如 [1,2] 表示其中任一天）；
   periods  原定时段（morning/noon/aft/eve）；
            ※ 注意：day/periods 现在只是“日程备注”——引擎已改为
            “本章之事随时可遇”，不再按天/时段门控（engine.js 的
            eventsNow 只按 ch 过滤）；
   scene    事件发生场景（data/scenes.js 的场景 id）；
   pos      现场坐标 [x,y]（常与该场景 spots 锚点重合）；
   name     事件名（任务板、提示气泡用）；
   cast     登场人物 id 数组（data/people.js 的 id；world.js 会把
            这些人拉到现场；不在 people 表里的 id 会被安静忽略）；
   shard    通关后发放的史料卡 id（null=支线事件不发卡）；
   flag     通关后置 G.flags[flag]=true：开新地点/门控支线
            （如 xiehui=马刀协会开张、wonderTrial=试炼开关）；
   ach      写在事件根上仅作备注；真正发成就靠剧本里的 {ach:id}
            步骤（dialog.js 处理）；
   mg       本事件内嵌小游戏类型（与剧本里 {mg:...} 步骤配套）；
   script   剧本步骤数组，逐条播放：
            {who, text} 普通台词步；
            {choice:[…]} 选项步——每项 {t=文案, fx=成功率小字,
            favor/rep=奖励, say=选后插播台词}（dialog.js 支持，
            但当前 68 个事件还没用到 choice）；
            {ach:'id'} 发成就；
            {mg:'类型', who:'mg', text:说明} 小游戏步，输赢写回
            该步骤的 _mgResult，由 main.js 结算。
   ================================================================ */

/* 史料卡字典：用 id 当键直接取，SHARDS['sh_wall'] 即“破败城墙”卡。

sh_suannai:{vol:2,name:'封控酸奶',tags:['事'],wen:3,text:'封控，上恐学生惧，乃以酸奶贻学生，假手机以通话于父母。学生与家长俱悦。'},
sh_shengwu:{vol:2,name:'生物分猜猜',tags:['趣'],wen:3,text:'笑问绍铭曰：“猜尔生物分。”铭曰：“六十上下。”及看分，果42。铭曰：“概涂错卡。”一卷涂错而24。'},
sh_weijin:{vol:2,name:'风扇违禁品',tags:['趣'],wen:2,text:'哥入宿舍，其风扇无。四处搜寻，未果。盖风扇以违禁品没收，宿管查宿舍寻之。'},
sh_i_hanxiao:{vol:2,name:'评·含笑',tags:['评'],wen:5,text:'音克思曰：贤哉含笑！敢复读，有勇耳。去支教，有见耳。勇见兼备，序他班而朝同列，无敌于实验。号曰“文”，谊哉！'},
/* 卷三 */
sh_zhitiao:{vol:3,name:'锦绣昼行',tags:['事'],wen:3,text:'鲁豪说绍铭曰：“恋爱而不让人知，如锦绣夜行，谁知之者！今予我纸条，是所谓富贵还乡，锦绣昼行也！”铭曰：“善。”乃悉与纸条。'},
sh_daiyin:{vol:3,name:'断腿带饭',tags:['事'],wen:3,text:'歆慧踩空滚落下阶，腿断。绍铭每餐必携饭。又不欲自费，乃强要卓本市饼，又要之送于歆慧。'},
sh_duizhi:{vol:3,name:'办公室对质',tags:['言'],wen:4,text:'钦法欲令互相揭发。铭恐慧难支，挺而出曰：“但问吾，毋向歆慧也。”钦法愠曰：“吾未令尔言也！”铭对曰：“先前，汝令吾二人言也。”如是者三。'},
sh_shoulian:{vol:3,name:'手链复合',tags:['趣'],wen:3,text:'运动会既散，绍铭窃置手链于歆慧口袋。歆慧反家乃视之，以QQ问曰：“手链？”铭许。遂和好如初。'},
sh_i_shaoming:{vol:3,name:'评·绍铭',tags:['评'],wen:4,text:'音克思曰：铭以己之一厢情愿而恋爱，卒亡其慧，尚不觉寐而不自省。强曰“安能不悔”，岂不谬哉！'},
sh_i_xinhui:{vol:3,name:'评·歆慧',tags:['评'],wen:4,text:'歆慧曰：“后悔个屁！”既黑铭，吾觉未有之爽也。——史官按：先转身者，未必不痛。'},
/* 卷四 */
sh_xiaozu:{vol:4,name:'量子八组',tags:['事'],wen:3,text:'鲁豪自募组员填八组，既获组员复摆烂，八组常倒一。八组自此为量子之组：加分时合，检查时散，检查过而复合。'},
sh_koujue:{vol:4,name:'大师口诀',tags:['言'],wen:4,text:'世波曰：“面面垂直找交线，找到交线找垂线，找到垂线得垂面。”“指数找好友，对数单身狗。”“乘公比，错位减，顾两端，1检验！”'},
sh_heibang:{vol:4,name:'破伤风棒',tags:['趣'],wen:3,text:'为荣有黑棒不盈尺而威力无双。子琛离击而跳，叹曰：“苟有得痔疮者离击，或已死矣。”翼帆一棍而不能坐。'},
sh_gupiao:{vol:4,name:'明虎炒股',tags:['趣'],wen:3,text:'明虎尝曰：“吾以十万入，三日而赚五万，两日而又赔七万，卒退。故尔辈不得炒股！”其见识精辟如此。'},
sh_i_zouyu:{vol:4,name:'评·邹玉',tags:['评'],wen:4,text:'音克思曰：分组者非为分，乃使人人不敢懈；笔记者非为收，乃使人人不敢空。三大山，皆渡人之筏。'},
sh_i_shibo:{vol:4,name:'评·大师',tags:['评'],wen:4,text:'音克思曰：技无正邪，用有高下。能破题者，皆是正道。此真数学老师也。'},
sh_i_weirong:{vol:4,name:'评·为荣',tags:['评'],wen:4,text:'音克思曰：广大而精微，深沉而易懂，妙趣横生，生皆拥之。力度之强，技巧之深，未有过之者。'},
/* 卷五 */
sh_23:{vol:5,name:'二十三题',tags:['事'],wen:4,text:'wonder究一题十四节课，卒解之，予之汶斌。汶斌秒之。wonder大怒，悉发二十三题。汶斌皆破之。卒投降。'},
sh_biejielian:{vol:5,name:'别叫别叫',tags:['趣'],wen:3,text:'汶斌诗赞曰：“打完响指拍大腿，大喊一声别叫了，左手右手左右左，血祭血祭血血祭。”'},
sh_yurun:{vol:5,name:'面包之韫',tags:['事'],wen:3,text:'毓润持一面包谓业辉曰：“此面包之韫予我也。之韫见吾而大羞，面红而塞我一面包，诚矣！”大哥之徒尚不信，何况他人乎？'},
sh_qiangru:{vol:5,name:'强入TGO',tags:['事'],wen:3,text:'后有毓润之徒欲强入TGO，卒为逐。TGO为六班数学之冠，其后毓润之徒强入之，乃崩坏。'},
sh_i_wonder:{vol:5,name:'评·wonder',tags:['评'],wen:5,text:'音克思曰：思维甚慢，然思绪精妙，毅力超凡，能思十四节课而不辍。马刀之神，其此之谓乎。'},
sh_i_wanzhen:{vol:5,name:'评·万震',tags:['评'],wen:4,text:'音克思曰：潜心至学，无多事。三句够了。数学贵精不贵多。'},
sh_i_wenbin:{vol:5,name:'评·汶斌',tags:['评'],wen:4,text:'音克思曰：秒之，非傲，乃题就该秒。铃响不走者，非人也。'},
sh_i_yurun:{vol:5,name:'评·毓润',tags:['评'],wen:4,text:'音克思曰：脸非红乎？诚红，然非汝之所想也。joker无人可相较也。'},
/* 卷六 */
sh_yumi:{vol:6,name:'玉米为刃',tags:['趣'],wen:4,text:'一日午饭，展市一玉米，乃幻想玉米为刃，欲以杀人，乃拔玉米而舞。可怡见之，以为展呼己，回以招呼。'},
sh_yitang:{vol:6,name:'一糖之恩',tags:['事'],wen:3,text:'可怡抽转盘未得奖。展乃与可怡一糖，曰：“与尔一糖，毋有心伤。”可怡大感，心益善大展。'},
sh_haibin:{vol:6,name:'海滨之游',tags:['事'],wen:3,text:'坐公交，循阡陌，计半时辰乃至海滨。已而倦甚，展备火锅以饭。饭毕展径刷碗，可怡见之大喜。'},
sh_109:{vol:6,name:'卒得109',tags:['趣'],wen:4,text:'展睡至7:55，翻遍书包得可怡一黑笔。考场为19而入12，考号22058，卒未填。卒，除姓名外靡不毕缪，卒得109。'},
sh_i_zhan:{vol:6,name:'评·大展',tags:['评'],wen:4,text:'音克思曰：高中之恋爱多不就，惟大展成。究其本，乃收敛而谨慎也。此之谓恋爱者必慎也。'},
sh_i_keyi:{vol:6,name:'评·可怡',tags:['评'],wen:4,text:'音克思曰：不一样的糖。写史者当知：物轻而义重，此列传之所以贵细节也。'},
/* 卷七 */
sh_zheng20:{vol:7,name:'正二十面体',tags:['事'],wen:3,text:'头哥手搓正二十面体于课堂。为兵深异之，号之曰“教授”，于众面赞曰：“尔等安有如修逸折正二十面体者乎？”'},
sh_sui:{vol:7,name:'三溴化氮',tags:['趣'],wen:4,text:'头哥得一陀螺，名曰三溴化氮，鲜有败绩。后不慎失之，大悲，以头抢地，捶胸催脏而莫能追也。'},
sh_mofang:{vol:7,name:'魔方万段',tags:['事'],wen:3,text:'为兵破门而入，遽扑之，夺其魔方，碎之万段于垃圾桶。然非己物，乃奕峻之物也。'},
sh_shaqiu:{vol:7,name:'沙丘',tags:['事'],wen:4,text:'头哥阅《沙丘》于考试，一时辰未落一字。钦法视其答题卡空白，怒曰：“陈修逸，若高三吾复为汝级部主任，吾定除汝名于七班！”'},
sh_i_touge:{vol:7,name:'评·头哥',tags:['评'],wen:4,text:'音克思曰：三次为捉，四次换家，可谓之极。倘修逸从勇珺之言，则不至于此矣。'},
/* 卷八 */
sh_daoyuan:{vol:8,name:'马刀之源',tags:['事'],wen:3,text:'马刀者，wonder之所引进也。开局人皆位于己城，以猜拳定行动。规则至简，而引人入胜。'},
sh_laiya:{vol:8,name:'来呀来呀',tags:['趣'],wen:4,text:'wonder猜拳则曰：“来呀来呀。”声震九天。死则曰：“重开重开。”共赢时曰：“我先说的。”'},
sh_sanguo:{vol:8,name:'三国刀之辩',tags:['言'],wen:3,text:'小川、鲁豪觉马刀之腻，乃创三国刀，设技能。wonder初拒之，以为失马刀之初心，乃创boss战以距之，不敌。'},
sh_guifan:{vol:8,name:'马刀法',tags:['事'],wen:2,text:'高三时，铭哲规范马刀，勇珺著马刀法。虽不为众欢，马刀亦多有规范。'},
sh_i_luhao:{vol:8,name:'评·马刀',tags:['评'],wen:5,text:'音克思曰：马刀引人入胜，在于马刀之人也。既毕业，无复有刀者，悲哉！马刀之消，似于高中之时光也。'},
/* 卷九 */
sh_shuihu:{vol:9,name:'顺道',tags:['趣'],wen:4,text:'凯宇径提水壶而出班门。晓东怒：“何以携水壶？”宇无言，已而曰：“顺道。”苟失水壶，慌乱若无头之蝇。'},
sh_cesuo:{vol:9,name:'七点五十',tags:['趣'],wen:3,text:'凯宇必与7:50而入厕所，如遭拖堂，无不喟然而叹，击股而锤。至下课，飞身出班，疾如电，行如风雨。'},
sh_paidu:{vol:9,name:'拍肚皮',tags:['趣'],wen:3,text:'奕然见鲁豪腹大如斗，乃拍之，觉好玩，于是拍之不止，每见鲁豪，辄雀跃以拍。'},
sh_fajia:{vol:9,name:'发卡风波',tags:['事'],wen:3,text:'奕然捡一发卡，幻想其为梦晨所有。或曰：“得无仙女乎？”奕然闻之大惊，甩手弃掷于地，若为蝎子所蛰。'},
sh_i_guayu:{vol:9,name:'评·呱宇',tags:['评'],wen:4,text:'音克思曰：众人皆由其英姿，以为白玉无瑕。居无何，近人觉之不同。帅，是一种责任。'},
sh_i_xiaowa:{vol:9,name:'评·小蛙',tags:['评'],wen:4,text:'音克思曰：何只有凯宇一男也！以奕然之清秀，亡认其亦男也。'},
/* 卷十 */
sh_mimou:{vol:10,name:'起义密谋',tags:['言'],wen:4,text:'子琛曰：“今体育课少，乃洪波之独裁。吾欲先造心腹，占跑道，夺其话筒：马上解散，毋恐担责，凡有责任，在吾一人。”'},
sh_tongzhi:{vol:10,name:'通知非请教',tags:['言'],wen:4,text:'子琛告含笑以起义。含笑大怒：“尔敢起事，吾誓杀汝！”对曰：“此通知尔，非求建议也。”'},
sh_shangshu:{vol:10,name:'上书洪波',tags:['事'],wen:3,text:'子琛上书，为一师所得，呈于校长。洪波召之曰：“非吾占尔体育课，形势所迫尔。”后又以实言，子琛许。'},
sh_61:{vol:10,name:'六一之糖',tags:['趣'],wen:3,text:'6·1之时，含笑贻学生以糖。夜半，醒琛而邀之出门，琛乃光膀而出。凡十分钟乃释琛。'},
sh_i_zichen:{vol:10,name:'评·子琛',tags:['评'],wen:5,text:'音克思曰：子琛起于六班，续位于七班。号令两班，政由琛出，威震天下。位终，近古以来未之有也。'},
/* 卷十一 */
sh_jntm:{vol:11,name:'鸡你太美',tags:['趣'],wen:4,text:'顾一定规曰：“打铃后喧哗者，罚洁宿舍一周！”铃响方毕，忽于榻上高歌“鸡你太美”，遂自扫舍七日。'},
sh_huangtaizi:{vol:11,name:'皇太子',tags:['趣'],wen:3,text:'顾一尝谓鲁豪：“尔，吾子也！”鲁豪应曰：“既如此，顾良岂非吾祖？”适逢顾良过，顾一惶走，鲁豪大笑。'},
sh_woochuang:{vol:11,name:'挂壁拉丝',tags:['趣'],wen:3,text:'小川初入舍，见一人疾呼：“吾舍厕所，挂壁而拉丝也！”暗异之。封控间无桌，举行李箱为案，杨杰问：“汝习举重乎？”'},
sh_kaosi:{vol:11,name:'考前必死',tags:['言'],wen:3,text:'每临考，顾一必叹：“此番死矣！考绩必劣，无有过者。”及榜发，竟为级部第一。故人皆谓：只因之言，未可轻信。'},
sh_i_zhiyin:{vol:11,name:'评·只因',tags:['评'],wen:4,text:'音克思曰：自称摆烂，暗中勤学。两句都是真的——此之谓“只因之言，未可轻信”。'},
sh_i_xiaochuan:{vol:11,name:'评·小川',tags:['评'],wen:4,text:'音克思曰：川有超世之才，虽内向，何女不容？才貌如川且若此，况庸碌之人乎？'},
/* 卷十二 */
sh_shenjiao:{vol:12,name:'神教会',tags:['事'],wen:4,text:'刘毅创神教会，自命主教，使李帆、勇珺为左右护法，十余人入会。后李帆不慎泄露天机，为兵乃得之，遂镇压神教会。'},
sh_sayyou:{vol:12,name:'Say You Say Me',tags:['趣'],wen:4,text:'帆唱《Say You, Say Me》，笑场者三，遭之下台。班人皆以“say you”为乐。帆拍桌而起，咆哮曰：“适可而止！”'},
sh_bengdi:{vol:12,name:'蹦迪台灯',tags:['趣'],wen:3,text:'帆得一台灯，乃开频闪模式，挂之上铺，曰“蹦迪”。恰维坤至，复逮之，罚站一天。'},
sh_xianjiao:{vol:12,name:'改编仙女',tags:['事'],wen:3,text:'帆作角色“仙女”，宣讲于走廊。仙大怒：“汝改编吾为马刀角色，经吾肯定乎？”其声极尖锐。帆惧，遁逃入班。'},
sh_i_lifan:{vol:12,name:'评·李帆',tags:['评'],wen:4,text:'音克思曰：壮其行，悲其志。终得一言以评之曰：疯奇。'},
/* 卷十三 */
sh_lingyang:{vol:13,name:'羚羊奔食',tags:['趣'],wen:4,text:'默之趋食堂，必先以右足探地，既而狂奔，左右腾挪，状类羚羊。后以此断腿，然仍不改其速。'},
sh_xunzheng:{vol:13,name:'巡征二楼',tags:['趣'],wen:3,text:'默好重点班，常于二楼徘徊，时手提其袋，时举其水壶，时人谓之巡征。跑操不跑，持书佯作诵读状，实则环视各班。'},
sh_yedun:{vol:13,name:'相东夜遁',tags:['事'],wen:4,text:'相东不告而离校，混于走读生队中，行至台城。校服识之，押而归。乘师不备又走，闭门搜而获之，已十二点矣。终潜逃回家，二月不返。'},
sh_mengge:{vol:13,name:'一场游戏一场梦',tags:['言'],wen:3,text:'激励大会，默曰：“吾之高中，多以为一场游戏一场梦。”以其多曰此句，故又号称梦哥。'},
sh_i_limo:{vol:13,name:'评·李默',tags:['评'],wen:4,text:'音克思曰：腿可以断，饭不能凉。实验果多神人也。'},
sh_i_xiangdong:{vol:13,name:'评·相东',tags:['评'],wen:4,text:'音克思曰：有些列传，是走出来的，不是问出来的。台城、十二点、二月——史家亦不能尽知也。'},
/* 卷十四 */
sh_zhicheng:{vol:14,name:'职称令',tags:['事'],wen:4,text:'崇国下令：“不为班主任者不得评职称。”一出，天下皆惊，众师悉恶崇国，数与争。'},
sh_bianwei:{vol:14,name:'贬为兵教美术',tags:['事'],wen:4,text:'为兵固请往高一从其子而教。崇国怒曰：“为师者，吾之属地也！”贬其任美术老师之职，令其排其课表。众人皆怪为兵之贤而不见用。'},
sh_reshui:{vol:14,name:'免水费',tags:['事'],wen:3,text:'学子饮水无着，崇国免生打水之费。然待己宽而待师苛，乃以热水器加装于教师宿舍。'},
sh_zhongshu:{vol:14,name:'种树校长',tags:['趣'],wen:3,text:'崇国复入二中，多种树木。树木皆死，时人谓之“种树校长”。'},
sh_i_chongguo:{vol:14,name:'评·崇国',tags:['评'],wen:5,text:'音克思曰：轻师而重生，犹植木于沙，欲其茂而不得其土。荣国之术未尝败也，然校亦未尝兴也。'},
/* 卷十五 · 二中番外 */
sh_chanyan:{vol:15,name:'谗言始末',tags:['事'],wen:3,text:'子烨阴谗言于连奇曰：“若华为人阴险。”连奇阳奉阴违，告之若华。三人交错相告，于是二人陌路。'},
sh_liangpai:{vol:15,name:'两派对垒',tags:['事'],wen:3,text:'班遂分子烨、连奇二派。九人联合发朋友圈以阴阳子烨，齐岳尤甚。子烨闻之大怒，乃告于老师。'},
sh_sanbai:{vol:15,name:'纸条三白',tags:['事'],wen:3,text:'连奇予齐岳二择：a朋友，b陌路。齐岳强曰：“恋人不可为乎？”连奇曰：“高考且至，吾不欲吾二人难堪。”'},
sh_sanbaijin:{vol:15,name:'三百金手机',tags:['趣'],wen:4,text:'晟翔欲市手机以习王者荣耀。同学曰：“五十。”晟翔曰：“与尔三百，无令尔损！”彻夜苦练朵莉亚至四点，为手机所砸而醒。'},
sh_i_shengxiang:{vol:15,name:'评·晟翔',tags:['评'],wen:4,text:'音克思曰：晟翔有义无勇。以三百金市五十之机，痴情付之，其败亦宜也。'},
sh_i_qiyue:{vol:15,name:'评·齐岳',tags:['评'],wen:4,text:'音克思曰：齐岳有痴无断。好子烨，断后至此计不满一月，又好连奇。靡不有初，鲜克有终。'},
sh_i_ziye:{vol:15,name:'评·子烨',tags:['评'],wen:4,text:'音克思曰：子烨有媚无诚。一谗而莫逆成仇，党争之起，起于谗言；谗言之起，起于闲谈。'},
sh_i_lianqi:{vol:15,name:'评·连奇',tags:['评'],wen:4,text:'音克思曰：连奇有断无柔。流言可以离友，猜疑可以成仇，而人心之变，虽史家亦不能尽知也。'},
