<script>
/* 实验史记·马刀行 —— 引擎：状态 / 进度 / 事件 / 成就
   自由开放世界：没有「章节靠睡觉推进」的时间线。章节（G.ch）由主线完成度驱动，
   时段与行动点退化为氛围与风味，不再门控任何玩法。 */
'use strict';
/* ================================================================
   【这个文件是干嘛的】
   世界层的状态机：定义全局存档对象 G 的结构、章节进度推导、事件查询、
   风险判定（被巡查逮住的小剧场）、资源增减（文笔/声望/零花钱/好感）、
   史料收集与成就表。

   【架构位置】
   在 config.js 与 data/* 之后、world.js 之前加载。
   依赖：data 里的 CHAPTERS / EVENTS / SHARDS / PEOPLE*（顶层裸名），
   以及 config 的 clamp / toast / Sfx / Save；方法里还会调 UI、Dialog、
   World——这些文件在本文件之后加载也没关系，JS 的全局名是在“运行到
   那一行时”才去查找的，不是加载时。被几乎所有世界侧文件调用。

   【暴露的全局名】
   PERIODS / PERIOD_LABEL / PERIOD_THEME、newGameState、
   window.G（全局状态本体）、Engine、ACHIEVEMENTS。

   【新手阅读提示】
   1) G 是整个游戏唯一的“账本”，一切进度都在这一个对象里；它被特意挂到
      window 上（window.G = null），战斗层只认 window.G。
   2) 章节号 G.ch 不再由睡觉/日程推进，而是从主线任务完成度“推导”出来，
      且只进不退（见 Engine.syncChapter），老存档也不会章节回跳。
   3) 注意战斗层也有个 js/battle/engine.js，那是回合制对战的核心，
      与本文件是两个东西。
   ================================================================ */

/* 时段仅作氛围与 NPC 调度参考（世界不按课表走） */
/* 四个时段的 id 数组，外加两张映射表：显示名、<body> 上的主题 class
   （用于白天/夜间换肤）。PERIODS 的下标与 G.periodIdx 对应。 */
const PERIODS = ['morning', 'noon', 'aft', 'eve'];
const PERIOD_LABEL = { morning:'上午', noon:'午间', aft:'下午', eve:'夜间' };
const PERIOD_THEME = { morning:'theme-morning', noon:'theme-day', aft:'theme-day', eve:'theme-night' };

/* 造一份全新存档。整个游戏的所有进度都装在这一个对象里：
   ver=存档版本号（读档时据此做旧档兼容）、ch=章节、day/periodIdx=时间、
   wen/rep/money=文笔/声望/零花钱、shards=已得史料、vols=已发表各卷、
   bag=行囊、ach=成就、flags=一次性标记、blades/quests=刀卡与任务、
   settings=玩家设置、stats=统计数字（不少成就靠它判定）。
   存档时把整个对象 JSON.stringify 后写进 localStorage。 */
function newGameState() {
  return {
    ver: 2,
    ch: 0, day: 1, periodIdx: 0,
    ap: 3, apMax: 3,
    wen: 5, rep: 50, money: 12,
    favor: {},            // personId -> 0..100
    shards: {},           // shardId -> {src, wen}
    doneEvents: [],
    vols: {},             // no -> {grade(1-4), score, style, shards:[ids], text}
    giftToday: {}, chatCount: 0, caughtToday: false,
    bag: { snack:1, candy:2, note:1 },
    ach: {},
    flags: { visitedScenes:['playground'], metPeople:[], prologue:false, duelBanDays:0 },
    wins: 0, duelsLost: 0,
    blades: { cards: [], equip: null, rare: [], rareOn: [], rareInit: true },   // 刀谱：击败者 id → 录技；rareOn → 生效中的稀有刀卡
    quests: {},              // 任务完成记录（主线 9 节 + 支线 7 条）
    roster: ['yinkesi'],     // 出战名册（支线解锁强力人物）
    trialDone: {},           // 试炼首通记录
    duelDone: {},            // duelId -> true（成传战/支线战斗去重）
    settings: { muted:false, motion:'full', speed:1 },
    stats: { chats:0, gifts:0, reads:0, gossip:0, caught:0, listened:0,
             direct:0, curve:0, plays:{}, published:0 },
  };
}

/* 全局状态 G 的“户口”。特意用 window.G 而不是顶层 const：
   战斗层（blades.js 等）要通过 window.G 拿账本；真正的赋值发生在
   main.js 开新档/读档时（G = newGameState() 或 G = 读出的存档），
   此刻先占位 null。 */
window.G = null;

/* 世界状态机：一个普通对象字面量充当“命名空间”，方法之间用 this 互调
   （如 this.chDef()）。没有 class，也没有模块，就是最朴素的组织方式。 */
const Engine = {
  /* ---------- 进度（章节 ↔ 主线） ---------- */
  /* 当前章节的配置数据（CHAPTERS 表在 data/volumes.js）、时段、日期文案。 */
  chDef() { return CHAPTERS[G.ch] || CHAPTERS[0]; },
  period() { return PERIODS[G.periodIdx] || 'morning'; },
  dateLabel() { const c = this.chDef(); return `${c.date} · 第 ${G.day} 日`; },
  chLabel() { return this.chDef().title; },
  /** 章节由主线完成度推导；只进不退（老档原进度保留） */
  /* 章节同步：问主线任务系统 Quests“按现在的完成度应该是第几章”，
     只有想要的章节数更大才推进——单向推导、只进不退，
     旧存档里已到的进度绝不会往回拨。 */
  syncChapter() {
    if (typeof Quests === 'undefined') return false;
    const want = Quests.chapterNow();
    if (want > G.ch) { G.ch = want; this.pendingCh = G.ch; this.syncWorldFlags(); return true; }
    return false;
  },
  /** 章节达标即解锁对应世界内容（不再依赖某条史料去开门） */
  syncWorldFlags() {
    if (G.ch >= 8) G.flags.xiehui = true;   // 世界马刀协会开张（m4 后）
  },
  /* 取走“待播报的新章节”标记：一次性读取，读完即清空（null）。 */
  takePendingChapter() { const c = this.pendingCh; this.pendingCh = null; return c == null ? null : c; },
  pendingCh: null,
  /** 仅供测试/调试：直接推进章节号（正式流程由 syncChapter 按主线驱动） */
  nextChapter() {
    if (G.ch >= CHAPTERS.length - 1) return 'finale-ready';
    G.ch++; Save.write(); return 'ok';
  },

  /* ---------- 事件：不再按时段/日期门控，本章之事皆可亲历 ---------- */
  /* 当前章节中还没经历过的事件。filter 挑行 + includes 查“做过没有”，
     是 JS 里查“剩余项”的惯用组合。 */
  eventsNow() {
    return EVENTS.filter(e => e.ch === G.ch && !G.doneEvents.includes(e.id));
  },
  /** 供「今日风闻」板 */
  eventsToday() { return this.eventsNow(); },
  /** 已走过的章节里没赶上、且未收集的史料 → 可托人打听 */
  missedEvents() {
    return EVENTS.filter(e => e.shard && !G.shards[e.shard] && !G.doneEvents.includes(e.id) && e.ch < G.ch);
  },
  /** 歇一日：日子推进，时段随机轮换（纯氛围） */
  /* 过天结算：天数 +1、随机换时段（Math.floor(Math.random()*4) 取 0~3）、
     清空“每日限一次”类状态、发 3 文生活费；
     duelBanDays 是“马刀被没收”的剩余天数，减到 0 时 toast 报喜还刀。 */
  nextDay() {
    G.day++;
    G.periodIdx = Math.floor(Math.random() * 4);
    G.giftToday = {}; G.chatCount = 0; G.caughtToday = false;
    G.money += 3; // 每日生活费
    G.flags.fineTomorrow = false;
    if (G.flags.duelBanDays > 0) {
      G.flags.duelBanDays--;
      if (G.flags.duelBanDays === 0) toast('钦法还刀：马刀失而复得，可约战矣', '刀');
    }
    Save.write(); return 'newday';
  },

  /* ---------- 资源 ---------- */
  /** 自由开放世界：行动点不再是探索门禁。保留接口以免改动所有调用点。 */
  /* 四个“加资源”函数都走同一套路：先 clamp 夹进合法区间，再让 HUD 数字跳一下。
     addMoney 攒到 40 顺手解锁“家有余粮”成就。 */
  spendAP() { return true; },
  addWen(n) { G.wen = clamp(G.wen + n, 0, 100); UI.bump('wen'); },
  addRep(n) { G.rep = clamp(G.rep + n, 0, 100); UI.bump('rep'); },
  addMoney(n) {
    G.money = clamp(G.money + n, 0, 99); UI.bump('money');
    if (G.money >= 40) this.award('ach_rich');
  },
  /* 好感读档：没记录就当 0（|| 给默认值是 JS 处理“可能不存在”的惯用法）。 */
  favorOf(id) { return G.favor[id] || 0; },
  /* 静默版：只改数值不弹提示，供批量结算用。 */
  addFavorQuiet(id, n) { G.favor[id] = clamp(this.favorOf(id) + n, 0, 100); },
  /* 带提示版：弹出“某人称 好感 ±n”的 toast，文案优先称号（hao）再退回本名。 */
  addFavor(id, n) {
    G.favor[id] = clamp(this.favorOf(id) + n, 0, 100);
    const p = PEOPLE_BY_ID[id];
    if (n > 0 && p) toast(`${p.hao || p.name} 好感 +${n}`, '善');
    else if (n < 0 && p) toast(`${p.hao || p.name} 好感 ${n}`, '恶');
  },

  /* ---------- 史料 ---------- */
  /* 史料收集：!!x 把任意值转成 true/false。grantShard 记录来源并定文笔值：
     打听来的转述版（gossip）文笔 -1，亲历/采访拿全值；
     同一条史料不可重复获得（已有时返回 false）。 */
  hasShard(id) { return !!G.shards[id]; },
  grantShard(id, src) {
    if (!id || G.shards[id]) return false;
    const base = SHARDS[id];
    const cut = src === 'gossip' ? 1 : 0;
    G.shards[id] = { src, wen: Math.max(1, base.wen - cut) };
    const srcName = { scene:'亲历', gossip:'转述', interview:'采访' }[src] || '所得';
    toast(`史料「${base.name}」到手（${srcName}）`, '料');
    Sfx.good();
    return true;
  },

  /* ---------- 风险：被逮（自由世界：只与地点有关，不再限时段） ---------- */
  /** 在教学楼内行动，偶遇巡查。返回是否触发了巡查 */
  /* 风险掷骰：只在走廊/教室/办公室等“教学楼内”场景，9% 概率触发；
     每天至多一次（G.caughtToday 当天标记，nextDay 时清零）。 */
  riskCheck() {
    if (G.caughtToday) return false;
    if (!['corridor', 'classroom6', 'classroom7', 'office'].includes(World.sceneId)) return false;
    if (Math.random() > 0.09) return false;
    G.caughtToday = true;
    return true;
  },
  /* 被逮后的教学小剧场：播放一段带选项的对话。三个选项成功率
     50% / 65% / 80%，选项的 run() 里用 Math.random() 掷骰决定走向，
     失败扣声望甚至“通报电子班牌”（解锁 ach_caught 成就）。
     onDone 原样传给 Dialog.play——对话结束后由调用方继续自己的流程。 */
  caughtPlay(onDone) {
    G.stats.caught++;
    Dialog.play([
      { who:'钦法', text:'（从走廊尽头逼近）汝乃何人？此何课也？' },
      { choice: [
        { t:'把纸条塞进袖口，装作无事', fx:'五五之数', run() {
            if (Math.random() < 0.5) return { say:{who:'旁白',text:'钦法扫了一眼，走了。冷汗浸透了后背。'} };
            Engine.addRep(-3); return { say:{who:'钦法',text:'手拿出来。——记你一笔。'}, bad:true };
        } },
        { t:'淡定举起手中的书', fx:'六五之数', run() {
            if (Math.random() < 0.65) return { say:{who:'旁白',text:'钦法点点头：“善。”——幸好你带的是《读通鉴论》。'} };
            G.flags.fineTomorrow = true; return { say:{who:'钦法',text:'站到后面去。明日行动点-1。'}, bad:true };
        } },
        { t:'撒腿就跑', fx:'险中求活', run() {
            if (Math.random() < 0.8) { Engine.addRep(-2); return { say:{who:'旁白',text:'你一路冲进厕所，听见外面脚步声远去。'} }; }
            Engine.addRep(-5); Engine.award('ach_caught');
            return { say:{who:'钦法',text:'站住！通报于电子班牌！'}, bad:true };
        } },
      ] },
    ], onDone);
  },

  /* ---------- 成就 ---------- */
  /* 发成就：G.ach 里记一笔（已有就直接返回，保证幂等——重复触发不重复弹），
     从成就表查出名字弹 toast、播解锁音效并立刻写存档。 */
  award(id) {
    if (G.ach[id]) return;
    G.ach[id] = 1;
    const a = ACHIEVEMENTS.find(x => x.id === id);
    toast(`成就达成「${a ? a.name : id}」`, '成');
    Sfx.unlock();
    Save.write();
  },
};

/* ============ 成就表 ============ */

const ACHIEVEMENTS = [

<script>
/* 实验史记·春秋笔 —— Canvas 校园世界 */
'use strict';
/* ================================================================
   【这个文件是干嘛的】
   游戏的“探索世界”层：用 Canvas 2D 把校园画出来（教室/食堂/操场等
   场景、桌椅黑板等道具、Q 版小人），并负责玩家在其中的一切活动——
   点地面走路（BFS 网格寻路）、碰门切场景、靠近人物/事件/任务点时
   弹出交互条、键盘方向键移动、相机平滑跟随。文件顶部的两个函数
   drawAvatar / roundRect 是全站共用的画图小工具（对话、图鉴、小
   游戏都来借）。

   【架构位置】
   index.html 按固定顺序加载 22 个 <script>，本文件排在 config、
   data/、engine 之后、dialog/ui/main 之前：它要用前面定义好的
   $、clamp、SCENE_BY_ID、PEOPLE、Engine 等，又被后面的 dialog/
   main/minigames 使用（minigames.js 就直接借走了 drawAvatar 和
   roundRect）。世界↔战斗的命脉在 main.js：世界收到约战 →
   window.SJI_UI.startBattle(cfg) 开战 → 战斗层立起
   window.BATTLE_ACTIVE = true → 本文件的点击处理与主循环看到这面
   旗子就让位（世界“暂停”，给战斗画面腾地方）。

   【暴露的全局名】
   1) drawAvatar(ctx, p, cx, cy, s)、roundRect(ctx, x, y, w, h, r)
      ——顶层 function 声明。经典 <script> 里顶层 function 会挂到
      全局对象上，别的文件直接裸名调用即可。
   2) const World——下面 IIFE 返回的对象（enter/travel/walkTo/
      npcPos/isNearNPC/avatarCanvas/setOnCtx/start…），main.js 主要
      跟它打交道。注意大坑：顶层 const 不挂 window！跨文件只能裸名
      World，不能 window.World；判活写 typeof World !== 'undefined'。

   【新手阅读提示】
   1) Canvas 是“整页重画”模型：画面上没有“留住的小人”，只有每帧
      在 requestAnimationFrame 回调里把整个世界重新画一遍（draw），
      一秒约 60 次。看到的连续动画，其实是高速翻页。
   2) 两处防御性设计值得细读：a) freeSpot()——默认落点可能恰好踩进
      道具的碰撞盒，一落地就被卡住不能动，所以落地前先螺旋找最近的
      空位；b) pointerdown 里任务标记的命中区只有 30 像素、只认气泡
      与名牌本身——命中区若太大，点标记附近的地面总被它“抢走”，
      玩家会莫名其妙被拉向标记。
   3) 满屏的 arc(x, y, r, 0, 7)：一整圈是 2π≈6.28 弧度，结尾写 7
      是偷懒的“画满圆”（多出来的角度画不出东西）。
   ================================================================ */

/* ---------- 头像绘制（世界/对话/图鉴通用） ---------- */
/* 画一个 Q 版小人：p 是人物数据（主要读 p.look 里的发型/眼镜等外
   观字段），(cx, cy) 是小人脚底中心的位置，s 是身高像素。第一个
   参数收 ctx（画笔），所以世界、对话头像、小游戏都能借它画到各自
   的画布上。`p.look || {}`：|| 在此当“取不到就用备胎”，防止没有
   外观数据时读 undefined 的属性直接报错。 */
function drawAvatar(ctx, p, cx, cy, s) {
  const L = p.look || {};
  const hair = L.hair || '#2a2620';
  const skin = '#f2d6b3';
  /* save/restore 成对使用：先“存档”当前画笔状态，再 translate 把
     坐标原点挪到小人脚下（此后坐标都相对小人自己），画完“读档”
     还原，不污染外面的坐标系——Canvas 局部绘制的标准套路 */
  ctx.save();
  ctx.translate(cx, cy);
  const u = s / 64; // 基准 64
  // 影
  ctx.fillStyle = 'rgba(30,26,16,.18)';
  ctx.beginPath(); ctx.ellipse(0, 30 * u, 20 * u, 7 * u, 0, 0, 7); ctx.fill();
  // 身体（制服色）
  // 嵌套三目相当于一串 if-else：主角/校长/老师有专属制服色，其余按班级配色
  const body = p.role === 'x' ? '#f4efe2' : p.role === 'p' ? '#3a352c' : p.role === 't' ? '#5a4a38'
    : p.cls === '6' ? '#41608c' : p.cls === '7' ? '#3e7a5e' : '#7a5f8a';
  ctx.fillStyle = body;
  roundRect(ctx, -14 * u, 8 * u, 28 * u, 26 * u, 10 * u); ctx.fill();
  if (p.role === 'x') { ctx.fillStyle = '#b8432f'; roundRect(ctx, -12 * u, 8 * u, 24 * u, 7 * u, 4 * u); ctx.fill(); }
  // 头
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, -6 * u, 15 * u, 0, 7); ctx.fill();
  // 发型
  ctx.fillStyle = hair;
  // 发型分发：st 依次与各发型比对，全不中就走最后的 else（即默认短发）
  const st = L.style || 'short';
  if (st === 'bald') { ctx.beginPath(); ctx.arc(0, -8 * u, 13.5 * u, Math.PI, 0); ctx.fill(); }
  else if (st === 'long') { roundRect(ctx, -15 * u, -20 * u, 30 * u, 26 * u, 12 * u); ctx.fill(); ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(0, -5 * u, 12.5 * u, 0, 7); ctx.fill(); ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(0, -9 * u, 13 * u, Math.PI * 0.95, Math.PI * 2.05); ctx.fill(); }
  else if (st === 'bob') { ctx.beginPath(); ctx.arc(0, -6 * u, 15.5 * u, Math.PI * 0.9, Math.PI * 2.1); ctx.fill(); roundRect(ctx, -16 * u, -8 * u, 32 * u, 8 * u, 4 * u); ctx.fill(); }
  else if (st === 'bun') { ctx.beginPath(); ctx.arc(0, -9 * u, 14 * u, Math.PI, 0); ctx.fill(); ctx.beginPath(); ctx.arc(0, -22 * u, 6.5 * u, 0, 7); ctx.fill(); }
  else if (st === 'buzz') { ctx.fillStyle = hair + 'cc'; ctx.beginPath(); ctx.arc(0, -8 * u, 14 * u, Math.PI, 0); ctx.fill(); }
  else if (st === 'spiky') { ctx.beginPath(); ctx.arc(0, -7 * u, 14.5 * u, Math.PI, 0); ctx.fill(); for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * 5 * u, -18 * u); ctx.lineTo(i * 5 * u + 2 * u, -25 * u); ctx.lineTo(i * 5 * u + 5 * u, -17 * u); ctx.fill(); } }
  else if (st === 'messy') { ctx.beginPath(); ctx.arc(0, -8 * u, 14.5 * u, Math.PI * 0.9, Math.PI * 2.05); ctx.fill(); ctx.beginPath(); ctx.arc(-8 * u, -20 * u, 5 * u, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(7 * u, -21 * u, 4 * u, 0, 7); ctx.fill(); }
  else if (st === 'flat') { roundRect(ctx, -14 * u, -20 * u, 28 * u, 12 * u, 3 * u); ctx.fill(); }
  else { ctx.beginPath(); ctx.arc(0, -7 * u, 14.5 * u, Math.PI * 0.92, Math.PI * 2.08); ctx.fill(); }
  // 眼镜
  if (L.glasses) { ctx.strokeStyle = '#4a4438'; ctx.lineWidth = 1.6 * u; ctx.beginPath(); ctx.arc(-5.5 * u, -4 * u, 4.5 * u, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(5.5 * u, -4 * u, 4.5 * u, 0, 7); ctx.stroke(); }
  // 眼
  ctx.fillStyle = '#2c2820';
  ctx.beginPath(); ctx.arc(-5 * u, -4 * u, 1.7 * u, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(5 * u, -4 * u, 1.7 * u, 0, 7); ctx.fill();
  // 随身标识
  if (L.acc) { ctx.font = `${15 * u}px sans-serif`; ctx.textAlign = 'center'; ctx.fillText(L.acc, 19 * u, -12 * u); }
  ctx.restore();
}
/* 画圆角矩形路径（只描路径不上色，调用方随后自己 fill/stroke）。
   arcTo 用四段圆弧把四个角抹圆；第一行先把 r 夹到不超过边长一半，
   防止半径比矩形还大时画出现怪图形。它是顶层 function 声明，
   本文件的道具/名牌和 minigames.js 的按钮都在用它。 */
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------- 世界 ---------- */
/* World 是一个 IIFE（立即执行函数表达式）：定义完马上执行一次，
   return 出去的对象才是外界能摸到的接口；cv、player、npcs 这些变量
   被关在闭包里当私有状态，外部只能通过接口方法间接读写——这是没有
   模块系统的年代最朴素的“模块”写法，作用类似 Python 里整个 .py 文件。 */
const World = (() => {
  // $ 是 config.js 的 DOM 查询工具（按 CSS 选择器找元素），#world 是
  // index.html 里铺满窗口的 <canvas>；getContext('2d') 拿到“画笔”，
  // 之后所有绘制都通过它进行
  const cv = $('#world');
  const ctx = cv.getContext('2d');
  let scene = null, sceneId = '';
  // player：主角状态。path 是待走的路径点队列（点地面后由寻路填入），speed 单位是“像素/秒”
  let player = { x: 200, y: 300, path: [], speed: 230 };
  // cam：相机。x/y 是镜头中心对准的世界坐标，scale 是缩放倍率
  let cam = { x: 0, y: 0, scale: 1 };
  let npcs = [];       // {p, x, y, busy}
  let doorCd = 0;      // 进门冷却
  let t0 = performance.now();
  // keys：键盘按下状态表，键名是 e.key（如 'w'、'ArrowLeft'），值为 true/false
  let keys = {};
  let onCtx = null;    // (ctxObj|null) 邻近交互回调
  // near：玩家此刻“够得着”的可交互对象（事件/NPC/任务/门），一旦变化就回调 onCtx 刷新交互条
  let near = null;

  /* ---- 网格与寻路 ---- */
  /* 寻路思路：把场景切成 T×T（40 像素）的方格，1=可走、0=被道具占住。
     点地面时先算出一条格子序列，主角沿着格子中心走——比逐像素判碰撞
     省事得多，也保证永远不会一头扎进桌子 */
  const T = 40;
  let grid = null, gw = 0, gh = 0;
  /* 把场景里的道具“盖章”到网格上：道具占到的格子一律记 0。
     window/track/mat/board（窗、跑道、垫子、黑板）是贴墙或贴地的
     装饰，人要能从跟前走过，所以豁免、不入网格 */
  function buildGrid() {
    gw = Math.ceil(scene.w / T); gh = Math.ceil(scene.h / T);
    grid = Array.from({ length: gh }, () => Array(gw).fill(1));
    scene.props.forEach(pr => {
      if (pr.t === 'window' || pr.t === 'track' || pr.t === 'mat' || pr.t === 'board') return;
      const x0 = Math.max(0, Math.floor(pr.x / T)), x1 = Math.min(gw - 1, Math.floor((pr.x + pr.w - 1) / T));
      const y0 = Math.max(0, Math.floor(pr.y / T)), y1 = Math.min(gh - 1, Math.floor((pr.y + pr.h - 1) / T));
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) grid[y][x] = 0;
    });
  }
  // 判断世界坐标 (x, y) 所在的格子能不能走：先换算成格子下标，再查表
  function walk(x, y) { const gx = Math.floor(x / T), gy = Math.floor(y / T); return gx >= 0 && gy >= 0 && gx < gw && gy < gh && grid[gy][gx] === 1; }
  /* BFS（广度优先搜索）寻路：从起点一格一格向外“水波式扩散”，第一
     次摸到终点的那条路线必然步数最少。prev 这个 Map 记录“我这格是
     从哪格走过来的”，到终点后顺着 prev 一路回溯，就能拼出完整路径 */
  function bfsPath(sx, sy, tx, ty) {
    const s = [Math.floor(sx / T), Math.floor(sy / T)], t = [Math.floor(tx / T), Math.floor(ty / T)];
    if (!walk(t[0] * T + 20, t[1] * T + 20)) { // 目标不可走则找邻近
      // 暴力扫全图，取离目标最近的可走格当新目标（1e9 即 10 亿，当“无穷大”初值用）
      let best = null, bd = 1e9;
      for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) if (grid[y][x]) {
        const d = (x - t[0]) ** 2 + (y - t[1]) ** 2; if (d < bd) { bd = d; best = [x, y]; }
      }
      if (!best) return null; t[0] = best[0]; t[1] = best[1];
    }
    // 二维下标压成一维编号 (x, y) → y*gw+x：查重、存 Map 都只需一个数字
    const key = (x, y) => y * gw + x;
    const prev = new Map(); const q = [s]; prev.set(key(s[0], s[1]), null);
    // q 当队列用：shift() 取队头（最早入队的先出），正是 BFS 的扩散顺序
    while (q.length) {
      const [x, y] = q.shift();
      if (x === t[0] && y === t[1]) {
        // 到达终点：从终点沿 prev 回溯到起点；unshift 逐个往前插，
        // 最终 path 正好按“从起点到终点”排列，每个点取格子中心
        const path = []; let k = [x, y];
        while (k) { path.unshift({ x: k[0] * T + 20, y: k[1] * T + 20 }); k = prev.get(key(k[0], k[1])); }
        return path;
      }
      // 枚举右/左/下/上四个相邻格：越界或撞墙（≠1）跳过，走过的（prev 已有）跳过
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx, dy]) => {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= gw || ny >= gh || grid[ny][nx] !== 1) return;
        if (prev.has(key(nx, ny))) return;
        prev.set(key(nx, ny), [x, y]); q.push([nx, ny]);
      });
    }
    return null;
  }

  /* ---- NPC 调度 ---- */
  /* 极简字符串哈希：把 id 揉成一个 0~65535 的数。不是加密，只求
     “同一个 id 每次算出来都一样、不同 id 尽量散得开”——这样 NPC
     的站位不用存档，每次进场景都能稳定重现 */
  function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) & 0xffff; return h; }
  /* 给人物 id 挑一个场景里的站位：先从场景 spots 里按哈希取一个
     锚点，再叠加确定性的随机偏移把人散开 */
  function sceneSpot(sceneId2, id) {
    const sc = SCENE_BY_ID[sceneId2]; if (!sc) return [sc ? sc.w / 2 : 300, sc ? sc.h / 2 : 300];
    const spots = Object.values(sc.spots || {});
    if (!spots.length) return [sc.w / 2, sc.h - 120];
    const s = spots[hash(id) % spots.length];
    // 大幅度确定性散开，避免多人挤成一团
    return [
      clamp(s[0] + (hash(id + 'x') % 340) - 170, 80, sc.w - 80),
      clamp(s[1] + (hash(id + 'y') % 120) - 60, 80, sc.h - 90),
    ];
  }
  function placement(p) {
    // 事件优先：把事件角色临时放到事件现场
    for (const ev of Engine.eventsNow()) {
      if (ev.cast.includes(p.id)) return { scene: ev.scene, pos: ev.pos.slice(), busy: true };
    }
    /* 时段（Engine.period）在此**只作氛围调度**（每天随机轮换），不再门控任何玩法：
       它决定 NPC 此刻更像在教室、在食堂还是在走廊，仅此而已。 */
    const per = Engine.period();
    // 第 15 章（番外）开启后，“二中番外四人”（PEOPLE_WAI）固定到校门口候场
    if (G.ch >= 15 && PEOPLE_WAI.some(w => w.id === p.id)) return { scene: 'gate', pos: [700, 300] };
    // 校长：全天蹲办公室的校长位
    if (p.role === 'p') return { scene: 'office', pos: SCENE_BY_ID.office.spots.of_head };
    // 老师：上午/下午有课则去六班讲台，其余回办公室（hanxiao 等有专座）
    if (p.role === 't') {
      if ((per === 'morning' || per === 'aft') && p.cls === '6' && p.id !== 'hanxiao')
        return { scene: 'classroom6', pos: [540, 210] };
      const o = p.id === 'hanxiao' ? SCENE_BY_ID.office.spots.of_hx : p.id === 'chongguo' ? SCENE_BY_ID.office.spots.of_head : [280, 500];
      return { scene: 'office', pos: o };
    }
    // 学生
    // 晚自习回教室；中午约六成学生去食堂（hash 决定，天天一致）；平时待在“家”（默认走廊）
    if (per === 'eve' && (p.cls === '6' || p.cls === '7'))
      return { scene: p.cls === '6' ? 'classroom6' : 'classroom7', pos: sceneSpot(p.cls === '6' ? 'classroom6' : 'classroom7', p.id) };
    if (per === 'noon' && (hash(p.id) % 10) < 6) return { scene: 'canteen', pos: sceneSpot('canteen', p.id) };
    return { scene: p.home || 'corridor', pos: sceneSpot(p.home || 'corridor', p.id) };
  }
  /* 按 placement() 重排全场 NPC，只把“身在当前场景”的留下来。
     切场景、时段切换、事件开演之后都会调它，让众人重新就位 */
  function refreshNPCs() {
    npcs = [];
    PEOPLE.forEach(p => {
      const pl = placement(p);
      if (pl.scene !== sceneId) return;
      npcs.push({ p, x: pl.pos[0], y: pl.pos[1], busy: !!pl.busy });
    });
  }

  /* ---- 场景 ---- */
  /* 落点避让：默认/门口落点可能恰好踩在道具碰撞盒里（曾在走廊长椅、食堂圆桌、
     宿舍柜、办公楼档案柜四处复现"落地即卡死"），故就近找一个能站的位置 */
  function freeSpot(x, y) {
    if (!collides(x, y)) return [x, y];
    // 螺旋找空位：半径从 26 起步、每圈放大 22，每圈均测 16 个方向，
    // 撞见第一个不碰撞的点就用；全都失败则原样返回（极端兜底）
    for (let r = 26; r <= 300; r += 22) {
      for (let a = 0; a < 16; a++) {
        const nx = x + Math.cos(a / 16 * Math.PI * 2) * r;
        const ny = y + Math.sin(a / 16 * Math.PI * 2) * r;
        if (!collides(nx, ny)) return [nx, ny];
      }
    }
    return [x, y];
  }
  /* 进场景总入口：换场景数据 → 重建网格 → 定落点 → 重排 NPC →
     通知各面板刷新。atDoor 是可选落点（从某扇门穿过来时由 doorTarget
     算好传入），不传就落默认位置 */
  function enterScene(id, atDoor) {
    scene = SCENE_BY_ID[id]; sceneId = id;
    // 记入“到访过”清单（探索度/成就类玩法用），并记下最后所在场景供读档恢复
    if (!G.flags.visitedScenes.includes(id)) G.flags.visitedScenes.push(id);
    G.flags.lastScene = id;
    buildGrid();
    let sx, sy;
    if (atDoor) { sx = clamp(atDoor[0], 40, scene.w - 40); sy = clamp(atDoor[1], 40, scene.h - 40); }
    else { sx = scene.w / 2; sy = scene.h - 110; }
    // freeSpot 兜底：落点若恰好撞进道具碰撞盒，就近挪到能站的位置（见上方 freeSpot 注释）
    const sp = freeSpot(sx, sy);
    player.x = sp[0]; player.y = sp[1];
    player.path = [];
    refreshNPCs();
    // 进场景可能改变“可去之处/传闻/任务”的显示，把相关面板都刷一遍
    UI.renderPlaces();
    UI.renderHearsay();
    // 跨文件判活惯用法：Quests 定义在后面的文件里，先用 typeof 探一探，
    // 没加载就安静跳过，绝不会抛 ReferenceError（裸名直接比较会炸）
    if (typeof Quests !== 'undefined') Quests.render();
  }
  /* 算“穿过这扇门后落在对面哪里”：在对面场景找一扇通回本场景的门，
     落在它下方 34 像素处——两个场景的门因此互相对得上，来回穿不迷路 */
  function doorTarget(d) {
    const sc = SCENE_BY_ID[d.to];
    // 落点：对面场景的某扇回到本场景的门旁
    const back = sc.doors.find(dd => dd.to === sceneId);
    if (back) return [back.x + back.w / 2, back.y + back.h + 34];
    return [sc.w / 2, sc.h - 110];
  }

  /* ---- 绘制 ---- */
  /* 画一个道具：按 pr.t（道具类型）用基础图形拼装简笔画。先设
     fillStyle 再画形状；多数配方按“阴影 → 底色 → 高光”三层叠加，
     两三个矩形就能叠出立体感 */
  function drawProp(pr) {
    const c = ctx;
    // 局部小工具：在道具下方写一行灰色小字（很多 case 的末尾调用它）
    const label = f => { if (pr.label) { c.fillStyle = 'rgba(60,55,40,.55)'; c.font = '10px sans-serif'; c.textAlign = 'center'; c.fillText(pr.label, pr.x + pr.w / 2, pr.y + pr.h + 12); } };
    switch (pr.t) {
      case 'wall': c.fillStyle = '#8d8371'; roundRect(c, pr.x, pr.y, pr.w, pr.h, 4); c.fill(); break;
      case 'desk': case 'longtable': case 'table': {
        c.fillStyle = 'rgba(30,26,16,.10)'; roundRect(c, pr.x + 3, pr.y + 5, pr.w, pr.h, 8); c.fill();
        c.fillStyle = pr.t === 'desk' ? '#c9b389' : '#b89d72'; roundRect(c, pr.x, pr.y, pr.w, pr.h, 8); c.fill();
        c.fillStyle = 'rgba(255,255,255,.25)'; roundRect(c, pr.x + 3, pr.y + 3, pr.w - 6, pr.h * 0.35, 6); c.fill();
        label(); break; }
      case 'round': {
        c.fillStyle = 'rgba(30,26,16,.10)'; c.beginPath(); c.ellipse(pr.x + pr.w / 2 + 3, pr.y + pr.h / 2 + 5, pr.w / 2, pr.h / 2, 0, 0, 7); c.fill();
        c.fillStyle = '#b89d72'; c.beginPath(); c.ellipse(pr.x + pr.w / 2, pr.y + pr.h / 2, pr.w / 2, pr.h / 2, 0, 0, 7); c.fill();
        c.fillStyle = 'rgba(255,255,255,.25)'; c.beginPath(); c.ellipse(pr.x + pr.w / 2, pr.y + pr.h / 2 - 6, pr.w / 2.6, pr.h / 4, 0, 0, 7); c.fill(); break; }
      case 'bookshelf': case 'shelf': {
        c.fillStyle = pr.t === 'bookshelf' ? '#7a5f40' : '#9a8a6a'; roundRect(c, pr.x, pr.y, pr.w, pr.h, 6); c.fill();
        const cols = ['#b8432f', '#3e7a5e', '#41608c', '#a8842c'];
        for (let i = 0; i < 4; i++) { c.fillStyle = cols[(i + pr.x) % 4]; c.fillRect(pr.x + 6 + i * (pr.w - 12) / 4 + 2, pr.y + 8, (pr.w - 12) / 4 - 4, pr.h * 0.4); }
        c.fillStyle = 'rgba(0,0,0,.15)'; c.fillRect(pr.x + 4, pr.y + pr.h * 0.52, pr.w - 8, 3); label(); break; }
      case 'board': c.fillStyle = '#3f4a3c'; roundRect(c, pr.x, pr.y, pr.w, pr.h, 8); c.fill();
        c.strokeStyle = '#8d6b4a'; c.lineWidth = 4; roundRect(c, pr.x, pr.y, pr.w, pr.h, 8); c.stroke();
        c.fillStyle = 'rgba(255,255,255,.5)'; c.font = '12px serif'; c.textAlign = 'center';
        c.fillText('温故而知新', pr.x + pr.w / 2, pr.y + pr.h / 2 + 4); break;
      case 'podium': c.fillStyle = '#8d6b4a'; roundRect(c, pr.x, pr.y, pr.w, pr.h, 6); c.fill(); label(); break;
      case 'window': c.fillStyle = '#bcd6e2'; roundRect(c, pr.x, pr.y, pr.w, pr.h, 4); c.fill();
        c.strokeStyle = '#ffffff88'; c.lineWidth = 2; c.strokeRect(pr.x + 2, pr.y + 2, pr.w - 4, pr.h - 4); break;
      case 'bunk': c.fillStyle = '#a08a64'; roundRect(c, pr.x, pr.y, pr.w, pr.h, 8); c.fill();
        c.fillStyle = '#e8e0cc'; roundRect(c, pr.x + 6, pr.y + 6, pr.w * 0.3, pr.h - 12, 6); c.fill();
        c.fillStyle = '#6b84a0'; roundRect(c, pr.x + pr.w * 0.38, pr.y + 6, pr.w * 0.56, pr.h - 12, 6); c.fill(); label(); break;
      case 'locker': c.fillStyle = '#9aa4ac'; roundRect(c, pr.x, pr.y, pr.w, pr.h, 6); c.fill();
        c.strokeStyle = 'rgba(0,0,0,.2)'; c.lineWidth = 1.5;
        for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(pr.x + 4, pr.y + i * pr.h / 4); c.lineTo(pr.x + pr.w - 4, pr.y + i * pr.h / 4); c.stroke(); } label(); break;
      case 'fan': c.fillStyle = '#7d8892'; c.beginPath(); c.arc(pr.x + 25, pr.y + 25, 22, 0, 7); c.fill();
        // 叶片角度直接用当前时间算——“拿时间当参数”是最省事的物件动画
        c.fillStyle = '#cfd6dc';
        for (let i = 0; i < 3; i++) { c.beginPath(); c.ellipse(pr.x + 25, pr.y + 25, 16, 5, i * 2.09 + performance.now() / 300, 0, 7); c.fill(); }
        c.fillStyle = '#5a646e'; c.beginPath(); c.arc(pr.x + 25, pr.y + 25, 4, 0, 7); c.fill(); break;
      case 'tree': c.fillStyle = '#7a5a3a'; c.fillRect(pr.x + pr.w / 2 - 5, pr.y + pr.h * 0.5, 10, pr.h * 0.5);
        c.fillStyle = '#5d8a5a'; c.beginPath(); c.arc(pr.x + pr.w / 2, pr.y + pr.h * 0.38, pr.w / 2, 0, 7); c.fill();
        c.fillStyle = '#6f9a68'; c.beginPath(); c.arc(pr.x + pr.w / 2 - 8, pr.y + pr.h * 0.3, pr.w / 3.2, 0, 7); c.fill(); break;
      case 'plant': c.fillStyle = '#b0653a'; roundRect(c, pr.x + 8, pr.y + pr.h - 16, 24, 16, 4); c.fill();
        c.fillStyle = '#5d8a5a'; c.beginPath(); c.arc(pr.x + 20, pr.y + 12, 13, 0, 7); c.fill();
        c.fillStyle = '#6f9a68'; c.beginPath(); c.arc(pr.x + 13, pr.y + 8, 8, 0, 7); c.fill(); break;
      case 'track': c.strokeStyle = '#c47a54'; c.lineWidth = 26; c.beginPath();
        c.ellipse(pr.x + pr.w / 2, pr.y + pr.h / 2, pr.w / 2 - 13, pr.h / 2 - 13, 0, 0, 7); c.stroke();
        c.fillStyle = '#b8d48a'; c.beginPath(); c.ellipse(pr.x + pr.w / 2, pr.y + pr.h / 2, pr.w / 2 - 34, pr.h / 2 - 34, 0, 0, 7); c.fill(); break;
      case 'basket': c.strokeStyle = '#6a6458'; c.lineWidth = 5; c.beginPath(); c.moveTo(pr.x + pr.w / 2, pr.y + pr.h); c.lineTo(pr.x + pr.w / 2, pr.y); c.stroke();
        c.fillStyle = '#e8e2d4'; roundRect(c, pr.x - 8, pr.y - 14, pr.w + 16, 22, 4); c.fill(); break;
      case 'pingpong': c.fillStyle = '#3e7a5e'; roundRect(c, pr.x, pr.y, pr.w, pr.h, 6); c.fill();
        c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.moveTo(pr.x + pr.w / 2, pr.y); c.lineTo(pr.x + pr.w / 2, pr.y + pr.h); c.stroke();
        c.strokeStyle = '#ffffffaa'; c.beginPath(); c.moveTo(pr.x + pr.w / 2, pr.y - 6); c.lineTo(pr.x + pr.w / 2, pr.y + pr.h + 6); c.stroke(); label(); break;
      case 'counter': c.fillStyle = '#a99a78'; roundRect(c, pr.x, pr.y, pr.w, pr.h, 8); c.fill();
        c.fillStyle = '#cbb98e'; roundRect(c, pr.x, pr.y, pr.w, 12, 6); c.fill(); label(); break;
      case 'sofa': c.fillStyle = '#7a6a8a'; roundRect(c, pr.x, pr.y, pr.w, pr.h, 14); c.fill(); label(); break;
      case 'pc': c.fillStyle = '#b89d72'; roundRect(c, pr.x, pr.y + pr.h - 18, pr.w, 18, 4); c.fill();
        c.fillStyle = '#3a3f46'; roundRect(c, pr.x + 8, pr.y, pr.w - 16, pr.h - 22, 4); c.fill();
        c.fillStyle = '#7ec8e0'; roundRect(c, pr.x + 12, pr.y + 4, pr.w - 24, pr.h - 32, 2); c.fill(); break;
      case 'machine': c.fillStyle = '#aab4bc'; roundRect(c, pr.x, pr.y, pr.w, pr.h, 8); c.fill();
        c.fillStyle = 'rgba(255,255,255,.4)'; roundRect(c, pr.x + 6, pr.y + 6, pr.w - 12, pr.h * 0.3, 4); c.fill(); label(); break;
      case 'mat': c.fillStyle = '#c5c0a8'; for (let i = 0; i < 3; i++) { roundRect(c, pr.x + i * (pr.w / 3) + 4, pr.y, pr.w / 3 - 8, pr.h, 10); c.fill(); } break;
      case 'gate': c.fillStyle = '#8d6b4a'; roundRect(c, pr.x, pr.y, pr.w, pr.h, 10); c.fill();
        c.fillStyle = '#f0e9d6'; c.font = 'bold 26px serif'; c.textAlign = 'center';
        c.fillText('实验', pr.x + pr.w / 2, pr.y + pr.h / 2 + 9); break;
      case 'bench': c.fillStyle = '#a08a64'; roundRect(c, pr.x, pr.y, pr.w, pr.h, 8); c.fill(); label(); break;
    }
  }

  /* 每帧一次的全量重画（世界的心脏）：适配窗口 → 摆相机 → 画地板/
     边墙/道具/门/热点/任务标记 → 人和 NPC 按 y 排序绘制 → 叠时段
     色调与暗角。上一帧的残影不用擦：整个画布每帧都被盖掉重画 */
  function draw() {
    const now = performance.now();
    const dpr = window.devicePixelRatio || 1;
    const vw = window.innerWidth, vh = window.innerHeight;
    // 高分屏适配：物理像素 = CSS 像素 × dpr。canvas 内部分辨率跟着窗口
    // 走；setTransform 让之后的绘制仍按 CSS 像素计数，图形在 Retina 屏
    // 上才不会发虚。窗口尺寸变了就顺手改画布大小
    if (cv.width !== vw * dpr || cv.height !== vh * dpr) { cv.width = vw * dpr; cv.height = vh * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // 相机
    // 期望缩放随窗口高度走（夹在 0.72~1.5，太小看不清、太大看不全），
    // lerp 让缩放平滑过渡；cx/cy 是“想对准”的镜头中心，clamp 保证
    // 镜头不出场景边界（四周不露黑）；cam.x/y 再逐帧靠近目标，就是
    // “慢慢跟上”的跟随手感
    const targetScale = clamp(vh / 620, 0.72, 1.5);
    cam.scale = lerp(cam.scale || targetScale, targetScale, 0.1);
    const vw2 = vw / cam.scale, vh2 = vh / cam.scale;
    const cx = clamp(player.x, vw2 / 2, Math.max(vw2 / 2, scene.w - vw2 / 2));
    const cy = clamp(player.y, vh2 / 2, Math.max(vh2 / 2, scene.h - vh2 / 2));
    cam.x = lerp(cam.x, cx, 0.12); cam.y = lerp(cam.y, cy, 0.12);
    // 背景
    ctx.fillStyle = '#111'; ctx.fillRect(0, 0, vw, vh);
    // 把画布原点挪到镜头左上角：先 scale（缩放）再 translate（平移），
    // 之后一律用“世界坐标”作画——相机怎么动都不用改绘制代码
    ctx.save();
    ctx.scale(cam.scale, cam.scale);
    ctx.translate(vw2 / 2 - cam.x, vh2 / 2 - cam.y);
    // 地板
    ctx.fillStyle = scene.floor; ctx.fillRect(0, 0, scene.w, scene.h);
    ctx.fillStyle = 'rgba(60,55,40,.05)';
    for (let x = 0; x < scene.w; x += 80) ctx.fillRect(x, 0, 1, scene.h);
    for (let y = 0; y < scene.h; y += 80) ctx.fillRect(0, y, scene.w, 1);
    // 边墙
    ctx.fillStyle = '#6e6553';
    ctx.fillRect(0, 0, scene.w, 12); ctx.fillRect(0, scene.h - 12, scene.w, 12);
    ctx.fillRect(0, 0, 12, scene.h); ctx.fillRect(scene.w - 12, 0, 12, scene.h);
    scene.props.forEach(drawProp);
    // 门
    scene.doors.forEach(d => {
      ctx.fillStyle = 'rgba(184,67,47,.16)';
      roundRect(ctx, d.x, d.y, d.w, d.h, 8); ctx.fill();
      ctx.strokeStyle = 'rgba(184,67,47,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = 'rgba(90,50,35,.85)'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(d.label, d.x + d.w / 2, d.y + d.h / 2 + 4);
    });
    // 热点
    Engine.eventsNow().forEach(ev => {
      if (ev.scene !== sceneId) return;
      const bob = Math.sin(now / 300 + ev.pos[0]) * 4;
      ctx.fillStyle = '#b8432f';
      ctx.beginPath(); ctx.arc(ev.pos[0], ev.pos[1] - 46 + bob, 13, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 16px serif'; ctx.textAlign = 'center';
      ctx.fillText('记', ev.pos[0], ev.pos[1] - 41 + bob);
      ctx.fillStyle = 'rgba(40,30,20,.75)'; roundRect(ctx, ev.pos[0] - 34, ev.pos[1] - 26, 68, 20, 10); ctx.fill();
      ctx.fillStyle = '#f3efe4'; ctx.font = '11px sans-serif';
      ctx.fillText(ev.name, ev.pos[0], ev.pos[1] - 12);
    });
    // 任务标记（主线「令」／支线「刀」）
    if (typeof Quests !== 'undefined') {
      Quests.markers().forEach(mk => {
        if (mk.q.where !== sceneId) return;
        const mp = mk.dpos || mk.q.pos;
        // bob：随时间上下浮动的偏移，让标记像悬浮的气球；主线「令」金色、支线「刀」绿色
        const bob = Math.sin(now / 320 + mp[1]) * 4;
        const col = mk.main ? '#a8842c' : '#3e7a5e';
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(mp[0], mp[1] - 52 + bob, 14, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(mp[0], mp[1] - 52 + bob, 14, 0, 7); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 16px serif'; ctx.textAlign = 'center';
        ctx.fillText(mk.main ? '令' : '刀', mp[0], mp[1] - 46 + bob);
        ctx.fillStyle = 'rgba(40,30,20,.78)'; roundRect(ctx, mp[0] - 46, mp[1] - 32, 92, 20, 10); ctx.fill();
        ctx.fillStyle = '#f3efe4'; ctx.font = '11px sans-serif';
        ctx.fillText(mk.q.name, mp[0], mp[1] - 18);
      });
    }
    // NPC
    // 画家算法：把人和 NPC 放一起按 y 从小到大排（y 大 = 更靠下 = 离
    // 镜头近），从远到近地画，站位重叠时才有“前面的人挡住后面的人”
    const sortables = npcs.map(n => ({ y: n.y, draw: () => drawNPC(n, now) }));
    sortables.push({ y: player.y, draw: () => drawPlayer(now) });
    sortables.sort((a, b) => a.y - b.y).forEach(o => o.draw());
    ctx.restore();
    // 时段氛围（纯视觉：晨光/午后/夜色，无玩法含义）
    const per = Engine.period();
    if (per === 'morning') { ctx.fillStyle = 'rgba(255,190,120,.10)'; ctx.fillRect(0, 0, vw, vh); }
    else if (per === 'aft') { ctx.fillStyle = 'rgba(255,215,150,.07)'; ctx.fillRect(0, 0, vw, vh); }
    else if (per === 'eve') { ctx.fillStyle = 'rgba(18,22,48,.34)'; ctx.fillRect(0, 0, vw, vh); }
    // 暗角
    // 径向渐变从透明到半透明黑：四周变暗、中心透亮，把视线聚到画面中间
    const g = ctx.createRadialGradient(vw / 2, vh / 2, vh * 0.4, vw / 2, vh / 2, vh * 0.95);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(20,15,5,.22)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh);
  }
  /* 画一个 NPC：save+translate 挪到对方脚下，先画人再画头顶名牌。
     measureText 量出名字的实际宽度，名牌长短跟着文字走 */
  function drawNPC(n, now) {
    // sin 波让每个人轻轻“呼吸”；加上 n.x 当相位，各人起伏错开不同步
    const bob = Math.sin(now / 450 + n.x) * 1.5;
    ctx.save(); ctx.translate(n.x, n.y + bob);
    drawAvatar(ctx, n.p, 0, 0, 56);
    if (n.busy) { // 事件人物头上有笔墨提示
      ctx.fillStyle = '#b8432f'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('◆', 20, -34);
    }
    // 名牌
    const name = n.p.hao || n.p.name;
    ctx.font = '11px sans-serif';
    const w = ctx.measureText(name).width + 14;
    ctx.fillStyle = 'rgba(252,250,244,.82)'; roundRect(ctx, -w / 2, -44, w, 18, 9); ctx.fill();
    ctx.fillStyle = '#403a2e'; ctx.textAlign = 'center'; ctx.fillText(name, 0, -31);
    ctx.restore();
  }
  /* 画主角：与 drawNPC 同一套路（save/translate 局部坐标系）。走路时
     （path 非空）bob 摆幅更大，看起来在迈步；白衫、朱砂围巾和手里的
     笔是主角的视觉标识，名牌底色也用主角专属的朱红 */
  function drawPlayer(now) {
    ctx.save(); ctx.translate(player.x, player.y);
    const bob = Math.sin(now / 160) * (player.path.length ? 2.2 : 1);
    ctx.translate(0, bob * 0.4);
    // 主角：白衫 + 朱砂围巾
    ctx.fillStyle = 'rgba(30,26,16,.2)'; ctx.beginPath(); ctx.ellipse(0, 30, 20, 7, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#f4efe2'; roundRect(ctx, -14, 8, 28, 26, 10); ctx.fill();
    ctx.fillStyle = '#b8432f'; roundRect(ctx, -12, 8, 24, 8, 5); ctx.fill();
    ctx.fillStyle = '#f2d6b3'; ctx.beginPath(); ctx.arc(0, -6, 15, 0, 7); ctx.fill();
    ctx.fillStyle = '#1c1812'; roundRect(ctx, -14, -20, 28, 11, 4); ctx.fill();
    ctx.fillStyle = '#2c2820';
    ctx.beginPath(); ctx.arc(-5, -4, 1.7, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -4, 1.7, 0, 7); ctx.fill();
    // 手中笔
    ctx.strokeStyle = '#26241f'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(16, 14); ctx.lineTo(23, 4); ctx.stroke();
    ctx.fillStyle = '#b8432f'; ctx.beginPath(); ctx.arc(23.6, 3, 2.2, 0, 7); ctx.fill();
    const name = '音克思';
    ctx.font = '11px sans-serif';
    const w = ctx.measureText(name).width + 14;
    ctx.fillStyle = 'rgba(184,67,47,.92)'; roundRect(ctx, -w / 2, -44, w, 18, 9); ctx.fill();
    ctx.fillStyle = '#fff6f0'; ctx.textAlign = 'center'; ctx.fillText(name, 0, -31);
    ctx.restore();
  }

  /* ---- 移动 ---- */
  /* 主角每帧的位移：键盘有输入就按方向走（并清空点击路径，两套输入
     不打架）；没按键盘才沿寻路队列逐点走。末尾顺带做“是否踩到门”
     的检测（有冷却，防止两个场景来回横跳） */
  function tickMove(dt) {
    // 键盘优先
    // 布尔值参与加减会变成 1/0：两行算出水平/垂直方向（-1/0/1）。
    // 再用 Math.hypot 求向量长度做归一化——斜着走不会比直走更快
    let kx = (keys.d || keys.ArrowRight ? 1 : 0) - (keys.a || keys.ArrowLeft ? 1 : 0);
    let ky = (keys.s || keys.ArrowDown ? 1 : 0) - (keys.w || keys.ArrowUp ? 1 : 0);
    if (kx || ky) {
      player.path = [];
      const len = Math.hypot(kx, ky) || 1;
      tryMove(kx / len * player.speed * dt, ky / len * player.speed * dt);
    } else if (player.path.length) {
      // 沿路径走：离当前路点不足 6 像素就算到达（shift 弃掉它），否则朝它挪
      const t = player.path[0];
      const dx = t.x - player.x, dy = t.y - player.y, d = Math.hypot(dx, dy);
      if (d < 6) player.path.shift();
      else tryMove(dx / d * player.speed * dt, dy / d * player.speed * dt);
    }
    // 门检测
    // doorCd 是进门冷却（秒）：刚穿门后 0.5 秒内不再检测，
    // 防止站在门边被相邻两扇门“弹来弹去”
    if (doorCd > 0) doorCd -= dt;
    else {
      // 找玩家所站的门（判定框比门四周各大 6 像素，好踩上去）；校长室走专属分支
      const d = scene.doors.find(d => player.x > d.x - 6 && player.x < d.x + d.w + 6 && player.y > d.y - 6 && player.y < d.y + d.h + 6);
      if (d) {
        Sfx.page();
        const at = doorTarget(d);
        if (d.inner && d.zone === 'principal') { enterScene('office', at); doorCd = 0.5; UI.toastScene('校长室'); }
        else { enterScene(d.to, at); doorCd = 0.5; UI.toastScene(SCENE_BY_ID[d.to].name); }
      }
    }
  }
  /* 点 (x, y) 能不能站：先查是否出界（四周留 26 像素），再逐个道具
     查矩形重叠（留 12/10 像素余量，碰撞盒比画面稍大一圈，手感更稳）。
     window/track/mat/board 与寻路网格口径一致地豁免 */
  function collides(x, y) {
    if (x < 26 || y < 26 || x > scene.w - 26 || y > scene.h - 26) return true;
    for (const pr of scene.props) {
      if (['window', 'track', 'mat', 'board'].includes(pr.t)) continue;
      if (x > pr.x - 12 && x < pr.x + pr.w + 12 && y > pr.y - 10 && y < pr.y + pr.h + 12) return true;
    }
    return false;
  }
  /* 分轴移动：x、y 各自试探，哪根轴撞了就只废掉那半步。贴着墙走会
     “滑过去”而不是原地卡死——2D 游戏最经典的碰撞小技巧 */
  function tryMove(dx, dy) {
    if (!collides(player.x + dx, player.y)) player.x += dx;
    if (!collides(player.x, player.y + dy)) player.y += dy;
  }

  /* ---- 输入 ---- */
  /* 屏幕坐标 → 世界坐标：draw 里相机做的是“先 scale 再 translate”，
     这里做逆运算（除回缩放、减回平移），点击才能点准世界里的点 */
  function toWorld(mx, my) {
    const vw2 = window.innerWidth / cam.scale, vh2 = window.innerHeight / cam.scale;
    return { x: (mx / cam.scale) + cam.x - vw2 / 2, y: (my / cam.scale) + cam.y - vh2 / 2 };
  }
  /* 一次点击的“接力赛”：对话/小游戏/战斗进行中时世界让位（直接
     return，一个字符都不处理——BATTLE_ACTIVE 就是战斗层立的那面
     旗子）；否则按 热点事件 → 任务标记 → NPC → 走路 的优先级逐个
     尝试，谁先命中谁消费这次点击，后面的就不再看 */
  cv.addEventListener('pointerdown', e => {
    if (Dialog.active || MG.active || window.BATTLE_ACTIVE) return;
    // getBoundingClientRect 拿 canvas 在页面里的位置和尺寸，
    // 减去左上角偏移才得到“canvas 内部”的点击坐标
    const r = cv.getBoundingClientRect();
    const w = toWorld(e.clientX - r.left, e.clientY - r.top);
    // 热点
    const ev = Engine.eventsNow().find(ev => ev.scene === sceneId && Math.hypot(w.x - ev.pos[0], w.y - ev.pos[1] + 20) < 44);
    if (ev) { Main.onEvent(ev); return; }
    // 任务标记
    if (typeof Quests !== 'undefined') {
      const mk = Quests.markers().find(mk => {
        if (mk.q.where !== sceneId) return false;
        const mp = mk.dpos || mk.q.pos;
        /* 只认气泡与名牌本身（约锚点上 -52 与 -22 两处），
           勿把附近的地面点击抢走（否则会出现"不由自主被拉向标记"） */
        return Math.hypot(w.x - mp[0], w.y - (mp[1] - 37)) < 30;
      });
      if (mk) { Main.onQuest(mk.q); return; }
    }
    // NPC
    const n = npcs.find(n => Math.hypot(w.x - n.x, w.y - n.y + 6) < 36);
    if (n) { Main.onNPC(n.p); return; }
    // 移动
    // 谁都没命中：把点击处当目的地，BFS 算路后交给 tickMove 逐点走。
    // path.shift() 丢掉第一个点——那格就是脚下，不必走
    const path = bfsPath(player.x, player.y, w.x, w.y);
    if (path) { path.shift(); player.path = path; }
  });
  // 键盘按下记 true、松开记 false，凑成“按住持续走、松手就停”。
  // 方向键 preventDefault 掉，防止页面跟着滚动
  window.addEventListener('keydown', e => { keys[e.key] = true; if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault(); });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  /* ---- 主循环 ---- */
  /* 主循环：requestAnimationFrame 请浏览器“下一帧再叫我”（屏幕约每
     秒刷 60 次），游戏的心跳。小游戏或战斗进行中只暂停世界逻辑，
     循环本身继续转——一旦不预约下一帧，就再也没有人来叫醒它了 */
  let last = performance.now();
  function loop() {
    const now = performance.now();
    // dt：这一帧距上一帧的秒数，所有位移都乘它，帧率快慢不影响速度。
    // 夹到 0.05 秒以内，防止切走标签页再回来时角色“瞬移”
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    // 世界可动的前提：场景已加载，且小游戏/战斗都没在占用
    if (scene && !MG.active && !window.BATTLE_ACTIVE) {
      tickMove(dt);
      draw();
      // 邻近检测：事件优先（限时时限，错过不再来），其次 NPC
      let best = null;
      Engine.eventsNow().forEach(ev => { if (ev.scene !== sceneId) return; const d = Math.hypot(ev.pos[0] - player.x, ev.pos[1] - player.y); if (d < 100) best = { type: 'event', ev }; });
      if (!best) {
        let bd = 90;
        npcs.forEach(n => { const d = Math.hypot(n.x - player.x, n.y - player.y); if (d < bd) { bd = d; best = { type: 'npc', p: n.p }; } });
      }
      if (!best && typeof Quests !== 'undefined') {
        const qm = Quests.nearMarker(sceneId, player.x, player.y, 100);
        if (qm) best = { type: 'quest', q: qm.m.q, main: qm.m.main };
      }
      if (!best) {
        const door = scene.doors.find(d => Math.hypot(d.x + d.w / 2 - player.x, d.y + d.h / 2 - player.y) < 70);
        if (door) best = { type: 'door', door };
      }
      // “附近对象”发生变化才回调 onCtx 刷新交互条：JSON.stringify 把
      // 两个对象转成字符串再比相等，是偷懒但够用的深比较
      if ((best && !near) || (!best && near) || (best && near && JSON.stringify(best) !== JSON.stringify(near))) { near = best; onCtx && onCtx(near); }
    }
    requestAnimationFrame(loop);
  }

  /* 对外接口：get 开头的是“只读视图”（外面能读不能改，保护闭包里的
     内部状态）；其余是主流程会调用的动作——walkTo/travel 让 main.js
     远程指挥主角（比如“先走到任务点”），setOnCtx 注册交互条回调 */
  return {
    // getter 写法：像读属性一样用（World.sceneId），实际执行的是这个小函数
    get sceneId() { return sceneId; },
    get playerPos() { return [player.x, player.y]; },
    get active() { return !!scene; },
    enter(id) { enterScene(id); cam.x = player.x; cam.y = player.y; },
    refresh() { if (scene) refreshNPCs(); },
    setOnCtx(f) { onCtx = f; },
    start() { requestAnimationFrame(loop); },
    travel(id) { if (SCENE_BY_ID[id]) { Sfx.page(); enterScene(id); UI.toastScene(SCENE_BY_ID[id].name); } },
    walkTo(x, y) { const p = bfsPath(player.x, player.y, x, y); if (p) { p.shift(); player.path = p; } },
    resetNear() { near = null; },
    npcPos(id) { const n = npcs.find(n => n.p.id === id); return n ? [n.x, n.y] : null; },
    isNearNPC(id) { return npcs.some(n => n.p.id === id && Math.hypot(n.x - player.x, n.y - player.y) < 90); },
    /* 现画一张头像 canvas 交给面板当图片用：内部尺寸按像素密度放大
       保证清晰，style.width/height 再把它显示为请求的 CSS 大小 */
    avatarCanvas(p, size) {
      const c = document.createElement('canvas');
      const d = window.devicePixelRatio || 1;
      c.width = size * d; c.height = size * 1.25 * d;
      c.style.width = size + 'px'; c.style.height = size * 1.25 + 'px';
      const cc = c.getContext('2d'); cc.scale(d, d);
      drawAvatar(cc, p, size / 2, size * 0.56, size * 0.8);
      return c;
    },
  };
})();

</script>
<script>
/* 实验史记·春秋笔 —— 对话系统：剧本播放 / 立绘 / 选项 */
'use strict';
/* ================================================================
   【这个文件是干嘛的】
   世界侧的对话播放器，玩法类似 galgame/视觉小说：把“剧本”（一个数组，
   每项是一句台词/旁白/选项/成就/小游戏）逐条播出，负责打字机效果、
   舞台立绘的亮暗调度、选项分支与奖励结算；播完后通过 onDone 回调
   把控制权交还给调用方（开战、进下一幕等都挂在它后面）。

   【架构位置】
   在 config、data/*、engine、world 之后由 index.html 加载（第 9 个）。
   依赖：$ el（config）、World.avatarCanvas（画像素立绘）、Engine（发成就/
   加好感等）、Sfx、MG（minigames 的小游戏）、Save、flushToasts（config）。
   被 main.js、engine.js（被逮剧情）、quests.js 等调用：
   Dialog.play(剧本, 结束回调)。

   【暴露的全局名】
   MINOR_FIGS（配角立绘配置）、resolveFig（名字 → 立绘数据）、
   Dialog（播放器：play / tap / active / forceFinish）。

   【新手阅读提示】
   1) Dialog 是 IIFE 返回的对象，steps/idx/onDone/active 这些变量藏在
      闭包里成为私有状态，外界只能通过返回的那几个方法操作。
   2) 全文件最值得细读的是 finish()：收尾回调是“幂等 + 320ms 超时兜底”
      的双保险设计，为什么要兜底见 finish() 上方的大段注释。
   ================================================================ */

/* 剧本中出现、但不进入图鉴的师长配角 */
/* 以“名字字符串”为 key 的对象字面量（JS 对象即 Python 的 dict）。
   look 里的发色/发型/小物件会喂给 World.avatarCanvas 画成立绘。 */
const MINOR_FIGS = {
  '为兵':  { name:'为兵',    look:{ hair:'#2a2620', style:'short', glasses:true, acc:'📷' }, role:'t', cls:'7' },
  '钦法':  { name:'钦法',    look:{ hair:'#3a352c', style:'short', acc:'📋' }, role:'t', cls:'t' },
  '晓东':  { name:'晓东',    look:{ hair:'#26221c', style:'short', glasses:true, acc:'📐' }, role:'t', cls:'6' },
  '杨杰':  { name:'杨杰',    look:{ hair:'#4a4438', style:'short', acc:'🔑' }, role:'t', cls:'t' },
  '杨洪波': { name:'杨洪波',  look:{ hair:'#1c1812', style:'spiky', acc:'📢' }, role:'t', cls:'t' },
  '王明虎': { name:'王明虎',  look:{ hair:'#565043', style:'short', acc:'🌏' }, role:'t', cls:'6' },
  '卓本':  { name:'卓本',    look:{ hair:'#221e18', style:'short', acc:'🫓' }, role:'s', cls:'6' },
  '组员们': { name:'组员们',  look:{ hair:'#33302a', style:'short' }, role:'s', cls:'6' },
  '舍友们': { name:'舍友们',  look:{ hair:'#33302a', style:'messy' }, role:'s', cls:'6' },
};
/* 把台词里的 who（人名/称号/“旁白”）解析成立绘数据，查找顺序：
   旁白 → 没有立绘（null）；主角音克思 → 特殊标记 'PLAYER'；
   先按 id 查图鉴人物表 PEOPLE_BY_ID，再按本名或称号扫 PEOPLE 数组，
   最后落到配角表 MINOR_FIGS；都查不到返回 null。 */
function resolveFig(who) {
  if (!who || who === '旁白') return null;
  if (who === '音克思') return 'PLAYER';
  if (PEOPLE_BY_ID[who]) return PEOPLE_BY_ID[who];
  const byName = PEOPLE.find(p => p.name === who || p.hao === who);
  if (byName) return byName;
  if (MINOR_FIGS[who]) return MINOR_FIGS[who];
  return null;
}

/* Dialog 播放器本体：IIFE 返回值被存进 Dialog。
   steps（待播剧本）、idx（播到第几条）、onDone（结束回调）、active（是否在播）
   全部封在闭包里——外界碰不到，只能走下面 return 出口的那几个方法。 */
const Dialog = (() => {
  /* 把要反复操作的 DOM 元素在启动时一次性查好存进局部变量，
     后面直接用，免去每次重复查询。 */
  const root = $('#dialog'), cast = $('#dialog-cast'), box = $('#dialog-box');
  const nameEl = $('#dialog-name'), textEl = $('#dialog-text'), choicesEl = $('#dialog-choices'), nextBtn = $('#dialog-next');
  let steps = [], idx = 0, onDone = null, active = false;
  let typing = false, typeTimer = null, figs = {};
  let stepOver = null; // 选择后的附加处理

  /* 让当前说话者的立绘亮起，其余立绘加 .dim 调暗。
     Object.entries(对象) 把对象转成 [key, value] 数组来遍历，
     相当于 Python 的 dict.items()。 */
  function setFigs(who) {
    const f = resolveFig(who);
    if (!f) return;
    ensureFig(f);
    const key = f === 'PLAYER' ? 'PLAYER' : f.id || f.name;
    Object.entries(figs).forEach(([k, elx]) => elx.classList.toggle('dim', k !== key));
  }
  /* 确保该角色的立绘已在舞台上：没有就现画一个（Canvas 头像 + 名牌）
     插入 cast 容器并缓存进 figs（下次直接复用）。
     舞台最多同时站 3 人，超员就撤掉最早登台的那个——
     Object.keys 返回键的顺序即插入顺序，keys[0] 就是最早的。 */
  function ensureFig(f) {
    const key = f === 'PLAYER' ? 'PLAYER' : f.id || f.name;
    if (figs[key]) return figs[key];
    const figEl = el('div', 'cast-fig');
    const cvs = f === 'PLAYER'
      ? World.avatarCanvas({ look:{ hair:'#1c1812', style:'flat' }, role:'x', cls:'x' }, 190)
      : World.avatarCanvas(f, 190);
    figEl.appendChild(cvs);
    figEl.appendChild(el('div', 'cast-label', f === 'PLAYER' ? '音克思' : (f.hao && f.hao !== f.name ? `${f.name} · ${f.hao}` : f.name)));
    cast.appendChild(figEl);
    figs[key] = figEl;
    const keys = Object.keys(figs);
    if (keys.length > 3) { figs[keys[0]].remove(); delete figs[keys[0]]; }
    return figEl;
  }
  /* 开播前把整份剧本里会出场的角色一次性“预上舞台”并全部调暗。
     不这么做的话，每个角色第一次开口才突然冒出来，画面会一惊一乍。 */
  function preSpawn() {
    steps.forEach(st => {
      if (!st.who || st.who === '旁白') return;
      const f = resolveFig(st.who);
      if (f) ensureFig(f);
    });
    Object.values(figs).forEach(elx => elx.classList.add('dim'));
  }

  /* 播放器的状态机核心：取出当前步骤并 idx++，按步骤类型分派——
     ach=顺手发成就、mg=先玩小游戏（玩完带结果继续）、choice=出选项、
     普通台词=亮立绘 + 打字机。idx 越过末尾（剧本播完）就走 finish()。 */
  function showStep() {
    if (idx >= steps.length) return finish();
    const st = steps[idx++];
    if (st.ach) { Engine.award(st.ach); return showStep(); }
    /* 小游戏步骤：MG.launch 是异步的，第二个参数是“玩完后的回调”。
       结果记在该步骤对象身上且只记第一次（防回调重复触发被覆盖），
       剧本后续步骤可以查看它。 */
    if (st.mg) {
      MG.launch(st.mg, ok => {
        if (st._mgResult == null) st._mgResult = ok;
        showStep();
      });
      return;
    }
    if (st.choice) { renderChoices(st.choice); return; }
    setFigs(st.who);
    nameEl.textContent = st.who === '旁白' ? '——' : st.who;
    nameEl.style.opacity = st.who === '旁白' ? 0.55 : 1;
    typewrite(st.text);
  }

  /* 打字机效果：setInterval 每 26ms 多亮出一个字；玩家在设置里选了
     “风驰”（speed >= 2）就跳过动画整句上屏。
     开新定时器前先 clearInterval 清掉旧的，防止两个定时器抢同一个文本框。 */
  function typewrite(text) {
    typing = true; textEl.classList.add('typing');
    textEl.textContent = '';
    choicesEl.innerHTML = '';
    nextBtn.style.visibility = 'hidden';
    const full = G.settings.speed >= 2 ? '' : text;
    if (!full) { textEl.textContent = text; typing = false; textEl.classList.remove('typing'); nextBtn.style.visibility = 'visible'; return; }
    let i = 0;
    clearInterval(typeTimer);
    typeTimer = setInterval(() => {
      i += 1;
      textEl.textContent = text.slice(0, i);
      if (i >= text.length) { clearInterval(typeTimer); typing = false; textEl.classList.remove('typing'); nextBtn.style.visibility = 'visible'; }
    }, 26);
  }

  /* 点击对话框时：字没打完 → 立刻显示整句（视觉小说的惯例操作）；
     已经打完 → Sfx.tap 音效并推进到下一句。 */
  function completeOrNext() {
    if (!active) return;
    if (typing) { clearInterval(typeTimer); typing = false; textEl.classList.remove('typing');
      const st = steps[idx - 1]; textEl.textContent = st.text; nextBtn.style.visibility = 'visible'; return; }
    Sfx.tap();
    showStep();
  }

  /* 渲染选项分支：每个选项生成一个按钮塞进 choicesEl。
     c.run() 是选项自带的逻辑（常用来掷骰子定成败），可返回 { say: {...} }
     表示“选完后插播一句台词”；favor/rep/wen/money 是点击即结算的资源增减；
     c.fx 是按钮上显示的成功率小字（如“五五之数”）。 */
  function renderChoices(list) {
    textEl.textContent = '（你要——）';
    nextBtn.style.visibility = 'hidden';
    choicesEl.innerHTML = '';
    list.forEach(c => {
      const b = el('button', 'choice-btn');
      b.innerHTML = `${c.t}${c.fx ? `<span class="fx">${c.fx}</span>` : ''}`;
      b.onclick = () => {
        Sfx.tap();
        choicesEl.innerHTML = '';
        nextBtn.style.visibility = 'visible';
        let result = null;
        if (c.run) result = c.run() || null;
        /* Object.entries + forEach：把 { 传主id: 加减值 } 的好感表逐项结算。 */
        if (c.favor) Object.entries(c.favor).forEach(([id, v]) => Engine.addFavor(id, v));
        if (c.rep) Engine.addRep(c.rep);
        if (c.wen) Engine.addWen(c.wen);
        if (c.money) Engine.addMoney(c.money);
        const say = (result && result.say) || c.say;
        /* splice(idx, 0, say)：在待播位置插入插播台词——第二个参数 0
           表示不删除任何元素、只插入，原剧本其余部分顺序不变。 */
        if (say) { steps.splice(idx, 0, say); }
        Save.write();
        showStep();
      };
      choicesEl.appendChild(b);
    });
  }

  /* ============ 本文件最讲究的一处：收尾为什么必须有“兜底” ============
     对话结束时，台词框要播一个“下滑 + 淡出”的弹簧动画，而 onDone 回调
     曾经直接挂在动画的 done 上——等于赌“弹簧动画一定会跑完”。但动画链
     是脆弱的：任何一个别的弹簧回调抛异常把 rAF 循环带停、或浏览器对
     后台标签页限流暂停 rAF，done 就永远不会被调用。一旦 done 丢失：
     onDone 不触发 → Main.afterDialog() 与后续的战后一幕/开战流程全部
     落空，表现就是“对话关了，世界却冻住”。因此改成三重保险：
       1) cleanup 用 fired 标志做幂等：弹簧完成和超时兜底谁先到，
          收尾逻辑都只执行一次，不会重复刷新世界或二次调回调；
       2) try/catch 包住建弹簧：连创建都抛错时立刻手动 cleanup；
       3) setTimeout(cleanup, 320)：与动画完全无关的保底闹钟，
          就算动画压根没跑，320ms 后也强制收尾（正常动画远快于 320ms，
          玩家毫无感知）。
     教训：把“必须发生的业务收尾”寄托在“可能不发生的动画回调”上，
     就必须另备一条与动画无关的退路。 */
  function finish() {
    if (!active) return;
    active = false;
    /* 弹簧只负责视觉滑出；收尾与回调（onDone）必须保证执行，不能被动画链的健康状况拖累。
       之前出现过"对话结束回调丢失 → 后续流程（开战/战后一幕）永远不触发"的隐患。 */
    let fired = false;
    /* 收尾：藏起对话框、清空立绘与样式残留、刷新世界（afterDialog 会
       重刷 HUD/风闻/任务并写存档），最后取出 onDone 调用——
       “cb && cb()”是“有回调才调用”的惯用法，防止空指针。 */
    const cleanup = () => {
      if (fired) return; fired = true;
      root.classList.add('hidden'); cast.innerHTML = ''; figs = {};
      box.style.transform = ''; box.style.opacity = '';
      Main.afterDialog();
      World.resetNear();
      flushToasts();
      const cb = onDone; onDone = null; cb && cb();
    };
    /* 滑出动画：x 从 0 → 40（往下挪），透明度随之降到接近 0；
       动画自然结束时由弹簧触发 cleanup。 */
    try {
      Spring.make({
        x0: 0, target: 40, damping: 1, response: 0.25,
        update: x => { box.style.transform = `translateY(${x}px)`; box.style.opacity = String(1 - x / 60); },
        done: cleanup,
      });
    } catch (e) { cleanup(); return; }
    /* 保险 3：与动画无关的定时兜底（详见上方大注释）。 */
    setTimeout(cleanup, 320);
  }

  /* 强制收尾：不播动画、也不调 onDone，直接把所有状态清零。
     幂等：不在对话中就是空操作。 */
  /* 强制收尾：任何残留对话（如战后幕在结算画面下弹出、剧情回调中断遗留）
     都会卡住 Dialog.active，令约战/任务入口静默失效——此函数幂等地清理现场。 */
  function forceFinish() {
    if (!active) return;
    active = false;
    if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
    typing = false; steps = []; idx = 0; onDone = null; stepOver = null;
    root.classList.add('hidden'); cast.innerHTML = ''; figs = {};
    box.style.transform = ''; box.style.opacity = '';
    choicesEl.innerHTML = ''; nextBtn.style.visibility = 'visible';
  }

  /* 对外接口。get active() 是“访问器属性”：外界读 Dialog.active 时
     实际执行这个函数返回私有变量——只能看，改不了。 */
  return {
    get active() { return active; },
    forceFinish,
    /* 播一段剧本：script.slice() 浅复制一份——选项插播时会对 steps 做
       splice，绝不能污染调用方手里的原剧本数组。
       开场先把台词框摆到下方 40px、半透明，再用弹簧送回原位，然后开播。 */
    play(script, done) {
      steps = script.slice(); idx = 0; onDone = done || null; active = true;
      cast.innerHTML = ''; figs = {};
      preSpawn();
      $('#ctxbar').classList.add('hidden');
      root.classList.remove('hidden');
      box.style.transform = 'translateY(40px)'; box.style.opacity = '0.4';
      Spring.make({ x0: 40, target: 0, damping: 0.85, response: 0.38, update: (x) => { box.style.transform = `translateY(${x}px)`; box.style.opacity = String(1 - x / 80); } });
      showStep();
    },
    tap: completeOrNext,
  };
})();

/* 事件绑定：点台词框任意空白处 = tap（推进对话）。
   点到“下一步”按钮或选项按钮时不算——它们有自己的 onclick，
   再冒泡到这里会连点两次；e.target.closest('.choice-btn') 沿祖先链
   向上找，判断点击落点是否在选项按钮内部。 */
$('#dialog-box').addEventListener('click', e => { if (e.target.id !== 'dialog-next' && !e.target.closest('.choice-btn')) Dialog.tap(); });
$('#dialog-next').addEventListener('click', () => Dialog.tap());

</script>
<script>
/* 实验史记·春秋笔 —— 撰史系统：拼版 / 笔法 / 品级 */
'use strict';
/* ================================================================
   【这个文件是干嘛的】
   “撰史”玩法：把收集到的史料像排文章一样放进起/承/转/合四个槽位，
   选“直笔/曲笔”笔法，按槽位匹配度与文笔算分定品级（下/中/上/神品），
   发表一卷立传并结算奖励，最后播“判词”面板与传主反应。

   【架构位置】
   在 dialog.js 之后、ui.js 之前加载。
   依赖：data/events.js 的 SHARDS（史料表）、data/volumes.js 的
   SLOTS / VOLS / VOL_BY_NO（槽位与卷目），以及 config 的 el / toast /
   Sfx / Save、Engine（资源与成就）、UI（面板）、Dialog（传主反应）。
   入口在 ui.js 的史记面板：点某卷 → Writing.open(卷号)。

   【暴露的全局名】
   Writing（IIFE 返回：open / duelReady / duelWon / openPublished）。
   volNo、placed、style 等编辑状态全是闭包私有，外界碰不到。

   【新手阅读提示】
   1) 本玩法已与主线解耦：不需要打赢传主也能立传（duelReady 恒返回 true），
      “与传主切磋”只是图鉴里的软提示。
   2) 界面采用“整体重画”模式：任何一次点击都把面板 DOM 全部重建
      （重新执行 render()），而不是精细修改某个元素——代码简单，
      状态与界面永远不会对不上，小面板完全够用。
   ================================================================ */

const Writing = (() => {
  /* 闭包私有状态：当前编辑的卷号；四个槽各放了哪条史料（null=空）；
     笔法（'直' 或 '曲'）。 */
  let volNo = 0;
  let placed = { qi: null, cheng: null, zhuan: null, he: null }; // shardId
  let style = '直';

  /* 某卷可用的全部史料：卷池 + 该卷所有采访/额外史料（如 sh_pingpong） */
  /* 从 SHARDS 全表里筛出属于第 no 卷的史料 id 列表。 */
  function volPool(no) { return Object.keys(SHARDS).filter(id => SHARDS[id].vol === no); }

  const SLOT_KEYS = ['qi', 'cheng', 'zhuan', 'he'];
  /* 槽位定义查表；accepts 判断史料能否进某槽：
     槽定义里的 only 标签列表是硬门槛（如“合”槽只收带「评」标签的采访）。 */
  function slotDef(k) { return SLOTS.find(s => s.key === k); }
  function accepts(slotKey, shardId) {
    const def = slotDef(slotKey);
    const tags = SHARDS[shardId].tags;
    if (def.only && !def.only.some(t => tags.includes(t))) return false;
    return true;
  }
  /* 点史料卡时自动挑槽，优先级：
     1) 带「评」且合槽空着 → 直接入合槽；
     2) 按起→承→转找一个“空着 + 放得进 + 标签对味（prefer 命中）”的槽；
     3) 退而求其次：任意空着且放得进的槽；
     4) 全满返回 null（由调用方提示先取回一条）。 */
  function autoSlotFor(shardId) {
    const tags = SHARDS[shardId].tags;
    // 合槽优先收评
    if (tags.includes('评') && !placed.he) return 'he';
    for (const k of ['qi', 'cheng', 'zhuan']) {
      if (placed[k]) continue;
      if (!accepts(k, shardId)) continue;
      if (slotDef(k).prefer.some(t => tags.includes(t))) return k;
    }
    for (const k of ['qi', 'cheng', 'zhuan']) if (!placed[k] && accepts(k, shardId)) return k;
    return null;
  }

  /* 评分：每槽 = 该史料文笔值 ×（标签命中槽位 prefer 记 1.5 倍，否则 1 倍），
     再加角色文笔 G.wen 的 25%、直笔固定 +2。
     Math.round(s * 10) / 10 是“四舍五入保留一位小数”的惯用法
     （JS 没有按位数四舍五入的内置函数）。 */
  function score() {
    let s = 0;
    SLOT_KEYS.forEach(k => {
      const id = placed[k];
      if (!id) return;
      const def = slotDef(k);
      const tags = SHARDS[id].tags;
      const mult = def.prefer.some(t => tags.includes(t)) ? 1.5 : 1;
      s += G.shards[id].wen * mult;
    });
    s += G.wen * 0.25;
    if (style === '直') s += 2;
    return Math.round(s * 10) / 10;
  }
  /* 得分 → 品级 1~4（连续三元表达式按阈值分档）→ 品级名。 */
  function gradeOf(s) { return s >= 36 ? 4 : s >= 28 ? 3 : s >= 20 ? 2 : 1; }
  function gradeName(g) { return { 4:'神品', 3:'上品', 2:'中品', 1:'下品' }[g]; }

  /* 撰史界面的搭建与刷新：UI.openPanel(标题, build) 里 build(body) 是回调，
     面板打开后把 body 元素交过来、由这里往里填内容。
     左栏 = 四槽 + 笔法切换 + 得分预览 + 发表按钮；右栏 = 拥有的史料卡池。
     所有交互（点槽取回、换笔法、点料入槽）都是改闭包状态后整体重画。 */
  function render() {
    const v = VOL_BY_NO[volNo];
    UI.openPanel(`撰史 · ${v.title}（${v.i}）`, body => {
      const grid = el('div', 'writ-grid');
      /* 左：四槽 + 笔法 + 发表 */
      const left = el('div', '');
      const slots = el('div', 'slot-row');
      SLOT_KEYS.forEach(k => {
        const def = slotDef(k);
        const id = placed[k];
        const slot = el('div', 'slot' + (id ? '' : ' empty'));
        /* 模板字符串拼 HTML：反引号里 ${...} 可嵌任意表达式，
           类似 Python 的 f-string。槽里有料显示名字/标签/全文，
           空槽显示引导文案（合槽额外说明只收「评」）。 */
        slot.innerHTML = `<span class="slot-tag">${def.tag}</span>
          ${id ? `<div class="s-name">${SHARDS[id].name} <span class="pill gold">${SHARDS[id].tags.join('')} · 文${G.shards[id].wen}</span></div>
                  <div class="s-text">${SHARDS[id].text}</div>`
               : `<div class="s-name">${def.label}</div><div class="s-text">${k === 'he' ? '只收「评」——采访所得' : '点右侧史料放入'}</div>`}`;
        /* 点已放料的槽 = 取回该史料（置 null 后重画，卡池里它会复活）。 */
        slot.onclick = () => {
          if (placed[k]) { delete placed[k]; Sfx.tap(); render(); }
        };
        slots.appendChild(slot);
      });
      left.appendChild(slots);
      // 笔法
      /* 笔法二选一：直笔据实而书（发表时声望 +2，得罪传主），
         曲笔温柔敦厚（声望 -2，传主欢喜）。选中的按钮加 .on 高亮。 */
      const styleRow = el('div', '');
      styleRow.style.cssText = 'display:flex;gap:8px;margin:14px 0;align-items:center';
      styleRow.innerHTML = '<b style="font-size:13.5px">笔法：</b>';
      [['直', '直笔 · 据实而书（声望+2，传主未必高兴）'], ['曲', '曲笔 · 温柔敦厚（传主欢喜，声望-2）']].forEach(([key, tip]) => {
        /* forEach 的参数 [key, tip] 是解构：直接把数组拆成两个变量。 */
        const b = el('button', 'seg' + (style === (key === '直' ? '直' : '曲') ? ' on' : ''), key + '笔');
        b.title = tip;
        b.onclick = () => { style = key === '直' ? '直' : '曲'; Sfx.tap(); render(); };
        styleRow.appendChild(b);
      });
      left.appendChild(styleRow);
      left.appendChild(el('div', 'muted', `预计得分 ${score()} · 文笔 ${G.wen}（≥${v.minWen} 可发）· 神品≥36 上品≥28 中品≥20`));
      const pubBtn = el('button', 'btn btn-primary', '定稿 · 发表此卷');
      pubBtn.style.cssText = 'width:100%;margin-top:12px;padding:14px;font-size:17px';
      pubBtn.onclick = () => publish();
      left.appendChild(pubBtn);
      grid.appendChild(left);
      /* 右：史料池 */
      const right = el('div', '');
      right.appendChild(el('div', 'muted', `本卷史料（点选入槽，点槽可取回）`));
      const pool = el('div', 'shard-pool');
      pool.style.marginTop = '8px';
      /* 只展示玩家已拥有的本卷史料；已在槽里的卡标记 used（置灰防重复入槽）。 */
      const owned = volPool(volNo).filter(s => G.shards[s]);
      owned.forEach(sid => {
        const sh = SHARDS[sid];
        const used = Object.values(placed).includes(sid);
        const card = el('div', 'shard-card' + (used ? ' used' : ''));
        const srcName = { scene:'亲历', gossip:'转述', interview:'采访' }[G.shards[sid].src] || '';
        card.innerHTML = `<div class="sc-tags">${sh.tags.join('')} · 文${G.shards[sid].wen} · ${srcName}</div>
          <div class="sc-name">${sh.name}</div><div class="sc-text">${sh.text}</div>`;
        /* 点史料卡 = 让 autoSlotFor 挑个好槽自动放入。 */
        card.onclick = () => {
          if (used) return;
          const k = autoSlotFor(sid);
          if (!k) { toast('四槽已满，点槽取回一条再放'); return; }
          placed[k] = sid; Sfx.page(); render();
        };
        pool.appendChild(card);
      });
      /* 还没收集到的史料列个清单，提醒玩家去哪补——缺料也允许发表。 */
      const missing = volPool(volNo).filter(s => !G.shards[s]);
      if (missing.length) {
        pool.appendChild(el('div', 'muted', `尚缺 ${missing.length} 条：「${missing.map(s => SHARDS[s].name).join('」「')}」。缺料也可发（凑满四槽即可），但选择少了。`));
      }
      right.appendChild(pool);
      grid.appendChild(right);
      body.appendChild(grid);
    });
  }

  /* 发表前的三道门槛：四槽必须全满（不成卷不发表）、文笔要够该卷下限、
     个别卷还要求传主好感达标。任一不过就 toast 说明原因并返回 false。 */
  function checks() {
    const v = VOL_BY_NO[volNo];
    if (SLOT_KEYS.some(k => !placed[k])) { toast('四槽未满，不成卷'); return false; }
    if (G.wen < v.minWen) { toast(`文笔不足（${G.wen}/${v.minWen}），去图书馆读书、写日记`, '恶'); return false; }
    if (v.needFavor && Engine.favorOf(v.needFavor.id) < v.needFavor.v) {
      toast(v.needFavor.hint, '恶'); return false;
    }
    return true;
  }

  /* 定稿发表（本文件的核心结算）：
     1) 算分定品级，把这一卷“落卷”进 G.vols 存档；
     2) 结算奖励：文笔 +5，声望/零花钱按卷配置，直/曲笔再 ±2 修正，
        按卷配置给相关人物加好感；
     3) 直/曲笔各解锁一枚成就并按笔法增减传主（cast[0]）好感 ±4；
     4) 判定卷数/品级类成就（卷八、八卷、十五卷且均品上）；
     5) 打开“发刊词”面板展示品级判词，点“看看传主反应”播收尾对话；
     6) 最后清空四槽，为写下一卷做准备。 */
  function publish() {
    if (!checks()) return;
    const v = VOL_BY_NO[volNo];
    const s = score(), g = gradeOf(s);
    // 落卷
    G.vols[volNo] = { grade: g, score: s, style, shards: SLOT_KEYS.map(k => placed[k]) };
    G.stats.published++;
    Engine.addWen(5);
    Engine.addRep(v.rep + (style === '直' ? 2 : -2));
    Engine.addMoney(v.money);
    Object.entries(v.favor).forEach(([id, n]) => Engine.addFavor(id, n));
    if (style === '直') {
      G.stats.direct++;
      Engine.award('ach_direct');
      Engine.addFavor(v.cast[0], -4);
    } else {
      G.stats.curve++;
      Engine.award('ach_curve');
      Engine.addFavor(v.cast[0], 4);
    }
    if (volNo === 8) Engine.award('ach_v8');
    if (G.stats.published >= 8) Engine.award('ach_half');
    /* “太史公”成就：十五卷全部发表且平均品级 ≥ 3（平均达上品）。 */
    if (G.stats.published >= 15) {
      const avg = Object.values(G.vols).reduce((a, b) => a + b.grade, 0) / 15;
      if (avg >= 3) Engine.award('ach_taishi');
    }
    Sfx.seal();
    Save.write();
    // 判词画面
    /* openPanel 的 build 回调是同步执行的：此刻 placed 还没被清空，
       所以判词里能列出本卷四槽的史料名；面板建好之后才执行下面那行清空。 */
    UI.openPanel(`发刊 · ${v.title}`, body => {
      const verd = el('div', 'writ-verdict');
      verd.innerHTML = `
        <div class="muted" style="letter-spacing:.4em;margin-bottom:6px">实 验 史 记 · 卷${v.i}</div>
        <h3 style="font-family:var(--font-cl);font-size:22px">${v.title}</h3>
        <div class="grade">${gradeName(g)}</div>
        <div class="muted">得分 ${s} · ${style}笔 · ${placedToDesc()}</div>
        <div style="margin-top:10px" class="card">
          <div class="meta">声望 ${v.rep + (style === '直' ? 2 : -2) >= 0 ? '+' : ''}${v.rep + (style === '直' ? 2 : -2)} · 零花钱 +${v.money} · 文笔 +5<br>立传入册：${v.cast.map(id => (PEOPLE_BY_ID[id] || {}).name || id).join('、')}</div>
        </div>
        <button class="btn btn-primary" style="margin-top:14px" id="after-vol">看看传主反应</button>`;
      body.appendChild(verd);
      $('#after-vol').onclick = () => {
        UI.closePanel();
        const after = v.after || [{ who:'旁白', text:'卷成。' }];
        Dialog.play(after);
      };
    });
    placed = { qi: null, cheng: null, zhuan: null, he: null };
  }
  /* 把四槽的史料名连成一句话（空槽自动跳过），用在判词画面。 */
  function placedToDesc() {
    return SLOT_KEYS.map(k => SHARDS[placed[k]] ? SHARDS[placed[k]].name : '').filter(Boolean).join(' / ');
  }

  /* 立传已与主线解耦：不再需要先胜传主（原「成传之战」门禁撤下）。
     保留下方 duelReady / duelWon 两个函数，供面板作「可切磋」的软提示。 */
  function duelReady() { return true; }
  /* 传主若配了马刀卡，看刀谱（Blades）里录没录到他的刀；
     只用于图鉴里显示“可切磋”的提示，不影响立传本身。
     typeof 判活：blades.js 在本文件之后加载，运行时才检查是否存在。 */
  function duelWon(no) {
    const v = VOL_BY_NO[no];
    return !v.duel || (typeof Blades !== 'undefined' && Blades.hasCard(v.duel));
  }

  /* 对外接口：open 进入某卷的撰写面板（每次进入都重置槽位与笔法）；
     openPublished 只是跳转到 UI.viewVol 阅读已发表的成卷。 */
  return {
    open(no) {
      volNo = no;
      placed = { qi: null, cheng: null, zhuan: null, he: null };
      style = '直';
      render();
    },
    duelReady,
    duelWon,
    openPublished(no) { UI.viewVol(no); },
  };
})();

</script>
<script>
/* 实验史记·春秋笔 —— 小游戏：月考迟到 / 陀螺 / 食堂冲刺 / 乒乓球 */
'use strict';
/* ================================================================
   【这个文件是干嘛的】
   四个自包含小游戏的“总机”：月考迟到（限时点按闯关）、陀螺·
   三溴化氮（蓄力对撞）、食堂冲刺（三车道躲避）、乒乓球二十板
   （时机点击）。每个游戏都是一个工厂函数，把状态封在自己的闭包
   里；共用同一块 #mg-canvas 覆盖层和同一条动画循环，玩完把输赢
   经回调交还给主流程。

   【架构位置】
   排在 world.js 之后加载：借用 config.js 的 $、clamp、rand、irand、
   pick、Sfx，以及 world.js 顶层的 drawAvatar 和 roundRect（顶层
   function 声明会挂到全局对象，跨文件裸名直接可调）。对外只暴露
   const MG——顶层 const 不挂 window，跨文件用裸名 MG。dialog.js /
   main.js 调 MG.launch(名字, 完成回调) 开局；world.js / main.js 靠
   MG.active 判断小游戏是否占用输入，占用就给世界“让位”。

   【新手阅读提示】
   1) 每个小游戏返回一个“约定好形状”的对象：update(dt) 推进一帧
      逻辑、draw(ctx) 画一帧、point(x, y, down) 接收点击、key(k)
      接收左右键、swing() 接收空格。公共循环 loop() 每帧只做
      cur.update + cur.draw——像 Python 的“鸭子类型”：只要带齐这些
      方法，谁都能坐上 cur 这把交椅。
   2) 四个游戏共用一份事件监听（画布点击 / 全局键盘），切游戏只是
      换掉 cur，监听器不用重新挂。
   3) end(success) 里的 ended 旗子防重复结算：胜负只认第一次。
   ================================================================ */

/* MG 同样是 IIFE 模块。cur 是“当前在玩的游戏”对象；raf 存动画帧
   请求的编号（cancelAnimationFrame 靠它停循环）；ended 防重复结算；
   onEnd 存“玩完后交给谁”的回调 */
const MG = (() => {
  // 三个 DOM：root 是全屏覆盖层，cv 是画布，hud 是顶部说明文字那一行
  const root = $('#minigame'), cv = $('#mg-canvas'), hud = $('#mg-hud');
  const ctx = cv.getContext('2d');
  // 画布内部分辨率固定不变：游戏逻辑永远按这套坐标系写，不用关心窗口多大
  const W = 760, H = 540;
  let cur = null, raf = 0, last = 0, onEnd = null, ended = false;

  /* 开局布置：算出缩放比 d（不超过 1），把 CSS 显示尺寸乘上 d——
     画面整体塞进窗口且不变形，内部坐标仍是 760×540 */
  function setup() {
    const d = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
    cv.width = W; cv.height = H;
    cv.style.width = W * d + 'px'; cv.style.height = H * d + 'px';
  }
  /* 结束一局：先立 ended 旗子（之后再有人喊 end 一律无视），停掉
     动画循环；900 毫秒后收起覆盖层并回调 onEnd(输赢)——延迟是让
     玩家看清结算画面。`cb && cb(success)`：有回调才调用（短路求值） */
  function end(success) {
    if (ended) return; ended = true;
    cancelAnimationFrame(raf);
    setTimeout(() => { root.classList.add('hidden'); const cb = onEnd; onEnd = null; cur = null; cb && cb(success); }, 900);
  }
  /* 四个游戏共用的主循环：让当前游戏推进一帧、画一帧；只要没结束
     就继续预约下一帧。dt 夹在 0.05 秒内，防止切走标签页回来时“时间
     大跳”（小球瞬移、倒计时狂掉） */
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (cur) { cur.update(dt); cur.draw(ctx); }
    if (!ended) raf = requestAnimationFrame(loop);
  }
  // 铺米色纸面 + 细横线：四个游戏共用的“作业本”底
  function bg() {
    ctx.fillStyle = '#f4efe0'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(60,55,40,.06)';
    for (let y = 0; y < H; y += 26) ctx.fillRect(0, y, W, 1);
  }
  // 带默认值的写字小工具：不传颜色/字体/对齐就用默认，省得每处写全七个参数
  function txt(s, x, y, size, color, font, align) {
    ctx.fillStyle = color || '#26241f';
    ctx.font = `${size}px ${font || 'serif'}`;
    ctx.textAlign = align || 'center';
    ctx.fillText(s, x, y);
  }
  /* 画一个按钮并返回它的矩形 {x, y, w, h}：调用方把返回值攒进数组，
     点击时用 inBtn 判断点中了哪个。hot=true 画成高亮红（选中感） */
  function button(x, y, w, h, label, hot) {
    ctx.fillStyle = hot ? '#b8432f' : '#fffdf5';
    roundRect(ctx, x, y, w, h, 12); ctx.fill();
    ctx.strokeStyle = hot ? '#8a2f1c' : 'rgba(0,0,0,.15)'; ctx.lineWidth = 1.5; ctx.stroke();
    txt(label, x + w / 2, y + h / 2 + 6, 17, hot ? '#fff6f0' : '#26241f', 'sans-serif');
    return { x, y, w, h };
  }
  // 点 (x, y) 是否落在按钮矩形内——最基础的矩形命中检测
  const inBtn = (b, x, y) => b && x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h;
  // 画布点击统一转发给当前游戏的 point()。getBoundingClientRect 减去
  // 页面偏移得到画布内坐标；算出的缩放比 d 这里并没有参与换算
  // （坐标按 CSS 像素直传）
  cv.addEventListener('pointerdown', e => {
    if (!cur || !cur.point) return;
    const r = cv.getBoundingClientRect();
    const d = cv.width / r.width;
    cur.point(e.clientX - r.left, e.clientY - r.top, true);
  });

  /* ============ 1. 月考迟到 ============ */
  /* 六个 stage 串成的一天早上：看表(0)→开锁(1)→找笔(2)→找考场(3)→
     填考号(4)→done(5)。timer 是总倒计时（秒），点错一次 fail() 扣 8
     秒；clicks 是“本关已点次数”，每过一关清零复用；btns 攒当前画面
     上按钮的矩形，供 point() 命中检测 */
  function gameLate() {
    let stage = 0, timer = 90, clicks = 0, wrongFlash = 0, msg = '';
    let btns = [];
    const stages = ['clock', 'lock', 'bag', 'room', 'number', 'done'];
    // 点错的代价：留一句提示、倒计时狠扣 8 秒、红光闪 0.5 秒
    function fail(t) { msg = t; timer = Math.max(0, timer - 8); wrongFlash = 0.5; }
    return {
      update(dt) {
        // 还没通关时倒计时才走；红光余量随时间消退。hud 是顶部那行说明文字
        if (stage < 5) { timer -= dt; wrongFlash = Math.max(0, wrongFlash - dt); }
        hud.textContent = `月考之晨 · 剩余 ${Math.ceil(timer)} 秒 · ${msg}`;
        // 超时：定格在失败文案上并 end(false)；stage 拨到 5 让倒计时停下
        if (timer <= 0 && stage < 5) {
          bg(); txt('钟声响时，你还在走廊里。', W / 2, H / 2 - 20, 30, '#b8432f');
          txt('（卒得109。除姓名外靡不毕缪。）', W / 2, H / 2 + 24, 19, '#5a564c');
          stage = 5; end(false);
        }
        // 通关路径把 stage 拨到 5 后在这里收尾；若刚因超时 end(false)
        // 过，ended 旗子会让这次 end(true) 无效——胜负只认第一次
        if (stage === 5) end(true);
      },
      draw() {
        bg();
        txt('大展的清晨', W / 2, 52, 30, '#26241f');
        txt('── 七点五十五分，距离月考还有一切要办的事 ──', W / 2, 84, 15, '#8d887a', 'sans-serif');
        // 每帧重建按钮坐标表：按钮是画出来的，命中全靠这份矩形清单
        btns = [];
        const st = stages[stage];
        if (st === 'clock') {
          txt('① 逼视表', W / 2, 160, 20, '#b8432f');
          roundRect(ctx, W / 2 - 90, 200, 180, 180, 20); ctx.fillStyle = '#fffdf5'; ctx.fill();
          ctx.strokeStyle = '#26241f'; ctx.lineWidth = 3; ctx.stroke();
          const flip = clicks > 0;
          txt(flip ? '7:55' : '6:55', W / 2, 305, 52, flip ? '#b8432f' : '#26241f');
          txt(flip ? '大惊。' : '善，恰吾不欲上早读。（点一下再看）', W / 2, 420, 17, '#5a564c', 'sans-serif');
        } else if (st === 'lock') {
          txt('② 宿舍西大门的锁', W / 2, 160, 20, '#b8432f');
          txt('宿管说：此锁乃虚铁。', W / 2, 196, 16, '#5a564c', 'sans-serif');
          const open = clicks >= 3;
          txt(open ? '🔓 开了' : '🔒', W / 2, 300, clicks >= 3 ? 40 : 90);
          if (!open) txt(`点 3 下开锁（${clicks}/3）`, W / 2, 420, 17, '#5a564c', 'sans-serif');
          else txt('置锁于吾桌，尔便得出。', W / 2, 420, 17, '#5a564c', 'sans-serif');
        } else if (st === 'bag') {
          txt('③ 翻遍教室外的书包找笔', W / 2, 160, 20, '#b8432f');
          txt('准考证、笔俱在七班内。点一个书包：', W / 2, 196, 16, '#5a564c', 'sans-serif');
          // right 每帧重新随机，只影响提示文案；真正的命中判定在下方 point()
          const right = irand(0, 2);
          const got = clicks > 0;
          for (let i = 0; i < 3; i++) btns.push(button(120 + i * 180, 240, 140, 120, ['🎒 书包', '🎒 书包', '🎒 书包'][i], false));
          if (got) txt(clicks === right + 1 ? '可怡的一支黑笔！' : '没有笔……再找。', W / 2, 420, 18, clicks === right + 1 ? '#3e7a5e' : '#b8432f', 'sans-serif');
          if (got && clicks === right + 1) stage = 3;
        } else if (st === 'room') {
          txt('④ 找考场', W / 2, 160, 20, '#b8432f');
          txt('隐知己考场为 12、17。', W / 2, 196, 16, '#5a564c', 'sans-serif');
          if (clicks === 0) txt('（提示：试两次才知道真正在哪）', W / 2, 420, 15, '#8d887a', 'sans-serif');
          btns.push(button(140, 240, 140, 90, '17 考场', false));
          btns.push(button(310, 240, 140, 90, '12 考场', false));
          btns.push(button(480, 240, 140, 90, '19 考场', false));
          if (clicks === 1) txt('17：无有缺考者。', W / 2, 400, 17, '#5a564c', 'sans-serif');
          // 剧情点：第二次试探才暴露真考场（19），把 stage 推到 4；
          // 行尾那个空的 setTimeout 什么也不做，可无视
          if (clicks === 2) { txt('12：恰有缺考者，入。——然吾之考场为 19 也。', W / 2, 400, 17, '#b8432f', 'sans-serif'); stage = 4; setTimeout(() => {}, 0); }
        } else if (st === 'number') {
          txt('⑤ 考号', W / 2, 160, 20, '#b8432f');
          txt('监考员给了你一张 22058 的准考证格式。', W / 2, 200, 16, '#5a564c', 'sans-serif');
          btns.push(button(170, 260, 200, 80, '凭记忆填上', false));
          btns.push(button(400, 260, 200, 80, '空着不填', false));
          txt('（原典：不知考号，卒未填。然考号实未变也。）', W / 2, 400, 15, '#8d887a', 'sans-serif');
        }
        if (wrongFlash > 0) { ctx.fillStyle = `rgba(184,67,47,${wrongFlash * 0.3})`; ctx.fillRect(0, 0, W, H); }
      },
      /* 点击判定：按 stage 分派。bag 关不累加 clicks，正确书包的序号
         是 clicks % 3（此时已被上一关清零）；room 关必须先查 17 再查 12 */
      point(x, y) {
        const st = stages[stage];
        if (st === 'clock') { clicks++; if (clicks >= 2) { stage = 1; clicks = 0; } }
        else if (st === 'lock') { clicks++; if (clicks >= 3) { stage = 2; clicks = 0; } }
        else if (st === 'bag') {
          for (let i = 0; i < 3; i++) if (inBtn(btns[i], x, y)) {
            if (i === clicks % 3) { msg = '可怡的一支黑笔！'; stage = 3; }
            else fail('翻错了书包');
          }
        } else if (st === 'room') {
          if (clicks === 0 && inBtn(btns[0], x, y)) { clicks = 1; msg = '17：无有缺考者。'; }
          else if (clicks === 1 && inBtn(btns[1], x, y)) { clicks = 2; stage = 4; }
          else fail('不是这个考场');
        } else if (st === 'number') {
          if (inBtn(btns[0], x, y)) fail('填错考号，靡不毕缪');
          else if (inBtn(btns[1], x, y)) { stage = 5; end(true); }
        }
      },
    };
  }

  /* ============ 2. 陀螺·三溴化氮 ============ */
  /* 双陀螺对撞：按住蓄力、松手朝对方发射。P 是玩家、E 是对手；e 是
     陀螺能量（转速），随时间自耗、相撞时按撞击猛烈程度互扣，先归零
     的倒下。over：1=你赢、2=你输。onUp:true 向公共监听声明“本游戏
     需要松手事件”（见文件底部 window 的 pointerup 转发） */
  function gameSpin() {
    // x/y 位置，vx/vy 速度，r 半径（碰撞用），ang 是画面自转角
    const P = { x: W * 0.3, y: H * 0.6, vx: 0, vy: 0, e: 100, r: 26, ang: 0 };
    const E = { x: W * 0.7, y: H * 0.4, vx: 0, vy: 0, e: 100, r: 26, ang: 0 };
    let charging = false, charge = 0, over = 0, tipp = 0;
    // 发射：朝敌方的单位方向 ×（基础 260 + 蓄力最多再加 320）的速度
    function launch() {
      const dx = E.x - P.x, dy = E.y - P.y, d = Math.hypot(dx, dy);
      const v = 260 + charge * 320;
      P.vx = dx / d * v; P.vy = dy / d * v;
    }
    return {
      update(dt) {
        // 蓄力条最多充到 1；分出胜负后等 0.9 秒再结算，留出“倒下”时间
        if (charging) charge = Math.min(1, charge + dt * 1.4);
        if (over) { tipp += dt; if (tipp > 0.9) end(over === 1); return; }
        // 物理一步：位置按速度推进；速度乘 (1 - 1.1*dt) 模拟摩擦（逐帧
        // 衰减）；四条边界把陀螺夹回场内并反弹、保留七成速度
        [P, E].forEach((t, i) => {
          t.x += t.vx * dt; t.y += t.vy * dt;
          t.vx *= (1 - 1.1 * dt); t.vy *= (1 - 1.1 * dt);
          if (t.x < 40 + t.r) { t.x = 40 + t.r; t.vx = Math.abs(t.vx) * 0.7; }
          if (t.x > W - 40 - t.r) { t.x = W - 40 - t.r; t.vx = -Math.abs(t.vx) * 0.7; }
          if (t.y < 90 + t.r) { t.y = 90 + t.r; t.vy = Math.abs(t.vy) * 0.7; }
          if (t.y > H - 40 - t.r) { t.y = H - 40 - t.r; t.vy = -Math.abs(t.vy) * 0.7; }
          // 能量自然流失（i=0 是玩家，流得稍慢一点）；ang 是给画面看的自转角
          t.e -= dt * (5.2 - i * 0.4);
          t.ang += (Math.hypot(t.vx, t.vy) * 0.02 + 6) * dt * 10;
        });
        const dx = E.x - P.x, dy = E.y - P.y, d = Math.hypot(dx, dy);
        // 相撞：n 是连线方向的单位向量，rel 是相对速度（撞击猛烈程度）。
        // 双方按 rel 扣能量（对方 1.15 倍略吃亏），再沿 n 交换动量——
        // 至少 120 的“弹开下限”保证撞完一定分开，不会贴着不放
        if (d < P.r + E.r) {
          const nx = dx / d, ny = dy / d;
          const rel = Math.abs(P.vx - E.vx) + Math.abs(P.vy - E.vy);
          const imp = 0.10;
          P.e -= rel * imp; E.e -= rel * imp * 1.15;
          const tm = (P.vx * nx + P.vy * ny), te = (E.vx * nx + E.vy * ny);
          P.vx += nx * Math.max(120, rel * 0.5) - nx * tm; P.vy += ny * Math.max(120, rel * 0.5) - ny * tm;
          E.vx -= nx * Math.max(120, rel * 0.5) - nx * te; E.vy -= ny * Math.max(120, rel * 0.5) - ny * te;
          Sfx.tap();
        }
        // 裁判：谁的能量先见底谁输（hud 里的 `| 0` 是截断取整的惯用法）
        if (P.e <= 0) over = 2; else if (E.e <= 0) over = 1;
        hud.textContent = `三溴化氮之战 · 你 ${Math.max(0, P.e | 0)} ─ ${Math.max(0, E.e | 0)} 头哥`;
      },
      draw() {
        bg();
        ctx.fillStyle = '#d9cfb4'; ctx.beginPath(); ctx.ellipse(W / 2, H / 2 + 30, W / 2 - 30, H / 2 - 70, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.1)'; ctx.stroke();
        // 陀螺本体：两条交叉的圆角矩形绕中心旋转（rotate(t.ang)），
        // 底下加影子，静止画面也能看出“高速旋转”
        [[P, '#41608c', '你'], [E, '#8a4a2f', '三溴化氮']].forEach(([t, col, name]) => {
          ctx.save(); ctx.translate(t.x, t.y);
          ctx.fillStyle = 'rgba(30,26,16,.2)'; ctx.beginPath(); ctx.ellipse(0, 10, t.r, 8, 0, 0, 7); ctx.fill();
          ctx.rotate(t.ang);
          ctx.fillStyle = col; roundRect(ctx, -t.r, -6, t.r * 2, 12, 6); ctx.fill();
          ctx.rotate(Math.PI / 3);
          roundRect(ctx, -t.r, -6, t.r * 2, 12, 6); ctx.fill();
          ctx.restore();
          txt(name, t.x, t.y - 34, 14, '#403a2e', 'sans-serif');
        });
        if (!over) {
          if (charging) {
            ctx.fillStyle = '#fffdf5'; roundRect(ctx, W / 2 - 130, H - 70, 260, 26, 13); ctx.fill();
            ctx.fillStyle = '#b8432f'; roundRect(ctx, W / 2 - 126, H - 66, 252 * charge, 18, 9); ctx.fill();
            txt('蓄力中……松手发射！', W / 2, H - 86, 15, '#b8432f', 'sans-serif');
          } else if (charge === 0 && Math.hypot(P.vx, P.vy) < 10) {
            txt('按住蓄力，松手发射，撞飞三溴化氮！', W / 2, H - 60, 16, '#5a564c', 'sans-serif');
            txt('（碰撞后可继续点击追击）', W / 2, H - 36, 13, '#8d887a', 'sans-serif');
          }
        } else {
          ctx.fillStyle = 'rgba(244,239,224,.75)'; ctx.fillRect(0, 0, W, H);
          txt(over === 1 ? '三溴化氮，倒了！' : '你的陀螺先停了……', W / 2, H / 2, 34, over === 1 ? '#3e7a5e' : '#b8432f');
        }
      },
      /* down=true 是按下、false 是松手（由全局 pointerup 转发过来）。
         按下：几乎静止时才开始蓄力（防连点骚扰）；松手：发射并清蓄力
         （延迟 100 毫秒清零，让进度条先走完再消失） */
      point(x, y, down) {
        if (over) return;
        if (down) {
          if (!charging && Math.hypot(P.vx, P.vy) < 30) { charging = true; charge = 0; }
        } else if (charging) {
          charging = false; launch();
          Sfx.seal();
          setTimeout(() => { charge = 0; }, 100);
        }
      },
      onUp: true,
    };
  }

  /* ============ 3. 食堂冲刺 ============ */
  /* 三车道跑酷：点左/右半屏（或方向键）换线，躲开挡路的同学，冲满
     goal 步到窗口即赢。速度随时间越来越快；撞人只踉跄 1.4 秒（变慢）
     不清场；超过 40 秒没到则失败。laneX 预存三条车道的中线横坐标 */
  function gameCanteen() {
    let lane = 1, dist = 0, time = 0, over = 0, stumble = 0, speed = 210;
    let obs = []; let nextSpawn = 0.5;
    const laneX = [W * 0.3, W * 0.5, W * 0.7];
    const goal = 2600;
    return {
      update(dt) {
        if (over) { over += dt; if (over > 1) end(dist >= goal); return; }
        time += dt; stumble = Math.max(0, stumble - dt);
        speed = 210 + time * 6;
        dist += stumble > 0 ? speed * 0.25 * dt : speed * dt;
        nextSpawn -= dt;
        // 生成障碍：到点投一个随机车道的同学，四成概率再补一个错位的
        if (nextSpawn <= 0) {
          nextSpawn = rand(0.45, 0.85);
          const l = irand(0, 2);
          obs.push({ lane: l, y: -40, hit: false });
          if (Math.random() < 0.4) { let l2 = (l + irand(1, 2)) % 3; obs.push({ lane: l2, y: -40 - rand(30, 90), hit: false }); }
        }
        obs.forEach(o => o.y += speed * dt * 1.15);
        // 出屏的障碍直接丢弃，数组不会越积越大（filter 留下“还没出屏”的）
        obs = obs.filter(o => o.y < H + 60);
        // 碰撞：同车道且纵向贴近（34 像素内）就算撞上；hit 标记防重复扣
        obs.forEach(o => {
