        // 技能（按进攻性决定使用意愿）
        // 技能使用意愿 = 档位基数 + 角色个人进攻性微调（aggr 以 0.6 为基准线）。
        const skillP = Math.max(0.05, Math.min(1, prof.skill + (u.aggr - 0.6) * 0.25));
        if (Math.random() < skillP) {
          const pick = this.aiPickSkill(u);
          if (pick) { await this.doSkill(u, pick.idx, pick.target); await sleep(320); continue; }
        }
        // 血祭抢攻（按进攻性）
        if (u.st.bloodlust <= 0 && adj(u, target) && u.hp >= 5 && Math.random() < prof.sac) {
          await this.doSacrifice(u); await sleep(300); continue;
        }
        // 刀击
        if (u.hasKnife && u.st.seal <= 0 && u.st.disarm <= 0 && adj(u, target)) {
          await this.doKnife(u, target); await sleep(300); continue;
        }
        // 空地驱赶（互补于马踢）
        if (u.hasHorse && !isWall(u.r, u.c) && !isWall(target.r, target.c) && adj(u, target) && Math.random() < prof.horse * 0.6) {
          await this.doDrive(u, target); await sleep(300); continue;
        }
        // 马踢（同城）
        if (u.hasHorse && isWall(u.r, u.c) && isWall(target.r, target.c) && manh(u, target) <= 3) {
          await this.doHorse(u, target); await sleep(300); continue;
        }
        // 买马：城墙之上、或目标在城墙上、或尚有余动（消极者不热衷）
        if (!u.hasHorse && u.apNow >= 2 && Math.random() < prof.horse && (isWall(u.r, u.c) || isWall(target.r, target.c))) {
          await this.doBuyHorse(u); await sleep(200); continue;
        }
        // 移动：消极者可能逡巡不前，其余逼近
        if (prof.keep > 0 && Math.random() < prof.keep && manh(u, target) > 2) {
          const idle = this._stepAway(u, target);
          if (idle && !(idle[0] === u.r && idle[1] === u.c)) {
            await this.doMove(u, idle[0], idle[1]);
            this.pushLog("「" + u.ch.hao + "」逡巡不前。");
            await sleep(260);
            continue;
          }
        }
        const step = this._stepToward(u, target);
        if (step && !(step[0] === u.r && step[1] === u.c)) { await this.doMove(u, step[0], step[1]); await sleep(260); continue; }
        // 无路可进时，若有余动则买马备战
        if (!u.hasHorse && u.apNow >= 1) { await this.doBuyHorse(u); await sleep(200); continue; }
        break;
      }
      this._tickStatusEnd(u);   // 该单位本回合结束：缴械/沉默到期
    }

    /* ---------- 断点续战：序列化 ---------- */
    /* 断点续战：把整场战局拍成纯数据快照（每回合末由 _endRound 写入存档）。
       只存「复原所需最小集」：配置存 stageId（场景参数回头查 config），单位只存
       战场可变字段——设计目标是引擎能从任意中间状态原样重启。 */
    serialize() {
      return {
        v: 1,
        cfg: {
          mode: this.mode, diff: this.diff, aiAggr: this.aiAggr,
          playerChar: this.cfg.playerChar,
          stageId: (this.cfg.stage && this.cfg.stage.id) || null,
          enemies: this.cfg.enemies || null,
          allies: this.cfg.allies || [],
          free: this.cfg.mode === "free",
          enemyIds: this.cfg.mode === "free" ? (this.cfg.enemies || []) : null
        },
        round: this.round, waveIndex: this.waveIndex, survivalWaveNo: this.survivalWaveNo || 1,
        boonsTaken: this.boonsTaken,
        result: this.result, over: false,
        stats: this.stats,
        units: this.units.map(u => ({
          charId: u.charId, side: u.side, uid: u.uid, hp: u.hp, maxhp: u.maxhp,
          r: u.r, c: u.c, alive: u.alive, offField: u.offField,
          hasKnife: u.hasKnife, hasHorse: u.hasHorse,
          st: u.st, cds: u.cds, usedSave: u.usedSave, boons: u.boons,
          homeR: u.homeR, homeC: u.homeC, apNow: u.apNow,
          _undo: u._undo
        })),
        log: this.log.slice(-40)
      };
    }

    /* 静态方法（Battle.fromSave(...)，不必先 new）：从快照重建一场战斗。
       先按配置正常 _build 摆好棋，再用快照逐字段覆盖回去，单位按 uid 对齐。 */
    static fromSave(snap, stages) {
      const stg = snap.cfg.stageId ? stages.find(x => x.id === snap.cfg.stageId) : null;
      const cfg = {
        mode: snap.cfg.mode, diff: snap.cfg.diff, aiAggr: snap.cfg.aiAggr,
        playerChar: snap.cfg.playerChar, stage: stg || undefined,
        enemies: snap.cfg.enemies || [], allies: snap.cfg.allies || [],
        rule: stg ? stg.rule : null, waves: stg ? stg.waves : undefined,
        triggeredReset: true
      };
      const b = new Battle(cfg);
      // 还原单位（按 uid 对齐，缺者忽略，多者丢弃）
      // uid→快照 的 Map：键值查找是 Map 的本职，比在数组里反复 find 利索。
      const saved = new Map(snap.units.map(u => [u.uid, u]));
      const keep = [];
      for (const u of b.units) {
        const su = saved.get(u.uid);
        if (!su) continue;
        // Object.assign：把右侧对象的字段批量盖进 u（用存档值覆盖新建值）。
        // st/boons 先合并默认值再盖存档值——旧存档缺新字段时也不至于 undefined。
        Object.assign(u, {
          hp: su.hp, maxhp: su.maxhp, r: su.r, c: su.c, rx: su.c, ry: su.r,
          alive: su.alive, offField: su.offField, hasKnife: su.hasKnife, hasHorse: su.hasHorse,
          st: Object.assign({}, u.st, su.st), cds: su.cds || {}, usedSave: !!su.usedSave,
          boons: Object.assign({}, u.boons, su.boons), homeR: su.homeR, homeC: su.homeC,
          apNow: su.apNow || 0, _undo: su._undo || []
        });
        keep.push(u);
      }
      b.units = keep;
      b.player = keep.find(u => u.side === "player") || b.units[0];
      b.round = snap.round; b.waveIndex = snap.waveIndex;
      b.survivalWaveNo = snap.survivalWaveNo;
      b.boonsTaken = snap.boonsTaken || [];
      b.stats = Object.assign(b.stats, snap.stats || {});
      b.log = (snap.log || []).slice();
      return b;
    }

    /* ---------- 行动点 ---------- */
    /* 算行动点：基础值（猜拳结果）+ 增益 + 临时修正，封顶 AP_CAP。
       玩家侧附带「以寡敌众」补偿：敌人越多，行动点与血上限的补贴越多。 */
    calcAP(u, base) {
      let ap = base + (u.boons.apBonus || 0);
      // 上回合积欠的行动点修正（apMod，多为负数）在此兑现，用完即清零。
      ap += u.st.apMod || 0; u.st.apMod = 0;
      // 以寡敌众：每多一名敌人，玩家多得一点行动（至多+3），使一对多仍有输出
      // （极难/噩梦：多人平衡失效——无行动点与血上限补偿）
      if (u.side === "player" && this.diff !== "extreme" && this.diff !== "nightmare") {
        const n = this.living("enemy").length;
        if (n > 1) {
          const O = CFG.RULES.OUTNUMBER;
          const bonus = Math.min(O.apCap, (n - 1) * O.apPer);
          ap += bonus;
          const hpBonus = Math.min(O.hpCap, (n - 1) * O.hpPer);
          // 血上限补贴只在首次多打少时发一次（_outnumberedHp 兼当「已领过」记号）。
          if (!u._outnumberedHp) {
            u._outnumberedHp = hpBonus;
            u.maxhp += hpBonus; u.hp += hpBonus;
            this.pushLog("以寡敌众：行动点+" + bonus + "，血上限+" + hpBonus + "。");
          }
        }
      }
      if (this.hasPassive(u, "xinhui") && this.round % 2 === 0) { ap += 1; this.pushLog("「慧」灵光乍现，行动点+1！"); }
      return Math.max(0, Math.min(CFG.RULES.AP_CAP, ap));
    }

    // 敌方基础行动点：查难度表；3 名以上敌人用 apBig（人多反而更少，压总输出）。
    enemyBaseAP() {
      const d = CFG.DIFFICULTY[this.diff] || CFG.DIFFICULTY.normal;
      const big = this.living("enemy").length >= 3;
      if (this.mode === "survival") return d.apSolo;
      return big ? d.apBig : d.apSolo;
    }

    /* AI 进攻性档位：影响技能使用、血祭、目标选择与是否撤退 */
    aiProfile() {
      return CFG.AI_AGGR[this.aiAggr] || CFG.AI_AGGR.active;
    }

    // 挑目标：weakest=先打残血（同血比远近），否则就近打；slice() 先复制再排序，不动原数组。
    _pickTarget(u, foes, focus) {
      if (!foes.length) return null;
      if (focus === "weakest") {
        return foes.slice().sort((a, b) => (a.hp - b.hp) || (manh(u, a) - manh(u, b)))[0];
      }
      return foes.slice().sort((a, b) => manh(u, a) - manh(u, b))[0];
    }

    /* 远离某目标的可达格（消极/守成在残血时用） */
    _stepAway(u, threat) {
      const reach = this._reachable(u, this.moveRange(u));
      let best = null, bestScore = -1e9;
      for (const key of reach.keys) {
        const [r, c] = key.split(",").map(Number);
        if (this.unitAt(r, c)) continue;
        const d = Math.abs(r - threat.r) + Math.abs(c - threat.c);
        const near = this.opponentsOf(u).filter(f => Math.max(Math.abs(f.r - r), Math.abs(f.c - c)) <= 1).length;
        // 打分：离威胁越远越好（×2），落点旁的敌人越多扣得越狠（×4）。
        const sc = d * 2 - near * 4;
        if (sc > bestScore) { bestScore = sc; best = [r, c]; }
      }
      return best;
    }



    /* 敌方伤害缩放：以少打多为常态，人多则单体伤害递减，避免围殴瞬杀 */
    enemyDmgScale() {
      const n = this.living("enemy").length;
      let base = CFG.DMG_BY_COUNT[Math.min(4, n)];
      if (this.mode === "survival") base *= CFG.SURVIVAL_HP_EXTRA;
      base *= (CFG.DIFFICULTY[this.diff] || CFG.DIFFICULTY.normal).dmgMul;
      return base;
    }

    /* ---------- 回合循环 ---------- */
    /* ============================================================
     * run()：主回合循环——引擎的心跳。一回合的完整时序：
     *   回合数 +1 → 清「每回合一次」标记 → 剧情触发/特则（飞瓶、种树）→
     *   回合上限检查 → 起义援军 → await 猜拳（等玩家点弹窗）→ 发行动点 →
     *   玩家阶段（await 玩家操作）→ 友军各自动一回合 → 敌人各自动 → _endRound 收尾。
     * 任何一步都可能把 this.over 置真；循环一见 over 就停，返回胜负结果。
     * ============================================================ */
    async run() {
      // 把 UI 钩子抓个短名；下面所有 await ui.xxx 都是在「请界面做事」。
      const ui = window.SJI_UI;
      while (!this.over) {
        this.round++;
        // 「每回合一次」类记号（依然的减伤、首击加成）在回合开头统一复位。
        this.units.forEach(u => u.dampUsed = false);
        if (this.player._undo) this.player._undo.length = 0;
        for (const u of this.units) u._usedFirstStrike = false;
        await this._fireTriggers("roundStart");
        // 剧情特则：看台飞瓶（运动会）——与敌人同行或同列者，被饮料瓶砸中
        if (this.rule && this.rule.id === "cans" && !this.over) {
          const lined = this.living("enemy").some(u => u.r === this.player.r || u.c === this.player.c);
          if (lined) {
            this.pushLog("—— 看台上飞来饮料瓶！——");
            await this.rawHurt(this.player, 1, "被看台飞瓶砸中");
            window.SJI_UI.fxFloat(this.player, "飞瓶！", "#c9b28a");
          }
        }
        // 剧情特则：种树不绝（终焉）——崇国每回合自动种树
        if (this.rule && this.rule.id === "zhongshu" && !this.over) {
          const cg = this.living("enemy").find(u => u.charId === "chongguo");
          if (cg) {
            const live = this.units.filter(x => x.alive && x.charId === "tree" && x.side === "enemy").length;
            if (live < CFG.RULES.TREE_CAP) {
              const spot = DIRS.map(([dr, dc]) => [cg.r + dr, cg.c + dc]).find(([r, c]) => this.passable(r, c));
              if (spot) {
                const tr = makeUnit("tree", "enemy", this.units.length);
                this._place(tr, spot);
                this.units.push(tr);
                window.SJI_UI.snap(tr);
                this.pushLog("崇国种树一株！它看起来……快要死了。");
              }
            }
          }
        }
        ui.onState();
        // 30 回合打完仍未分胜负：判负（高考终了，视为败绩）。
        if (this.round > CFG.RULES.MAX_ROUND) { this.finish("timeout"); break; }
        // 起义援军
        if (this.rule && this.rule.id === "uprising" && this.round === 3) await this._spawnReinforcements();
        // 猜拳
        // 猜拳：引擎把控制权交给 UI 弹窗，玩家点完才 resolve，返回 {res, ap}。
        // 这是引擎/UI 异步协作的第一处——引擎只要结果，何时给由 UI 决定。
        const rps = await ui.rpsRound(this);
        if (this.over) break;
        // 发行动点：玩家按猜拳结果，友军固定 2 点，敌人按难度表。
        this.player.apNow = this.calcAP(this.player, rps.ap);
        this.living("ally").forEach(u => u.apNow = this.calcAP(u, 2));
        this.living("enemy").forEach(u => u.apNow = this.calcAP(u, this.enemyBaseAP()));
        ui.onState();
        // 玩家阶段（返家者本回合不得入场）
        if (this.player.offField > 0) {
          this.player.offField--;
          this.pushLog("「" + this.player.ch.hao + "」返家途中，此回合不得入场。");
          if (this.player.offField <= 0) this._returnHome(this.player);
          ui.onState();
          if (ui.banner) await ui.banner("返家途中", 900);
        } else if (this._tickStatusStart(this.player)) {
          // 被惑/晕眩：本回合跳过（此前玩家不经 aiAct，该项从未生效）
          this.pushLog("「" + this.player.ch.hao + "」晕眩/被惑，此回合跳过。");
          ui.onState();
          if (ui.banner) await ui.banner("此回合跳过", 900);
        } else {
          // 玩家操作阶段：battle-ui.js 会把 resolve 函数暂存进 _phaseResolve，
          // 直到玩家点「结束回合」才兑现这个 Promise——引擎在此冻结等操作。
          await ui.playerPhase(this);
        }
        // 缴械与沉默只封"本回合"，到此解除（否则会永久封锁）
        this._tickStatusEnd(this.player);
        ui.onState();
        if (this.over) break;
        // 友军
        for (const u of this.living("ally")) { await this.aiAct(u); if (this.over) break; }
        // 敌人
        for (const u of this.living("enemy")) { await this.aiAct(u); if (this.over) break; }
        if (this.over) break;
        await this._endRound();
      }
      return this.result;
    }

    /* 起义特则：第 3 回合，两名 9 血心腹在玩家附近入场。
       小细节：ui_onState 声明在使用之后——函数声明会「提升」所以能跑，但别学。 */
    async _spawnReinforcements() {
      this.pushLog("—— 起义！子琛之心腹二人入场：马上解散，毋恐担责！——");
      for (let i = 0; i < 2; i++) {
        const m = makeUnit("mob", "enemy", 100 + i);
        m.hp = m.maxhp = 9;
        const spot = this._freeNear(this.player.r, this.player.c, 3);
        this._place(m, spot);
        this.units.push(m);
        window.SJI_UI.snap(m);
      }
      ui_onState();
      function ui_onState() { window.SJI_UI.onState(); }
    }

    // 从 (r,c) 起一圈圈向外扩找空位（螺旋找位），实在没有就全图随机。
    _freeNear(r, c, maxD) {
      for (let d = 1; d <= maxD + 3; d++) {
        for (let dr = -d; dr <= d; dr++) for (let dc = -d; dc <= d; dc++) {
          const nr = r + dr, nc = c + dc;
          if (this.passable(nr, nc)) return [nr, nc];
        }
      }
      return this._randomFree();
    }

    /* 遣返归队：优先回原位（homeR/homeC）；被占则全图找最近的空格落脚。 */
    _returnHome(u) {
      if (!u.alive) return;
      const hr = (u.homeR !== undefined) ? u.homeR : u.r;
      const hc = (u.homeC !== undefined) ? u.homeC : u.c;
      // 占位判定须排除自身（归位时其 offField 已归零，会被 unitAt 误判为占位者）
      const taken = (r, c) => this.units.some(x => x !== u && x.alive && x.offField <= 0 && x.r === r && x.c === c);
      if (!taken(hr, hc)) { u.r = hr; u.c = hc; }
      else {
        let best = null, bd = 999;
        for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
          if (taken(r, c)) continue;
          const d = Math.abs(r - hr) + Math.abs(c - hc);
          if (d < bd) { bd = d; best = [r, c]; }
        }
        if (best) { u.r = best[0]; u.c = best[1]; this.pushLog("「" + u.ch.hao + "」原位被占，就近归队。"); }
      }
      if (window.SJI_UI.fxFloat) window.SJI_UI.fxFloat(u, "归来", "#7fe08a");
      this.pushLog("「" + u.ch.hao + "」返家归来，归于原位。");
    }

    /* ---------- 状态计时（玩家与 AI 共用） ---------- */
    /* 回合开始：若处于"跳过"，消耗一层并返回 true（本回合不得行动） */
    _tickStatusStart(u) {
      if (u.st.skip > 0) { u.st.skip--; u.apNow = 0; return true; }
      return false;
    }

    /* 回合结束：缴械与沉默恰好覆盖"受害者自己的这一个回合"，到此解除 */
    _tickStatusEnd(u) {
      if (u.st.seal > 0) u.st.seal--;
      if (u.st.disarm > 0) u.st.disarm--;
      if (u.st.silence > 0) u.st.silence--;
    }

    /* 剧情对话触发器两姊妹：_fireTriggers 是 async（可 await 依次播），
       _checkTriggers 是同步（伤害结算中途调用，不能打断流程）；都只触发一次。 */
    async _fireTriggers(when) {
      for (const t of this.triggers) {
        if (t.fired || t.when !== when) continue;
        if (when === "roundStart" && t.round !== this.round) continue;
        if (when === "waveStart" && t.wave !== this.waveIndex + 1) continue;
        t.fired = true;
        if (window.SJI_UI && window.SJI_UI.showDialogue) await window.SJI_UI.showDialogue(t.lines);
      }
    }

    _checkTriggers(when, arg) {
      for (const t of this.triggers) {
        if (t.fired || t.when !== when) continue;
        if (when === "enemyLow" && t.char !== arg) continue;
        if (when === "enemyDown" && t.char && t.char !== "any" && t.char !== arg) continue;
        t.fired = true;
        if (window.SJI_UI && window.SJI_UI.showDialogue) window.SJI_UI.showDialogue(t.lines);
      }
    }

    /* 回合收尾，按顺序结算：回血类被动 → 毒/近身被动掉血 → 技能冷却 −1 →
       剧情特则（验算/争食/鲍鱼之肆）→ 写续战存档 → 检查战斗是否结束。 */
    async _endRound() {
      this._trackMinHp(this.player);
      // 回合结束被动
      for (const u of this.living()) {
        if (this.hasPassive(u, "shibo")) this.heal(u, 1, "吸东来之紫气，");
        if (u.boons.regen) this.heal(u, u.boons.regen, "吐纳，");
        if (u.charId === "keai") {
          const dz = this.units.find(x => x.alive && x.charId === "dazhan" && x.side === u.side);
          if (dz && adj(u, dz)) this.heal(dz, 1, "可怡心善展，");
        }
      }
      for (const u of this.living()) {
        if (this.hasPassive(u, "shenren")) {
          const foes = this.opponentsOf(u).filter(f => adj(u, f));
          for (const f of foes) { this.rawHurt(f, 1, "近鲍鱼之肆而受毒"); await sleep(120); }
        }
          // 中毒：先扣回合数再掉 1 血，剩几回合就疼几回合。
        if (u.st.poison > 0) {
          u.st.poison--;
          this.rawHurt(u, 1, "毒发");
          await sleep(120);
        }
      }
      // 冷却
      for (const u of this.units) {
        for (const k of Object.keys(u.cds)) if (u.cds[k] > 0) u.cds[k]--;
        u.roundDealt = 0;
      }
      this.roundDealt = 0;
      // 剧情特则：验算（九省联考）——wonder 血量为偶数则回合末回复 1 血
      if (this.rule && this.rule.id === "yansuan") {
        const w = this.living("enemy").find(u => u.charId === "wonder");
        if (w && w.hp > 0 && w.hp % 2 === 0 && w.hp < w.maxhp) this.heal(w, 1, "验算无误，");
      }
      // 剧情特则：争食（二楼巡征）——场上三份饭，回合结束站在饭上者食之
      if (this.rule && this.rule.id === "zhengshi") {
          // 三份饭的固定坐标（首次用到才初始化；被吃掉即从名单上划去）。
        if (!this._food) this._food = [[1, 3], [3, 3], [5, 3]];
        this._food = this._food.filter(([r, c]) => {
          const u = this.unitAt(r, c);
          if (u) {
            this.heal(u, 2, "抢得一时之食，");
            this.pushLog("—— 那份饭，没了。——");
            return false;
          }
          return true;
        });
      }
      // 剧情特则：鲍鱼之肆（宿舍之夜）——相邻敌我互相腐蚀
      if (this.rule && this.rule.id === "stench") {
        for (const u of this.living()) {
          for (const f of this.opponentsOf(u)) {
            if (adj(u, f)) await this.rawHurt(f, 1, "近鲍鱼之肆而受蚀");
          }
        }
      }
      ui_onState2();
      function ui_onState2() { window.SJI_UI.onState(); }
      // 断点续战：每回合末写一次快照（玩家可在标题页"继续上局"）
      if (window.SJI_SAVE && window.SJI_SAVE.saveBattle) {
        try { window.SJI_SAVE.saveBattle(this.serialize()); } catch (e) {}
      }
      await sleep(260);
      await this._checkBattleEnd();   // 必须等待：增益选择等弹层需在下一回合猜拳前结束
    }

    /* 胜负判定：玩家倒下即负；敌人清空时——多波关卡/生存模式进下一波，否则获胜。 */
    async _checkBattleEnd() {
      if (this.over) return;
      const foes = this.living("enemy");
      if (!this.player.alive) { this.finish("lose"); return; }
      if (foes.length === 0) {
        if (this.mode === "survival" || (this.waves.length > 1 && this.waveIndex < this.waves.length - 1)) {
          await this._nextWave();   // 等待波次流程（含增益选择）完毕
        } else {
          this.finish("win");
        }
      }
    }

    /* 下一波：生存模式=先选增益→小回 3 血→生成随波次变强的敌人；
       剧情模式=阵间休整（restFull 回满，否则回血上限 60%）→按 hpScale 调血放入新敌。
       收尾统一清掉玩家身上的负面状态。 */
    async _nextWave() {
      this.waveIndex++;
      if (this.mode === "survival") {
        // 选增益后再推进波次号（波次号在选完前不代表已入下一波）
        const boon = await window.SJI_UI.pickBoon(this);
        if (boon) this._applyBoon(this.player, boon);
        this.survivalWaveNo = this.waveIndex + 1;
        this.pushLog("—— 第" + this.survivalWaveNo + "波将至，苔藓不尽…… ——");
        this.heal(this.player, 3, "战间休整，");
        const ids = this._survivalWave(this.survivalWaveNo);
          // 敌人血量每深一波 +5%。
        const scale = 1 + 0.05 * (this.survivalWaveNo - 1);
        ids.forEach((id, i) => {
          const m = makeUnit(id, "enemy", 200 + this.waveIndex * 10 + i);
          m.maxhp = Math.round(m.maxhp * scale); m.hp = m.maxhp;
          const spot = this._freeSpawnFar();
          this._place(m, spot);
          this.units.push(m);
          window.SJI_UI.snap(m);
        });
        this.pushLog("第" + this.survivalWaveNo + "波：" + ids.length + "人入场。");
        window.SJI_UI.onState();
      } else {
        const stgR = (this.cfg && this.cfg.stage) ? this.cfg.stage : null;
        if (stgR && stgR.restFull) {
          this.pushLog("—— 下一阵！赛事之间，得以充分休整。——");
          this.heal(this.player, this.player.maxhp, "充分休整，");
        } else {
          // 阵间休整：至少回 4 点，否则回血上限的 60%（向上取整）。
          const rest = Math.max(4, Math.ceil(this.player.maxhp * 0.6));
          this.pushLog("—— 下一阵！阵间休整回复" + rest + "血。——");
          this.heal(this.player, rest, "阵间休整，");
        }
        const ids = this.waves[this.waveIndex] || [];
        const stg2 = (this.cfg && this.cfg.stage) ? this.cfg.stage : null;
        const k = (stg2 && stg2.hpScale !== undefined) ? stg2.hpScale
          : (this.diff === "extreme" || this.diff === "nightmare") ? 1.0
          : CFG.HP_BY_COUNT[Math.min(4, ids.length)];
        ids.forEach((id, i) => {
          const m = makeUnit(id, "enemy", 300 + this.waveIndex * 10 + i);
          if (k !== 1) { m.maxhp = Math.max(4, Math.round(m.maxhp * k)); m.hp = m.maxhp; }
          const spot = this._freeSpawnFar();
          this._place(m, spot);
          this.units.push(m);
          window.SJI_UI.snap(m);
        });
        window.SJI_UI.onState();
        await this._fireTriggers("waveStart");
      }
      // 清负面
      const p = this.player;
      Object.assign(p.st, { skip: 0, poison: 0, apMod: 0, disarm: 0, silence: 0, seal: 0 });
    }

    // 新敌人出生点：优先「离玩家曼哈顿 ≥3」的标准出生位，实在没有就近塞。
    _freeSpawnFar() {
      const spots = SPAWNS.filter(s => this.passable(s[0], s[1]) && manh({ r: s[0], c: s[1] }, this.player) >= 3);
      if (spots.length) return spots[Math.floor(Math.random() * spots.length)];
      return this._freeNear(0, 3, 3);
    }

    /* 生存模式选中的增益落地：往 boons 表写「永久修正值」，各结算处按需读取
       （如 calcDamage 读 boons.knife、moveRange 读 boons.move、calcAP 读 boons.apBonus）。 */
    _applyBoon(u, boon) {
      this.boonsTaken.push(boon.id);
      switch (boon.id) {
        case "b_hp": u.maxhp += 2; this.heal(u, 2, "奋进，"); break;
        case "b_bloodfree": u.boons.bloodFree = true; break;
        case "b_cleave": u.boons.cleave = Math.max(1, u.boons.cleave); break;
        case "b_horsereach": u.boons.horseRange += 1; break;
        case "b_killheal": u.boons.killHeal = 2; break;
        case "b_shield": u.boons.shield += 3; u.st.shield += 3; break;
        case "b_firststrike": u.boons.firstStrike += 1; break;
        case "b_knife": u.boons.knife += 1; break;
        case "b_horse": u.boons.horse += 1; break;
        case "b_regen": u.boons.regen += 1; break;
        case "b_dodge": u.boons.dodge += 0.15; break;
        case "b_blood": u.boons.blood2 = true; break;
        case "b_cd": u.boons.cdReduce += 1; break;
        case "b_move": u.boons.move += 1; break;
        case "b_ap": u.boons.apBonus += 1; break;
      }
      this.pushLog("得增益「" + boon.name + "」：" + boon.desc);
    }

    /* 终局：钉死 over/result，清掉续战存档，播报战果并通知 UI 弹结算。 */
    finish(result) {
      if (this.over) return;
      this.over = true;
      this.result = result;
      if (window.SJI_SAVE && window.SJI_SAVE.clearBattle) window.SJI_SAVE.clearBattle();
      this.pushLog(result === "win" ? "—— 活者为王！——" : (result === "timeout" ? "—— 高考终了，胜负未分，视为败绩。——" : "—— 汝倒下了。重开重开！——"));
      if (window.SJI_UI) window.SJI_UI.onBattleEnd(this);
    }
  }

  // IIFE 的「出口」：只有这个对象上的名字能被外界访问，其余都是模块内部零件。
  return { Battle, isWall, inB, cheb, manh, adj, SIZE, makeUnit };
})();

</script>
<script>
/* ============================================================
 * 实验史记 · 马刀风云 —— 音律（WebAudio 程序合成，无外部资源）
 * ============================================================ */
/* ============================================================
 * 【新手导读】
 * 【这个文件是干嘛的】游戏里的所有音效和背景音乐。项目里没有任何
 *   mp3/wav 文件——每个声音都是用浏览器的 WebAudio 接口"现场合成"的：
 *   振荡器（oscillator）发波形、增益节点（gain）控音量、随机采样
 *   缓冲做打击噪声，几组参数一凑就是一种音效。
 * 【架构位置】battle 层的工具命名空间，index.html 正常加载。
 *   engine.js / battle-ui.js 在事件时机调用，如命中时
 *   SJI_AUDIO.hit()、胜利时 SJI_AUDIO.victory()。
 * 【暴露的全局名】window.SJI_AUDIO —— 末尾 api 对象里的全部方法：
 *   开关与解锁（setSfx / setMusic / unlock）、事件音效（click / select /
 *   hit / crit / heal / dodge / sacrifice / rpsWin / rpsLose / rpsDraw /
 *   skill / kick / die）、乐曲（victory / defeat / startMusic / stopMusic）。
 *   基础合成函数 tone / noise / pluck 是内部的，不在导出之列。
 * 【新手阅读提示】浏览器规定：必须等用户点过页面后才允许网页发声
 *   （防止流氓网页乱放噪音），所以有 unlock()，由 battle-ui.js 在第一次
 *   按下鼠标时调用。合成声音的核心手法叫"包络"：音量从接近 0 快速
 *   冲到目标、再缓缓落回 0，听感才自然；指数曲线不允许到达 0，
 *   代码里一律用 0.0001 顶替。
 * ============================================================ */
window.SJI_AUDIO = (function () {
  "use strict";
  // 模块私有状态：ctx 音频上下文（WebAudio 的总入口）、master 总音量节点、
  // 音效/音乐两个开关、BGM 定时器与已走拍数。一行声明多个变量是 JS 惯用法。
  let ctx = null, master = null, sfxOn = true, musicOn = true;
  let musicTimer = null, musicStep = 0;

  /* ensure：惰性初始化——第一次要出声时才创建 AudioContext（它比较重）。
     创建的 gain 节点 master 是所有声音的"总闸"，音量 0.28，接到扬声器。
     try/catch 防老浏览器或不支持音频的环境直接崩掉；webkit 前缀兼容旧 Safari。 */
  function ensure() {
    if (ctx) return ctx;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.28;
      master.connect(ctx.destination);
    } catch (e) { ctx = null; }
    return ctx;
  }

  /* tone：最基本的"哔"一声。freq 频率(Hz)、dur 时长(秒)、type 波形
     （sine 正弦柔和 / square 方阵电子 / sawtooth 锯齿刺耳 / triangle 三角居中）、
     vol 音量、delay 延迟几秒再响、slide 结束前滑到的频率（做下滑音）。
     流程：建振荡器+增益节点 → 排好"包络"（音量曲线）→ 接上总闸 → 定时启停。 */
  function tone(freq, dur, type, vol, delay, slide) {
    if (!ctx || !sfxOn) return;
    const t0 = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    // 传了 slide 才滑音；Math.max(30, ...) 防止滑进听不见的次声区（指数曲线也不接受 0）。
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t0 + dur);
    // 音量包络：从 0.0001 用 12 毫秒冲到目标音量，再在 dur 秒内衰减回 0.0001。
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.5, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }

  /* noise：白噪声，打击感的来源。做法：开一段长度 = 采样率 × 秒数的
     缓冲，每个采样点填一个随机数，播放时再过低通滤波器滤掉刺耳高频，
     听起来就是"噗/沙"的一声闷响。 */
  function noise(dur, vol, delay) {
    if (!ctx || !sfxOn) return;
    const t0 = ctx.currentTime + (delay || 0);
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    // 每个采样点取 -1~1 的随机数；再乘 (1 - i/len) 让噪声随时间线性变小。
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const g = ctx.createGain(); g.gain.value = vol || 0.3;
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0);
  }

  /* 五声音阶（宫商角徵羽）拨弦 */
  // 一串频率值（Hz）：C 调五声音阶从低 do 到高 mi，BGM 随机从中挑音。
  const PENTA = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.26];

  /* pluck：拨弦音，背景音乐的原料。两个振荡器叠加——基音 + 高一个
     八度（频率 ×2），包络快起长落，听感近似古筝/吉他拨一下。
     受 musicOn 开关控制（音效开关管不到它）。 */
  function pluck(freq, dur, vol, delay) {
    if (!ctx || !musicOn) return;
    const t0 = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
    o.type = "triangle"; o2.type = "sine";
    o.frequency.value = freq; o2.frequency.value = freq * 2;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 1.4));
    o.connect(g); o2.connect(g); g.connect(master);
    o.start(t0); o2.start(t0); o.stop(t0 + 1.6); o2.stop(t0 + 1.6);
  }

  /* ---------- 对外接口 ---------- */
  /* 下面每个方法都是一种"音效配方"：把 tone / noise / pluck 叠两三层、
     用 delay 错开出场时间就成。不用逐个看参数，知道方法名对应该什么
     游戏事件即可（命名已经很直白）。 */
  const api = {
    setSfx(v) { sfxOn = !!v; },
    setMusic(v) {
      musicOn = !!v;
      if (!musicOn) api.stopMusic();
    },
    // 解锁音频：用户第一次点击页面时由 battle-ui.js 调（浏览器的自动播放限制）。
    unlock() { const c = ensure(); if (c && c.state === "suspended") c.resume(); },

    click() { ensure(); tone(660, 0.07, "square", 0.12); },
    select() { ensure(); tone(520, 0.09, "triangle", 0.2); tone(780, 0.09, "triangle", 0.12, 0.05); },

    hit() { ensure(); noise(0.14, 0.5); tone(160, 0.12, "square", 0.3, 0, 80); },
    crit() { ensure(); noise(0.2, 0.65); tone(120, 0.2, "sawtooth", 0.35, 0, 60); tone(880, 0.1, "square", 0.15, 0.02); },
    heal() { ensure(); tone(523, 0.12, "sine", 0.2); tone(659, 0.14, "sine", 0.18, 0.08); tone(784, 0.2, "sine", 0.15, 0.16); },
    dodge() { ensure(); tone(980, 0.06, "sine", 0.2, 0, 1400); },
    sacrifice() { ensure(); tone(110, 0.5, "sawtooth", 0.35, 0, 45); noise(0.35, 0.4); },
    rpsWin() { ensure(); tone(523, 0.1, "square", 0.22); tone(659, 0.1, "square", 0.22, 0.09); tone(784, 0.16, "square", 0.22, 0.18); },
    rpsLose() { ensure(); tone(392, 0.14, "square", 0.2); tone(311, 0.22, "square", 0.2, 0.12); },
    rpsDraw() { ensure(); tone(440, 0.12, "triangle", 0.2); },
    skill() { ensure(); tone(700, 0.1, "triangle", 0.2, 0, 1000); tone(500, 0.15, "sine", 0.18, 0.06); },
    kick() { ensure(); noise(0.18, 0.6); tone(90, 0.25, "square", 0.4, 0, 50); },
    die() { ensure(); tone(300, 0.4, "sawtooth", 0.3, 0, 60); noise(0.3, 0.4, 0.05); },

    /* 胜利曲：上行琶音 C-E-G-C + 三声拨弦收尾；失败曲：下行四音。
       forEach 回调的第二个参数 i 是序号，乘 0.13 秒就是每个音的出场间隔。 */
    victory() {
      ensure();
      [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, "triangle", 0.25, i * 0.13));
      [523, 659, 784].forEach((f, i) => pluck(f, 1.2, 0.12, 0.55 + i * 0.05));
    },
    defeat() {
      ensure();
      [392, 330, 262, 196].forEach((f, i) => tone(f, 0.3, "triangle", 0.22, i * 0.18));
    },

    /* startMusic：BGM 不是预制曲子，而是程序即兴——每 0.7 秒有 62% 的
     概率从五声音阶里随机拨一音，逢 4 的倍数拍补一个低音当鼓点。 */
    startMusic() {
      ensure();
      // 已经在放（或音频没初始化成功）就不再开第二个定时器，防叠音。
      if (musicTimer || !ctx) return;
      musicStep = 0;
      musicTimer = setInterval(() => {
        if (!musicOn || !ctx) return;
        musicStep++;
        const beat = musicStep % 16;
        if (beat % 4 === 0) pluck(PENTA[0] / 2, 1.6, 0.09);
        // Math.random() 落在 0~1，< 0.62 即 62% 概率本拍弹音（"密度"手感值）。
        if (Math.random() < 0.62) {
          const f = PENTA[Math.floor(Math.random() * PENTA.length)];
          pluck(f, 1.8, 0.055 + Math.random() * 0.04);
        }
      }, 700);
    },
    // 停曲 = 清掉定时器；关音乐开关时 setMusic 也会顺手调它。
    stopMusic() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }
  };
  return api;
})();

</script>
<script>
/* ============================================================
 * 实验史记 · 马刀风云 —— 存档（localStorage）
 * ============================================================ */
/* ============================================================
 * 【新手导读】
 * 【这个文件是干嘛的】战斗侧的存档中心：通关进度、角色解锁、成就、
 *   统计计数、设置，以及"打一半退出"的断点快照。数据存进浏览器自带的
 *   localStorage：主档键名 shiji_madao_v1，断点另存 shiji_madao_v1_battle。
 *   localStorage 按域名隔离、关浏览器也不丢，只能存字符串，所以这里
 *   到处是 JSON.stringify（对象→字符串）和 JSON.parse（字符串→对象）。
 * 【架构位置】battle 层，index.html 正常加载。engine.js / battle-ui.js
 *   经 window.SJI_SAVE 读写；世界侧（js/quests.js、js/ui.js 等）也来存
 *   设置（如最近难度 lastDiff）。本文件会反向查 window.SJI_DATA 的
 *   关卡/成就表、调 window.SJI_UI 弹成就提示——跨命名空间一律写全
 *   window. 前缀，避免顶层 const 不挂 window 的大坑。
 * 【暴露的全局名】window.SJI_SAVE，方法都挂在末尾 return 的对象上。
 * 【新手阅读提示】三个高频 JS 惯用法在本文件集齐：
 *   1) JSON.parse(JSON.stringify(obj)) —— "深拷贝"，复制一份互不影响的新对象；
 *   2) Object.assign(目标, 来源) —— 把来源的字段盖到目标上，这里用来给
 *      老版本的存档自动补上新字段；
 *   3) 所有 localStorage / JSON.parse 都裹在 try/catch 里——隐私模式会
 *      禁存储、手改的存档可能解析失败，坏一次不能让整个游戏起不来。
 * ============================================================ */
window.SJI_SAVE = (function () {
  "use strict";
  // localStorage 的主键名：同一浏览器、同一域名下全局唯一，换名等于全新存档。
  const KEY = "shiji_madao_v1";
  /* 存档的默认结构（DEF = default）。progress / unlocked / charWins / ach
     都是"字典"用法：键不存在就当 false / 0，所以查"通没通关"直接
     !!data.progress[id]。 */
  const DEF = {
    progress: {},          // stageId -> true
    unlocked: { dage: true },  // 已立传（可操作）角色
    charWins: {},          // charId -> 胜场数（角色挑战成就）
    ach: {},               // achId -> true
    bestSurvival: 0,
    totals: { moves: 0, heals: 0, kills: 0, wins: 0, losses: 0 },
    // 设置默认值；世界侧还会往里追加 extra 键（如 lastDiff 最近难度），读取处一律有兜底。
    settings: { sfx: true, music: true, speed: 1, aiAggr: "active", rpsMode: "ask", fx: "full", ngPlus: false }
  };
  // 启动即读档：脚本加载到这行时数据就进内存了，之后改动统一由 persist() 落盘。
  let data = load();
  // 本场战斗新解锁的成就 id 暂存区（结算页取走展示），见 beginAchLog / takeAchLog。
  let achLog = [];

  /* load：读档 + 版本迁移。三层 Object.assign：先把默认值深拷贝一份打底，
     再用读到的存档整体覆盖，最后 totals / settings 单独浅合并一层——
     这样新版本给默认值加的字段，老存档没有也能自动补上。 */
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return JSON.parse(JSON.stringify(DEF));
      const d = JSON.parse(raw);
      return Object.assign(JSON.parse(JSON.stringify(DEF)), d, {
        totals: Object.assign({}, DEF.totals, d.totals || {}),
        settings: Object.assign({}, DEF.settings, d.settings || {})
      });
    } catch (e) { return JSON.parse(JSON.stringify(DEF)); }
  }
  // 写盘。失败（隐私模式 / 配额满）就静默放弃——游戏照玩，只是不存。
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }

  /* 下面是对外接口。get data() 是 getter 语法：外面写 SJI_SAVE.data 像读
     属性一样，实际执行的是函数。注意 data 是引用——外部拿到后直接改
     它的字段也会改到存档本体。 */
  return {
    get data() { return data; },
    get settings() { return data.settings; },
    /* 一组"读-改-写"小方法：查/记通关、成就、计数，改完立即落盘，
       保证刷新页面不丢。!! 是"转成布尔"的惯用法。 */
    isCleared(id) { return !!data.progress[id]; },
    allCleared() { return window.SJI_DATA.STAGES.every(s => !!data.progress[s.id]); },
    clearedCount() { return Object.keys(data.progress).length; },
    clearStage(id) { data.progress[id] = true; persist(); },
    hasAch(id) { return !!data.ach[id]; },
    /* 解锁成就：已解锁就返回 false（幂等，重复触发无害）；否则登记、
       落盘、记入本场日志，并让界面弹一条 toast 气泡。 */
    unlockAch(id) {
      if (data.ach[id]) return false;
      data.ach[id] = true; persist();
      achLog.push(id);
      const a = window.SJI_DATA.ACHIEVEMENTS.find(x => x.id === id);
      if (a && window.SJI_UI) window.SJI_UI.toast("成就达成 「" + a.name + "」：" + a.desc);
      return true;
    },
    // 累计计数 +n（如移动、击杀）：没有的键从 0 起步；n 不传按 1 兜底（n || 1）。
    bump(k, n) { data.totals[k] = (data.totals[k] || 0) + (n || 1); persist(); },
    // 某角色胜场 +1。charWins 可能不在老存档里，先补建字典再记。
    bumpCharWin(cid) {
      if (!data.charWins) data.charWins = {};
      data.charWins[cid] = (data.charWins[cid] || 0) + 1;
      persist();
    },
    // 「人人有传」成就的判定：PLAYABLE 名单里的角色是否每人都赢过至少一场。
    allCharsWon() {
      const w = data.charWins || {};
      return window.SJI_DATA.PLAYABLE.every(c => (w[c] || 0) > 0);
    },
    // 记录生存模式最佳波次：只在破纪录时写盘并返回 true，方便界面报喜。
    setBestSurvival(n) { if (n > data.bestSurvival) { data.bestSurvival = n; persist(); return true; } return false; },
    setSetting(k, v) { data.settings[k] = v; persist(); },
    markPrologue() { data.prologueSeen = true; persist(); },

    /* ---- 角色解锁：击败谁就为谁立传 ---- */
    isUnlocked(cid) {
      if (data.settings.ngPlus) return true;          // 二周目全解锁
      if (!data.unlocked) data.unlocked = { dage: true };
      return !!data.unlocked[cid];
    },
    unlockChars(list) {
      if (!data.unlocked) data.unlocked = { dage: true };
      let fresh = [];
      for (const cid of list || []) {
        if (!data.unlocked[cid]) { data.unlocked[cid] = true; fresh.push(cid); }
      }
      if (fresh.length) persist();
      return fresh;
    },
    /* 旧存档迁移：按已通关关卡补算解锁（不含初始角色之外的无主角色） */
    migrateUnlocks() {
      if (data.unlocked) return;
      data.unlocked = { dage: true };
      const D = window.SJI_DATA;
      for (const st of D.STAGES) {
        if (data.progress[st.id] && st.unlocks) for (const cid of st.unlocks) data.unlocked[cid] = true;
      }
      persist();
    },

    /* ---- 成就：本场解锁记录（供结算页展示） ---- */
    beginAchLog() { achLog = []; },
    // "取走"本场成就记录：slice() 先拷贝一份再清空原数组，结算页拿去展示。
    takeAchLog() { const l = achLog.slice(); achLog = []; return l; },

    /* ---- 循环存档导出 / 导入 ---- */
    /* 导出 = 存档对象变一段 JSON 文本（玩家可自行备份/分享）；
       导入 = 解析文本、和 load() 一样三层合并后整体替换。 */
    exportJSON() { return JSON.stringify(data); },
    importJSON(txt) {
      try {
        const obj = JSON.parse(txt);
        // 简单合法性检查：必须能解析成对象且带 settings 字段，才认是本游戏的存档。
        if (!obj || typeof obj !== "object" || !obj.settings) return { ok: false, err: "内容不是本游戏的存档" };
        data = Object.assign(JSON.parse(JSON.stringify(DEF)), obj, {
          totals: Object.assign({}, DEF.totals, obj.totals || {}),
          settings: Object.assign({}, DEF.settings, obj.settings || {})
        });
        persist();
        return { ok: true };
      } catch (e) { return { ok: false, err: "无法解析：" + e.message }; }
    },

    /* ---- 战斗中断点续战 ---- */
    /* 断点续战：引擎每回合末把整场战斗序列化成快照存进另一个键。
       三个方法都裹 try/catch——快照失败不该影响战斗本身。 */
    saveBattle(snap) { try { localStorage.setItem(KEY + "_battle", JSON.stringify(snap)); } catch (e) {} },
    loadBattle() {
      try { const raw = localStorage.getItem(KEY + "_battle"); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
    },
    clearBattle() { try { localStorage.removeItem(KEY + "_battle"); } catch (e) {} },
    // 重置主档：用深拷贝的默认结构整个替换内存数据再落盘（断点键不受影响）。
    reset() { data = JSON.parse(JSON.stringify(DEF)); persist(); }
  };
})();

</script>

/* 有些角色不出技卡（召唤/召唤物/纯辅助），只录其被动为注疏 */
const NO_SKILL_CARD = { chongguo: true, tree: true, mob: true, keai: true };

/* 行囊道具 → 战前一次性增益（来呀来呀前可择一使用） */
const BATTLE_ITEMS = {

/* 修炼（养成模式专用）：零花钱买的永久强化（刀谱面板购买，映射到既有增益体系）。
   price 是"当前等级升下一级"的花费函数：price(lv)，等级越高越贵。 */
const UPGRADES = [
  { id: 'hp',    name: '体魄', desc: '血上限 +2', max: 3, price: lv => 12 + lv * 8 },
  { id: 'knife', name: '刀锋', desc: '刀击伤害 +1', max: 1, price: () => 25 },

/* 修炼项 → 引擎增益 id 的映射：开战时按它把加成"借道"既有增益体系注入 */
const UPGRADE_BOON = { knife: 'b_knife', horse: 'b_horse', dodge: 'b_dodge', regen: 'b_regen', cd: 'b_cd', ap: 'b_ap' };

/* 身怀之技：支线完成永久继承的角色被动（可多张叠加、无需装备；hp 为额外生命上限）。
   机制侧由引擎 hasPassive(u, charId) 判定（_innates 注入），血量侧由 applyBoons 注入。 */
const INNATE_INFO = {
  dage:      { name: '城墙之梦', desc: '立于城墙时刀击伤害 +1', hp: 0 },
  xinhui:    { name: '灵光乍现', desc: '每第二回合行动点 +1', hp: 0 },

  guayu:     { name: '疾如电',   desc: '20% 闪避', hp: 0 },
  zichen:    { name: '班长之威', desc: '相邻敌人对汝伤害 -1', hp: 0 },
  xiaochuan: { name: '卧薪尝胆', desc: '每受伤一次，下次伤害 +1', hp: 0 },
  shenren:   { name: '鲍鱼之肆', desc: '回合结束，相邻敌人各损 1 血', hp: 0 },
  wonder:    { name: '马刀之神', desc: '血祭后接下来两次伤害翻倍', hp: 0 },
  lifan:     { name: '课代表夺权', desc: '购刀不需行动点', hp: 0 },
  guyin:     { name: '皇太子',   desc: '每场一次，受致命伤保留 1 血', hp: 0 },
  shibo:     { name: '吸东来之紫气', desc: '每回合回复 1 血', hp: 0 },
};

/* 稀有刀卡：高难试炼首通 / 支线所授的质变被动（每场常驻）
   注：每条都必须在 SJI_DATA.BOONS 里有对应的可注入增益，否则 applyBoons 静默失效 */
const RARE_BOONS = {
  b_bloodfree:   { name: '以道代血', desc: '血祭不再损血，只耗行动点。（道之所在，血不轻洒）' },
  b_cleave:      { name: '刀扫一片', desc: '刀击同时波及相邻的另一名敌人。（马刀本是横扫之术）' },
  b_horsereach:  { name: '长杆马刀', desc: '马踢射程 +1。（加长一寸，强出一分）' },
  b_killheal:    { name: '庆功之宴', desc: '击破敌人回复 4 血，原为 2。（大胜而归，理当加餐）' },
  b_shield:      { name: '班主任的偏爱', desc: '每场开局获得 3 点护盾。（含笑素善大哥，此之谓也）' },
  b_firststrike: { name: '先手刀', desc: '每回合首次刀击伤害 +1。（唯快不破）' },
  b_horse:       { name: '马踏连营', desc: '马踢伤害 +1。（一连踏营，声势浩大）' },
};

const Blades = (() => {

  /* 白板默认技「史笔」：射程 2、1 伤、冷却 2——开局唯一手段 */
  const defaultSkill = () => ({
    name: '史笔', kind: 'unit', range: 2, ap: 1, dmg: 1, cd: 2,
    desc: '距二内一敌受1伤。（史笔如铁，据实而书）',
  });

  /* 胜场数：刀谱成长的主时钟（段位、养成加成全看它）；window.G 未建时兜底 0 */
  function wins() { return (window.G && G.wins) || 0; }

  /* 段位查询三件套：从头扫段位表取"最后一个达标"的，就是当前段位 */
  function rankOf(w) {
    let r = BLADE_RANKS[0];
    for (const t of BLADE_RANKS) if (w >= t.w) r = t;
    return r;
  }
  function rankName() { return rankOf(wins()).name; }
  function nextRank() { return BLADE_RANKS.find(t => t.w > wins()) || null; }

  /* 已入手的稀有刀卡 id 列表（G.blades 结构没建就先补建——"懒初始化"惯用法） */
  function rareList() {
    if (!window.G) return [];
    if (!G.blades) G.blades = { cards: [], equip: null };
    G.blades.rare = G.blades.rare || [];
    return G.blades.rare;
  }
  /* 身怀之技：支线完成永久继承的被动（可叠加，无需装备） */
  function innates() {
    if (!window.G) return [];
    if (!G.blades) G.blades = { cards: [], equip: null };
    G.blades.innates = G.blades.innates || [];
    return G.blades.innates;
  }
  /* 授予身怀之技：去重→存档→弹提示→立刻重算战斗卡（血上限可能变了） */
  function grantInnate(charId) {
    if (!INNATE_INFO[charId]) return false;
    if (!innates().includes(charId)) {
      innates().push(charId);
      const info = INNATE_INFO[charId];
      if (typeof Save !== 'undefined') Save.write();
      if (window.toast) toast(`身怀之技＋1：「${info.name}」——${info.desc}（常驻，无需装备）`, '承');
      if (window.SJI_DATA) registerChar();
      return true;
    }
    return false;
  }

  /* 修炼等级表：形如 { hp: 2, knife: 1 }（没买过的项不在表里，读时 || 0 兜底） */
  function upgrades() {
    if (!window.G) return {};
    G.upgrades = G.upgrades || {};
    return G.upgrades;
  }
  /* 养成模式开关：关=纯白板（无数值加成），开=段位+修炼生效 */
  function cultivation() { return !!(window.G && window.G.cultivation); }
  /* 段位 → 战斗加成（仅养成模式）：血上限看胜场（8 场 +1，封顶 4）+ 体魄修炼；
     行动点看胜场（15 场 +1，封顶 3）+ 气力修炼 */
  function hpBonus() { return cultivation() ? Math.min(4, Math.floor(wins() / 8)) + (upgrades().hp || 0) * 2 : 0; }
  function apBonus() { return cultivation() ? Math.min(3, Math.floor(wins() / 15)) + (upgrades().ap || 0) : 0; }

  /* 买修炼：验开关→验条目→验等级上限→扣零花钱→等级+1→重算战斗卡→存档 */
  function buyUpgrade(id) {
    if (!cultivation()) { toast('养成模式未开：开卷时可选「养成模式」', '禁'); return false; }
    const def = UPGRADES.find(u => u.id === id);
    if (!def) return false;
    const lv = upgrades()[id] || 0;
    if (lv >= def.max) return false;
    const cost = def.price(lv);
    if (G.money < cost) { toast(`零花钱不够（需 ◉${cost}）`, '恶'); return false; }
    Engine.addMoney(-cost);
    upgrades()[id] = lv + 1;
    if (window.SJI_DATA) registerChar();
    Save.write();
    toast(`修炼有成：「${def.name}」${def.desc}`, '炼');
    Engine.award('ach_upgrade');
    return true;
  }

  /* 发稀有刀卡：收进列表并默认启用。这里只是"收进列表"，真正生效要等
     开战时 applyBoons 把当前开关集合逐张注入战斗单位。 */
  function grantRare(boonId) {
    const def = RARE_BOONS[boonId];
    if (!def) return false;
    if (!rareList().includes(boonId)) {
      rareList().push(boonId);
      rareOn().push(boonId);   // 新入手默认启用（可在战场左上角或刀谱面板关闭）
      if (typeof Save !== 'undefined') Save.write();
      if (window.toast) toast(`稀有刀卡入手：「${def.name}」——${def.desc}`, '谱');
      return true;
    }
    return false;
  }

  /* 稀有刀卡：每张独立开关，生效数量由玩家自定（rareOn = 当前生效集合） */
  function rareOn() {
    if (!window.G) return [];
    if (!G.blades) G.blades = { cards: [], equip: null };
    G.blades.rareOn = (G.blades.rareOn || []).filter(id => rareList().includes(id));
    return G.blades.rareOn;
  }
  function isRareOn(id) { return rareOn().includes(id); }
  /* 把一张刀卡的增益从战斗单位上手工作"逆运算"摘除：每个 case 对应
     _applyBoon 加过的字段，加过几就减几，Math.max(0, …) 夹住不让数值
     变负。项目里没有通用"撤销"机制，只能逐项手写——这是无框架小项目
     的常见取舍。 */
  function _removeBoonFx(u, id) {
    const b = u.boons;
    switch (id) {
      case 'b_hp': u.maxhp = Math.max(1, u.maxhp - 2); u.hp = Math.min(u.hp, u.maxhp); break;
      case 'b_knife': b.knife = Math.max(0, (b.knife || 0) - 1); break;
      case 'b_horse': b.horse = Math.max(0, (b.horse || 0) - 1); break;
      case 'b_regen': b.regen = Math.max(0, (b.regen || 0) - 1); break;
      case 'b_dodge': b.dodge = Math.max(0, +((b.dodge || 0) - 0.15).toFixed(2)); break;
      case 'b_blood': b.blood2 = false; break;
      case 'b_cd': b.cdReduce = Math.max(0, (b.cdReduce || 0) - 1); break;
      case 'b_move': b.move = Math.max(0, (b.move || 0) - 1); break;
      case 'b_ap': b.apBonus = Math.max(0, (b.apBonus || 0) - 1); break;
      case 'b_bloodfree': b.bloodFree = false; break;
      case 'b_cleave': b.cleave = 0; break;
      case 'b_horsereach': b.horseRange = Math.max(0, (b.horseRange || 0) - 1); break;
      case 'b_killheal': b.killHeal = 0; break;
      case 'b_shield': b.shield = Math.max(0, (b.shield || 0) - 3); u.st.shield = Math.max(0, u.st.shield - 3); break;
      case 'b_firststrike': b.firstStrike = Math.max(0, (b.firstStrike || 0) - 1); break;
    }
  }
  /* 开/关一张稀有刀卡（战斗内外皆可）：battle 传 null 就只改存档记录；
     传 battle 则立刻注入（开）或逆运算摘除（关）该卡增益并写战报——
     战场上换卡不用等下一场。 */
  function toggleRare(battle, boonId) {
    if (!RARE_BOONS[boonId] || !rareList().includes(boonId)) return false;
    const on = isRareOn(boonId);
    if (on) {
      const list = rareOn();
      const i = list.indexOf(boonId);
      if (i >= 0) list.splice(i, 1);
      if (battle && !battle.over) _removeBoonFx(battle.player, boonId);
      battle && battle.pushLog("收回稀有刀卡：「" + RARE_BOONS[boonId].name + "」。（效果即刻解除）");
    } else {
      rareOn().push(boonId);
      if (battle && !battle.over) {
        const boon = window.SJI_DATA.BOONS.find(b => b.id === boonId);
        if (boon) battle._applyBoon(battle.player, boon);
      }
      battle && battle.pushLog("启用稀有刀卡：「" + RARE_BOONS[boonId].name + "」。（即刻生效）");
    }
    if (typeof Save !== 'undefined') Save.write();
    return true;
  }

  /* 已录技的角色 id 列表 / 判断某角色录没录过 */
  function cards() { return (G.blades && G.blades.cards) || []; }
  function hasCard(id) { return cards().includes(id); }

  /* 当前装备的技卡 id：必须是"已录且出技卡"的角色，否则视为白板（返回 null） */
  function equippedSkillId() {
    const eq = (window.G && G.blades && G.blades.equip) || null;
    if (eq && hasCard(eq) && !NO_SKILL_CARD[eq]) return eq;
    return null;
  }

  /* 从角色卡提炼可学技能（拷贝一份，附出处注） */
  function skillCardOf(charId) {
    const ch = window.SJI_DATA.CHARACTERS[charId];
    if (!ch || NO_SKILL_CARD[charId]) return null;
    const sk = ch.skills ? ch.skills[0] : ch.skill;
    if (!sk || sk.kind === 'summon') return null;
    return Object.assign({}, sk, { from: charId, fromName: ch.name + '（' + ch.hao + '）' });
  }

  /* 击败后录技入谱；返回 {fresh, name} 供结算文案区分"首录"与"重复" */
  function grant(charId) {
    if (!G.blades) G.blades = { cards: [], equip: null };
    if (!G.blades.cards.includes(charId)) {
      G.blades.cards.push(charId);
      /* 首个可装备的技自动装上（白板期打完第一场立刻有技可用） */
      if (!G.blades.equip && skillCardOf(charId)) G.blades.equip = charId;
      const ch = window.SJI_DATA.CHARACTERS[charId];
      const sk = skillCardOf(charId);
      if (window.toast) toast(sk ? `刀谱录新技「${sk.name}」——出自 ${ch.hao}` : `刀谱录得「${ch.hao}」之名`, '谱');
      return { fresh: true, name: ch.hao };
    }
    return { fresh: false, name: window.SJI_DATA.CHARACTERS[charId].hao };
  }

  /* 换装备技卡：charId 传 null = 卸下回白板；没录过/不出技卡的角色拒绝 */
  function equip(charId) {
    if (charId && (!hasCard(charId) || NO_SKILL_CARD[charId])) return false;
    G.blades = G.blades || { cards: [], equip: null };
    G.blades.equip = charId;
    Save.write();
    return true;
  }

  /* 构建音克思战斗卡并注册进 SJI_DATA：基础血 10 + 养成加成 + 身怀附加血。
     开战前重算一次就能反映最新成长。引擎、图鉴、立绘读的都是这里
     写进 SJI_DATA.CHARACTERS 的这一份。 */
  function registerChar() {
    const eqId = equippedSkillId();
    const sk = eqId ? skillCardOf(eqId) : null;
    /* 各身怀之技的附加血量求和（如「大腹如斗」+10） */
    const innateHp = innates().reduce((a, id) => a + ((INNATE_INFO[id] && INNATE_INFO[id].hp) || 0), 0);
    window.SJI_DATA.CHARACTERS.yinkesi = {
      id: 'yinkesi', name: '音克思', hao: '史官 · ' + rankName(), juan: '各卷',
      glyph: '史', color: '#a63a2b',
      /* 血 10（白板底子）+ 养成血加成 + 身怀附加血 */
      hp: 10 + hpBonus() + innateHp,
      /* 被动描述是模板字符串拼出来的文案：反引号内可跨行、${…} 插值。
         内容 = 养成/称号段 + 装备卡出处 + 身怀之技清单。 */
      passive: {
        name: eqId ? '刀谱 · ' + rankName() : '白板 · ' + rankName(),
        desc: (cultivation()
          ? `养成中：血上限+${hpBonus()}，每回合行动点+${apBonus()}（胜${wins()}场）。`
          : `称号「${rankName()}」（胜${wins()}场，纯荣誉）。`)
          + (eqId ? `技与被动承「${window.SJI_DATA.CHARACTERS[eqId].hao}」——其被动机制对汝生效。`
                 : '白板无技——去赢一场，录他一技（连被动一并承之）。')
          + (innates().length ? ` 身怀：${innates().map(id => INNATE_INFO[id] ? '「' + INNATE_INFO[id].name + '」' : '').join('')}（常驻）。` : ''),
      },
      skill: sk,
      quote: '规则至简，而引人入胜。',
      bio: '史官执刀，为立传而战。胜一场，录一技。',
      playable: true, aggr: 0.7,
    };
    return window.SJI_DATA.CHARACTERS.yinkesi;
  }

  /* 开战前注入加成（按序执行）：
     ① 装备卡被动（记在 _learnedFrom）与身怀之技（记在 _innates）——
        只授给亲自上阵的音克思，引擎的 hasPassive 查这两个集合放行被动；
     ② 养成模式（仅开启时）：行动点加成与各项修炼，"借道"BOONS 增益注入；
     ③ 文斗增益（骂阵削敌/檄文减冷却，读 G.flags.duelWen，此时才扣文笔）；
     ④ 稀有刀卡（rareOn 开关集合，逐张注入）；
     ⑤ 战大道具（读 G.flags.duelItem，一次性）。
     "flags 取完就置 null" 是本项目的一次性触发惯用法。 */
  function applyBoons(battle) {
    /* 只有主角亲自出战（charId 为空或就是 yinkesi）才吃刀谱/身怀/修炼加成；
       点将派别人出战时，对方按自己的本卡打。 */
    const asLead = !battle.player.charId || battle.player.charId === 'yinkesi';
    if (asLead) {
      /* 获得角色 = 获得其全部技能：装备谁的卡，其被动机制即对音克思生效（引擎 hasPassive 多来源） */
      battle.player._learnedFrom = equippedSkillId() || null;
      if (battle.player._learnedFrom) {
        const src = window.SJI_DATA.CHARACTERS[battle.player._learnedFrom];
        battle.pushLog("承「" + src.hao + "」之技与被动「" + (src.passive ? src.passive.name : '') + "」。");
      }
      /* 身怀之技（支线永久继承的被动）：注入多来源集合 */
      battle.player._innates = innates().slice();
      if (innates().length) battle.pushLog("身怀之技：" + innates().map(id => INNATE_INFO[id] ? INNATE_INFO[id].name : '').filter(Boolean).join('、') + "。");
      /* 养成模式：行动点加成先注入，再按修炼表逐项借道对应增益 */
      if (cultivation()) {
        const n = apBonus();
        for (let i = 0; i < n; i++) battle._applyBoon(battle.player, window.SJI_DATA.BOONS.find(b => b.id === 'b_ap'));
        for (const id of Object.keys(UPGRADE_BOON)) {
          if ((upgrades()[id] || 0) > 0) battle._applyBoon(battle.player, window.SJI_DATA.BOONS.find(b => b.id === UPGRADE_BOON[id]));
        }
      }
    }
    /* 文笔文斗（约战前选择）：骂阵削敌 / 檄文减冷却；此时才扣文笔 */
    const duelWen = (window.G && G.flags && G.flags.duelWen) || null;
    if (duelWen === 'ma') {
      window.Engine.addWen(-10);
      let n = 0;
      battle.living('enemy').forEach(f => { f.hp = Math.max(1, f.hp - 1); n++; });
      battle.pushLog("骂阵先声：敌方全员 -1 血（共 " + n + " 人）。");
      window.G.flags.duelWen = null;
      if (typeof Save !== 'undefined') Save.write();
    } else if (duelWen === 'xi') {
      window.Engine.addWen(-20);
      const boon = window.SJI_DATA.BOONS.find(b => b.id === 'b_cd');
      if (boon) battle._applyBoon(battle.player, boon);
      battle.pushLog("檄文传遍战场：本场技能冷却 -1。");
      window.G.flags.duelWen = null;
      if (typeof Save !== 'undefined') Save.write();
    }
    /* 稀有刀卡：生效数量由玩家自定（逐张开关） */
    rareOn().forEach(bid => {

    const carryNames = rareOn().map(bid => (RARE_BOONS[bid] || {}).name).filter(Boolean);

           rareOn, isRareOn, toggleRare, buyUpgrade, upgrades, UPGRADES, hpBonus, apBonus,

  /* ============ 主线完成度 → 章节进度 ============
     旧内容（协会开张、刀禁期、试炼解锁、番外人物客串）此前都挂在 G.ch 上。
     现在 G.ch 不再靠睡觉推进，而由主线进度翻译而来，于是「打完这一节，世界就变了一道」。
        m4 世界马刀协会 → ch≥8（协会/试炼/生存开）
        m6 刀禁令风波   → ch≥12（刀禁期起）
        m9 马刀的结局   → ch16（终章） */
  /* 表本体：key 是主线任务 id，value 是打完该节后应到达的章节号
     （chapterNow() 取所有已完成条目里的最大值）。 */
  const CH_AFTER = { m1: 1, m2: 3, m3: 5, m4: 8, m5: 9, m6: 12, m7: 13, m8: 14, m9: 16 };

  /* Quests 对象本体：以下方法都是对上面几张表的查询与驱动。
     done(id) { … } 这种是 ES6 对象方法简写，等价于 done: function (id) { … }；
     方法体里的 this 指代 Q 自身（所以能写 this.done / this.current）。 */
  const Q = {
    /* 三张表的便捷访问：all=主线+支线合并（concat 不改原数组、返回新
       数组）；byId 按 id 查任务；done 查存档——!! 把任意值强转成布尔
       （!!undefined === false），相当于 Python 的 bool()。 */
    all() { return MAIN.concat(SIDE); },
    mainList() { return MAIN.slice(); },
    sideList() { return SIDE.slice(); },
    byId(id) { return this.all().find(q => q.id === id); },
    done(id) { return !!G.quests[id]; },
    /* 主线进度 → 章节号 */
    /* 扫一遍已完成的主线，取 CH_AFTER 对应章节的最大值。注意它只负责
       "算"；真正写进 G.ch 的是 engine.js 的 syncChapter()——那边仅当
       算出的章节数更大时才赋值，因此章节单向只进不退，老存档的进度
       绝不会回跳。 */
    chapterNow() {
      let ch = 0;
      MAIN.forEach(q => { if (this.done(q.id) && CH_AFTER[q.id] != null) ch = Math.max(ch, CH_AFTER[q.id]); });
      return ch;
    },
    /* HUD 用：主线 n/9 + 支线已办 m/7 */
    progressLabel() {
      return MAIN.filter(q => this.done(q.id)).length + '/' + MAIN.length;
    },
    sideDoneLabel() {
      return SIDE.filter(q => this.done(q.id)).length + '/' + SIDE.length;
    },
    /* 当前主线：第一个未完成的主线 */
    current() { return MAIN.find(q => !this.done(q.id)) || null; },
    /* 可接支线：条件满足且未完成 */
    sideOpen() { return SIDE.filter(q => !this.done(q.id) && q.cond()); },
    /* 世界上此刻该显示的任务点（主线当前 + 已解锁支线）
       dpos = 显示/交互位置；q.pos 仍是寻路用的锚点。同场景重叠时扇形错开。 */
    markers() {
      const cur = this.current();
      const list = [];
      if (cur) list.push({ q: cur, main: true });
      this.sideOpen().forEach(q => list.push({ q, main: false }));
      /* 聚类后错位：距离 <70 的点视为一团，按扇形摊开（左右各展开约 42px） */
      /* 先按场景分组：byScene 是"场景 id → 该场景任务点数组"的表。
         (byScene[x] = byScene[x] || []).push(m) 是懒初始化惯用法——
         没有就先放个空数组再 push。 */
      const byScene = {};
      list.forEach(m => { (byScene[m.q.where] = byScene[m.q.where] || []).push(m); });
      Object.keys(byScene).forEach(sid => {
        const arr = byScene[sid];
        const groups = [];
        /* 聚类：给每个任务点找一个"距它 <70px"的已有组并入，找不到
           就自立一组。Math.hypot(dx,dy) 算直角三角形斜边长，即两点距离。 */
        arr.forEach(m => {
          const g = groups.find(g => Math.hypot(g[0].q.pos[0] - m.q.pos[0], g[0].q.pos[1] - m.q.pos[1]) < 70);
          if (g) g.push(m); else groups.push([m]);
        });
        groups.forEach(g => {
          /* 错位：只有一个点就原位显示（slice 浅拷贝坐标数组，防多处
             共用同一引用）；多个点按扇形摊开——ang 从正上方(-90°)起步、
             相邻点隔 0.9 弧度，水平摊 96px、垂直摊 34px（压扁的椭圆），
             算出的 dpos 只用于显示/交互，寻路仍用原 pos。 */
          g.forEach((m, i) => {
            if (g.length < 2) { m.dpos = m.q.pos.slice(); return; }
            const ang = -Math.PI / 2 + (i - (g.length - 1) / 2) * 0.9;
            m.dpos = [Math.round(m.q.pos[0] + Math.cos(ang) * 96), Math.round(m.q.pos[1] + Math.sin(ang) * 34)];
          });
        });
      });
      list.forEach(m => { if (!m.dpos) m.dpos = m.q.pos.slice(); });
      return list;
    },
    /* 某任务点的显示位置（有错位则用错位后） */
    walkPosOf(id) {
      const m = this.markers().find(m => m.q.id === id);
      return m ? m.dpos.slice() : [0, 0];
    },
    /* 玩家附近的任务点（供交互条） */
    /* 找离玩家最近的同场景任务点（供交互条用）：过滤场景 → 映射成
       {任务点, 距离} → 按距离升序 → 取第一个；一个都没有时靠
       || null 兜底。r 是判定半径，不传默认 100px。 */
    nearMarker(sceneId, x, y, r) {
      r = r || 100;
      return this.markers().filter(m => m.q.where === sceneId)
        .map(m => ({ m, d: Math.hypot(m.dpos[0] - x, m.dpos[1] - y) }))
        .filter(o => o.d < r).sort((a, b) => a.d - b.d)[0] || null;
    },
    /* 战前脚本：专属剧情 + 对手一句随机挑衅。无专属数据时返回 null（由调用方兜底） */
    /* (q.pre || []).slice() 是双保险：没写过 pre 就当空数组，slice 再
       浅拷贝一份，防止往里 push 挑衅台词时污染任务表的原始数据。 */
    preScript(q) {
      const s = (q.pre || []).slice();
      if (q.foe && q.foe.pool && q.foe.pool.length) s.push({ who: q.foe.who, text: pick(q.foe.pool) });
      return s.length ? s : null;
    },
    /* 战后脚本：胜/败分开 */
    /* win ? post : postLose 是三目运算符，
       相当于 Python 的 q.post if win else q.postLose。 */
    postScript(q, win) {
      const s = win ? q.post : q.postLose;
      return (s && s.length) ? s.slice() : null;
    },
    /* 结算时先把战后对话挂起，等回到世界（战斗覆盖层关闭）再播 */
    /* 为什么不直接播：结算页此刻还盖在世界上，剧情画面会被压住——
       所以先存进 _pendingPost，等 main.js 战斗收尾时调
       takePendingPost() 取走播映；取时顺手清空，一存一取成对消费，
       多场战斗之间不会串场。 */
    stashPost(q, win) { this._pendingPost = q ? this.postScript(q, win) : null; },
    takePendingPost() { const s = this._pendingPost; this._pendingPost = null; return s; },
    _pendingPost: null,
    /* 兜底脚本（老数据/缺剧情时） */
    fallbackPre(q, isMain) {
      return [
        { who: '音克思', text: (isMain ? '【主线】' : '【支线】') + q.name + '——' + q.goal },
        { who: '音克思', text: '（' + (q.hint || q.goal) + '）' },
        { who: '对手', text: pick(['来呀来呀。', '规则至简，而引人入胜。', '既来之，则战之。', '重开重开，谁怕谁。']) },
      ];
    },
    /* 开战：难度自选 + 出战角色选择 → SJI_UI.startBattle */
    /* 开战总入口步骤：① 先 Blades.registerChar() 按最新成长重造主角
       战斗卡；② Object.assign(默认配置, q.cfg) 合并——同名属性后者
       覆盖前者，任务表里写过的字段会盖掉默认值（JS 合并配置的惯用法）；
       ③ q.cfg.diff === null 特判：任务不锁难度、随玩家自选；
       ④ 战场参数归位进 cfg.stage（见下方注释，本项目著名的坑）。 */
    start(q, fighterId) {
      const diff = Quests.diffV();
      Blades.registerChar();
      const cfg = Object.assign({
        mode: 'story', questId: q.id,
        title: (MAIN.indexOf(q) >= 0 ? '主线 · ' : '支线 · ') + q.name,
        playerChar: fighterId || 'yinkesi',
        enemies: [], allies: [], diff: diff, aiAggr: 'active',
      }, q.cfg);
      if (q.cfg.diff === null) cfg.diff = diff;      // diff:null 表示随玩家难度
      if (!cfg.rule) cfg.rule = null;
      /* hpScale / restFull 属于战场配置，引擎只从 cfg.stage 读取（engine.js HP 缩放与阵间回血）。
         任务数据为书写方便放在顶层，这里归位——否则全部静默失效。 */
      /* "搬家"写法：把 hpScale/restFull 抄进 cfg.stage 之后，再用
         delete 运算符删掉 cfg 顶层的原字段，避免两处数据不一致。 */
      if (cfg.hpScale !== undefined || cfg.restFull) {
        cfg.stage = Object.assign({}, cfg.stage || {});
        if (cfg.hpScale !== undefined) { cfg.stage.hpScale = cfg.hpScale; delete cfg.hpScale; }
        if (cfg.restFull) { cfg.stage.restFull = true; delete cfg.restFull; }
      }
      SJI_UI.startBattle(cfg);
    },
    /* 点将出征：名册只有主角一人就直接开打；否则弹面板挑人。
       el() 是 config.js 的 DOM 元素工厂，UI.openPanel 开底部抽屉；
       roster.forEach 给每个可选角色生成一张卡片，点谁就以谁出战
       （主角保有刀谱与身怀，别人用自己的本卡）。 */
    pickAndStart(q) {
      const roster = Quests.roster();
      if (roster.length <= 1) { this.start(q); return; }
      UI.openPanel('点将出征 · ' + q.name, body => {
        body.appendChild(el('div', 'muted', '选定出战之人。音克思保有刀谱与修炼；他人以其本卡出战（保留稀有刀卡与道具）。'));
        body.appendChild(el('div', '', '<div style="height:8px"></div>'));
        roster.forEach(id => {
          const ch = window.SJI_DATA.CHARACTERS[id];
          if (!ch) return;
          const c = el('div', 'card');
          c.style.cssText = 'display:flex;align-items:center;gap:12px;cursor:pointer';
          c.innerHTML = `<span class="tokenface" style="background:${ch.color}">${ch.glyph}</span>
            <div style="flex:1"><h3 style="margin:0">${ch.name} <span class="phao" style="color:var(--cinnabar);font-size:12px">${ch.hao}</span></h3>
            <div class="meta">血 ${ch.hp} · 被动「${ch.passive.name}」${ch.skill ? ` · 技「${ch.skill.name}」` : ''}</div></div>`;
          c.onclick = () => { UI.closePanel(); Quests.start(q, id); };
          body.appendChild(c);
        });
      });
    },
    /* 完成结算：发赏、解锁、推进 */
    /* 战斗引擎战胜后经钩子回调到这里：按难度倍率发钱发声望、发放
       身怀之技/稀有刀卡/解锁人物、标记任务完成、推进章节、挂起战后
       剧情，最后把结算文案拼成 HTML 字符串返回（battle-ui 会把它插进
       战斗结算页展示）。 */
    complete(q) {
      const rw = q.reward || {};
      /* 赏格随难度浮动：查难度表拿 mul 倍率，Math.round 四舍五入取整。 */
      const mul = DIFF_BY_V[Quests.diffV()].mul;
      const money = Math.round((rw.money || 0) * mul);
      const rep = Math.round((rw.rep || 0) * mul);
      /* lines 收集一段段 HTML 字符串，最后 join('') 拼成整段结算文案。 */
      let lines = [`<div><b>任务完成：「${q.name}」</b></div>`];
      if (money) { Engine.addMoney(money); lines.push(`<div>零花钱 +${money}${mul !== 1 ? `（难度 ×${mul}）` : ''}</div>`); }
      if (rep) { Engine.addRep(rep); lines.push(`<div>声望 +${rep}</div>`); }
      /* 下面三种特殊奖励都做了"已持有"去重：新的才发，旧的提示一句。 */
      if (rw.innate) {
        const info = Blades.INNATE_INFO[rw.innate];
        if (info) {
          const freshInnate = Blades.grantInnate(rw.innate);
          lines.push(`<div>${freshInnate ? '<b>身怀之技＋1</b>：「' + info.name + '」——' + info.desc + '（永久常驻，无需装备）' : '（身怀「' + info.name + '」早已在身）'}</div>`);
        }
      }
      if (rw.rare) {
        const rareDefs = Blades.RARE_BOONS;
        if (rareDefs[rw.rare] && Blades.grantRare(rw.rare)) lines.push(`<div>稀有刀卡「${rareDefs[rw.rare].name}」入手</div>`);
        else if (rareDefs[rw.rare]) lines.push(`<div>（稀有刀卡「${rareDefs[rw.rare].name}」已在囊中）</div>`);
      }
      if (rw.unlock) {
        const ch = window.SJI_DATA.CHARACTERS[rw.unlock];
        if (Quests.unlockFighter(rw.unlock) && ch) lines.push(`<div>强力人物解锁：<b>${ch.name}（${ch.hao}）</b>可点将出征</div>`);
        else if (ch) lines.push(`<div>（${ch.hao} 早已在列）</div>`);
      }
      if (rw.text) lines.push(`<div class="yueks">${rw.text}</div>`);
      /* 标记完成：done()/current()/chapterNow()/进度统计全认这个字段。 */
      G.quests[q.id] = true;
      Engine.award('ach_quest');
      /* 主线完成 → 章节推进（世界随之变化：协会开张 / 刀禁期 / 试炼解锁） */
      const chAdvanced = Engine.syncChapter();
      /* 战后收束：挂起，回世界后播 */
      this.stashPost(q, true);
      /* 结算页顺带预告下一个任务；主线全部打完则换成收卷文案。 */
      const cur = this.current();
      if (cur) lines.push(`<div style="margin-top:6px">▸ 新任务：「${cur.name}」——${cur.hint}</div>`);
      else lines.push(`<div style="margin-top:6px" class="yueks">音克思曰：刀者，终将入书。全书将成。</div>`);
      if (chAdvanced) lines.push(`<div class="yueks">刀史又进一道——世界随之一变。</div>`);
      if (q.post) lines.push(`<div class="muted" style="margin-top:4px">▸ 返回校园后，尚有一幕。</div>`);
      Save.write();
      this.render();
      return '<div class="result-extra">' + lines.join('') + '</div>';
    },
    /* 老档迁移：已完成的支线若奖励含身怀之技，一次性静默补发（否则老玩家永远拿不到） */
    migrateInnates() {
      let got = [];
      for (const q of this.sideList()) {
        if (G.quests[q.id] && q.reward && q.reward.innate && !Blades.innates().includes(q.reward.innate)) {
          Blades.innates().push(q.reward.innate);
          const info = Blades.INNATE_INFO[q.reward.innate];
          got.push(info ? '「' + info.name + '」' : q.reward.innate);
        }
      }
      if (got.length) {
        Save.write();
        if (Blades.hasCard && window.SJI_DATA) Blades.registerChar();
        toast('身怀之技补发（按已完成的支线）：' + got.join(''), '承');
      }
      return got.length;
    },
    /* 出战名册 */
    /* 可点将出征的角色 id 表：同样懒初始化，主角永远在列。 */
    roster() { if (!G.roster) G.roster = ['yinkesi']; return G.roster; },
    /* 解锁强力人物入册：已在册返回 false（结算页据此显示"早已在列"）；
       新解锁则 toast 提示 + 存档 + 刷新 HUD。 */
    unlockFighter(id) {
      const r = this.roster();
      if (r.includes(id)) return false;
      r.push(id);
      const ch = window.SJI_DATA.CHARACTERS[id];
      toast(`强力人物入列：「${ch ? ch.name + '（' + ch.hao + '）' : id}」——点将可选出战`, '将');
      Save.write(); this.render();
      return true;
    },
    /* 当前难度代号：读设置里上次选的档，两级 || 兜底——先兜"从没存过
       设置"，再兜"存的代号不认识"（老存档/手改），一律退回 'normal'。 */
    diffV() {
      const d = (window.SJI_SAVE && SJI_SAVE.settings.lastDiff) || 'normal';
      return DIFF_BY_V[d] ? d : 'normal';
    },
    /* HUD 任务指引卡 */
    /* 当前主线 + 最多 3 条可接支线拼成 HTML，一次性 innerHTML 赋值。
       按钮不逐个绑事件，而是写上 data-quests / data-finale 属性，
       最后统一 querySelectorAll 找出来绑 onclick——事件委托的简化版。 */
    render() {
      const box = document.getElementById('questcard');
      if (!box) return;
      const cur = this.current();
      const sides = this.sideOpen();
      const prog = this.progressLabel();
      let h = '';
      if (cur) {
        /* 查场景表拿短名做按钮文字，查不到就退回场景 id。 */
        const sc = SCENE_BY_ID[cur.where];
        h += `<div class="qc-main"><div class="qc-tag">主线 ${prog}</div>
          <div class="qc-name">${cur.name}</div>
          <div class="qc-goal">${cur.goal}</div>
          <div class="qc-hint">${cur.hint}</div>
          <button class="ctx-btn duel qc-btn" data-quests="${cur.id}">前往 · ${sc ? sc.short : cur.where}</button></div>`;
      } else {
        h += `<div class="qc-main"><div class="qc-tag done">主线 ${prog} · 已成</div><div class="qc-name">刀史收卷</div>
          <div class="qc-goal">纵刀已封，书已成。校园仍可自由来去。</div>
          <button class="ctx-btn duel qc-btn" data-finale="1">终章 · 高考</button></div>`;
      }
      if (sides.length) {
        h += `<div class="qc-sides"><div class="qc-sides-title">支线可接（${sides.length}）· 已办 ${this.sideDoneLabel()}</div>` +
          sides.slice(0, 3).map(q => {
            const sc = SCENE_BY_ID[q.where];
            return `<div class="qc-side"><b>${q.name}</b> · ${sc ? sc.short : q.where}
              <button class="ctx-btn qc-btn" data-quests="${q.id}">前往</button></div>`;
          }).join('') + '</div>';
      }
      box.innerHTML = h;
      box.classList.remove('hidden');
      /* 「前往」按钮：不在目标场景就先 World.travel 切过去，等 120ms
         （让场景切换先走完）再 World.walkTo 走到任务点下方 40px 处。 */
      box.querySelectorAll('[data-quests]').forEach(b => {
        b.onclick = (e) => {
          e.stopPropagation();
          const q = Quests.byId(b.dataset.quests);
          if (!q) return;
          if (World.sceneId !== q.where) World.travel(q.where);
          setTimeout(() => {
            const p = Quests.walkPosOf(q.id);
            World.walkTo(p[0], p[1] + 40);
          }, 120);
          toast(`前往：${q.goal}`, '令');
        };
      });
      /* 「终章 · 高考」按钮：转发给 main.js 的收卷流程处理。 */
      box.querySelectorAll('[data-finale]').forEach(b => {
        b.onclick = (e) => {
          e.stopPropagation();
          if (typeof Main !== 'undefined' && Main.finale) Main.finale();
        };
      });
    },
  };
  return Q;
})();
window.Quests = Quests;   // 显式挂载：Node 测试（mainquest_winrate 等）与跨脚本判活皆可直读任务配置

</script>
<script>
/* ============================================================
 * 实验史记·马刀行 —— 战斗胶水模块（自 main.js 拆出）
 * 职责：约战入口 / 难度与特殊战场配置 / 文斗与战大道具结算 /
 *       任务完成回流 / 高难试炼 / 协会锦标赛与生存。
 * 依赖（均为全局）：Engine / Quests / Blades / World / Dialog / UI / SJI_UI / SJI_DATA / Main.afterAction
 * ============================================================ */
/* ================================================================
   【这个文件是干嘛的】
   世界层与战斗层之间的"接线盒"。校园里一切通往战斗的入口都在这：
   街头约战（challenge）、主线任务开战、协会锦标赛、生存模式、高难
   试炼；打完之后的奖励结算与回世界流程（SJI_BATTLE_HOOKS）也在这。

   【架构位置】
   融合层。index.html 加载顺序：…quests.js → 本文件 → battle-ui.js →
   main.js。它把双方都不认识的中间概念翻译过去——
   下行：把一个人物 p 翻译成引擎能直接开打的配置对象 cfg（duelCfg）；
   上行：引擎打完回调 SJI_BATTLE_HOOKS.onResult/onDone，这里发奖励、
   录技、推进任务，再把玩家送回校园。
   main.js 的 challenge/startTournament 等只是转发到这里的一层皮。

   【暴露的全局名】
   window.Duels（challenge / duelCfg / knifeBanRiskOk / startTrial /
   panelTrial / trialById / TRIALS / startTournament / startSurvival）
   以及 window.SJI_BATTLE_HOOKS（战斗结算钩子，battle-ui.js 会调）。
   注意：本文件是少数显式挂 window 的模块（window.Duels = …），
   因为它要被 main.js 的转发层和测试直接引用。

   【新手阅读提示】
   1) 最佳入口是 challenge(p)：从"来呀来呀"到 SJI_UI.startBattle(cfg)
      一条线读完，就能看懂世界侧是怎么"约一架"的。
   2) onResult(b) 的返回值是一段 HTML 字符串——battle-ui.js 会把它
      拼进胜负结算面板。用字符串拼界面是无框架项目的常见做法。
   3) 战场参数（hpScale/restFull/blocked/terrain/rule）全部放在
      cfg.stage 子对象里——引擎只从 stage 读，写在 cfg 顶层会静默失效
      （项目史上最阴险的 bug 来源，务必记住）。
   ================================================================ */
'use strict';

window.Duels = (function () {

  /* 战后世界刷新（与 main.js afterAction 同构；跨模块桥接用） */
  /* 本模块自己的一份"行为收尾"：刷 HUD/风闻/任务/世界 + 存档。
     用 typeof 判活再调，防止单独在 Node/测试环境里缺全局时崩掉 */
  function afterActionBridge() {
    UI.updateHUD();
    UI.renderHearsay();
    if (typeof Quests !== 'undefined') Quests.render();
    World.refresh();
    if (typeof Save !== 'undefined') Save.write();
  }

  /* 首战剧本地图：角色 id → 马刀风云台词卷的关卡 id（js/battle/scenes.js）。
     第一次约战某人时按它挂上专属战前剧本（duelCfg 里用）。 */
  const SCENE_OF_CHAR = {
    wanzhen: 's0', dage: 's1', shenren: 's1', xiannv: 's1', hanxiao: 's2',
    shaoming: 's3', xinhui: 's3', shibo: 's4', weirong: 's4', wonder: 's5',
    wenbin: 's5', dazhan: 's6', touge: 's7', luhao: 's8', xiaochuan: 's8',
    guayu: 's9', yiran: 's9', zichen: 's10', guyin: 's11', lifan: 's12',
    limo: 's13', xiangdong: 's13', chongguo: 's14', qinfa: 's14',
    shengxiang: 's15', qiyue: 's15', ziye: 's15', lianqi: 's15',
  };
  /* 特殊战场（据马刀风云原关卡地形） */
  /* 个别人物有"专属关卡"：额外敌人/援军/地形/血量缩放，按角色 id 覆盖默认配置。
     注意 allies/stage 都在 cfg 层组装后交给引擎，引擎只认 cfg.stage 里的战场参数。 */
  const DUEL_SPECIAL = {
    chongguo: {  // 卷十四 · 终焉之战：校长携钦法，为兵助阵
      enemies: ['qinfa', 'chongguo'], allies: ['weibing'],
      stage: { id: 's14', blocked: [[2, 3], [4, 3]], terrain: 'cabinet', hpScale: 0.78 },
      title: '终焉之战 · 校长室',
    },
  };

  /* 约战难度：读战斗侧设置里的"上次选择"，非法值兜底回 normal */
  function duelDiff() {
    const d = (window.SJI_SAVE && SJI_SAVE.settings.lastDiff) || 'normal';
    return ['easy', 'normal', 'hard', 'extreme'].includes(d) ? d : 'normal';
  }

  /* 组装一场约战的完整配置 cfg（引擎 startBattle 的唯一入口参数）：
     默认值 ← opts 覆盖 ← 特殊战场/首战剧本再修。Object.assign 是
     "对象合并"惯用法：后面的同名键覆盖前面的。 */
  function duelCfg(p, opts) {
    Blades.registerChar();   // 先按最新成长重算主角卡（胜场/身怀/修炼都可能变了）
    const id = p.id;
    const sp = DUEL_SPECIAL[id];
    const first = !Blades.hasCard(id);   // 没录过他的技 = 首战（要挂剧本）
    const cfg = Object.assign({
      mode: 'story',
      title: (p.hao || p.name) + ' · 马刀场',
      playerChar: 'yinkesi',
      enemies: [id],
      allies: [],
      diff: duelDiff(),
      aiAggr: (window.SJI_SAVE && SJI_SAVE.settings.aiAggr) || 'active',
    }, opts || {});
    if (sp) {
      /* 特殊战场：整套敌人/援军/地形按专属表覆盖 */
      Object.assign(cfg, { enemies: sp.enemies, allies: sp.allies || [], stage: sp.stage, title: sp.title });
    } else if (first && window.SJI_SCENES) {
      /* 首战且有台词卷：挂上对应关卡地形与战前剧本 */
      const sid = SCENE_OF_CHAR[id];
      if (sid && SJI_SCENES.stages[sid]) {
        cfg.stage = { id: sid };
        cfg.introScene = SJI_SCENES.stages[sid].intro;
      }
    }
    return cfg;
  }

  /* 刀禁期（G.ch ≥ 12，即主线「刀禁令风波」之后）：楼内约战可能被钦法连人带刀收缴。
     自由开放世界：只与地点有关，不再限时段。 */
  /* 刀禁期风险掷骰：安全地点直接放行；被逮住则进三选一小剧场，
     输了轻则罚款重则刀具被缴（duelBanDays>0 期间约战全禁）。 */
  function knifeBanRiskOk(onDecide) {
    if (G.ch < 12) { onDecide(); return; }   // 刀禁令还没上线，直接放行
    if (G.flags.duelBanDays > 0) { toast(`刀具尚在钦法处（还押 ${G.flags.duelBanDays} 日），约战不得`, '禁'); return; }
    const safe = ['dorm', 'playground', 'gate', 'canteen'].includes(World.sceneId);
    if (safe || Math.random() > 0.25) { onDecide(); return; }   // 安全地点 / 75% 幸运脱身
    /* 被钦法堵住：三个选项各是不同概率的掷骰，输的代价不同 */
    Dialog.play([
      { who: '钦法', text: '（从走廊尽头逼近）此何课也？尔等围于此，所为何物？' },
      { choice: [
        { t: '把马刀塞进袖口，佯装晨读', fx: '五五之数', run() {
            if (Math.random() < 0.55) return { say: { who: '旁白', text: '钦法扫了一眼，走了。刀柄上全是手汗。' } };
            G.flags.duelBanDays = 2;
            return { say: { who: '钦法', text: '此何物？马刀也。——缴矣。两日后还汝。' }, bad: true };
        } },
        { t: '称此乃历史教具，正在鉴古', fx: '六五之数', run() {
            if (Math.random() < 0.65) return { say: { who: '旁白', text: '钦法端详片刻：「……善。」——好险，他没认出来。' } };
            G.flags.fineTomorrow = true;
            return { say: { who: '钦法', text: '教具？站到后面去。明日行动点-1。' }, bad: true };
        } },
        { t: '抱起书包就跑', fx: '险中求活', run() {
            if (Math.random() < 0.8) { Engine.addRep(-2); return { say: { who: '旁白', text: '你一路冲进厕所，听见外面脚步声远去。' } }; }
            Engine.addRep(-5); Engine.award('ach_caught');
            G.flags.duelBanDays = 2;
            return { say: { who: '钦法', text: '站住！人赃并获——刀缴两日，通报于电子班牌！' }, bad: true };
        } },
      ] },
    ], () => {
      /* 小剧场播完的收尾：刀被缴就打不成（不回调 onDecide），否则继续约战 */
      Save.write();
      if (G.flags.duelBanDays > 0) { afterActionBridge(); return; }   // 刀被缴，这一战打不成了
      onDecide();
    });
  }

  /* 约战主流程（交互条「来呀来呀」的落点）：
     清残留 → 先走近 → 验"会不会马刀"/刀禁 → 挑衅对白 →
     战前准备（道具/骂阵/檄文三选一）→ 过刀禁掷骰 → 真正开战 */
  function challenge(p) {
    if (MG.active || (window.BATTLE_ACTIVE)) return;
    if (Dialog.active) Dialog.forceFinish();   // 清掉残留对话（战后幕等），不再静默失效
    /* "先走近再办事"：离得远就先走过去，到了再继续（World 会重新调到这） */
    const pos = World.npcPos(p.id);
    if (pos) {
      const [px, py] = World.playerPos;
      if (Math.hypot(pos[0] - px, pos[1] - py) > 80) { World.walkTo(pos[0], pos[1] - 50); return; }
    }
    if (!window.SJI_DATA.CHARACTERS[p.id]) { toast('此人不会马刀。', '刀'); return; }
    if ((G.flags.duelBanDays || 0) > 0) { toast(`刀具尚在钦法处（还押 ${G.flags.duelBanDays} 日），约战不得`, '禁'); return; }
    /* 开战对白：第一句从他的聊天池里抽（每人专属挑衅），后两句通用 */
    const pool = (p.chat && p.chat.length) ? p.chat : ['来呀来呀。'];
    const script = [
      { who: p.hao || p.name, text: pick(pool) },
      { who: '音克思', text: '闲话少叙——马刀场上见真章。来呀来呀！' },
      { who: p.hao || p.name, text: pick(['来呀来呀，重开重开。', '规则至简，而引人入胜。——请。', '活者为王。开刀吧。']) },
    ];
    /* 战前准备：行囊战大道具（一次性）与文笔文斗（骂阵/檄文） */
    /* 动态攒选项：包里有战大道具就多一个选项；文笔够 10/20 再各多一个。
       每个选项的 run() 只是把旗子记进 G.flags，真正结算在开战后的
       Blades.applyBoons 里——"先记账、后兑现"的两段式。 */
    const choices = [];
    Object.keys(G.bag).filter(k => G.bag[k] > 0 && Blades.BATTLE_ITEMS[k]).forEach(id => {
      choices.push({
        t: `携「${ITEM_BY_ID[id].name}」入场`, fx: Blades.BATTLE_ITEMS[id].label,
        run() {
          G.bag[id]--; G.flags.duelItem = id; Save.write();
          return { say: { who: '旁白', text: `（${ITEM_BY_ID[id].name}入怀，刀意更稳。）` } };
        },
      });
    });
    if (G.wen >= 10) choices.push({
      t: '骂阵 · 10 文笔', fx: '开战敌方全员 -1 血',
      run() { G.flags.duelWen = 'ma'; Save.write();
        return { say: { who: '旁白', text: '（一纸骂檄先声夺人，对方阵脚未整。）' } }; },
    });
    if (G.wen >= 20) choices.push({
      t: '檄文 · 20 文笔', fx: '本场技能冷却 -1',
      run() { G.flags.duelWen = 'xi'; Save.write();
        return { say: { who: '旁白', text: '（笔扫千军，先声夺人。）' } }; },
    });
    /* 有可选就追加一道选择题；「空手赴战」的 run 返回 null 表示无事发生 */
    if (choices.length) script.push({ choice: choices.concat([{ t: '空手赴战', fx: '来呀来呀', run() { return null; } }]) });
    /* 剧情播完 → 过刀禁掷骰 → 开战（duelCfg 组配置，SJI_UI 开战场） */
    Dialog.play(script, () => {
      knifeBanRiskOk(() => SJI_UI.startBattle(duelCfg(p)));
    });
  }

  /* 战斗结算钩子：奖励 / 录技 / 段位（供 battle-ui 调用） */
  /* 引擎与界面的上行通道：打完架，battle-ui 先调 onResult 拿"额外结算
     文案"（一段 HTML，拼进胜负面板），玩家点继续后再调 onDone 回世界。 */
  window.SJI_BATTLE_HOOKS = {
    /* onResult：发奖励并返回 HTML 结算文案。b 是引擎的战斗状态对象。 */
    onResult(b) {
      const win = b.result === 'win';
      const rankBefore = Blades.rankName();   // 先记下战前段位，回头判断有没有晋升
      let extra = '<div class="result-extra">';
      /* 生存模式：按波次结算 */
      if (b.mode === 'survival') {
        const reached = b.survivalWaveNo || 1;
        const gained = Math.max(0, reached - 1) * 2;   // 过 1 波给 2 文钱
        Engine.addMoney(gained);
        if (reached >= 3) { G.wins++; Engine.addRep(1); }   // 撑过 3 波算一胜
        if (reached >= 10) Engine.award('ach_surv10');
        extra += `<div>破败城墙，此行抵第 <b>${reached}</b> 波，零花钱 +${gained}。${reached >= 3 ? '计一胜。' : ''}</div>
          <div class="yueks">音克思曰：苔藓覆其上，其高极大以至于不能尽。吾走之其上久——终将尽之。</div>`;
        extra += '</div>';
        Save.write();
        return extra;
      }
      if (win) {
        G.wins++;
        /* 逐个敌人结算：报名号、录技入刀谱、给当事人加好感（首录 +6 / 重复 +3） */
        const foes = b.cfg.enemies || [];
        const names = [];
        foes.forEach(id => {
          const ch = window.SJI_DATA.CHARACTERS[id];
          if (!ch) return;
          names.push(ch.hao);
          const c = Blades.grant(id);
          if (PEOPLE_BY_ID[id]) Engine.addFavorQuiet(id, c.fresh ? 6 : 3);
        });
        Engine.addRep(2); Engine.addMoney(3);
        if (G.rep >= 80) { Engine.addMoney(2); extra += '<div>名望远播：小卖部赊账 +2。</div>'; }
        /* 战斗成就 */
        if (G.wins >= 1) Engine.award('ach_duel1');
        if (G.wins >= 30) Engine.award('ach_duel30');
        if (b.stats.usedBlood) Engine.award('ach_bloodwin');
        if (!b.stats.everLeftWall) Engine.award('ach_wallwin');
        /* 任务：主线/支线完成回流（发赏·解锁·推进） */
        if (b.cfg.questId) {
          const q = Quests.byId(b.cfg.questId);
          if (q && !Quests.done(q.id)) extra += Quests.complete(q);
        }        /* 高难试炼首通：追加稀有刀卡 */
        if (b.cfg.trialId && !G.trialDone[b.cfg.trialId]) {
          const t = trialById(b.cfg.trialId);
          G.trialDone[t.id] = true;
          Blades.grantRare(t.reward);
          Engine.addRep(3); Engine.addMoney(30);
          if (TRIALS.every(x => G.trialDone[x.id])) Engine.award('ach_trial');
          const rw = Blades.RARE_BOONS[t.reward];
          extra += `<div><b>试炼首通！</b>「${t.name}」授稀有刀卡「${rw.name}」：${rw.desc}（每场常驻生效）</div>
            <div>另声望 +3 · 零花钱 +30。</div>`;
        }
        if (b.cfg.tournament) {
          /* 锦标赛三连胜大赏：三人之技尽录 + 声望零花钱 + 成就 */
          ['luhao', 'xiaochuan', 'zichen'].forEach(id => Blades.grant(id));
          Engine.addRep(4); Engine.addMoney(10);
          Engine.award('ach_champion');
          extra += `<div><b>锦标赛三连胜！</b>鲁豪、小川、子琛之技尽录刀谱。声望 +4 · 零花钱 +10。</div>
            <div class="yueks">音克思曰：马刀大兴盛，汝今列席协会，与有荣焉。</div>`;
        } else {
          /* 普通约战：录技文案 + 段位晋升检查（rankNow ≠ rankBefore 即晋级） */
          extra += `<div>胜${names.length > 1 ? '众刀手' : '「' + names[0] + '」'}，其名其技录入刀谱。好感与声望各有进益。</div>`;
          const rankNow = Blades.rankName();
          if (rankNow !== rankBefore) {
            toast(`刀道晋阶：「${rankNow}」`, '晋');
            extra += `<div class="yueks">音克思曰：今日封「${rankNow}」。刀是死的，人是活的。</div>`;
          } else {
            extra += `<div class="yueks">音克思曰：规则至简，而引人入胜。${pick(['来呀来呀。', '活者为王。', '重开重开。'])}</div>`;
          }
        }
      } else {
        /* 战败：记败场、掉对方 1 点好感；任务战挂一段"战后一幕"待回世界播 */
        G.duelsLost++;
        const foeId = (b.cfg.enemies || [])[0];
        const ch = foeId && window.SJI_DATA.CHARACTERS[foeId];
        if (foeId && PEOPLE_BY_ID[foeId]) Engine.addFavorQuiet(foeId, -1);
        /* 任务战败：挂起战败后的一段（回世界后播） */
        if (b.cfg.questId) {
          const q = Quests.byId(b.cfg.questId);
          if (q) { Quests.stashPost(q, false); extra += `<div class="muted" style="margin-top:4px">▸ 返回校园后，尚有一幕。</div>`; }
        }
        extra += `<div>败于${ch ? '「' + ch.hao + '」' : '刀下'}。胜负乃兵家常事。</div>
          <div class="yueks">音克思曰：${pick(['重开重开！', '既毕业，无复有刀者，悲哉——故今日之败，不足记也。', '汝倒下了。但史官还站着。'])}</div>`;
      }
      extra += '</div>';
      Save.write();
      return extra;
    },
    /* onDone：结算面板点"继续"后回世界。先把主线里程碑卡与战后一幕
       "成对消费"——take* 都是"取走即清空"，不会串场也不会重播 */
    onDone() {
      afterActionBridge();
      World.refresh();
      /* 回到世界后：先弹主线里程碑卡（若有），再播战后收束一幕 */
      const playPost = () => {
        const post = Quests.takePendingPost();
        if (!post) return;
        Dialog.play(post, () => { UI.updateHUD(); Quests.render(); Save.write(); });
      };
      const ch = Engine.takePendingChapter();
      if (ch != null && CHAPTERS[ch]) {
        /* 有里程碑卡：点掉/超时后才接战后一幕（嵌套回调保证顺序） */
        Main.showChapterCard(CHAPTERS[ch], () => {
          UI.updateHUD(); UI.renderHearsay(); Quests.render(); playPost();
        });
      } else playPost();
    },
  };

  /* ---------- 刀谱面板 ---------- */

  /* 协会锦标赛：s8 关卡地形连战三人（waves 轮换出场），战后 onResult
     里的 b.cfg.tournament 分支发大赏 */
  function startTournament() {
    if (!window.SJI_SCENES) return;
    const st = SJI_SCENES.stages.s8;
    SJI_UI.startBattle({
      mode: 'story', tournament: true,
      title: '世界马刀协会 · 锦标赛', playerChar: 'yinkesi',
      enemies: ['luhao'], waves: [['luhao'], ['xiaochuan'], ['zichen']],
      allies: [], diff: duelDiff(), aiAggr: 'active',
      stage: { id: 's8', hpScale: 0.68, restFull: true },   // 敌人血量 0.68 倍 + 阵间回满：三连战的平衡补偿
      introScene: st.intro,
    });
  }
  /* 生存模式：无限波次，打到倒下为止，结算看 onResult 的 survival 分支 */
  function startSurvival() {
    SJI_UI.startBattle({
      mode: 'survival', title: '破败城墙 · 生存', playerChar: 'yinkesi',
      diff: duelDiff(), aiAggr: 'active',
    });
  }

  /* ---------- 高难试炼：随剧情渐次解锁，各有特则，首通授稀有刀卡 ---------- */
  /* 六座试炼一览表。字段：ok() 是解锁条件（章节+录技+旗子），
     cfg 是战斗配置（rule 即"特则"——本关特殊规则，引擎按 id 实现行为），
     reward 是首通奖励的稀有刀卡 id。 */
  const TRIALS = [
    { id: 't_yundonghui', name: '运动会 · 不怒自威', stars: 2,
      cond: '卷三后，且已胜绍铭', ok: () => G.ch >= 3 && Blades.hasCard('shaoming'),
      desc: '级部榜上前茅的绍铭：血厚一层，半血之下刀刀致命。',
      cfg: { enemies: ['shaoming'], stage: { id: 's3b', hpScale: 1.3, blocked: [[1, 2], [1, 4], [5, 2], [5, 4]], terrain: 'cabinet' },
             rule: { id: 'cans', desc: '看台飞瓶：与绍铭同行或同列，回合开始即被饮料瓶砸中 1 血——走位，别站在他的线上。' } },
      reward: 'b_firststrike' },
    { id: 't_sushe', name: '宿舍之夜 · 双臭临门', stars: 2,
      cond: '卷七后，且已胜头哥', ok: () => G.ch >= 7 && Blades.hasCard('touge'),
      desc: '头哥与神人同宿舍：溴味与臭袜齐飞，汝被锁在中间。',
      cfg: { enemies: ['touge', 'shenren'], stage: { id: 's7b' },
             rule: { id: 'stench', desc: '鲍鱼之肆：回合结束，所有相邻的敌我互相腐蚀，各损 1 血——贴身即换血，远程为王。' } },
      reward: 'b_shield' },
    { id: 't_liankao', name: '九省联考 · 牛刀小试', stars: 3,
      cond: '卷九后，已胜 wonder，且见证过「马刀神的试炼」', ok: () => G.ch >= 9 && Blades.hasCard('wonder') && G.flags.wonderTrial,
      desc: 'wonder 以牛顿定理破第十八题——你就是那道题。血厚五成，强制困难。',
      cfg: { enemies: ['wonder'], diff: 'hard', stage: { id: 's5b', hpScale: 1.5, blocked: [[3, 1], [3, 5]], terrain: 'table' },
